- conHeaderAS:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.Navy900
      Height: =88
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Parent.Width - 48
      X: =24
      Y: =72
    Children:
      - lblHeaderTitleAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextOnDark
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =30
            Size: =Typography.SizeTitle
            Text: ="Tracking your application"
            Width: =Parent.Width - 242
            X: =28
            Y: =16
      - lblHeaderSubAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.Blue50
            Font: =Typography.Family
            Height: =24
            Size: =Typography.SizeBody
            Text: |-
              =If(IsBlank(locApp.ApplicantName), "",
                 locApp.ApplicantName & "  ·  ")
                & locCycle.CycleName
                & If(IsBlank(locApp.SubmittedDate), "",
                     "  ·  Submitted " & Text(locApp.SubmittedDate, "mmmm d, yyyy"))
            Width: =Parent.Width - 242
            X: =28
            Y: =48
      - conHomeAS:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =40
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =170
            X: =Parent.Width - 198
            Y: =24
          Children:
            - imgHomeAS:
                Control: Image@2.2.3
                Properties:
                  AccessibleLabel: ="Back to home"
                  Height: =28
                  Image: |-
                    ="data:image/svg+xml," &
                      EncodeUrl(Substitute(gblNavIcons.ReturnHome,
                        "currentColor", "#213455"))
                  Width: =28
                  X: =12
                  Y: =6
            - lblHomeAS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.Navy900
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =Parent.Height
                  Size: =Typography.SizeBody
                  Text: ="Back to home"
                  Width: =Parent.Width - 60
                  X: =48
                  Y: =0
      - btnHomeAS:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Height: =conHomeAS.Height
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0.08)
            OnSelect: =Navigate('Landing Screen')
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.16)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: =""
            Tooltip: ="Back to home"
            Width: =conHomeAS.Width
            X: =conHomeAS.X
            Y: =conHomeAS.Y

- conTimelineAS:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =520
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: |-
        =And(Not(IsBlank(locApp)),
           locApp.ApplicationStatus.Value <> "Draft",
           locApp.ApplicationStatus.Value <> "Withdrawn")
      Width: =620
      X: =24
      Y: =180
    Children:
      - lblTimeTitleAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =28
            Size: =Typography.SizeHeading
            Text: ="Progress"
            Width: =300
            X: =20
            Y: =18
      - lblTimeSubtitleAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =22
            Size: =Typography.SizeBody
            Text: ="Where your application is right now"
            Width: =360
            X: =20
            Y: =46
      - lblTimeCounterAS:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =If(locStageDone, ColorPalette.SuccessText, ColorPalette.Blue600)
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =28
            Size: =Typography.SizeBody
            Text: |-
              =If(locStageDone, "Complete",
                 "Step " & Min(locTimeStep, 6) & " of 6")
            Width: =180
            X: =Parent.Width - 200
            Y: =18
      - conTL1DotAS:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: |-
              =If(Or(locTimeStep > 1, And(locTimeStep = 1, locStageDone)), ColorPalette.Success,
                 If(And(locTimeStep = 1, Not(locStageDone)), ColorPalette.Blue600, ColorPalette.Gray300))
            Height: =24
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =24
            X: =36
            Y: =88
          Children:
            - icoTL1CheckAS:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Height: =12
                  Icon: =Icon.Check
                  Visible: =Or(locTimeStep > 1, And(locTimeStep = 1, locStageDone))
                  Width: =12
                  X: =6
                  Y: =6
      - recTL1LineAS:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(locTimeStep > 1, ColorPalette.Blue600, ColorPalette.Gray200)
            Height: =48
            Width: =2
            X: =conTL1DotAS.X + conTL1DotAS.Width / 2 - 1
            Y: =conTL1DotAS.Y + conTL1DotAS.Height
      - lblTL1TitleAS:
          Control: Label@2.5.1
          Properties:
            Color: =If(locTimeStep >= 1, ColorPalette.TextHeading, ColorPalette.TextHelp)
            Font: =Typography.Family
            FontWeight: =If(locTimeStep >= 1, Typography.WeightMedium, Typography.WeightRegular)
            Height: =22
            Size: =Typography.SizeBody
            Text: ="Submitted"
            Width: =300
            X: =78
            Y: =conTL1DotAS.Y
      - lblTL1DescAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =38
            Size: =Typography.SizeBody
            Text: ="Your application has been received."
            VerticalAlign: =VerticalAlign.Top
            Width: =372
            X: =78
            Y: =lblTL1TitleAS.Y + lblTL1TitleAS.Height
      - lblTL1StateAS:
