- conAdminShell:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =ColorPalette.Navy850
      Height: =Parent.Height - Self.Y
      Width: =Parent.Width
      Y: =conUtilityBar.Y + conUtilityBar.Height
    Children:
      - conSidebar:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Navy850
            Height: =Parent.Height
            RadiusBottomRight: =10
            RadiusTopRight: =10
            Width: =If(gblSidebar, 300, 68)
          Children:
            - conShellTitle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height * 0.08
                  LayoutDirection: =LayoutDirection.Horizontal
                  Width: =Parent.Width
                Children:
                  - lblPlaceholder:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: =""
                        Width: =25
                  - lblShellTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextOnDark
                        FillPortions: =1
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =Parent.Height
                        LayoutMinWidth: =0
                        PaddingLeft: =0
                        Size: =Typography.SizeBody
                        Text: ="LDP Administration"
                        Visible: =gblSidebar
                        Wrap: =false
                  - icoShellToggle:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =ColorPalette.TextOnDark
                        FillPortions: =0.4
                        Height: =Parent.Height * 0.9
                        Icon: =If(gblSidebar, Icon.Cancel, Icon.Hamburger)
                        LayoutMinWidth: =If(gblSidebar, 0, Parent.Width)
                        OnSelect: =Set(gblSidebar, !gblSidebar)
                        PaddingBottom: =15
                        PaddingTop: =15
                        Width: =0
            - conShellItems:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height - conShellUser.Height - conShellTitle.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =Parent.Width
                  Y: =conShellTitle.Height
                Children:
                  - galShellNav:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Height: =Parent.Height
                        Items: |-
                          =Table(
                            { id: 1,  isHeader: false, labelText: "Dashboard",             iconSvg: gblNavIcons.Dashboard },
                            { id: 2,  isHeader: true,  labelText: "REVIEW & SELECTION",    iconSvg: gblNavIcons.ReviewSelection },
                            { id: 3,  isHeader: false, labelText: "Applications",          iconSvg: gblNavIcons.Applications },
                            { id: 4,  isHeader: false, labelText: "Placements",            iconSvg: gblNavIcons.Placements },
                            { id: 5,  isHeader: false, labelText: "Notifications",         iconSvg: gblNavIcons.Notifications },
                            { id: 6,  isHeader: true,  labelText: "PROGRAM MANAGEMENT",    iconSvg: gblNavIcons.ProgramManagement },
                            { id: 7,  isHeader: false, labelText: "Programs",              iconSvg: gblNavIcons.Programs },
                            { id: 8,  isHeader: false, labelText: "Application Cycles",    iconSvg: gblNavIcons.Cycles },
                            { id: 9,  isHeader: false, labelText: "Competencies",          iconSvg: gblNavIcons.Competencies },
                            { id: 10, isHeader: true,  labelText: "EVALUATION MANAGEMENT", iconSvg: gblNavIcons.EvaluationManagement },
                            { id: 11, isHeader: false, labelText: "Criterion Catalog",     iconSvg: gblNavIcons.CriterionCatalog },
                            { id: 12, isHeader: false, labelText: "Scoring Rubrics",       iconSvg: gblNavIcons.RatingSheets }
                          )
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =45
                        Width: =Parent.Width
                      Children:
                        - lblShellDivider:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =ColorPalette.TextOnDarkMuted
                              Font: =Typography.Family
                              FontWeight: =Typography.WeightMedium
                              Height: =Parent.TemplateHeight - 15
                              PaddingBottom: =10
                              PaddingLeft: =If(gblSidebar, Parent.TemplateWidth * 0.1, 0)
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =Typography.SizeCaption
                              Text: ="___"
                              Visible: =And(ThisItem.isHeader, Not(gblSidebar))
                              Width: =Parent.TemplateWidth
                              Y: =15
                        - lblShellHeader:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextOnDarkMuted
                              Font: =Typography.Family
                              FontWeight: =Typography.WeightMedium
                              Height: =Parent.TemplateHeight - 15
                              PaddingBottom: =0
                              PaddingLeft: =If(gblSidebar, Parent.TemplateWidth * 0.1, 0)
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =Typography.SizeCaption
                              Text: =ThisItem.labelText
                              Visible: =And(ThisItem.isHeader, gblSidebar)
                              Width: =Parent.TemplateWidth
                              Wrap: =false
                              Y: =15
                        - conShellItem:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(gblSidebar, 10, 0)
                              LayoutJustifyContent: =If(gblSidebar, LayoutJustifyContent.Start, LayoutJustifyContent.Center)
                              PaddingLeft: =If(gblSidebar, Parent.TemplateWidth * 0.1, 0)
                              Visible: =Not(ThisItem.isHeader)
                              Width: =Parent.TemplateWidth
                            Children:
                              - imgShellItem:
                                  Control: Image@2.2.3
                                  Properties:
                                    Height: =Parent.Height * 0.58
                                    Image: ="data:image/svg+xml," & EncodeUrl(ThisItem.iconSvg)
                                    Width: =Self.Height
                              - lblShellItem:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =ColorPalette.TextOnDark
                                    Font: =Typography.Family
                                    FontWeight: =Typography.WeightMedium
                                    Height: =Parent.Height
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =Typography.SizeBody
                                    Text: =ThisItem.labelText
                                    Visible: =gblSidebar
                                    Width: =Parent.Width - imgShellItem.Width - Parent.LayoutGap
                                    Wrap: =false
                        - btnShellItem:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.TemplateHeight
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(255, 255, 255, 0.12)
                              OnSelect: |-
                                =Switch(ThisItem.labelText,
                                  "Dashboard", Navigate('Admin Dashboard Screen'),
                                  "Applications", Navigate('DTD Applications Screen'),
                                  "Placements", Navigate('Placement Screen'),
                                  "Notifications", Navigate('Notification Screen'),
                                  "Programs", Navigate('Program Options Screen'),
                                  "Application Cycles", Navigate('Application Cycles Screen'),
                                  "Competencies", Navigate('Competencies Screen'),
                                  "Criterion Catalog", Navigate('Criterion Catalog Screen'),
                                  "Scoring Rubrics", Navigate('Scoring Rubrics Screen'),
                                  Notify("That screen has not been built yet.", NotificationType.Information)
                                )
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(255, 255, 255, 0.2)
                              Text: =ThisItem.labelText
                              Visible: =Not(ThisItem.isHeader)
                              Width: =Parent.TemplateWidth * 0.9
                              X: =Parent.TemplateWidth * 0.05
            - conShellUser:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height * 0.08
                  LayoutDirection: =LayoutDirection.Horizontal
                  Width: =Parent.Width
                  Y: =Parent.Height - Self.Height
                Children:
                  - lblShellUser:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextOnDarkMuted
                        FillPortions: =1
                        Font: =Typography.Family
                        Height: =Parent.Height
                        LayoutMinWidth: =0
                        PaddingLeft: =0
                        Size: =Typography.SizeCaption
                        Text: =User().FullName
                        Visible: =gblSidebar
      - conMainArea:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =ColorPalette.Gray50
            Height: =Parent.Height - 5
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - conSidebar.Width - 5
            X: =conSidebar.Width
            Y: =5
          Children:
            - conWipSH:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =240
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =520
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - lblWipTagSH:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.Blue600
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =20
                        Size: =Typography.SizeCaption
                        Text: ="COMING SOON"
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =40
                  - lblWipTitleSH:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =32
                        Size: =Typography.SizeHeading
                        Text: ="This screen is under construction"
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =68
                  - lblWipMessageSH:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =48
                        Size: =Typography.SizeBody
                        Text: |-
                          ="Functionality is being built and will be available in a
                          future release. Thanks for your patience."
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =108
                  - lblWipFooterSH:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextHelp
                        Font: =Typography.Family
                        Height: =20
                        Size: =Typography.SizeCaption
                        Text: ="Placeholder for demo — do not use for real data."
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =180
