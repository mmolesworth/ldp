      # ===========================================================================
      # SCORING — primary workspace.
      # ===========================================================================
      - conScoringCS:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =628
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width - 48
            X: =24
            # Reference locAppExpandedCS directly rather than
            # conAppBodyCS.Height — Studio caches the referenced Height and
            # the scoring pane can end up overlapping the expanded accordion.
            Y: |-
              =conAppHeaderCS.Y + conAppHeaderCS.Height +
               If(locAppExpandedCS, 400, 0) + 12
          Children:
            # ---- Header (Navy900 band; name first, context second) ----------
            - conCritHeaderCS:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.Navy900
                  Height: =64
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - lblCritNameCS:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =28
                        Size: =Typography.SizeTitle
                        Text: |-
                          =Coalesce(LookUp(colCritsCS, CritId = locCurrentCritCS).Name, "")
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =10
                  - lblContextCS:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.Blue50
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =20
                        Size: =Typography.SizeCaption
                        Text: |-
                          ="Criterion " & Text(locCritIndex) &
                           " of " & Text(CountRows(colCritsCS)) &
                           "  ·  " & Coalesce(locProgram.ProgramName, "—") &
                           "  ·  Rubric v" & Text(locSheet.SheetVersion)
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =lblCritNameCS.Y + lblCritNameCS.Height + 2
            - lblCritDescCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextBody
                  Font: =Typography.Family
                  Height: =44
                  Size: =Typography.SizeBody
                  Text: |-
                    =Coalesce(LookUp(colCritsCS, CritId = locCurrentCritCS).Description, "")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =conCritHeaderCS.Y + conCritHeaderCS.Height + 16
            # ---- Left column: 4 stacked anchor cards -------------------------
            # Card width: (Parent.Width - 48) / 2 (columns + 16 gap between)
            # Card height: 100 each, 8px gap between cards
            # Anchor 0: card (visual only) + transparent button overlay + labels
            # declared AFTER the button so labels render on top of any hover /
            # press fill. Labels' X/Y reference conAnchor0CS coordinates.
            - conAnchor0CS:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: |-
                    =If(LookUp(colScoresCS, CritId = locCurrentCritCS).Score = 0,
                        ColorPalette.Blue600, ColorPalette.Gray300)
                  BorderThickness: |-
                    =If(LookUp(colScoresCS, CritId = locCurrentCritCS).Score = 0, 2, 1)
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(LookUp(colScoresCS, CritId = locCurrentCritCS).Score = 0,
                        ColorPalette.Blue50, ColorPalette.White)
                  Height: =100
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =(Parent.Width - 48) / 2
                  X: =16
                  Y: =lblCritDescCS.Y + lblCritDescCS.Height + 16
            - btnAnchor0CS:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =2
                  Font: =Typography.Family
                  Height: =conAnchor0CS.Height
                  HoverFill: =ColorPalette.Blue50
                  OnSelect: |-
                    =With({e: LookUp(colScoresCS, CritId = locCurrentCritCS)},
                       RemoveIf(colScoresCS, CritId = locCurrentCritCS);
                       Collect(colScoresCS,
                         { CritId: locCurrentCritCS,
                           Score: 0,
                           Comment: Coalesce(e.Comment, "") });
                       Patch(COMMITTEE_CRITERION_SCORES,
                         Coalesce(
                           LookUp(COMMITTEE_CRITERION_SCORES,
                             And(ApplicationProgramChoiceID.Id = locChoice.ID,
                                 RatingCriterionID.Id = locCurrentCritCS)),
                           Defaults(COMMITTEE_CRITERION_SCORES)),
                         { ApplicationProgramChoiceID:
                             { Id: locChoice.ID, Value: locChoice.ID },
                           RatingCriterionID:
                             { Id: locCurrentCritCS, Value: locCurrentCritCS },
                           Score: 0,
                           Comment: Coalesce(e.Comment, "") }))
                  PressedFill: =ColorPalette.Blue50
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Text: =""
                  Tooltip: |-
                    =Coalesce(LookUp(colAnchorsCS,
                       And(CritId = locCurrentCritCS, Score = 0)).ExampleText, "")
                  Width: =conAnchor0CS.Width
                  X: =conAnchor0CS.X
                  Y: =conAnchor0CS.Y
            - lblAnchor0ScoreCS:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =28
                  OnSelect: =Select(btnAnchor0CS)
                  Size: =Typography.SizeTitle
                  Text: ="0"
                  Tooltip: |-
                    =Coalesce(LookUp(colAnchorsCS,
                       And(CritId = locCurrentCritCS, Score = 0)).ExampleText, "")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =40
                  X: =conAnchor0CS.X + 12
                  Y: =conAnchor0CS.Y + 14
            - lblAnchor0TextCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextBody
                  Font: =Typography.Family
                  Height: =72
                  OnSelect: =Select(btnAnchor0CS)
                  Size: =Typography.SizeBody
                  Text: |-
                    =Coalesce(LookUp(colAnchorsCS,
                       And(CritId = locCurrentCritCS, Score = 0)).AnchorText, "")
                  Tooltip: |-
                    =Coalesce(LookUp(colAnchorsCS,
                       And(CritId = locCurrentCritCS, Score = 0)).ExampleText, "")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =conAnchor0CS.Width - 68
                  X: =conAnchor0CS.X + 56
                  Y: =conAnchor0CS.Y + 14
            - conAnchor1CS:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: |-
                    =If(LookUp(colScoresCS, CritId = locCurrentCritCS).Score = 1,
                        ColorPalette.Blue600, ColorPalette.Gray300)
                  BorderThickness: |-
                    =If(LookUp(colScoresCS, CritId = locCurrentCritCS).Score = 1, 2, 1)
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(LookUp(colScoresCS, CritId = locCurrentCritCS).Score = 1,
