# Committee Score Screen — score one applicant against the committee's pinned
# rubric. Opened from the Committee Queue Screen (Score / Review buttons).
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# ---------------------------------------------------------------------------
# LAYOUT
# ---------------------------------------------------------------------------
#
# conBodyCS (692 tall, Y=76 for env banner + utility bar) contains:
#
#   conAppHeaderCS   Accordion strip for the read-only app view. Closed by
#                    default (40px). Whole strip is the toggle. Pass 2 fills
#                    the body with the tabbed application detail.
#
#   conScoringCS     Primary workspace. Header at top; two columns below.
#     Header:
#       lblContextCS       "Criterion 2 of 4 · NEXT · Rubric v2"
#       lblCritNameCS      criterion name
#       lblCritDescCS      criterion description (~2 lines)
#     Left column — 4 stacked anchor cards. Each card shows the score number
#       (large, left) with the anchor text and example on the right. Clicking
#       a card scores THIS criterion at that anchor value.
#     Right column — one tall multiline Comment textbox (~430px). Bigger
#       real estate for meeting notes.
#     Below the columns: [< Previous]  [Next >]     [Submit final score]
#
# ---------------------------------------------------------------------------
# NAVIGATION
# ---------------------------------------------------------------------------
# locCritIndex (1..N) drives which criterion is showing. Prev/Next just
# decrement/increment it and re-derive locCurrentCritCS so the many downstream
# LookUps in the anchor cards, comment default, and header labels update in
# place. Reset(txtCommentCS) forces the textbox to re-read its Default after
# a nav — otherwise it keeps showing the previous criterion's comment.
# Buttons disable at boundaries (locCritIndex = 1 / = CountRows).
#
# ---------------------------------------------------------------------------
# PERSISTENCE — SCORES ARE SAVED CONTINUOUSLY, NOT JUST ON SUBMIT
# ---------------------------------------------------------------------------
# Every anchor click and every OnChange of the comment textbox writes to BOTH
# colScoresCS (in-memory, drives the UI) AND COMMITTEE_CRITERION_SCORES (via
# Patch(list, Coalesce(existing, Defaults))). So if the committee closes the
# tab mid-meeting and reopens the applicant later, every scored criterion
# and every comment is still there.
#
# Submit does the LAST thing left: patches the aggregate columns on
# APPLICATION_PROGRAM_CHOICES (CommitteeID, FinalScore, PercentOfPossible,
# ScoredBy, ScoredDate) and returns to the queue. Per-criterion rows have
# already been written incrementally, so there's no ForAll loop here.
#
# Submit is disabled until every criterion has a non-Blank Score (Blank is
# the "unscored" sentinel — 0 is a valid anchor value, so we can't default
# to 0). Button text switches to "Score all criteria to submit" while
# disabled so the reviewer knows what's blocking.
#
# ---------------------------------------------------------------------------
# PASS 1 SCOPE (this file, 2026-08-07; revised 2026-08-10)
# ---------------------------------------------------------------------------
# Full scoring workflow with per-anchor persistence. App detail parked in
# a collapsible strip; pass 2 mirrors DTDApplicationsScreen tabs.

- conBodyCS:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =692
      Width: =Parent.Width
      X: =0
      # Env banner + utility bar slim: 76px combined.
      Y: =76
    Children:
      # ===========================================================================
      # APP STRIP — accordion (unchanged from previous revision).
      # ===========================================================================
      - conAppHeaderCS:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorPalette.Gray200
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =40
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width - 48
            X: =24
            Y: =12
          Children:
            - icoAppChevronCS:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =20
                  Size: =Typography.SizeBody
                  Text: =If(locAppExpandedCS, "▼", "▶")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =24
                  X: =12
                  Y: =(Parent.Height - Self.Height) / 2
            - lblAppSummaryCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Application: " &
                     Coalesce(locApp.ApplicantName, "—") &
                     If(IsBlank(locApp.Grade), "",
                        "  ·  " & locApp.Grade) &
                     If(IsBlank(locApp.JobTitle), "",
                        "  ·  " & locApp.JobTitle)
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 60
                  X: =40
                  Y: =(Parent.Height - Self.Height) / 2
      - btnAppToggleCS:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =conAppHeaderCS.Height
            HoverFill: =RGBA(0, 0, 0, 0.03)
            OnSelect: |-
              =UpdateContext({ locAppExpandedCS: !locAppExpandedCS })
            PressedFill: =RGBA(0, 0, 0, 0.06)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: =""
            Width: =conAppHeaderCS.Width
            X: =conAppHeaderCS.X
            Y: =conAppHeaderCS.Y
      - conAppBodyCS:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorPalette.Gray200
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =If(locAppExpandedCS, 400, 0)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =locAppExpandedCS
            Width: =Parent.Width - 48
            X: =24
            Y: =conAppHeaderCS.Y + conAppHeaderCS.Height
          Children:
            # ---- Tab bar (PowerLibs tab-bar-v2-1 pattern, matches DTD) -----
            # Horizontal gallery of 5 tab labels. Each row is a button + a
            # 3px underline rectangle that only fills for the selected tab.
            # locDetailTabCS holds the selected tab id (1..5) and is set by
            # each tab button's OnSelect. Initialized to 1 in OnVisible.
            - galTabsCS:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =34
                  Items: |-
                    =Table(
                      { id: 1, label: "Personnel" },
                      { id: 2, label: "Program choices" },
                      { id: 3, label: "Competencies" },
                      { id: 4, label: "Eligibility" },
                      { id: 5, label: "Documents" },
                      { id: 6, label: "Supervisor review" }
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =160
                  Width: =960
                  X: =16
                  Y: =8
                Children:
                  - btnTabCS:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: |-
                          =If(ThisItem.id = locDetailTabCS,
                             ColorPalette.Blue600, ColorPalette.TextHelp)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =0
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(ThisItem.id = locDetailTabCS,
                             Typography.WeightBold, Typography.WeightRegular)
                        Height: =Parent.TemplateHeight - 3
                        HoverColor: =ColorPalette.TextOnDark
                        HoverFill: =ColorPalette.Blue700
                        OnSelect: |-
                          =UpdateContext({ locDetailTabCS: ThisItem.id })
                        PressedColor: =ColorPalette.TextOnDark
                        PressedFill: =ColorPalette.Blue700
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =Typography.SizeBody
                        Text: =ThisItem.label
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
                  - recTabLineCS:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: |-
                          =If(ThisItem.id = locDetailTabCS,
                             ColorPalette.Blue600, RGBA(0, 0, 0, 0))
                        Height: =3
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =Parent.TemplateHeight - 3
            - recTabsRuleCS:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =galTabsCS.Y + galTabsCS.Height
            # ---- Placeholder for tabs 2..6 (Personnel below is tab 1) -----
            - lblTabPlaceholderCS:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =40
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Tab " & Text(locDetailTabCS) &
                     " content — added in a later step."
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =locDetailTabCS = 5
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =recTabsRuleCS.Y + recTabsRuleCS.Height + 40
            # ---- Tab 1: Personnel ------------------------------------------
            # 2-column grid of disabled TextInputs with floating labels.
            # DisplayMode.Disabled (not View) keeps the border + fill, so the
            # box still shows for an empty value — DTD pattern (see
            # DTDApplicationsScreen.yaml notes around line 1462).
            # Row 1: Name / Title
            # Row 2: Email / Grade
            # Row 3: Location / Series
            # Row 4: Sup1 / Sup2
            - txtPersNameCS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.ApplicantName, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =(Parent.Width - 72) / 2
                  X: =24
                  Y: =recTabsRuleCS.Y + 24
            - lblPersNameCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="Full name"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersNameCS.X + 10
                  Y: =txtPersNameCS.Y - Self.Height / 2
            - txtPersTitleCS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.JobTitle, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =txtPersNameCS.Width
                  X: =txtPersNameCS.X + txtPersNameCS.Width + 24
                  Y: =txtPersNameCS.Y
            - lblPersTitleCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="Job title"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersTitleCS.X + 10
                  Y: =txtPersTitleCS.Y - Self.Height / 2
            - txtPersEmailCS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.ApplicantEmail, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =txtPersNameCS.Width
                  X: =txtPersNameCS.X
                  Y: =txtPersNameCS.Y + 58
            - lblPersEmailCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="Email"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersEmailCS.X + 10
                  Y: =txtPersEmailCS.Y - Self.Height / 2
            - txtPersGradeCS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.Grade, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =txtPersNameCS.Width
                  X: =txtPersTitleCS.X
                  Y: =txtPersEmailCS.Y
            - lblPersGradeCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="Grade"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersGradeCS.X + 10
                  Y: =txtPersGradeCS.Y - Self.Height / 2
            - txtPersLocationCS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.Location, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =txtPersNameCS.Width
                  X: =txtPersNameCS.X
                  Y: =txtPersEmailCS.Y + 58
            - lblPersLocationCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="Location"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersLocationCS.X + 10
                  Y: =txtPersLocationCS.Y - Self.Height / 2
            - txtPersSeriesCS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.JobSeries, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =txtPersNameCS.Width
                  X: =txtPersTitleCS.X
                  Y: =txtPersLocationCS.Y
            - lblPersSeriesCS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="Job series"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersSeriesCS.X + 10
                  Y: =txtPersSeriesCS.Y - Self.Height / 2
            - txtPersSup1CS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.FirstLineSupervisorEmail, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =txtPersNameCS.Width
                  X: =txtPersNameCS.X
                  Y: =txtPersLocationCS.Y + 58
            - lblPersSup1CS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="First-line supervisor"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersSup1CS.X + 10
                  Y: =txtPersSup1CS.Y - Self.Height / 2
            - txtPersSup2CS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =Coalesce(locApp.SecondLineSupervisorEmail, "—")
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Visible: =locDetailTabCS = 1
                  Width: =txtPersNameCS.Width
                  X: =txtPersTitleCS.X
                  Y: =txtPersSup1CS.Y
            - lblPersSup2CS:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =16
                  PaddingLeft: =4
                  PaddingRight: =4
                  Size: =Typography.SizeCaption
                  Text: ="Second-line supervisor"
                  Visible: =locDetailTabCS = 1
                  Width: =Len(Self.Text) * 6 + 16
                  Wrap: =false
                  X: =txtPersSup2CS.X + 10
                  Y: =txtPersSup2CS.Y - Self.Height / 2
            # ---- Tab 2: Program choices ------------------------------------
            # Vertical gallery over APPLICATION_PROGRAM_CHOICES filtered to
            # this applicant, sorted by Rank. Each row shows the rank badge
            # (#1/#2/#3), the PROGRAM as the headline, and the OPTION as a
            # muted subline (blank for MDP/NEXT which have no options —
            # matches the DTD detail pattern; no fabricated "N/A").
            - galChoicesCS:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =ColorPalette.Gray200
                  Height: =Min(3, CountRows(APPLICATION_PROGRAM_CHOICES)) * 56 + 8
                  Items: |-
                    =SortByColumns(
                       ForAll(
                          Filter(APPLICATION_PROGRAM_CHOICES,
                                 ApplicationID.Id = locApp.ID) As ch,
                          {
                             ChRank:      ch.Rank,
                             ProgramName: ch.ProgramID.Value,
                             OptionName:  ch.ProgramOptionID.Value
                          }),
                       "ChRank", SortOrder.Ascending)
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =56
                  Visible: =locDetailTabCS = 2
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =recTabsRuleCS.Y + recTabsRuleCS.Height + 16
                Children:
                  - lblChoiceRankCS:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.Blue700
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =20
                        Size: =Typography.SizeBody
                        Text: |-
                          ="#" & ThisItem.ChRank
                        Width: =34
                        X: =0
                        Y: =6
                  - lblChoiceProgramCS:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =20
                        Size: =Typography.SizeBody
                        Text: =ThisItem.ProgramName
                        Width: =Parent.TemplateWidth - 60
                        X: =36
                        Y: =6
                  - lblChoiceOptionCS:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Font: =Typography.Family
                        Height: =20
                        Size: =Typography.SizeBody
                        Text: =Coalesce(ThisItem.OptionName, "")
                        Width: =Parent.TemplateWidth - 60
                        X: =36
                        Y: =26
                  - recChoiceLineCS:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =ColorPalette.Gray200
                        Height: =1
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =Parent.TemplateHeight - 1
            - lblNoChoicesCS:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =40
                  Size: =Typography.SizeBody
                  Text: ="No program choices recorded."
                  Visible: |-
                    =And(locDetailTabCS = 2,
                       CountRows(galChoicesCS.AllItems) = 0)
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =recTabsRuleCS.Y + recTabsRuleCS.Height + 24
            # ---- Tab 3: Competencies ---------------------------------------
            # Data-driven — reads COMPETENCY_TYPES (usually OPM/Technical/ECQ)
            # into a small type strip, then filters APPLICATION_COMPETENCIES
            # by the selected type. Nothing hard-codes a type name, so a
            # fourth added on the Competencies admin screen shows up here too.
            # Same shape as DTD's Competencies tab (read-only view).
            - conCompTabsCS:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =locDetailTabCS = 3
                  Width: |-
                    =Min(Parent.Width - 300,
                       170 * Max(1,
                          CountRows(Filter(COMPETENCY_TYPES, State.Value = "Active"))))
                  X: =24
                  Y: =recTabsRuleCS.Y + recTabsRuleCS.Height + 12
                Children:
                  - galCompTypeTabsCS:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Height: =Parent.Height - 10
                        Items: |-
                          =SortByColumns(
                             Filter(COMPETENCY_TYPES, State.Value = "Active"),
                             "SortOrder", SortOrder.Ascending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: |-
                          =galCompTypeTabsCS.Width /
                             Max(1, galCompTypeTabsCS.AllItemsCount)
                        Width: =Parent.Width - 10
                      Children:
                        - btnCompTypeTabCS:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: |-
                                =If(ThisItem.ID = locCompTypeCS,
                                   ColorPalette.Gray200, RGBA(0, 0, 0, 0))
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: |-
