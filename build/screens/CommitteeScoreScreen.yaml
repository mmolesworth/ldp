                  Height: =20
                  Size: =Typography.SizeLabel
                  Text: ="Comment (optional)"
                  Width: =(Parent.Width - 48) / 2
                  X: =conAnchor0CS.X + conAnchor0CS.Width + 16
                  Y: =conAnchor0CS.Y - 4
            - txtCommentCS:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextHeading
                  Default: |-
                    =Coalesce(LookUp(colScoresCS, CritId = locCurrentCritCS).Comment, "")
                  Fill: =ColorPalette.White
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =2
                  Font: =Typography.Family
                  Height: |-
                    =conAnchor5CS.Y + conAnchor5CS.Height - conAnchor0CS.Y
                  HintText: |-
                    ="Discussion notes for this criterion: strengths, gaps, examples the committee weighed."
                  HoverBorderColor: =ColorPalette.Blue400
                  Mode: =TextMode.MultiLine
                  OnChange: |-
                    =With({e: LookUp(colScoresCS, CritId = locCurrentCritCS)},
                       RemoveIf(colScoresCS, CritId = locCurrentCritCS);
                       Collect(colScoresCS,
                         { CritId: locCurrentCritCS,
                           Score: e.Score,
                           Comment: Self.Text });
                       Patch(COMMITTEE_CRITERION_SCORES,
                         Coalesce(
                           LookUp(COMMITTEE_CRITERION_SCORES,
                             And(ApplicationProgramChoiceID.Id = locChoice.ID,
                                 RatingCriterionID.Id = locCurrentCritCS)),
                           Defaults(COMMITTEE_CRITERION_SCORES)),
                         { ApplicationProgramChoiceID:
                             { Id: locChoice.ID, Value: locChoice.ID },
                           RatingCriterionID:
                             { Id: locCurrentCritCS, Value: locCurrentCritCS },
                           Score: e.Score,
                           Comment: Self.Text }))
                  Size: =Typography.SizeBody
                  Width: =(Parent.Width - 48) / 2
                  X: =conAnchor0CS.X + conAnchor0CS.Width + 16
                  Y: =conAnchor0CS.Y
            # ---- Prev / Next -------------------------------------------------
            # Both drive locCritIndex (1..N) and re-derive locCurrentCritCS so
            # downstream LookUps update. Reset(txtCommentCS) refreshes the
            # Default binding — otherwise the box keeps showing the previous
            # criterion's comment.
            - btnPrevCS:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  DisplayMode: |-
                    =If(locCritIndex > 1, DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =ColorPalette.White
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =36
                  HoverBorderColor: =ColorPalette.Gray300
                  HoverColor: =ColorPalette.TextHeading
                  HoverFill: =ColorPalette.Gray25
                  OnSelect: |-
                    =UpdateContext({ locCritIndex: locCritIndex - 1 });
                     UpdateContext({
                       locCurrentCritCS:
                         Index(
                           SortByColumns(colCritsCS, "Order", SortOrder.Ascending),
                           locCritIndex).CritId
                     });
                     Reset(txtCommentCS)
                  PressedBorderColor: =ColorPalette.Gray300
                  PressedColor: =ColorPalette.TextHeading
                  PressedFill: =ColorPalette.Gray50
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeBody
                  Text: ="<  Previous"
                  Width: =160
                  X: =16
                  Y: =conAnchor5CS.Y + conAnchor5CS.Height + 16
            - btnNextCS:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  DisplayMode: |-
                    =If(locCritIndex < CountRows(colCritsCS),
                        DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =ColorPalette.White
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =36
                  HoverBorderColor: =ColorPalette.Gray300
                  HoverColor: =ColorPalette.TextHeading
                  HoverFill: =ColorPalette.Gray25
                  OnSelect: |-
                    =UpdateContext({ locCritIndex: locCritIndex + 1 });
                     UpdateContext({
                       locCurrentCritCS:
                         Index(
                           SortByColumns(colCritsCS, "Order", SortOrder.Ascending),
                           locCritIndex).CritId
                     });
                     Reset(txtCommentCS)
                  PressedBorderColor: =ColorPalette.Gray300
                  PressedColor: =ColorPalette.TextHeading
                  PressedFill: =ColorPalette.Gray50
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeBody
                  Text: ="Next  >"
                  Width: =160
                  X: =btnPrevCS.X + btnPrevCS.Width + 12
                  Y: =btnPrevCS.Y
            # ---- Submit ------------------------------------------------------
            # Per-criterion rows are already saved (Patch on each anchor/comment
            # change). Submit only writes the aggregate on APPLICATION_PROGRAM_CHOICES
            # then returns to the queue. Disabled until every criterion has a
            # non-Blank Score.
            - btnSubmitCS:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =ColorPalette.TextOnDark
                  DisplayMode: |-
                    =If(CountRows(Filter(colScoresCS, Not(IsBlank(Score)))) =
                        CountRows(colCritsCS),
                        DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =ColorPalette.Blue600
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =36
                  HoverColor: =ColorPalette.TextOnDark
                  HoverFill: =ColorPalette.Blue700
                  OnSelect: |-
                    =Patch(APPLICATION_PROGRAM_CHOICES, locChoice,
                       { CommitteeID:
                           { Id: locCommittee.ID,
                             Value: locCommittee.CommitteeName },
                         FinalScore:        Sum(colScoresCS, Score),
                         PercentOfPossible: Sum(colScoresCS, Score) /
                                            (5 * CountRows(colCritsCS)),
                         ScoredBy:          User().Email,
                         ScoredDate:        Today() });
                     Navigate('Committee Queue Screen')
                  PressedColor: =ColorPalette.TextOnDark
                  PressedFill: =ColorPalette.Blue700
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeBody
                  Text: |-
                    =If(CountRows(Filter(colScoresCS, Not(IsBlank(Score)))) =
                        CountRows(colCritsCS),
                        "Submit final score",
                        "Score all criteria to submit")
                  Width: =240
                  X: =Parent.Width - Self.Width - 16
                  Y: =btnPrevCS.Y
