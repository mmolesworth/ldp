            BorderThickness: =1
            Color: |-
              =Switch(locApp.ApplicationStatus.Value,
                 "Draft", ColorPalette.Blue700,
                 "Submitted", ColorPalette.WarningText,
                 "Validated", ColorPalette.SuccessText,
                 "Withdrawn", ColorPalette.TextHelp,
