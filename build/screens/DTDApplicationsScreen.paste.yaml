            Fill: |-
              =Switch(Self.Color,
                 ColorPalette.WarningText, ColorPalette.WarningLight,
                 ColorPalette.DangerText,  ColorPalette.DangerLight,
                 ColorPalette.SuccessText, ColorPalette.SuccessLight,
                 ColorPalette.TextHelp,    ColorPalette.Gray50,
                 ColorPalette.Blue50)
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =24
            RadiusBottomLeft: =3
            RadiusBottomRight: =3
            RadiusTopLeft: =3
