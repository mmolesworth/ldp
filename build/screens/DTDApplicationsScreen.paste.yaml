            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1.4
            FocusedBorderThickness: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorPalette.Blue600
            HoverFill: =ColorPalette.Gray50
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locAppAsc: If(locAppSort = "ReviewStage", Not(locAppAsc), true),
                locAppSort: "ReviewStage"
              })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =ColorPalette.Blue700
            PressedFill: =ColorPalette.Gray200
            Size: =Typography.SizeCaption
