              =If(btnDetailStageBadgeDTD.Visible,
                 btnDetailStageBadgeDTD.X - 8,
                 If(btnDetailOutcomeBadgeDTD.Visible,
                    btnDetailOutcomeBadgeDTD.X - 8,
                    Parent.Width - 24)) - Self.Width
            Y: =14
      - btnDetailStageBadgeDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Self.Color
