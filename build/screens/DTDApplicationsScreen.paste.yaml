- conHeadDTD:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =36
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =Parent.Width - 48
      X: =24
      Y: =126
    Children:
      - btnHeadNameDTD:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =2
            FocusedBorderThickness: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorPalette.Blue600
            HoverFill: =ColorPalette.Gray50
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locAppAsc: If(locAppSort = "ApplicantName", Not(locAppAsc), true),
                locAppSort: "ApplicantName"
              })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =ColorPalette.Blue700
            PressedFill: =ColorPalette.Gray200
            Size: =Typography.SizeCaption
            Text: |-
              ="Applicant" & If(locAppSort = "ApplicantName", If(locAppAsc, "  ▲", "  ▼"), "")
      - btnHeadStatusDTD:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1
            FocusedBorderThickness: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorPalette.Blue600
            HoverFill: =ColorPalette.Gray50
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locAppAsc: If(locAppSort = "ApplicationStatus", Not(locAppAsc), true),
                locAppSort: "ApplicationStatus"
              })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =ColorPalette.Blue700
            PressedFill: =ColorPalette.Gray200
            Size: =Typography.SizeCaption
            Text: |-
              ="Application status" & If(locAppSort = "ApplicationStatus", If(locAppAsc, "  ▲", "  ▼"), "")
      - btnHeadStageDTD:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
