            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeCaption
            Text: |-
              =If(
                Or(And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)), drpEditOpt1DTD.Visible,
                       IsBlank(drpEditOpt1DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg2DTD.Selected.Value)), drpEditOpt2DTD.Visible,
                       IsBlank(drpEditOpt2DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg3DTD.Selected.Value)), drpEditOpt3DTD.Visible,
                       IsBlank(drpEditOpt3DTD.Selected.Value))),
                "Choose an option for every program that has them.",
                "The same program and option is selected more than once.")
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 2, locEditApp,
                 Or(And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)), drpEditOpt1DTD.Visible,
                       IsBlank(drpEditOpt1DTD.Selected.Value)),
                    And(Not(IsBlank(drpEditPrg2DTD.Selected.Value)), drpEditOpt2DTD.Visible,
                       IsBlank(drpEditOpt2DTD.Selected.Value)),
                    And(Not(IsBlank(drpEditPrg3DTD.Selected.Value)), drpEditOpt3DTD.Visible,
                       IsBlank(drpEditOpt3DTD.Selected.Value)),
                    And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)),
                       drpEditPrg1DTD.Selected.Value = drpEditPrg2DTD.Selected.Value,
                       Coalesce(drpEditOpt1DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt2DTD.Selected.Value, "")),
                    And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)),
                       drpEditPrg1DTD.Selected.Value = drpEditPrg3DTD.Selected.Value,
                       Coalesce(drpEditOpt1DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt3DTD.Selected.Value, "")),
                    And(Not(IsBlank(drpEditPrg2DTD.Selected.Value)),
                       drpEditPrg2DTD.Selected.Value = drpEditPrg3DTD.Selected.Value,
