      - btnSaveAppDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            DisplayMode: |-
              =If(
                Or(And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)), drpEditOpt1DTD.Visible,
                       IsBlank(drpEditOpt1DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg2DTD.Selected.Value)), drpEditOpt2DTD.Visible,
                       IsBlank(drpEditOpt2DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg3DTD.Selected.Value)), drpEditOpt3DTD.Visible,
                       IsBlank(drpEditOpt3DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)),
                       drpEditPrg1DTD.Selected.Value = drpEditPrg2DTD.Selected.Value,
                       Coalesce(drpEditOpt1DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt2DTD.Selected.Value, "")),
                   And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)),
                       drpEditPrg1DTD.Selected.Value = drpEditPrg3DTD.Selected.Value,
                       Coalesce(drpEditOpt1DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt3DTD.Selected.Value, "")),
                   And(Not(IsBlank(drpEditPrg2DTD.Selected.Value)),
                       drpEditPrg2DTD.Selected.Value = drpEditPrg3DTD.Selected.Value,
                       Coalesce(drpEditOpt2DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt3DTD.Selected.Value, ""))),
                DisplayMode.Disabled, DisplayMode.Edit)
            Font: =Typography.Family
            Height: =32
            HoverColor: =Self.Color
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({
                locApp: Patch(APPLICATIONS,
                  LookUp(APPLICATIONS, ID = locApp.ID),
                  {
                    ApplicantName: If(txtPersNameDTD.Text = "—", Blank(), txtPersNameDTD.Text),
                    Location: If(txtPersLocationDTD.Text = "—", Blank(), txtPersLocationDTD.Text),
                    JobTitle: If(txtPersTitleDTD.Text = "—", Blank(), txtPersTitleDTD.Text),
                    Grade: If(txtPersGradeDTD.Text = "—", Blank(), txtPersGradeDTD.Text),
                    JobSeries: If(txtPersSeriesDTD.Text = "—", Blank(), txtPersSeriesDTD.Text),
                    NCUAStartDate: dtpPersStartDTD.SelectedDate,
                    ServiceComputationDate: dtpPersScdDTD.SelectedDate,
                    FirstLineSupervisorEmail: If(txtPersSup1DTD.Text = "—", Blank(), txtPersSup1DTD.Text),
                    SecondLineSupervisorEmail: If(txtPersSup2DTD.Text = "—", Blank(), txtPersSup2DTD.Text),
                    // Eligibility. A choice is patched as { Value: "..." } and
                    // the record form comes FIRST in the If — putting Blank()
                    // first makes Power Fx infer the branch type from it.
                    ListedOnIDP:
                      If(Not(IsBlank(drpEligIdpDTD.Selected.Value)),
                        { Value: drpEligIdpDTD.Selected.Value }, Blank()),
                    AttendedInfoSession:
                      If(Not(IsBlank(drpEligSessionDTD.Selected.Value)),
                        { Value: drpEligSessionDTD.Selected.Value }, Blank()),
                    LatestPerformanceRating:
                      If(txtEligRatingDTD.Text = "—", Blank(),
                        Value(txtEligRatingDTD.Text)),
                    InfoSessionDate: dtpEligDateDTD.SelectedDate
                  }),
                locEditApp: false
              });
              // GUARDED, not diffed. Rank is positional, so a diff would have
              // to match on the (program, option, rank) triple and rewrite any
              // row whose rank moved — more failure surface than the
              // delete-and-rewrite it replaces.
              //
              // The write failure that cost the competencies cannot happen on
              // this list: New-LdpSharePointLists.ps1 made its Title optional
              // when it created it. The remaining risk was an unrelated save
              // rewriting choices from dropdowns that had failed to default,
              // and locChoicesDirty closes that — the flag is raised only by
              // the six dropdowns' OnChange.
              If(locChoicesDirty,
                Remove(APPLICATION_PROGRAM_CHOICES,
                  Filter(APPLICATION_PROGRAM_CHOICES, ApplicationID.Id = locApp.ID)));
              If(locChoicesDirty,
                ForAll(
                  Filter(
                    Table(
                    { PrgId: LookUp(PROGRAMS, ProgramName = drpEditPrg1DTD.Selected.Value).ID,
                      PrgName: drpEditPrg1DTD.Selected.Value,
                      OptId: LookUp(PROGRAM_OPTIONS,
                        And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg1DTD.Selected.Value).ID,
                            OptionName = drpEditOpt1DTD.Selected.Value)).ID,
                      OptName: drpEditOpt1DTD.Selected.Value, Rnk: 1 },
                    { PrgId: LookUp(PROGRAMS, ProgramName = drpEditPrg2DTD.Selected.Value).ID,
                      PrgName: drpEditPrg2DTD.Selected.Value,
                      OptId: LookUp(PROGRAM_OPTIONS,
                        And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg2DTD.Selected.Value).ID,
                            OptionName = drpEditOpt2DTD.Selected.Value)).ID,
                      OptName: drpEditOpt2DTD.Selected.Value, Rnk: 2 },
                    { PrgId: LookUp(PROGRAMS, ProgramName = drpEditPrg3DTD.Selected.Value).ID,
                      PrgName: drpEditPrg3DTD.Selected.Value,
                      OptId: LookUp(PROGRAM_OPTIONS,
                        And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg3DTD.Selected.Value).ID,
                            OptionName = drpEditOpt3DTD.Selected.Value)).ID,
                      OptName: drpEditOpt3DTD.Selected.Value, Rnk: 3 }
                  ),
                    Not(IsBlank(PrgId))
                  ) As ch,
                  Patch(APPLICATION_PROGRAM_CHOICES, Defaults(APPLICATION_PROGRAM_CHOICES),
                  {
                    ApplicationID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: locApp.ID,
                      Value: locApp.ApplicantEmail
                    },
                    ProgramID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: ch.PrgId,
                      Value: ch.PrgName
                    },
                    ProgramOptionID:
                      If(Not(IsBlank(ch.OptId)),
                        {
                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                          Id: ch.OptId,
                          Value: ch.OptName
                        },
                        Blank()),
                    Rank: ch.Rnk
                  })
              ));
              // GUARDED. This block deletes every competency row for the
              // application and rewrites it from colComps, so an empty or
              // stale colComps destroys the lot. colComps is built only by the
              // Edit toggle, which means a Personnel-only edit used to rewrite
              // competencies as a side effect — and did, losing them.
              //
              // locCompsDirty is set only by Add and Remove on the Competencies
              // tab. Deliberately removing every competency still saves,
              // because that sets the flag; not touching the tab now leaves the
              // list alone entirely.
              //
              // Two separate If()s rather than If(cond, A; B): semicolons
              // inside an If branch are the shape that parses inconsistently.
              // ADD FIRST, THEN REMOVE — never the other way round. Deleting
              // and rewriting means any failed write loses the whole set, which
              // is exactly what a required Title column did here: every Patch
              // failed validation after the Remove had already run.
              //
              // In this order a failed write costs the additions and nothing
              // else. The removal is correct either way, because it deletes
              // only what is genuinely absent from the working copy.
              //
              // colCompsWas is the stored set snapshotted BEFORE any write, so
              // "already there" is judged against what was on the server when
              // Save started, not against what this handler has since added.
              If(locCompsDirty,
                ClearCollect(colCompsWas,
                  ForAll(
                    Filter(APPLICATION_COMPETENCIES,
                      ApplicationID.Id = locApp.ID) As sv,
                    { CompId: sv.CompetencyID.Id })));
              If(locCompsDirty,
                ForAll(
                  Filter(colComps, Not(CompId in colCompsWas.CompId)) As cc,
                  Patch(APPLICATION_COMPETENCIES, Defaults(APPLICATION_COMPETENCIES),
                  {
                    ApplicationID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: locApp.ID,
                      Value: locApp.ApplicantEmail
                    },
                    CompetencyID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: cc.CompId,
                      Value: cc.CompName
                    }
                  })));
              If(locCompsDirty,
                Remove(APPLICATION_COMPETENCIES,
                  Filter(APPLICATION_COMPETENCIES,
                    ApplicationID.Id = locApp.ID,
                    Not(CompetencyID.Id in colComps.CompId))));
              ClearCollect(colComps,
                ForAll(
                  Filter(APPLICATION_COMPETENCIES,
                    ApplicationID.Id = locApp.ID) As ac,
                  {
                    CompId: ac.CompetencyID.Id,
                    CompName: ac.CompetencyID.Value,
                    TypeId:
                      LookUp(COMPETENCIES, ID = ac.CompetencyID.Id).CompetencyTypeID.Id,
                    TypeName:
                      LookUp(COMPETENCIES, ID = ac.CompetencyID.Id).CompetencyTypeID.Value,
                    TypeOrder:
                      LookUp(COMPETENCY_TYPES,
                        ID = LookUp(COMPETENCIES,
                               ID = ac.CompetencyID.Id).CompetencyTypeID.Id
                      ).SortOrder
                  }));
              UpdateContext({
                locCompsDirty: false,
                locChoicesDirty: false,
                locCompTypeDTD:
                  Coalesce(locCompTypeDTD,
                    First(SortByColumns(
                      Filter(COMPETENCY_TYPES, State.Value = "Active"),
                      "SortOrder", SortOrder.Ascending)).ID)
              });
              Reset(drpAddCompDTD);
              Reset(txtPersNameDTD); Reset(txtPersLocationDTD); Reset(txtPersTitleDTD);
              Reset(txtPersGradeDTD); Reset(txtPersSeriesDTD);
              Reset(txtPersSup1DTD); Reset(txtPersSup2DTD);
              Reset(dtpPersStartDTD); Reset(dtpPersScdDTD);
              Reset(drpEditPrg1DTD); Reset(drpEditOpt1DTD);
              Reset(drpEditPrg2DTD); Reset(drpEditOpt2DTD);
              Reset(drpEditPrg3DTD); Reset(drpEditOpt3DTD);
              Reset(txtEligRatingDTD); Reset(drpEligIdpDTD);
              Reset(drpEligSessionDTD); Reset(dtpEligDateDTD);
              Notify("Application updated.", NotificationType.Success)
            PressedColor: =Self.Color
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeBody
            TabIndex: =6
            Text: ="Save"
            Visible: =And(Not(IsBlank(locApp)), locEditApp)
            Width: =100
            X: =Parent.Width - 124
            Y: =60

