# Utility Bar — shared app chrome
# App name · signed-in user · the two secondary-role routes.
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
# Rationale: build/LANDING_DESIGN.md ① — this is the load-bearing above-the-fold
# route for program administrators and committee members.
#
# ---------------------------------------------------------------------------
# THIS IS A SHARED PASTE BLOCK
# ---------------------------------------------------------------------------
# Paste it FIRST on every screen, before that screen's own controls. It is not a
# canvas component, so each screen holds its own copy — change this file and you
# must re-paste it everywhere it is used. (Converting the shared blocks to real
# canvas components is the T083 refactor.)
#
# Studio will auto-suffix the duplicate names on the second and later screens
# (conUtilityBar_1, _2 …). That is FINE here: nothing references these controls
# by name, on this screen or any other. Do not "fix" the suffixes.
#
# ---------------------------------------------------------------------------
# WHAT IT DELIBERATELY DOES NOT CONTAIN
# ---------------------------------------------------------------------------
# · No sign-in control — internal app, single sign-on, the visitor is already
#   authenticated. Identity is displayed, never requested.
# · No page title. This is app chrome; the app name is constant across screens.
#   Each screen puts its own heading in its content area, below this bar.
# · No global menu. Role-based global navigation was ruled out deliberately —
#   see LANDING_DESIGN.md. These two links are utility nav, not a menu.
#
# ---------------------------------------------------------------------------
# WIRING THE TWO LINKS
# ---------------------------------------------------------------------------
# Both are DISABLED because neither destination screen exists yet. As each is
# built, set on that button:
#     DisplayMode: =DisplayMode.Edit
#     OnSelect:    =Navigate('<Screen Name>')
# and do it in this file, then re-paste everywhere — otherwise the copies drift.
#
# Screens that still carry their own navy header (Application Cycles, Program
# Options, Criterion Catalog, Scoring Rubrics) need that header deleted and their
# content shifted down before this bar fits. That is part of T083; do not mix it
# into an unrelated change.

- conUtilityBar:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Group: UtilityBar
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Navy900
      Height: =52
      Width: =Parent.Width
      X: =0
      # Sits directly below _EnvironmentBanner (see _EnvironmentBanner.yaml).
      # If the banner is present on the screen, its Height pushes the utility
      # bar down. If the banner is not on the screen or its height is 0, the
      # utility bar sits at the very top. Screens that use the utility bar
      # MUST paste _EnvironmentBanner too, or this reference won't resolve.
      Y: =If(lblEnvBanner.Height > 0, lblEnvBanner.Height, 0)
    Children:
      - lblUtilityBrand:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextOnDark
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =24
            Size: =Typography.SizeBody
            Text: ="NCUA Leader Development Program"
            Width: =420
            X: =24
            Y: =14
      - btnUtilityReviewers:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextOnDark
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Typography.Family
            Height: =28
            HoverFill: =ColorPalette.Navy700
            OnSelect: =Navigate('Supervisor Endorsement Screen')
            PressedFill: =ColorPalette.Navy700
            Size: =Typography.SizeCaption
            Text: ="Reviewers"
            Width: =100
            X: =Parent.Width - 262
            Y: =12
      - btnUtilityAdmin:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextOnDark
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Typography.Family
            Height: =28
            HoverFill: =ColorPalette.Navy700
            OnSelect: =Navigate('Admin Dashboard Screen')
            PressedFill: =ColorPalette.Navy700
            Size: =Typography.SizeCaption
            Text: ="Administrators"
            Width: =130
            X: =Parent.Width - 154
            Y: =12
