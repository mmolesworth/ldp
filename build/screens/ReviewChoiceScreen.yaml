# Review Choice Screen — routes reviewers to the correct workspace.
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# ---------------------------------------------------------------------------
# WHY THIS SCREEN EXISTS
# ---------------------------------------------------------------------------
# Both btnUtilityReviewers (in _UtilityBar) and btnBandReviewersLD (on the
# Landing band) point here. The screen asks the reviewer which workspace
# they mean — Supervisor endorsement or Committee scoring — then routes.
#
# A modal on the Landing Screen would work for the band button but not for
# the utility-bar button (which appears on multiple screens). One dedicated
# destination screen is the single source of truth for the choice.
#
# ---------------------------------------------------------------------------
# LAYOUT
# ---------------------------------------------------------------------------
#
#   conHeaderRC          Navy900 title — "Which review are you doing today?"
#   conCardSupRC         Left card — Supervisor review
#   conCardCommRC        Right card — Committee review
#   btnCancelRC          Small link at the bottom — back to Landing

- conBodyRC:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =692
      Width: =Parent.Width
      X: =0
      # Env banner + utility bar slim: 76px combined.
      Y: =76
    Children:
      # ===========================================================================
      # HEADER
      # ===========================================================================
      - conHeaderRC:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =88
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width - 48
            X: =24
            Y: =12
          Children:
            - lblHeaderTitleRC:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =30
                  Size: =Typography.SizeTitle
                  Text: ="Which review are you doing today?"
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =16
            - lblHeaderSubRC:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.Blue50
                  Font: =Typography.Family
                  Height: =24
                  Size: =Typography.SizeBody
                  Text: ="Pick the workspace that matches what you're here to do."
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =48
      # ===========================================================================
      # OPTION CARDS — two side-by-side, centered horizontally.
      # 460 wide × 260 tall each, 24 px gap.
      # Total: 460 + 24 + 460 = 944 → X margin = (Parent.Width - 944) / 2.
      # ===========================================================================
      # Cards: visual container + transparent button overlay + labels on top.
      # Labels are declared AFTER the button so they render on top of the
      # button's HoverFill — same flatten pattern as the Committee Score
      # anchor cards. Labels have OnSelect: =Select(btnCardXxRC) so a click
      # anywhere on the label area forwards to the underlying button.
      - conCardSupRC:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorPalette.Gray200
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =260
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =460
            X: =(Parent.Width - 944) / 2
            Y: =conHeaderRC.Y + conHeaderRC.Height + 60
      - btnCardSupRC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =conCardSupRC.Height
            HoverFill: =ColorPalette.Blue50
            OnSelect: =Navigate('Supervisor Endorsement Screen')
            PressedFill: =ColorPalette.Blue50
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Text: =""
            Width: =conCardSupRC.Width
            X: =conCardSupRC.X
            Y: =conCardSupRC.Y
      - lblCardSupHeadRC:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =32
            OnSelect: =Select(btnCardSupRC)
            Size: =Typography.SizeTitle
            Text: ="Supervisor review"
            Width: =conCardSupRC.Width - 40
            X: =conCardSupRC.X + 20
            Y: =conCardSupRC.Y + 32
      - lblCardSupDescRC:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =60
            OnSelect: =Select(btnCardSupRC)
            Size: =Typography.SizeBody
            Text: |-
              ="Approve or decline an employee's application to the Leadership Development Program."
            Width: =conCardSupRC.Width - 40
            X: =conCardSupRC.X + 20
            Y: =lblCardSupHeadRC.Y + lblCardSupHeadRC.Height + 8
      - lblCardSupCTARC:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.Blue600
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =20
            OnSelect: =Select(btnCardSupRC)
            Size: =Typography.SizeBody
            Text: ="Go to Supervisor review  →"
            Width: =conCardSupRC.Width - 40
            X: =conCardSupRC.X + 20
            Y: =conCardSupRC.Y + conCardSupRC.Height - 44
      - conCardCommRC:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorPalette.Gray200
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =260
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =460
            X: =conCardSupRC.X + conCardSupRC.Width + 24
            Y: =conCardSupRC.Y
      - btnCardCommRC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =conCardCommRC.Height
            HoverFill: =ColorPalette.Blue50
            OnSelect: =Navigate('Committee Queue Screen')
            PressedFill: =ColorPalette.Blue50
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Text: =""
            Width: =conCardCommRC.Width
            X: =conCardCommRC.X
            Y: =conCardCommRC.Y
      - lblCardCommHeadRC:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =32
            OnSelect: =Select(btnCardCommRC)
            Size: =Typography.SizeTitle
            Text: ="Committee review"
            Width: =conCardCommRC.Width - 40
            X: =conCardCommRC.X + 20
            Y: =conCardCommRC.Y + 32
      - lblCardCommDescRC:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =60
            OnSelect: =Select(btnCardCommRC)
            Size: =Typography.SizeBody
            Text: |-
              ="Score and rank applicants against your committee's rubric for a program."
            Width: =conCardCommRC.Width - 40
            X: =conCardCommRC.X + 20
            Y: =lblCardCommHeadRC.Y + lblCardCommHeadRC.Height + 8
      - lblCardCommCTARC:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.Blue600
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =20
            OnSelect: =Select(btnCardCommRC)
            Size: =Typography.SizeBody
            Text: ="Go to Committee review  →"
            Width: =conCardCommRC.Width - 40
            X: =conCardCommRC.X + 20
            Y: =conCardCommRC.Y + conCardCommRC.Height - 44
      # ===========================================================================
      # CANCEL — small link centered under the cards.
      # ===========================================================================
      - btnCancelRC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextHelp
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Typography.Family
            Height: =32
            HoverColor: =ColorPalette.TextHeading
            HoverFill: =RGBA(0, 0, 0, 0.03)
            OnSelect: =Navigate('Landing Screen')
            PressedColor: =ColorPalette.TextHeading
            PressedFill: =RGBA(0, 0, 0, 0.06)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeCaption
            Text: ="Cancel — back to home"
            Width: =220
            X: =(Parent.Width - Self.Width) / 2
            Y: =conCardSupRC.Y + conCardSupRC.Height + 32
