            Fill: =ColorPalette.White
            Height: =92
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =(Parent.Width - 36) / 2
            X: =12
            Y: =12
