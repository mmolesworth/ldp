      Visible: =conHeroLD.Visible
      Width: =Parent.Width - 48
      X: =24
      Y: =268

# A well behind the gallery. Without it the scrollbar sits on the page
# background with no boundary to belong to, which is what made a fourth
# program look wrong. Outer height is conditional so the page still fits.
- lblProgramsCountLD:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Right
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =22
      Size: =Typography.SizeCaption
      # Non-visual users get no benefit from a peek row or a scrollbar, so the
      # count says it in words.
      Text: |-
        =CountRows(Filter(PROGRAMS, State.Value = "Active")) & " programs" &
        If(CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3,
           " — scroll to see all", "")
      Visible: =conHeroLD.Visible
      Width: =320
      X: =Parent.Width - 344
      Y: =lblProgramsHeaderLD.Y

- conProgramsWellLD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =198
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =conHeroLD.Visible
      Width: =Parent.Width - 48
      X: =24
      Y: =lblProgramsHeaderLD.Y + 28
    Children:
      - galProgramsLD:
          Control: Gallery@2.15.0
          # Vertical + WrapCount is what gives a wrapping GRID. A Horizontal gallery
          # is a single row that scrolls sideways; a plain Vertical gallery is one
          # item per row. WrapCount 3 keeps the three-across layout and pushes a
          # fourth program onto a second row instead of off the right edge.
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            # Only one row fits between the header and the supporting panels, and the
            # page itself cannot scroll (no scroll host). So row two is reached by
            # scrolling inside the gallery — hence the conditional scrollbar below.
            # Sized so the supporting panels below still clear the role band in both
            # cases. Strip hidden: one row plus a 50px peek of row two — the peek is
            # the scroll affordance. Strip shown: exactly one row, everything shifts
            # down 60px, panels still land above the band.
            Height: =Parent.Height - 16
            # Retired programs must never reach an applicant-facing picker
            # (PROGRAMS.md). The gallery, the count above it and the scrollbar
            # all read the SAME filtered set, or the count contradicts the list.
            # PROGRAMS is a small reference list — the bounded non-delegable
            # exception. CountRows does not delegate; acceptable here and ONLY here.
            Items: =Filter(PROGRAMS, State.Value = "Active")
            ShowScrollbar: =CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3
            TemplatePadding: =0
            # In a wrapped Vertical gallery TemplateSize is the ROW HEIGHT. Each item's
            # width is derived automatically as gallery width / WrapCount, which the
            # card below reads as Parent.TemplateWidth.
            TemplateSize: =132
            Width: =Parent.Width - 16
            WrapCount: =3
            X: =8
            Y: =8
          Children:
            - conProgramCardLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.White
                  Height: =Parent.TemplateHeight - 8
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.TemplateWidth - 16
                  X: =8
                  Y: =4
                Children:
                  - lblProgramCardNameLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =24
                        Size: =Typography.SizeSubtitle
                        Text: =ThisItem.ProgramName
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =14
                  - lblProgramCardDescLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =74
                        Size: =Typography.SizeBody
                        Text: |-
                          =Coalesce(ThisItem.Description, "Description to be supplied by the program office.")
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =42

