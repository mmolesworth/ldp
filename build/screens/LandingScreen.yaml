# Landing Screen — US13 (RQ101–104, FR-051/052)
# Structure and rationale: build/LANDING_DESIGN.md — read that before changing layout.
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# Composition (Constitution VIII — library first):
#   · application progress — PowerLibs `timeline-progress` (Pro), generated
#     2026-07-25 via generate_yaml, adapted (see DEVIATIONS)
#   · everything else is layout the library has no component for
#
# ---------------------------------------------------------------------------
# HOW TO TRANSCRIBE (Constitution IV)
# ---------------------------------------------------------------------------
#   1. New screen → Blank. Rename it "Landing Screen".
#   1b. Paste build/screens/_UtilityBar.yaml FIRST (app chrome, shared).
#   2. Fill: =ColorPalette.Gray50
#   3. OnVisible — transcribe by hand:
#        =UpdateContext({
#           locCycle: If(IsBlank(LookUp(CYCLES, State.Value = "Open")),
#                        First(Sort(CYCLES, OpenDate, SortOrder.Descending)),
#                        LookUp(CYCLES, State.Value = "Open"))
#         });
#         UpdateContext({
#           locApp: LookUp(APPLICATIONS,
#                     And(CycleID.Id = locCycle.ID, ApplicantEmail = User().Email))
#         });
#         UpdateContext({
#           locTimeStep: Switch(locApp.RoutingStage.Value,
#             "Pending First Line",  2,
#             "Pending Second Line", 3,
#             "Pending Validation",  4,
#             "In Committee",        5,
#             "Closed",              6,
#             1)
#         })
#      The three calls must stay separate and in order — each depends on the
#      previous. Fields inside one UpdateContext cannot reference each other.
#   4. Data sources (three): CYCLES, APPLICATIONS, PROGRAMS.
#   5. App → StartScreen = 'Landing Screen'.
#   6. Preview (F5) — OnVisible does not run on the design surface.
#
# ---------------------------------------------------------------------------
# THE ONE-CTA RULE
# ---------------------------------------------------------------------------
# Exactly one primary CTA above the fold: btnApplyToday. Its label changes with
# applicant state (Apply Today / Finish your application) and the whole hero is
# replaced by the timeline once an application is in flight. That is one slot
# with state-dependent content — never two competing buttons.
# btnSeeDetails is deliberately low-emphasis (outlined, not filled).
# The role links are utility navigation in small type, not CTAs.
#
# ---------------------------------------------------------------------------
# TWO MUTUALLY EXCLUSIVE PAGE MODES
# ---------------------------------------------------------------------------
# locHasLiveApp = an application exists and is still in flight.
#   FALSE → hero + programmes + supporting panels  (the "should I apply?" page)
#   TRUE  → timeline only                          (the "where is it?" page)
# Once someone has applied, the pitch is noise, so the body sections hide. This
# is also what keeps the page inside one screen height without a scroll host:
# the timeline is 500px and would otherwise push the role band off-screen.
# Utility bar, role band and footer are present in both modes.
#
# ---------------------------------------------------------------------------
# DEVIATIONS FROM THE GENERATED timeline-progress
# ---------------------------------------------------------------------------
# 1. REMOVED Next / Undo / Reset and the demo status line. An applicant able to
#    advance their own endorsement state is an integrity problem.
# 2. varTimeStep → locTimeStep, driven by APPLICATIONS.RoutingStage.
# 3. Description text Size 8 → Typography.SizeCaption (9); 8pt is below the
#    Section 508 floor in theme.md.
# Dot/line geometry, 70px step rhythm, active-state colouring and the green
# completion state are the component as designed.

# ===========================================================================
# ① UTILITY BAR — now a shared block: build/screens/_UtilityBar.yaml
# Paste that file FIRST, then everything below. It is shared with every other
# screen, so it is not duplicated here.
# ===========================================================================

# ===========================================================================
# ② HERO — one primary CTA. Hidden once an application is in flight.
# ===========================================================================
- conHeroLD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.Navy900
      Height: =176
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: |-
        =Not(And(
          Not(IsBlank(locApp)),
          Or(locApp.Status.Value = "Submitted",
             locApp.Status.Value = "Complete",
             locApp.Status.Value = "Incomplete")
        ))
      Width: =Parent.Width - 48
      X: =24
      Y: =72
    Children:
      - lblHeroHeadlineLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextOnDark
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =36
            Size: =Typography.SizeHero
            Text: ="Apply to the Leader Development Program"
            Width: =Parent.Width - 320
            X: =28
            Y: =28
      # Who it is for and what the deadline is — the two things that decide
      # whether the applicant reads on. Facts only; no invented claims about
      # the programme (Constitution I).
      - lblHeroSubheadLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextOnDarkMuted
            Font: =Typography.Family
            Height: =48
            Size: =Typography.SizeTitle
            Text: |-
              =Switch(locCycle.State.Value,
                "Open",
                  "Now accepting applications for " & locCycle.CycleName & ". Deadline " &
                  Text(locCycle.CloseDate, "mmmm d, yyyy") & "; decisions by " &
                  Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                "Closed",
                  "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                  ". Applicants will be notified by " &
                  Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                "In Review",
                  "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                  ". Applicants will be notified by " &
                  Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                "Scheduled",
                  "Not yet accepting applications. The " & locCycle.CycleName & " cycle opens " &
                  Text(locCycle.OpenDate, "mmmm d, yyyy") & ".",
                "No application cycle is currently scheduled.")
            Width: =Parent.Width - 320
            X: =28
            Y: =66
      # Outcome, once a decision exists. Replaces the invitation.
      - lblHeroOutcomeLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextOnDark
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =24
            Size: =Typography.SizeBody
            Text: |-
              =Switch(locApp.Status.Value,
                "Placed", "You have been placed in this cohort.",
                "Not Selected", "You were not selected for this cohort.",
                "")
            Visible: |-
              =Or(locApp.Status.Value = "Placed", locApp.Status.Value = "Not Selected")
            Width: =Parent.Width - 320
            X: =28
            Y: =120
      # THE primary CTA. Disabled until the Application Screen is transcribed.
      - btnApplyTodayLD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.Navy900
            # Live only while a cycle is Open (FR-051/FR-008). The hero itself is
            # hidden once an application is in flight, so no submitted-state test
            # is needed here.
            DisplayMode: |-
              =If(locCycle.State.Value = "Open", DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =ColorPalette.White
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =52
            HoverFill: =ColorPalette.Gray50
            # The Application Screen's OnVisible resolves the applicant's row for
            # this cycle — existing Draft if there is one, blank otherwise. The
            # row is written on first Save draft or Submit, not on arrival, so
            # clicking through and leaving does not litter APPLICATIONS with
            # empty rows. FR-011 holds either way: one row per (cycle, email).
            OnSelect: =Navigate('Application Screen')
            PressedFill: =ColorPalette.Gray50
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeHeading
            Text: |-
              =If(IsBlank(locApp), "Apply Today", "Finish your application")
            Width: =240
            X: =Parent.Width - 268
            Y: =40
      - lblCtaWhyLD:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextOnDarkMuted
            Font: =Typography.Family
            Height: =28
            Size: =Typography.SizeCaption
            Text: ="Applications can only be submitted while a cycle is open."
            Visible: =locCycle.State.Value <> "Open"
            Width: =240
            X: =Parent.Width - 268
            Y: =142

# ===========================================================================
# ③ REVIEWER STRIP — conditional, data-driven, no self-identification
# ===========================================================================
# Reinforcement only. The supervisor's real path is the deep-linked email
# (T076); this is for someone already in the app. An applicant never sees it.
- conReviewerStripLD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.WarningLight
      Height: =52
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      # FirstLine/SecondLineSupervisorEmail are snapshots taken at submit (R1/R5).
      # Delegable: ApplicantEmail and RoutingStage are indexed; this filters on
      # the snapshot columns, which are not — acceptable because the result set
      # is one cycle's applications, but revisit at multi-cycle volume (T082).
      Visible: |-
        =Not(IsEmpty(Filter(APPLICATIONS,
          Or(FirstLineSupervisorEmail = User().Email,
             SecondLineSupervisorEmail = User().Email))))
      Width: =Parent.Width - 48
      X: =24
      Y: =260
    Children:
      - lblReviewerStripLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =24
            Size: =Typography.SizeBody
            Text: |-
              =CountRows(Filter(APPLICATIONS,
                Or(FirstLineSupervisorEmail = User().Email,
                   SecondLineSupervisorEmail = User().Email))) &
              " application(s) are waiting for your endorsement."
            Width: =Parent.Width - 220
            X: =20
            Y: =14
      - btnReviewerStripLD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.WarningText
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.WarningText
            DisplayMode: =DisplayMode.Disabled
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =30
            OnSelect: =false
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeCaption
            Text: ="Review them"
            Width: =140
            X: =Parent.Width - 160
            Y: =11

