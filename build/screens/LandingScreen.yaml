                          ]
                        ShowScrollbar: =true
                        TemplatePadding: =6
                        TemplateSize: =160
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =72
                      Children:
                        - conFaqItemLD:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorPalette.Gray200
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorPalette.White
                              Height: =If(locOpenFaqIdLD = ThisItem.id, lblFaqTitleLD.Height + lblFaqBodyLD.Height + 16, lblFaqTitleLD.Height)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =galFaqLD.TemplateWidth
                        - lblFaqBodyLD:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =ColorPalette.TextBody
                              Font: =Typography.Family
                              Height: =80
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              Size: =Typography.SizeCaption
                              Text: =ThisItem.body
                              Visible: =locOpenFaqIdLD = ThisItem.id
                              Width: =galFaqLD.TemplateWidth - imgFaqArrowLD.Width - 32
                              Y: =lblFaqTitleLD.Height
                        - lblFaqTitleLD:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextHeading
                              Font: =Typography.Family
                              FontWeight: =Typography.WeightBold
                              Height: =40
                              PaddingLeft: =16
                              Size: =Typography.SizeLabel
                              Text: =ThisItem.title
                              Width: =galFaqLD.TemplateWidth - imgFaqArrowLD.Width - 24
                        - imgFaqArrowLD:
                            Control: Image@2.2.3
                            Properties:
                              Height: =16
                              Image: |
                                ="data:image/svg+xml," & EncodeUrl(
                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='40px' height='40px'>
                                      <style>
                                        .arrow" & ThisItem.id & "_" & LookUp(colFaqAnimTriggersLD, itemID = ThisItem.id).timestamp & " {
                                          stroke: black;
                                          stroke-width: 1.5;
                                          stroke-linecap: round;
                                          stroke-linejoin: round;
                                          fill: none;
                                          transform-origin: center;
                                          animation-name: rotateArrow" & ThisItem.id & "_" & LookUp(colFaqAnimTriggersLD, itemID = ThisItem.id).timestamp & ";
                                          animation-duration: " & If(IsBlank(LookUp(colFaqAnimTriggersLD, itemID = ThisItem.id).timestamp), "0ms", "400ms") & ";
                                          animation-fill-mode: both;
                                        }
                                        @keyframes rotateArrow" & ThisItem.id & "_" & LookUp(colFaqAnimTriggersLD, itemID = ThisItem.id).timestamp & " {
                                          " & If(locOpenFaqIdLD = ThisItem.id, "0%", "100%") & " {
                                            transform: rotate(0deg);
                                            d: path('m4.5 15.75 7.5-7.5 7.5 7.5');
                                          }
                                          " & If(locOpenFaqIdLD = ThisItem.id, "100%", "0%") & " {
                                            transform: rotate(180deg);
                                            d: path('m4.5 15.75 7.5-7.5 7.5 7.5');
                                          }
                                        }
                                      </style>
                                      <path class='arrow" & ThisItem.id & "_" & LookUp(colFaqAnimTriggersLD, itemID = ThisItem.id).timestamp & "' d='m4.5 15.75 7.5-7.5 7.5 7.5' />
                                    </svg>"
                                )
                              OnSelect: =false
                              Width: =16
                              X: =Parent.TemplateWidth - Self.Width - 16
                              Y: =12
                        - btnFaqItemLD:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Align: =Align.Left
                              BorderStyle: =BorderStyle.None
                              Color: =ColorPalette.TextHeading
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =Typography.Family
                              Height: =If(locOpenFaqIdLD = ThisItem.id, lblFaqTitleLD.Height + lblFaqBodyLD.Height + 16, lblFaqTitleLD.Height)
                              HoverColor: =ColorPalette.TextHeading
                              # 4% dark tint — subtle hover feedback without covering
                              # the title/body labels beneath (the button sits ABOVE
                              # them in tree order). An opaque HoverFill would wash
                              # the text out — see 2026-08-04 fix.
                              HoverFill: =RGBA(0, 0, 0, 0.04)
                              OnSelect: |-
                                =UpdateContext({ locOpenFaqIdLD: If(locOpenFaqIdLD = ThisItem.id, Blank(), ThisItem.id) });
                                RemoveIf(colFaqAnimTriggersLD, itemID = ThisItem.id);
                                Collect(colFaqAnimTriggersLD, { itemID: ThisItem.id, timestamp: Text(Now(), "yyyymmddhhmmss") })
                              PaddingLeft: =16
                              PaddingRight: =16
                              PressedColor: =ColorPalette.TextHeading
                              PressedFill: =RGBA(0, 0, 0, 0.08)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =Typography.SizeLabel
                              Text: =""
                              Width: =galFaqLD.TemplateWidth
                              X: =0
                              Y: =0

