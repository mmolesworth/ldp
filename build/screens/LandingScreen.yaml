      # -----------------------------------------------------------------------
      # FAQ MODAL — opens when the FAQs card in the info panels is clicked.
      #
      # Last child of conBodyLD, so it renders on top of every sibling above
      # (hero, programs, info panels, role band). Overlay covers the body
      # region only — the utility bar and environment banner stay visible.
      # Users can still orient themselves via the header chrome while the
      # modal is open, which for an informational FAQ is preferable to a
      # fully blocking modal.
      #
      # State (all initialised in OnVisible):
      #   locFaqOpenLD           — visibility toggle
      #   locOpenFaqIdLD         — which accordion item is expanded (Blank = none)
      #   colFaqAnimTriggersLD   — animation-restart tokens per item
      #
      # The gallery inside is the PowerLibs `accordion-card` component —
      # generated 2026-08-04 via generate_yaml with 5 Lorem Ipsum items.
      # Renamed to project convention and colours/sizes swapped to theme
      # tokens. Replace the items in `galFaqLD.Items` when real FAQs exist.
      # -----------------------------------------------------------------------
      - conFaqModalLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            Height: =Parent.Height
            Visible: =locFaqOpenLD
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            # Dark backdrop — click anywhere outside the content card closes.
            - btnFaqModalBackdropLD:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0.5)
                  Font: =Typography.Family
                  Height: =Parent.Height
                  HoverFill: =RGBA(0, 0, 0, 0.5)
                  OnSelect: |-
                    =UpdateContext({ locFaqOpenLD: false })
                  PressedFill: =RGBA(0, 0, 0, 0.5)
                  Text: =""
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            # Content card — centred. Clicks INSIDE do not bubble to the backdrop.
            - conFaqModalCardLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =ColorPalette.White
                  Height: =Min(600, Max(Parent.Height - 40, 240))
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Min(720, Parent.Width - 48)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - lblFaqModalTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =32
                        Size: =Typography.SizeHeading
                        Text: ="Frequently Asked Questions"
                        Width: =Parent.Width - 96
                        X: =24
                        Y: =24
                  - btnFaqModalCloseLD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =ColorPalette.TextHelp
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =32
                        HoverColor: =ColorPalette.TextHeading
                        HoverFill: =ColorPalette.Gray50
                        OnSelect: |-
                          =UpdateContext({ locFaqOpenLD: false })
                        PressedColor: =ColorPalette.TextHeading
                        PressedFill: =ColorPalette.Gray50
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Size: =Typography.SizeSubtitle
                        Text: ="X"
                        Width: =32
                        X: =Parent.Width - 56
                        Y: =20
                  # PowerLibs accordion-card — five Lorem Ipsum items.
                  - galFaqLD:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                      Properties:
                        BorderColor: =ColorPalette.Gray200
                        Height: =Parent.Height - 96
                        Items: |-
                          =[
                            { id: 1, title: "Lorem ipsum dolor sit amet?", body: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat." },
