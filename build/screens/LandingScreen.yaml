# Landing Screen — US13 (RQ101–104, FR-051/052)
# Structure and rationale: build/LANDING_DESIGN.md — read that before changing layout.
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# Composition (Constitution VIII — library first):
#   · FAQ modal accordion — PowerLibs `accordion-card` (Pro), generated
#     2026-08-04 via generate_yaml, renamed to project convention
#   · everything else is layout the library has no component for
#
# ---------------------------------------------------------------------------
# HOW TO TRANSCRIBE (Constitution IV)
# ---------------------------------------------------------------------------
# Steps marked (screen) are properties of the SCREEN itself — select the screen
# in the tree view and set them in the properties pane. They are NOT properties
# of the utility bar or of any control listed below it.
#
# They cannot be pasted, and there is no way to make them pasteable. Studio's
# Paste YAML inserts CONTROLS into the selected screen, so a paste block has no
# screen node to carry Fill, OnVisible or OnStart. Only the app-source format
# written by `pac canvas unpack` has one, and Studio will not paste that.
#
# The OnVisible below is also kept comment-free and ready to copy in
# build/screens/LandingScreen.OnVisible.fx.
#
#   1. New screen → Blank. Rename it "Landing Screen".
#   1b. Paste build/screens/_UtilityBar.yaml FIRST (app chrome, shared).
#   2. (screen) Fill: =ColorPalette.Gray50
#   3. (screen) OnVisible — transcribe by hand:
#        =UpdateContext({
#           locCycle: If(IsBlank(LookUp(CYCLES, State.Value = "Open")),
#                        First(Sort(CYCLES, OpenDate, SortOrder.Descending)),
#                        LookUp(CYCLES, State.Value = "Open")),
#           locFaqOpenLD:   false, locOpenFaqIdLD:   Blank(),
#           locNeedOpenLD:  false, locOpenNeedIdLD:  Blank(),
#           locDatesOpenLD: false, locOpenDatesIdLD: Blank(),
#           locEligOpenLD:  false, locOpenEligIdLD:  Blank()
#        });
#        UpdateContext({
#           locApp: LookUp(APPLICATIONS,
#                     And(CycleID.Id = locCycle.ID, ApplicantEmail = User().Email))
#        });
#        ClearCollect(colFaqAnimTriggersLD,   { itemID: 0, timestamp: "" });
#        ClearCollect(colNeedAnimTriggersLD,  { itemID: 0, timestamp: "" });
#        ClearCollect(colDatesAnimTriggersLD, { itemID: 0, timestamp: "" });
#        ClearCollect(colEligAnimTriggersLD,  { itemID: 0, timestamp: "" })
#      locCycle/locApp: two UpdateContexts, in order — locApp depends on
#      locCycle, and fields inside one UpdateContext cannot reference each
#      other. Four modals (FAQs, Before you start, Key dates, Eligibility)
#      each carry three state pieces: loc*OpenLD (visibility), locOpen*IdLD
#      (which accordion item is expanded), col*AnimTriggersLD (per-item
#      animation-restart tokens). The ClearCollect placeholder row (id 0)
#      establishes the schema; id 0 never matches a real item, harmless.
#   4. Data sources (three): CYCLES, APPLICATIONS, PROGRAMS.
#   5. App → StartScreen = 'Landing Screen'.
#   6. Preview (F5) — OnVisible does not run on the design surface.
#
# ---------------------------------------------------------------------------
# THE ONE-CTA RULE
# ---------------------------------------------------------------------------
# Exactly one primary CTA above the fold: btnApplyToday. Its label changes with
# applicant state (Apply Today / Finish your application). That is one slot
# with state-dependent content — never two competing buttons.
# The role links are utility navigation in small type, not CTAs.

# ===========================================================================
# ① UTILITY BAR — now a shared block: build/screens/_UtilityBar.yaml
# Paste that file FIRST, then everything below. It is shared with every other
# screen, so it is not duplicated here.
# ===========================================================================

# ===========================================================================
# ② BODY — everything between the utility bar and the role band.
#
# One responsive container so the body region reflows automatically when the
# environment banner shifts the utility bar down (or hides itself), and grows
# to fill the available height on larger displays. Children inside stay
# manual-layout; the container just anchors the top and stretches the bottom.
# ===========================================================================
- conBodyLD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Width: =Parent.Width
      X: =0
      # Anchor top: sit 20px below the utility bar's bottom edge. When the
      # environment banner is present the utility bar shifts down and this
      # whole region follows it; no other Y values need editing.
      Y: =conUtilityBar.Y + conUtilityBar.Height + 20
      # Fill to the screen bottom. The role band lives inside as a child and
      # anchors itself to Parent.Height - 140, so it still sits 140px above
      # the screen bottom without needing a sibling reference from here.
      Height: =Parent.Height - Self.Y
    Children:
      # -----------------------------------------------------------------------
      # HERO — one primary CTA. Sits at the top of the body container.
      # -----------------------------------------------------------------------
      - conHeroLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =160
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - 48
            X: =24
            # Relative to conBodyLD, which handles the utility-bar offset.
            # Y=16 adds breathing room between the utility bar and the hero;
            # the paired Height reduction keeps the hero's bottom edge fixed
            # so nothing downstream needs to shift.
            Y: =16
          Children:
            - lblHeroHeadlineLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =38
                  Size: =Typography.SizeHero
                  Text: ="Apply to the Leader Development Program"
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =28
            # Who it is for and what the deadline is — the two things that decide
            # whether the applicant reads on. Facts only; no invented claims about
            # the programme (Constitution I).
            - lblHeroSubheadLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDarkMuted
                  Font: =Typography.Family
                  Height: =48
                  Size: =Typography.SizeSubtitle
                  Text: |-
                    =Switch(locCycle.State.Value,
                      "Open",
                        "Now accepting applications for " & locCycle.CycleName & ". Deadline " &
                        Text(locCycle.CloseDate, "mmmm d, yyyy") & "; decisions by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "Closed",
                        "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                        ". Applicants will be notified by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "In Review",
                        "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                        ". Applicants will be notified by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "Scheduled",
                        "Not yet accepting applications. The " & locCycle.CycleName & " cycle opens " &
                        Text(locCycle.OpenDate, "mmmm d, yyyy") & ".",
                      "No application cycle is currently scheduled.")
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =66
            # Outcome, once a decision exists. Replaces the invitation.
            - lblHeroOutcomeLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =24
                  Size: =Typography.SizeBody
                  Text: |-
                    =Switch(locApp.PlacementOutcome.Value,
                      "Placed", "You have been placed in this cohort.",
                      "Not Selected", "You were not selected for this cohort.",
                      "Placement Declined", "You declined your placement in this cohort.",
                      "")
                  Visible: |-
                    =And(Not(IsBlank(locApp.PlacementOutcome.Value)),
                       locApp.PlacementOutcome.Value <> "Decision Pending")
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =120
            # THE primary CTA. Disabled until the Application Screen is transcribed.
            - btnApplyTodayLD:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =ColorPalette.TextOnDark
                  # Live only while a cycle is Open (FR-051/FR-008) UNLESS the
                  # applicant has already submitted — in that case the button
                  # switches to "Track your application" and stays enabled so
                  # they can always open the Application Status Screen, even
                  # after the cycle has closed.
                  DisplayMode: |-
                    =If(Or(locApp.ApplicationStatus.Value = "Submitted",
                           locApp.ApplicationStatus.Value = "Validated"),
                        DisplayMode.Edit,
                        If(locCycle.State.Value = "Open",
                           DisplayMode.Edit, DisplayMode.Disabled))
                  # Accent Blue on the Navy900 hero — the primary CTA reads
                  # as filled + prominent rather than a subtle white pill.
                  Fill: =ColorPalette.Blue600
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =52
                  HoverColor: =ColorPalette.TextOnDark
                  HoverFill: =ColorPalette.Blue700
                  # No app or Draft → Application Screen (its OnVisible resolves
                  # the applicant's row for this cycle: existing Draft if any,
                  # blank otherwise — the row is written on first Save draft or
                  # Submit, not on arrival, so FR-011's one-row-per-(cycle,email)
                  # holds either way).
                  # Submitted/Validated → Application Status Screen (read-only
                  # tracking view; kept reachable after cycle close).
                  OnSelect: |-
                    =Switch(Coalesce(locApp.ApplicationStatus.Value, ""),
                        "Submitted", Navigate('Application Status Screen'),
                        "Validated", Navigate('Application Status Screen'),
                        Navigate('Application Screen'))
                  PressedColor: =ColorPalette.TextOnDark
                  PressedFill: =ColorPalette.Blue700
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeHeading
                  Text: |-
                    =Switch(Coalesce(locApp.ApplicationStatus.Value, ""),
                        "Draft",     "Finish your application",
                        "Submitted", "Track your application",
                        "Validated", "Track your application",
                        "Apply Today")
                  Width: =240
                  X: =Parent.Width - 268
                  Y: =40
            - lblCtaWhyLD:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextOnDarkMuted
                  Font: =Typography.Family
                  Height: =28
                  Size: =Typography.SizeCaption
                  Text: ="Applications can only be submitted while a cycle is open."
                  Visible: |-
                    =And(locCycle.State.Value <> "Open",
                         Not(Or(locApp.ApplicationStatus.Value = "Submitted",
                                locApp.ApplicationStatus.Value = "Validated")))
                  Width: =240
                  X: =Parent.Width - 268
                  Y: =128
      
      # -----------------------------------------------------------------------
      # PROGRAMS & INFO — applicant content only. No role switching in this
      # region. Anchored to the hero above rather than a fixed Y so the whole
      # section shifts when the hero grows or moves.
      # -----------------------------------------------------------------------
      - lblProgramsHeaderLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =24
            Size: =Typography.SizeSubtitle
            Text: ="Learn about the programs"
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =conHeroLD.Y + conHeroLD.Height + 20
      
      # A well behind the gallery. Without it the scrollbar sits on the page
      # background with no boundary to belong to, which is what made a fourth
      # program look wrong. Outer height is conditional so the page still fits.
      - lblProgramsCountLD:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =22
            Size: =Typography.SizeCaption
            # Non-visual users get no benefit from a peek row or a scrollbar, so the
            # count says it in words.
            Text: |-
              =CountRows(Filter(PROGRAMS, State.Value = "Active")) & " programs" &
              If(CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3,
                 " — scroll to see all", "")
            Visible: =conHeroLD.Visible
            Width: =320
            X: =Parent.Width - 344
            Y: =lblProgramsHeaderLD.Y
      
      - conProgramsWellLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray25
            # Responsive: shrink on tight viewports so the info panels below
            # still get their room above the role band. Natural cap is 198
            # (two rows of program cards); floor is 100 (one row with a
            # scrollbar). Reserves ~300px below for info header + info
            # panels + role band + gaps.
            Height: =Max(100, Min(198, Parent.Height - Self.Y - 300))
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =lblProgramsHeaderLD.Y + 28
          Children:
            - galProgramsLD:
                Control: Gallery@2.15.0
                # Vertical + WrapCount is what gives a wrapping GRID. A Horizontal gallery
                # is a single row that scrolls sideways; a plain Vertical gallery is one
                # item per row. WrapCount 3 keeps the three-across layout and pushes a
                # fourth program onto a second row instead of off the right edge.
                Variant: Vertical
                Properties:
                  BorderColor: =ColorPalette.Gray200
                  # Only one row fits between the header and the supporting panels, and the
                  # page itself cannot scroll (no scroll host). So row two is reached by
                  # scrolling inside the gallery — hence the conditional scrollbar below.
                  # Sized so the supporting panels below still clear the role band in both
                  # cases. Strip hidden: one row plus a 50px peek of row two — the peek is
                  # the scroll affordance. Strip shown: exactly one row, everything shifts
                  # down 60px, panels still land above the band.
                  Height: =Parent.Height - 16
                  # Retired programs must never reach an applicant-facing picker
                  # (PROGRAMS.md). The gallery, the count above it and the scrollbar
                  # all read the SAME filtered set, or the count contradicts the list.
                  # PROGRAMS is a small reference list — the bounded non-delegable
                  # exception. CountRows does not delegate; acceptable here and ONLY here.
                  Items: =Filter(PROGRAMS, State.Value = "Active")
                  ShowScrollbar: =CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3
                  TemplatePadding: =0
                  # In a wrapped Vertical gallery TemplateSize is the ROW HEIGHT. Each item's
                  # width is derived automatically as gallery width / WrapCount, which the
                  # card below reads as Parent.TemplateWidth.
                  TemplateSize: =132
                  Width: =Parent.Width - 16
                  WrapCount: =3
                  X: =8
                  Y: =8
                Children:
                  - conProgramCardLD:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =ColorPalette.White
                        Height: =Parent.TemplateHeight - 4
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.TemplateWidth - 16
                        X: =8
                        Y: =4
                      Children:
                        - lblProgramCardNameLD:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextHeading
                              Font: =Typography.Family
                              FontWeight: =Typography.WeightBold
                              Height: =24
                              Size: =Typography.SizeLabel
                              Text: =ThisItem.ProgramName
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =14
                        - lblProgramCardDescLD:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextBody
                              Font: =Typography.Family
                              Height: =74
                              Size: =Typography.SizeCaption
                              Text: |-
                                =Coalesce(ThisItem.Description, "Description to be supplied by the program office.")
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =42
      
      - lblInfoHeaderLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =22
            Size: =Typography.SizeSubtitle
            Text: ="What you need to know"
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =conProgramsWellLD.Y + conProgramsWellLD.Height + 12

      # -----------------------------------------------------------------------
      # INFO PANELS — the four supporting cards. Wrapped in their own container
      # so they sit vertically centred inside a taller region instead of
      # crashing against the "What you need to know" header above them.
      # -----------------------------------------------------------------------
      - conInfoPanelsLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            # Fill the space between the info header above and the role band
            # below. Panels inside stay centred vertically via their own Y
            # formula and shrink their own height when the wrapper is short.
            # 100px minimum guarantees the panels always render at a usable
            # size — pairs with the responsive conProgramsWellLD.Height so
            # the programs well is what shrinks on tight viewports, not the
            # info panels below.
            Height: =Max(conRoleWellLD.Y - Self.Y - 20, 100)
            Visible: =conHeroLD.Visible
            Width: =Parent.Width
            X: =0
            Y: =lblInfoHeaderLD.Y + lblInfoHeaderLD.Height + 16
          Children:
            - conNeedLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.Navy900
                  # Cap at 72 (the natural size). Shrink if the wrapper is
                  # short — 8px total padding kept between panel and wrapper
                  # edges; 12px absolute minimum so the panel never inverts.
                  Height: =Min(72, Max(Parent.Height - 8, 12))
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Visible: =conHeroLD.Visible
                  Width: =(Parent.Width - 96) / 4
                  X: =24
                  # Vertically centred within the wrapper.
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - lblNeedTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =26
                        Size: =Typography.SizeSubtitle
                        Text: ="Before you start"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnNeedOverlayLD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Typography.Family
                        Height: =Parent.Height
                        HoverFill: =RGBA(255, 255, 255, 0.08)
                        OnSelect: |-
                          =UpdateContext({ locNeedOpenLD: true })
                        PressedFill: =RGBA(255, 255, 255, 0.15)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Text: =""
                        Width: =Parent.Width
                        X: =0
                        Y: =0
            
            - conDatesLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.Navy900
                  Height: =conNeedLD.Height
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Visible: =conHeroLD.Visible
                  Width: =conNeedLD.Width
                  X: =conNeedLD.X + conNeedLD.Width + 16
                  Y: =conNeedLD.Y
                Children:
                  - lblDatesTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =26
                        Size: =Typography.SizeSubtitle
                        Text: ="Key dates"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnDatesOverlayLD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Typography.Family
                        Height: =Parent.Height
                        HoverFill: =RGBA(255, 255, 255, 0.08)
                        OnSelect: |-
                          =UpdateContext({ locDatesOpenLD: true })
                        PressedFill: =RGBA(255, 255, 255, 0.15)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Text: =""
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  # The only supporting panel with real content — it comes from CYCLES.
            
            - conEligibilityLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.Navy900
                  Height: =conNeedLD.Height
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Visible: =conHeroLD.Visible
                  Width: =conNeedLD.Width
                  X: =conDatesLD.X + conNeedLD.Width + 16
                  Y: =conNeedLD.Y
                Children:
                  - lblEligibilityTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =26
                        Size: =Typography.SizeSubtitle
                        Text: ="Eligibility"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnEligOverlayLD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Typography.Family
                        Height: =Parent.Height
                        HoverFill: =RGBA(255, 255, 255, 0.08)
                        OnSelect: |-
                          =UpdateContext({ locEligOpenLD: true })
                        PressedFill: =RGBA(255, 255, 255, 0.15)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Text: =""
                        Width: =Parent.Width
                        X: =0
                        Y: =0
            
            - conContactLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.Navy900
                  Height: =conNeedLD.Height
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Visible: =conHeroLD.Visible
                  Width: =conNeedLD.Width
                  X: =conEligibilityLD.X + conNeedLD.Width + 16
                  Y: =conNeedLD.Y
                Children:
                  - lblContactTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =26
                        Size: =Typography.SizeSubtitle
                        Text: ="FAQs"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =(Parent.Height - Self.Height) / 2
                  # Transparent overlay makes the whole card clickable and
                  # opens the FAQ modal. Sits last in the child list so it
                  # captures clicks above the label.
                  - btnContactOverlayLD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Typography.Family
                        Height: =Parent.Height
                        HoverFill: =RGBA(255, 255, 255, 0.08)
                        OnSelect: |-
                          =UpdateContext({ locFaqOpenLD: true })
                        PressedFill: =RGBA(255, 255, 255, 0.15)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Text: =""
                        Width: =Parent.Width
                        X: =0
                        Y: =0
      # -----------------------------------------------------------------------
      # ROLE BAND — in a well, like the programs section. On a Gray50 page two
      # white panels with nothing behind them did not read as a distinct region.
      # Anchored to Parent.Height - 140 (Parent = conBodyLD, which fills to the
      # screen bottom), so it sits 140px above the screen bottom regardless.
      # -----------------------------------------------------------------------
      - conRoleWellLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray25
            Height: =116
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - 48
            X: =24
            Y: =Parent.Height - 140
          Children:
            - conBandReviewersLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.White
                  Height: =92
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =(Parent.Width - 36) / 2
                  X: =12
                  Y: =12
                Children:
                  - lblBandReviewersTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =22
                        Size: =Typography.SizeBody
                        Text: ="Reviewing applications?"
