                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - Parent.Width * 0.60 - 24
                  X: =Parent.Width * 0.60
                  Y: =138
            # lblS6ConfirmAP was here — a post-submit banner reading "Your application
            # has been submitted and routed to your first-line supervisor." Removed
            # 2026-08-02: Submit now navigates to the Application Status Screen, which
            # says the same thing with a timeline behind it. The banner could only
            # ever be seen by someone who came BACK to a submitted application, and
            # lblReadOnlyAP already tells that person what they need to know.
            # FR-009 — Submit is the ONLY gated action in the wizard.
            - btnSubmitAP:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =ColorPalette.TextOnDark
                  DisplayMode: |-
                    =If(
                      Or(Or(IsBlank(Trim(txtNameAP.Text)),
                            IsBlank(Trim(txtEmailAP.Text)),
                            IsBlank(Trim(txtLocationAP.Text)),
                            IsBlank(Trim(txtJobTitleAP.Text)),
                            IsBlank(Trim(txtGradeAP.Text)),
                            IsBlank(Trim(txtSeriesAP.Text)),
                            IsBlank(dtpStartAP.SelectedDate),
                            IsBlank(dtpScdAP.SelectedDate),
                            IsBlank(Trim(txtSup1AP.Text)),
                            IsBlank(Trim(txtSup2AP.Text))),
                         Or(IsBlank(drpProgram1AP.Selected.Value),
                            And(drpOption1AP.Visible, IsBlank(drpOption1AP.Selected.Value)),
                            And(Not(IsBlank(drpProgram2AP.Selected.Value)),
                                drpOption2AP.Visible, IsBlank(drpOption2AP.Selected.Value)),
                            And(Not(IsBlank(drpProgram3AP.Selected.Value)),
                                drpOption3AP.Visible, IsBlank(drpOption3AP.Selected.Value))),
                         CountRows(Filter(COMPETENCY_TYPES,
                            State.Value = "Active",
                            Not(ID in colAppComps.TypeId))) > 0,
                         Or(IsBlank(drpIdpAP.Selected.Value),
                            IsBlank(Trim(txtRatingAP.Text)),
                            IsBlank(drpSessionAP.Selected.Value),
                            And(dtpSessionAP.Visible, IsBlank(dtpSessionAP.SelectedDate))),
                         locCycle.State.Value <> "Open",
                         And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =ColorPalette.Blue600
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =44
                  HoverFill: =ColorPalette.Blue700
                  OnSelect: |-
                    =UpdateContext({
                      locApp: Patch(APPLICATIONS,
                        If(IsBlank(locApp), Defaults(APPLICATIONS), locApp),
                        {
                          CycleID: {
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                            Id: locCycle.ID,
                            Value: locCycle.CycleName
                          },
                          ApplicantEmail: Trim(txtEmailAP.Text),
                          ApplicantName: txtNameAP.Text,
                          Location: txtLocationAP.Text,
                          Grade: txtGradeAP.Text,
                          JobSeries: txtSeriesAP.Text,
                          JobTitle: txtJobTitleAP.Text,
                          LatestPerformanceRating: Value(txtRatingAP.Text),
                          ListedOnIDP: drpIdpAP.Selected,
                          AttendedInfoSession: drpSessionAP.Selected,
                          InfoSessionDate: dtpSessionAP.SelectedDate,
                          NCUAStartDate: dtpStartAP.SelectedDate,
                          ServiceComputationDate: dtpScdAP.SelectedDate,
                          FirstLineSupervisorEmail: txtSup1AP.Text,
                          SecondLineSupervisorEmail: txtSup2AP.Text,
                          ApplicationStatus: { Value: "Submitted" },
                          ReviewStage: { Value: "Pending First-Line" },
                          PlacementOutcome: { Value: "Decision Pending" },
                          SubmittedDate:
                            If(IsBlank(locApp.SubmittedDate), Today(), locApp.SubmittedDate)
                        })
                    });
                    Remove(APPLICATION_PROGRAM_CHOICES,
                      Filter(APPLICATION_PROGRAM_CHOICES, ApplicationID.Id = locApp.ID));
                    // A row exists because a PROGRAM was chosen. The filter used to
                    // test the OPTION, which meant an applicant choosing MDP or NEXT
                    // — neither of which has options — wrote nothing at all once the
                    // fabricated "N/A" rows were gone. The option rides along only
                    // where there is one; the record form is wrapped in If() because
                    // a lookup with a blank Id is not the same as no lookup.
                    ForAll(
                      Filter(
                        Table(
                          { PrgId: LookUp(PROGRAMS, ProgramName = drpProgram1AP.Selected.Value).ID,
                            PrgName: drpProgram1AP.Selected.Value,
                            OptId: LookUp(PROGRAM_OPTIONS,
                              And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram1AP.Selected.Value).ID,
                                  OptionName = drpOption1AP.Selected.Value)).ID,
                            OptName: drpOption1AP.Selected.Value, Rnk: 1 },
                          { PrgId: LookUp(PROGRAMS, ProgramName = drpProgram2AP.Selected.Value).ID,
                            PrgName: drpProgram2AP.Selected.Value,
                            OptId: LookUp(PROGRAM_OPTIONS,
                              And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram2AP.Selected.Value).ID,
                                  OptionName = drpOption2AP.Selected.Value)).ID,
                            OptName: drpOption2AP.Selected.Value, Rnk: 2 },
                          { PrgId: LookUp(PROGRAMS, ProgramName = drpProgram3AP.Selected.Value).ID,
                            PrgName: drpProgram3AP.Selected.Value,
                            OptId: LookUp(PROGRAM_OPTIONS,
                              And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram3AP.Selected.Value).ID,
                                  OptionName = drpOption3AP.Selected.Value)).ID,
                            OptName: drpOption3AP.Selected.Value, Rnk: 3 }
                        ),
                        Not(IsBlank(PrgId))
                      ) As ch,
                      Patch(APPLICATION_PROGRAM_CHOICES, Defaults(APPLICATION_PROGRAM_CHOICES),
                        {
                          ApplicationID: {
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                            Id: locApp.ID,
                            Value: locApp.ApplicantEmail
                          },
                          ProgramID: {
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                            Id: ch.PrgId,
                            Value: ch.PrgName
                          },
                          ProgramOptionID:
                            If(Not(IsBlank(ch.OptId)),
                              {
                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                Id: ch.OptId,
                                Value: ch.OptName
                              },
                              Blank()),
                          Rank: ch.Rnk
                        })
                    );
                          // Competencies. ADD FIRST, THEN REMOVE — a failed write then costs the
                          // additions rather than the whole set, which is what a delete-and-
                          // rewrite cost on the DTD panel when a required Title column made every
                          // Patch fail. colAppCompsWas is the stored set snapshotted BEFORE any
                          // write, so "already there" is judged against the server.
                          ClearCollect(colAppCompsWas,
                            ForAll(
                              Filter(APPLICATION_COMPETENCIES,
                                ApplicationID.Id = locApp.ID) As sv,
                              { CompId: sv.CompetencyID.Id }));
                          ForAll(
                            Filter(colAppComps, Not(CompId in colAppCompsWas.CompId)) As cc,
                            Patch(APPLICATION_COMPETENCIES, Defaults(APPLICATION_COMPETENCIES),
                              {
                                ApplicationID: {
                                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                  Id: locApp.ID,
                                  Value: locApp.ApplicantEmail
                                },
                                CompetencyID: {
                                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                  Id: cc.CompId,
                                  Value: cc.CompName
                                }
                              }));
                          Remove(APPLICATION_COMPETENCIES,
                            Filter(APPLICATION_COMPETENCIES,
                              ApplicationID.Id = locApp.ID,
                              Not(CompetencyID.Id in colAppComps.CompId)));
                    Set(gblFormDirty, false);
                    Notify("Application submitted.", NotificationType.Success);
                    Navigate('Application Status Screen')
                  PressedFill: =ColorPalette.Blue700
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeHeading
                  Text: ="Submit application"
                  Width: =240
                  # Four equal columns; 1 and 4 empty, 2 holds the checks, 3 holds
                  # this. Centred in column 3 both ways — the arithmetic is the
                  # column's left edge plus half its leftover width.
                  X: =Parent.Width * 0.60
                  Y: =288
      
      # ===========================================================================
      # WIZARD CONTROLS — Back / Next / Save Draft
      # ===========================================================================
      - btnBackAP:
          Control: Classic/Button@2.2.0
