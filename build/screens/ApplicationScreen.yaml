# Application Screen — US1, six-step wizard
# RQ001–014, RQ105a/105b (PROPOSED), FR-004–011, FR-009a/009b (PROPOSED)
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# Composition: PowerLibs `horizontal-stepper` (Pro), generated 2026-07-25 via
# generate_yaml, adapted (see DEVIATIONS).
#
# ---------------------------------------------------------------------------
# HOW TO TRANSCRIBE (Constitution IV)
# ---------------------------------------------------------------------------
# Steps marked (screen) are properties of the SCREEN itself — select the screen
# in the tree view and set them in the properties pane. They are NOT properties
# of the utility bar or of any control listed below it.
#
# They cannot be pasted, and there is no way to make them pasteable. Studio's
# Paste YAML inserts CONTROLS into the selected screen, so a paste block has no
# screen node to carry Fill, OnVisible or OnStart. Only the app-source format
# written by `pac canvas unpack` has one, and Studio will not paste that.
#
# The OnVisible below is also kept comment-free and ready to copy in
# build/screens/ApplicationScreen.OnVisible.fx.
#
#   1. New screen → Blank. Rename it "Application Screen".
#   2. (screen) Fill: =ColorPalette.Gray50
#   3. Paste build/screens/_EnvironmentBanner.yaml (or the .paste.yaml variant)
#      FIRST. The utility bar's Y references lblEnvBanner.Height and won't
#      compile without it.
#   3a. Paste build/screens/_UtilityBarSlim.yaml next. This screen uses the
#      slim variant (logo/home icon, no role links) per _UtilityBarSlim.yaml
#      guidance for task screens.
#   3b. Paste this file's `conBodyAP` block — the wrapper containing every
#      other control on the screen.
#   4. Data sources (eight): APPLICATIONS, APPLICATION_PROGRAM_CHOICES,
#      APPLICATION_COMPETENCIES, PROGRAM_OPTIONS, PROGRAMS, CYCLES,
#      COMPETENCIES, COMPETENCY_TYPES.
#      The last three arrived with the step 3 rebuild on 2026-08-01.
#   5. (screen) OnVisible — transcribe by hand (no # prefixes, no leading =):
#
#      Set(gblFormDirty, false);
#      Set(gblConfirmExitAP, false);
#      UpdateContext({
#          locCycle: If(IsBlank(LookUp(CYCLES, State.Value = "Open")),
#                       First(Sort(CYCLES, OpenDate, SortOrder.Descending)),
#                       LookUp(CYCLES, State.Value = "Open")),
#          locStep: 1,
#          locDropRank2: false,
#          locDropRank3: false,
#          locCompTypeAP: First(SortByColumns(
#                             Filter(COMPETENCY_TYPES, State.Value = "Active"),
#                             "SortOrder", SortOrder.Ascending)).ID
#      });Don
#      UpdateContext({
#          locApp: LookUp(APPLICATIONS,
#                    And(CycleID.Id = locCycle.ID, ApplicantEmail = User().Email))
#      });
#      ClearCollect(colAppComps,
#          ForAll(Filter(APPLICATION_COMPETENCIES, ApplicationID.Id = locApp.ID) As ac,
#              With({ compRec: LookUp(COMPETENCIES, ID = ac.CompetencyID.Id) },
#              With({ typeRec: LookUp(COMPETENCY_TYPES, ID = compRec.CompetencyTypeID.Id) },
#                  { CompId:    ac.CompetencyID.Id,
#                    CompName:  ac.CompetencyID.Value,
#                    TypeId:    compRec.CompetencyTypeID.Id,
#                    TypeName:  compRec.CompetencyTypeID.Value,
#                    TypeOrder: typeRec.SortOrder }))))
#
#      The two With blocks name the parent-record lookups so each fires once
#      per row (not three times) and so Power Fx type-inference sees a flatter
#      expression — deeply nested LookUp chains inside ForAll's record literal
#      can fail to fully type-infer and emit "Error type" for the last field.
#
#   THREE BLOCKS, IN THIS ORDER. locApp needs locCycle; colAppComps needs
#   locApp. A variable cannot be referenced inside the UpdateContext that
#   defines it, which is why these cannot be merged.
#
#   colRanked is GONE (2026-08-01). It was collected here and read by nothing;
#   the six step-2 dropdowns now restore from APPLICATION_PROGRAM_CHOICES via
#   their own Default expressions.
#
#   The three false flags matter. locDropRank2/3 suppress a rank's Default so a
#   removed choice stays removed; if they survive from a previous visit they
#   would blank a draft's choices on load, and the next save would delete them.
#
#   5b. (screen) OnHidden — transcribe by hand:
#
#      Set(gblFormDirty, false);
#      Set(gblConfirmExitAP, false)
#
#      NOT OPTIONAL. gblFormDirty is global so the shared utility bar can read
#      it from any screen. Global means it also OUTLIVES this screen: leave with
#      it true and the logo on the next screen raises a confirm modal that only
#      exists here, so the click does nothing at all and the user is stuck.
#      OnHidden runs on every exit path, including ones added later.
#
#   6. STEP 5 ATTACHMENTS — build by hand. Canvas exposes attachments only
#      through a Form control's data card, which has no YAML representation, so
#      this cannot be pasted (Constitution IV).
#
#      One Edit Form on APPLICATIONS with only the Attachments card. Applicants
#      add multiple files to the single unnamed attachment collection on their
#      APPLICATIONS row. Trades per-slot identity for simplicity — see OI-APP-1.
#
#        a. Insert > Forms > Edit, inside conStep5AP.
#        b. DataSource = APPLICATIONS.
#        c. Item = locApp.
#        d. DefaultMode = FormMode.Edit.
#        e. Fields: remove every card EXCEPT Attachments.
#        f. Size to fill conStep5AP.
#        g. Attachments card OnAddFile / OnRemoveFile:
#             SubmitForm(<that form>); Set(gblFormDirty, true)
#
#   7. Preview (F5) — OnVisible does not run on the design surface.
#
# ---------------------------------------------------------------------------
# NAVIGATION MODEL — RQ105a (PROPOSED, supersedes RQ105)
# ---------------------------------------------------------------------------
# Forward and backward one step at a time. The step circles are INDICATORS, not
# buttons — there is no control over them, so a step cannot be clicked directly.
# The only jumps are from step 6, where each missing item links to its step.
#
# NEXT NEVER BLOCKS. Advancing is unconditional by design: FR-009 validates the
# whole application at submission, and RQ106 requires incomplete items to be
# indicated without blocking navigation. Gaps surface at step 6 and stop Submit,
# never Next. Do not add per-step gating without amending FR-009 and RQ106 too.
#
# ---------------------------------------------------------------------------
# DEVIATIONS FROM THE GENERATED horizontal-stepper
# ---------------------------------------------------------------------------
# 1. Its demo content panel (conStepContent, with icon/title/description/hint)
#    is REPLACED by the six real step panels. The circles, connector lines,
#    labels and the Back/Next pair are kept as designed.
# 2. varHStep → locStep (project convention).
# 3. Step labels Size 8 → Typography.SizeCaption (9); 8pt is below the 508 floor.
# 4. "All steps completed successfully!" removed — completion is a submission,
#    not a wizard state.
#
# ---------------------------------------------------------------------------
# KNOWN LIMITATIONS
# ---------------------------------------------------------------------------
# OI-APP-1  (see build/OPEN_ISSUES.md)
# OI-APP-1  Step 5 uses SharePoint's native item attachments — ONE unnamed
#           collection on the APPLICATIONS row. No per-slot identity, no MIME
#           filter, no size guard. Accepted as-is 2026-08-11 to keep the
#           applicant experience simple; DTD cannot report which of the three
#           required documents is missing.
# D-2       Step 3's ten dropdowns have no values. _CHOICES.md marks OPM
#           competencies, technical competencies and ECQs "TBD — Appendix B",
#           and Constitution I forbids inventing them. Items: =Table() renders
#           an empty list; fill each in when Appendix B lands.

# ===========================================================================
# BODY — everything on the screen between the utility bar and the bottom.
#
# One responsive container so the whole body reflows automatically when the
# environment banner shifts the utility bar down (or hides itself), and grows
# to fill the available height. Children stay manual-layout — the container
# just anchors the top and stretches the bottom. Same pattern as conBodyLD
# on the Landing Screen.
# ===========================================================================
- conBodyAP:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Width: =Parent.Width
      X: =0
      # Anchor to the bottom edge of the utility bar. When the environment
      # banner is present the utility bar shifts down and everything follows.
      Y: =conUtilityBar.Y + conUtilityBar.Height
      # Fill to the screen bottom.
      Height: =Parent.Height - Self.Y
    Children:
      # ---------------------------------------------------------------------
      # STEPPER — progress indicator (PowerLibs horizontal-stepper)
      # ---------------------------------------------------------------------
      - conStepperAP:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =116
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width - 48
            X: =24
            Y: =12
          Children:
            - conStep1Circle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(locStep > 1, ColorPalette.SuccessText,
                       If(locStep = 1, ColorPalette.Blue600, ColorPalette.Gray300))
                  Height: =36
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =36
                  X: =1 * (Parent.Width - 40) / 12 + 20 - 18
                  Y: =20
                Children:
                  - lblStep1Num:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(locStep >= 1, ColorPalette.TextOnDark, ColorPalette.TextHelp)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: =If(locStep > 1, "✓", "1")
                        Width: =Parent.Width
            - recLine1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |-
                    =If(locStep > 1, ColorPalette.SuccessText, ColorPalette.Gray300)
                  Height: =3
                  Width: =(Parent.Width - 40) / 6 - 44
                  X: =conStep1Circle.X + conStep1Circle.Width + 4
                  Y: =conStep1Circle.Y + conStep1Circle.Height / 2 - 1
            - conStep2Circle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(locStep > 2, ColorPalette.SuccessText,
                       If(locStep = 2, ColorPalette.Blue600, ColorPalette.Gray300))
                  Height: =36
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =36
                  X: =3 * (Parent.Width - 40) / 12 + 20 - 18
                  Y: =20
                Children:
                  - lblStep2Num:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(locStep >= 2, ColorPalette.TextOnDark, ColorPalette.TextHelp)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: =If(locStep > 2, "✓", "2")
                        Width: =Parent.Width
            - recLine2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |-
                    =If(locStep > 2, ColorPalette.SuccessText, ColorPalette.Gray300)
                  Height: =3
                  Width: =(Parent.Width - 40) / 6 - 44
                  X: =conStep2Circle.X + conStep2Circle.Width + 4
                  Y: =conStep2Circle.Y + conStep2Circle.Height / 2 - 1
            - conStep3Circle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(locStep > 3, ColorPalette.SuccessText,
                       If(locStep = 3, ColorPalette.Blue600, ColorPalette.Gray300))
                  Height: =36
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =36
                  X: =5 * (Parent.Width - 40) / 12 + 20 - 18
                  Y: =20
                Children:
                  - lblStep3Num:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(locStep >= 3, ColorPalette.TextOnDark, ColorPalette.TextHelp)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: =If(locStep > 3, "✓", "3")
                        Width: =Parent.Width
            - recLine3:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |-
                    =If(locStep > 3, ColorPalette.SuccessText, ColorPalette.Gray300)
                  Height: =3
                  Width: =(Parent.Width - 40) / 6 - 44
                  X: =conStep3Circle.X + conStep3Circle.Width + 4
                  Y: =conStep3Circle.Y + conStep3Circle.Height / 2 - 1
            - conStep4Circle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(locStep > 4, ColorPalette.SuccessText,
                       If(locStep = 4, ColorPalette.Blue600, ColorPalette.Gray300))
                  Height: =36
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =36
                  X: =7 * (Parent.Width - 40) / 12 + 20 - 18
                  Y: =20
                Children:
                  - lblStep4Num:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(locStep >= 4, ColorPalette.TextOnDark, ColorPalette.TextHelp)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: =If(locStep > 4, "✓", "4")
                        Width: =Parent.Width
            - recLine4:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |-
                    =If(locStep > 4, ColorPalette.SuccessText, ColorPalette.Gray300)
                  Height: =3
                  Width: =(Parent.Width - 40) / 6 - 44
                  X: =conStep4Circle.X + conStep4Circle.Width + 4
                  Y: =conStep4Circle.Y + conStep4Circle.Height / 2 - 1
            - conStep5Circle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(locStep > 5, ColorPalette.SuccessText,
                       If(locStep = 5, ColorPalette.Blue600, ColorPalette.Gray300))
                  Height: =36
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =36
                  X: =9 * (Parent.Width - 40) / 12 + 20 - 18
                  Y: =20
                Children:
                  - lblStep5Num:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(locStep >= 5, ColorPalette.TextOnDark, ColorPalette.TextHelp)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: =If(locStep > 5, "✓", "5")
                        Width: =Parent.Width
            - recLine5:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |-
                    =If(locStep > 5, ColorPalette.SuccessText, ColorPalette.Gray300)
                  Height: =3
                  Width: =(Parent.Width - 40) / 6 - 44
                  X: =conStep5Circle.X + conStep5Circle.Width + 4
                  Y: =conStep5Circle.Y + conStep5Circle.Height / 2 - 1
            - conStep6Circle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(locStep = 6, ColorPalette.Blue600, ColorPalette.Gray300)
                  Height: =36
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =36
                  X: =11 * (Parent.Width - 40) / 12 + 20 - 18
                  Y: =20
                Children:
                  - lblStep6Num:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(locStep >= 6, ColorPalette.TextOnDark, ColorPalette.TextHelp)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: ="6"
                        Width: =Parent.Width
            - lblStep1Label:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(locStep >= 1, ColorPalette.TextHeading, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  FontWeight: |-
                    =If(locStep = 1, Typography.WeightMedium, Typography.WeightRegular)
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: ="Personnel"
                  Width: =140
                  X: =conStep1Circle.X + conStep1Circle.Width / 2 - 70
                  Y: =conStep1Circle.Y + conStep1Circle.Height + 6
            - lblStep2Label:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(locStep >= 2, ColorPalette.TextHeading, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  FontWeight: |-
                    =If(locStep = 2, Typography.WeightMedium, Typography.WeightRegular)
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: ="Program choices"
                  Width: =140
                  X: =conStep2Circle.X + conStep2Circle.Width / 2 - 70
                  Y: =lblStep1Label.Y
            - lblStep3Label:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(locStep >= 3, ColorPalette.TextHeading, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  FontWeight: |-
                    =If(locStep = 3, Typography.WeightMedium, Typography.WeightRegular)
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: ="Competencies"
                  Width: =140
                  X: =conStep3Circle.X + conStep3Circle.Width / 2 - 70
                  Y: =lblStep1Label.Y
            - lblStep4Label:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(locStep >= 4, ColorPalette.TextHeading, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  FontWeight: |-
                    =If(locStep = 4, Typography.WeightMedium, Typography.WeightRegular)
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: ="Eligibility"
                  Width: =140
                  X: =conStep4Circle.X + conStep4Circle.Width / 2 - 70
                  Y: =lblStep1Label.Y
            - lblStep5Label:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(locStep >= 5, ColorPalette.TextHeading, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  FontWeight: |-
                    =If(locStep = 5, Typography.WeightMedium, Typography.WeightRegular)
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: ="Documents"
                  Width: =140
                  X: =conStep5Circle.X + conStep5Circle.Width / 2 - 70
                  Y: =lblStep1Label.Y
            - lblStep6Label:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(locStep >= 6, ColorPalette.TextHeading, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  FontWeight: |-
                    =If(locStep = 6, Typography.WeightMedium, Typography.WeightRegular)
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: ="Review"
                  Width: =140
                  X: =conStep6Circle.X + conStep6Circle.Width / 2 - 70
                  Y: =lblStep1Label.Y
      
      # ---------- Read-only banner (FR-008) ----------
      - lblReadOnlyAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeCaption
            # THREE CASES, not two. A blank locCycle makes locCycle.State.Value
            # blank, and blank <> "Open" is TRUE — so an unloaded cycle was
            # indistinguishable from a closed one and produced "This cycle is ."
            # with nothing between "is" and the stop. That empty state name is the
            # tell, and it means OnVisible has not run: it never runs on the design
            # surface, so F5 is required.
            Text: |-
              =If(IsBlank(locCycle),
                 "No application cycle is loaded yet.",
                 If(locCycle.State.Value <> "Open",
                    "This cycle is " & locCycle.State.Value & ". Your application is read-only and cannot be submitted.",
                    "Your application has been submitted and can no longer be edited."))
            Visible: |-
              =Or(IsBlank(locCycle),
                  locCycle.State.Value <> "Open",
                  And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft"))
            Width: =Parent.Width - 220
            X: =24
            Y: =134
      
      # ===========================================================================
      # STEP 1 — Personnel (RQ002, RQ003, RQ004 / RQ105b)
      # ===========================================================================
      - conStep1AP:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =428
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =locStep = 1
            Width: =Parent.Width - 48
            X: =24
            Y: =160
          Children:
            # HEADER BAND. Navy900, matching the utility bar and the DTD detail
            # panel. Declared first — z-order is declaration order — and a
            # GroupContainer rather than a Rectangle because only Button,
            # GroupContainer and Image support Radius, and the top corners must match
            # the card's own 12px.
            #
            # This treatment repeats on steps 2-6.
            - conS1HeaderAP:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.Navy900
                  Height: =64
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - lblS1TitleAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =26
                  Size: =Typography.SizeHeading
                  Text: ="Personnel information"
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =10
            # SizeBody, up from SizeCaption. "Confirm" not "Enter": the D-1
            # integration will pre-fill these, and the sentence about it has been
            # dropped — an applicant does not need to know why a field is empty.
            - lblS1SourceAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.Blue50
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeBody
                  Text: ="Confirm your personnel details below."
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =36
            # COLUMN-MAJOR. Each column is a group that belongs together: identity,
            # position, service dates, supervisors. Reading down a column is the
            # point, so the tallest column sets the row count and the short ones
            # simply end.
            - txtNameAP:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =If(IsBlank(locApp), "", locApp.ApplicantName)
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =ColorPalette.White
                  FocusedBorderColor: =ColorPalette.Blue600
                  FocusedBorderThickness: =2
                  Font: =Typography.Family
                  Height: =40
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Width: =(Parent.Width - 120) / 4
                  X: =24
                  Y: =110
            - txtEmailAP:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =If(IsBlank(locApp), User().Email, locApp.ApplicantEmail)
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
