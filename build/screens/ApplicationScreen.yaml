                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.Blue50
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeBody
                  Text: ="Choose competencies and Executive Core Qualifications"
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =36
      
            # ---- type strip: PowerLibs shadcn-tabs-1, data-driven ----
            # Identical to the DTD Competencies tab. Types come from
            # COMPETENCY_TYPES and the per-type ceiling from SelectionCount, so a
            # fourth type added on the admin screen works here with no YAML change.
            # Nothing below knows the words OPM, Technical or ECQ.
            #
            # This replaces ten hardcoded dropdowns (3 OPM, 3 technical, 4 ECQ) whose
            # Items were an empty Table() and which wrote to three text columns that
            # no longer exist. See OI-APP-4.
            - conS3TabsAP:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: |-
                    =Min(Parent.Width - 300,
                      170 * Max(1, CountRows(Filter(COMPETENCY_TYPES, State.Value = "Active"))))
                  X: =24
                  Y: =80
                Children:
                  - galS3TypeTabsAP:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Height: =Parent.Height - 10
                        Items: |-
                          =SortByColumns(
                            Filter(COMPETENCY_TYPES, State.Value = "Active"),
                            "SortOrder", SortOrder.Ascending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: |-
                          =galS3TypeTabsAP.Width / Max(1, galS3TypeTabsAP.AllItemsCount)
                        Width: =Parent.Width - 10
                      Children:
                        - btnS3TypeTabAP:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: |-
                                =If(ThisItem.ID = locCompTypeAP,
                                   ColorPalette.Gray200, RGBA(0, 0, 0, 0))
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: |-
                                =If(ThisItem.ID = locCompTypeAP, 1, 0)
                              Color: =ColorPalette.TextHeading
                              Fill: |-
                                =If(ThisItem.ID = locCompTypeAP,
                                   ColorPalette.Blue50, RGBA(0, 0, 0, 0))
                              FocusedBorderThickness: |-
                                =If(ThisItem.ID = locCompTypeAP, 1, 0)
                              Font: =Typography.Family
                              FontWeight: |-
                                =If(ThisItem.ID = locCompTypeAP,
                                   Typography.WeightBold, Typography.WeightRegular)
                              # 1px of room top and bottom so the border is not
                              # clipped against the gallery bound.
                              Height: =Parent.TemplateHeight - 2
                              HoverBorderColor: =Self.BorderColor
                              HoverColor: =Self.Color
                              HoverFill: |-
                                =If(ThisItem.ID = locCompTypeAP,
                                   ColorPalette.Blue50, ColorPalette.Gray200)
                              OnSelect: |-
                                =UpdateContext({ locCompTypeAP: ThisItem.ID });
                                Reset(drpAddCompAP)
                              PressedBorderColor: =Self.BorderColor
                              PressedColor: =Self.Color
                              PressedFill: |-
                                =If(ThisItem.ID = locCompTypeAP,
                                   ColorPalette.Blue50, ColorPalette.Gray200)
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Size: =Typography.SizeBody
                              Text: =ThisItem.TypeName
                              Width: =Parent.TemplateWidth - 4
                              X: =2
                              Y: =1
            - lblS3CountAP:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: |-
                    =If(CountRows(Filter(colAppComps, TypeId = locCompTypeAP)) >= Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).SelectionCount, 0),
                       ColorPalette.WarningText, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: |-
                    =CountRows(Filter(colAppComps, TypeId = locCompTypeAP)) & " of " & Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).SelectionCount, 0) & " selected"
                  Visible: =Not(IsBlank(locCompTypeAP))
                  Width: =260
                  X: =Parent.Width - 284
                  Y: =90
      
            # ---- add row, above the list ----
            - drpAddCompAP:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AllowEmptySelection: =true
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  ChevronBackground: =ColorPalette.Blue600
                  ChevronFill: =ColorPalette.TextOnDark
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  Height: =32
                  # Already-chosen competencies are excluded rather than offered and
                  # rejected. Single-column text, like every dropdown in this app: a
                  # Classic/DropDown over records matches against a column YAML
                  # cannot name (PA2108).
                  Items: |-
                    =ForAll(
                      Sort(
                        Filter(COMPETENCIES,
                          CompetencyTypeID.Id = locCompTypeAP,
                          State.Value = "Active",
                          Not(ID in colAppComps.CompId)),
                        CompetencyName),
                      CompetencyName)
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  SelectionColor: =ColorPalette.TextOnDark
                  SelectionFill: =ColorPalette.Blue600
                  Size: =Typography.SizeBody
                  Visible: |-
                    =And(Not(IsBlank(locCompTypeAP)), CountRows(Filter(colAppComps, TypeId = locCompTypeAP)) < Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).SelectionCount, 0))
                  Width: =560
                  X: =24
                  Y: =136
            - btnAddCompAP:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorPalette.Blue600
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.TextOnDark
                  DisplayMode: |-
                    =If(Or(IsBlank(drpAddCompAP.Selected.Value),
                           locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =ColorPalette.Blue600
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =32
                  HoverColor: =Self.Color
                  HoverFill: =ColorPalette.Blue700
                  OnSelect: |-
                    =Collect(colAppComps,
                      {
                        CompId: LookUp(COMPETENCIES,
                          And(CompetencyTypeID.Id = locCompTypeAP,
                              CompetencyName = drpAddCompAP.Selected.Value)).ID,
                        CompName: drpAddCompAP.Selected.Value,
                        TypeId: locCompTypeAP,
                        TypeName: LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).TypeName,
                        TypeOrder: LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).SortOrder
                      });
                    Set(gblFormDirty, true);
                    Reset(drpAddCompAP)
                  PressedColor: =Self.Color
                  PressedFill: =ColorPalette.Blue700
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =Typography.SizeBody
                  Text: ="Add"
                  Visible: |-
                    =And(Not(IsBlank(locCompTypeAP)), CountRows(Filter(colAppComps, TypeId = locCompTypeAP)) < Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).SelectionCount, 0))
                  Width: =100
                  X: =596
                  Y: =136
            # Takes the add row's place at the ceiling so the list does not jump.
            - lblS3FullAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.WarningText
                  Font: =Typography.Family
                  Height: =32
                  Size: =Typography.SizeBody
                  Text: |-
                    ="You have chosen the maximum of " & Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).SelectionCount, 0) & " for " &
                     LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).TypeName & ". Remove one to choose a different competency."
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: |-
                    =And(Not(IsBlank(locCompTypeAP)), CountRows(Filter(colAppComps, TypeId = locCompTypeAP)) >= Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).SelectionCount, 0))
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =136
      
            # ---- what has been chosen for this type ----
            - galS3CompsAP:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =ColorPalette.Gray200
                  Height: =Parent.Height - 210
                  Items: |-
                    =SortByColumns(
                      Filter(colAppComps, TypeId = locCompTypeAP),
                      "CompName", SortOrder.Ascending)
                  ShowScrollbar: =true
                  TemplatePadding: =0
                  TemplateSize: =44
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =186
                Children:
                  - conS3CompRowAP:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPalette.White
                        Height: =Parent.TemplateHeight
                        Width: =Parent.TemplateWidth
                      Children:
                        - lblS3CompNameAP:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextHeading
                              Font: =Typography.Family
                              Height: =Parent.Height
                              Size: =Typography.SizeBody
                              Text: =ThisItem.CompName
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =560
                              X: =0
                              Y: =0
                        - icoS3CompRemoveAP:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =ColorPalette.TextHelp
                              Height: =18
                              Icon: =Icon.Trash
                              Width: =18
                              X: =583
                              Y: =13
                        - btnS3CompRemoveAP:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =0
                              Color: =RGBA(0, 0, 0, 0)
                              DisplayMode: |-
                                =If(Or(locCycle.State.Value <> "Open",
                                       And(Not(IsBlank(locApp)),
                                           locApp.ApplicationStatus.Value <> "Draft")),
                                   DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(0, 0, 0, 0)
                              FocusedBorderColor: =ColorPalette.FocusOnLight
                              FocusedBorderThickness: =2
                              Height: =32
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =ColorPalette.DangerLight
                              # Matched on CompId: the row came out of SortByColumns
                              # and is not the identity the collection holds.
                              OnSelect: |-
                                =RemoveIf(colAppComps, CompId = ThisItem.CompId);
                                Set(gblFormDirty, true)
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =ColorPalette.DangerLight
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =Typography.SizeCaption
                              Text: =""
                              Tooltip: |-
                                ="Remove " & ThisItem.CompName
                              Width: =32
                              X: =576
                              Y: =6
                  - recS3CompLineAP:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =ColorPalette.Gray200
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
            - lblS3NoCompsAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =40
                  Size: =Typography.SizeBody
                  Text: |-
                    ="No " & LookUp(COMPETENCY_TYPES, ID = locCompTypeAP).TypeName & " competencies chosen yet."
                  Visible: |-
                    =And(Not(IsBlank(locCompTypeAP)),
                       CountRows(galS3CompsAP.AllItems) = 0)
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =198
      
      # STEP 4 — Eligibility and background (Appendix A fields; FR-006a)
