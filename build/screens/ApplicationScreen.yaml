                  # <> "Retired", not = "Active": PROGRAMS.State is blank on rows
                  # created before the column existed (OI-DATA-2).
                  Items: |-
                    =ForAll(
                      Sort(Filter(PROGRAMS, State.Value <> "Retired"), ProgramName),
                      ProgramName)
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  SelectionColor: =ColorPalette.TextOnDark
                  SelectionFill: =ColorPalette.Blue600
                  Size: =Typography.SizeBody
                  Width: =360
                  X: =24
                  Y: =270
            - drpOption3AP:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AllowEmptySelection: =true
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  ChevronBackground: =ColorPalette.Blue600
                  ChevronFill: =ColorPalette.TextOnDark
                  Default: |-
                    =If(locDropRank3, Blank(),
                      LookUp(APPLICATION_PROGRAM_CHOICES,
                        And(ApplicationID.Id = locApp.ID, Rank = 3)).ProgramOptionID.Value)
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  Height: =32
                  Items: |-
                    =ForAll(
                      Sort(
                        Filter(PROGRAM_OPTIONS,
                          ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram3AP.Selected.Value).ID,
                          Or(State.Value = "Active",
                             OptionName = LookUp(APPLICATION_PROGRAM_CHOICES,
                      And(ApplicationID.Id = locApp.ID, Rank = 3)).ProgramOptionID.Value)),
                        OptionName),
                      OptionName)
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  SelectionColor: =ColorPalette.TextOnDark
                  SelectionFill: =ColorPalette.Blue600
                  Size: =Typography.SizeBody
                  # Hidden when the chosen program has no options — MDP and NEXT
                  # today. IsEmpty(Filter(...)) rather than CountRows(...) = 0:
                  # CountRows does not delegate to SharePoint and would answer from
                  # the first 500 rows only.
                  #
                  # This property is also the single definition of "this program has
                  # options". The submit gate and the review checklist both read
                  # Self.Visible rather than repeating the query, so the rule cannot
                  # drift between the picker and the validation.
                  Visible: |-
                    =Not(IsEmpty(Filter(PROGRAM_OPTIONS,
                       ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram3AP.Selected.Value).ID,
                       State.Value = "Active")))
                  Width: =588
                  X: =400
                  Y: =270
            - lblNoOption3AP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =32
                  Size: =Typography.SizeBody
                  Text: ="This program has no secondary options."
                  VerticalAlign: =VerticalAlign.Middle
                  # The mirror of the dropdown's Visible: shown exactly when the
                  # dropdown is not, and only once a program has been picked. An
                  # empty gap here reads as something failing to load.
                  Visible: |-
                    =And(Not(IsBlank(drpProgram3AP.Selected.Value)),
                       Not(drpOption3AP.Visible))
                  Width: =588
                  X: =400
                  Y: =270
            # FR-004 — the same option cannot be chosen twice.
            # Clearing a choice needs more than picking the blank entry that
            # AllowEmptySelection adds: Reset restores a control's Default, and the
            # Default here is the SAVED row — so a reset would put the choice back.
            # locDropRankN suppresses that Default, and Reset then re-reads it as
            # blank. UpdateContext runs BEFORE the Resets for exactly that reason.
            #
            # Nothing is written until Save. Choice 1 has no Remove — it is required.
            #
            # Icon plus a transparent button on top: Classic/Button has no Icon
            # property. Same pair as the DTD Competencies tab, and Icon.Trash is the
            # built-in — gblNavIcons carries DocumentEdit, Archive, ArchiveArrowBack
            # and Eye but nothing for delete.
            #
            # NO AccessibleLabel: it is not a valid property on Classic/Button, only
            # on inputs such as Classic/DatePicker. The Tooltip is the only name this
            # control has, which is an OI-A11Y-1 gap rather than something to fake.
            - icoClearChoice2AP:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  # TextHelp — the palette's muted text grey, 4.76:1 on white. The
                  # Gray tokens are surface colours: Gray300 is 1.48:1 and Gray200
                  # 1.24:1, both far under the 3:1 WCAG 1.4.11 wants for a
                  # non-text control, so an icon drawn in either would be decorative
                  # rather than visible.
                  #
                  # The hover fill stays DangerLight: quiet at rest, and the red
                  # only appears at the moment the action is about to happen.
                  Color: =ColorPalette.TextHelp
                  Height: =18
                  Icon: =Icon.Trash
                  Visible: |-
                    =Not(IsBlank(drpProgram2AP.Selected.Value))
                  Width: =18
                  X: =1011
                  Y: =199
            - btnClearChoice2AP:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =RGBA(0, 0, 0, 0)
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =2
                  Height: =32
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =ColorPalette.DangerLight
                  OnSelect: |-
                    =UpdateContext({ locDropRank2: true }); Set(gblFormDirty, true);
                    Reset(drpProgram2AP);
                    Reset(drpOption2AP)
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =ColorPalette.DangerLight
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =Typography.SizeCaption
                  Text: =""
                  Tooltip: |-
                    ="Remove program choice 2"
                  Visible: |-
                    =Not(IsBlank(drpProgram2AP.Selected.Value))
                  Width: =32
                  X: =1004
                  Y: =192
            - icoClearChoice3AP:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  # TextHelp — the palette's muted text grey, 4.76:1 on white. The
                  # Gray tokens are surface colours: Gray300 is 1.48:1 and Gray200
                  # 1.24:1, both far under the 3:1 WCAG 1.4.11 wants for a
                  # non-text control, so an icon drawn in either would be decorative
                  # rather than visible.
                  #
                  # The hover fill stays DangerLight: quiet at rest, and the red
                  # only appears at the moment the action is about to happen.
                  Color: =ColorPalette.TextHelp
                  Height: =18
                  Icon: =Icon.Trash
                  Visible: |-
                    =Not(IsBlank(drpProgram3AP.Selected.Value))
                  Width: =18
                  X: =1011
                  Y: =277
            - btnClearChoice3AP:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =RGBA(0, 0, 0, 0)
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =2
                  Height: =32
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =ColorPalette.DangerLight
                  OnSelect: |-
                    =UpdateContext({ locDropRank3: true }); Set(gblFormDirty, true);
                    Reset(drpProgram3AP);
                    Reset(drpOption3AP)
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =ColorPalette.DangerLight
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =Typography.SizeCaption
                  Text: =""
                  Tooltip: |-
                    ="Remove program choice 3"
                  Visible: |-
                    =Not(IsBlank(drpProgram3AP.Selected.Value))
                  Width: =32
                  X: =1004
                  Y: =270
            - lblS2DupAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.DangerText
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: |-
                    ="The same choice has been made more than once. Pick a different program, or a different option under the same program."
                  # Compares the PAIR, not the option. HPP may be ranked more than
                  # once with a different option each time; MDP or NEXT twice is
                  # still blocked and needs no special case, because both rows would
                  # be (program, blank) and Coalesce makes those two blanks equal.
                  Visible: |-
                    =Or(
                      And(Not(IsBlank(drpProgram1AP.Selected.Value)),
                          drpProgram1AP.Selected.Value = drpProgram2AP.Selected.Value,
                          Coalesce(drpOption1AP.Selected.Value, "") =
                            Coalesce(drpOption2AP.Selected.Value, "")),
                      And(Not(IsBlank(drpProgram1AP.Selected.Value)),
                          drpProgram1AP.Selected.Value = drpProgram3AP.Selected.Value,
                          Coalesce(drpOption1AP.Selected.Value, "") =
                            Coalesce(drpOption3AP.Selected.Value, "")),
                      And(Not(IsBlank(drpProgram2AP.Selected.Value)),
                          drpProgram2AP.Selected.Value = drpProgram3AP.Selected.Value,
                          Coalesce(drpOption2AP.Selected.Value, "") =
                            Coalesce(drpOption3AP.Selected.Value, ""))
                    )
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =318
      
      # ===========================================================================
      # STEP 3 — Competencies and ECQs (RQ006–008, FR-005) — see D-2 blocker
      # ===========================================================================
      - conStep3AP:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =428
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
