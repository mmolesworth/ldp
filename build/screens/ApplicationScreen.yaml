            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeCaption
            Text: ="Go to step 2"
            Width: =120
            X: =Parent.Width - 144
            Y: =118
      - lblS6Check3AP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
            Height: =22
            Size: =Typography.SizeBody
            Text: ="Not checked — competency lists are pending Appendix B"
            Width: =Parent.Width - 200
            X: =24
            Y: =152
      - btnS6Jump3AP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =26
            HoverFill: =ColorPalette.Blue50
            OnSelect: |-
              =UpdateContext({ locStep: 3 })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeCaption
            Text: ="Go to step 3"
            Width: =120
            X: =Parent.Width - 144
            Y: =150
      - lblS6Check4AP:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(IsBlank(Trim(txtRatingAP.Text)), ColorPalette.DangerText, ColorPalette.SuccessText)
            Font: =Typography.Family
            Height: =22
            Size: =Typography.SizeBody
            Text: |-
              =If(IsBlank(Trim(txtRatingAP.Text)),
                 "Incomplete — latest performance rating is required",
                 "Complete — eligibility and background")
            Width: =Parent.Width - 200
            X: =24
            Y: =184
      - btnS6Jump4AP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =26
            HoverFill: =ColorPalette.Blue50
            OnSelect: |-
              =UpdateContext({ locStep: 4 })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeCaption
            Text: ="Go to step 4"
            Width: =120
            X: =Parent.Width - 144
            Y: =182
      # Not a tick: documents genuinely cannot be validated yet (OI-APP-1).
      # A green check here would be a lie.
      - lblS6Check5AP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
            Height: =22
            Size: =Typography.SizeBody
            Text: ="Not checked — supporting documents cannot be validated yet (OI-APP-1)"
            Width: =Parent.Width - 200
            X: =24
            Y: =216
      - btnS6Jump5AP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =26
            HoverFill: =ColorPalette.Blue50
            OnSelect: |-
              =UpdateContext({ locStep: 5 })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeCaption
            Text: ="Go to step 5"
            Width: =120
            X: =Parent.Width - 144
            Y: =214
      - lblS6ConfirmAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.SuccessText
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =40
            Size: =Typography.SizeBody
            Text: ="Your application has been submitted and routed to your first-line supervisor. You will be notified as it progresses."
            Visible: |-
              =And(Not(IsBlank(locApp)), locApp.Status.Value <> "Draft")
            Width: =Parent.Width - 48
            X: =24
            Y: =260
      # FR-009 — Submit is the ONLY gated action in the wizard.
      - btnSubmitAP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(
                Or(IsBlank(Trim(txtNameAP.Text)),
                   IsBlank(drpOption1AP.Selected.ID),
                   IsBlank(Trim(txtRatingAP.Text)),
                   locCycle.State.Value <> "Open",
                   And(Not(IsBlank(locApp)), locApp.Status.Value <> "Draft")),
                DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.Blue600
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =44
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({
                locApp: Patch(APPLICATIONS,
                  If(IsBlank(locApp), Defaults(APPLICATIONS), locApp),
                  {
                    CycleID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: locCycle.ID,
                      Value: locCycle.CycleName
                    },
                    ApplicantEmail: User().Email,
                    ApplicantName: txtNameAP.Text,
                    Location: txtLocationAP.Text,
                    Grade: txtGradeAP.Text,
                    JobSeries: txtSeriesAP.Text,
                    JobTitle: txtJobTitleAP.Text,
                    LatestPerformanceRating: Value(txtRatingAP.Text),
                    ListedOnIDP: drpIdpAP.Selected,
                    AttendedInfoSession: drpSessionAP.Selected,
                    InfoSessionDate: dtpSessionAP.SelectedDate,
                    NCUAStartDate: dtpStartAP.SelectedDate,
                    ServiceComputationDate: dtpScdAP.SelectedDate,
                    Status: { Value: "Submitted" },
                    RoutingStage: { Value: "Pending First Line" }
                  })
              });
              Remove(APPLICATION_PROGRAM_CHOICES,
                Filter(APPLICATION_PROGRAM_CHOICES, ApplicationID.Id = locApp.ID));
              ForAll(
                Filter(
                  Table(
                    { OptId: drpOption1AP.Selected.ID, OptName: drpOption1AP.Selected.OptionName, Rnk: 1 },
                    { OptId: drpOption2AP.Selected.ID, OptName: drpOption2AP.Selected.OptionName, Rnk: 2 },
                    { OptId: drpOption3AP.Selected.ID, OptName: drpOption3AP.Selected.OptionName, Rnk: 3 }
                  ),
                  Not(IsBlank(OptId))
                ) As ch,
                Patch(APPLICATION_PROGRAM_CHOICES, Defaults(APPLICATION_PROGRAM_CHOICES),
                  {
                    ApplicationID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: locApp.ID,
                      Value: locApp.ApplicantEmail
                    },
                    ProgramOptionID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: ch.OptId,
                      Value: ch.OptName
                    },
                    Rank: ch.Rnk
                  })
              );
              Notify("Application submitted.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeHeading
            Text: ="Submit application"
            Width: =240
            X: =24
            Y: =318
      - lblS6BlockedAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =40
            Size: =Typography.SizeCaption
            Text: ="Submit becomes available once the items marked incomplete above are filled in."
            Visible: |-
              =Or(IsBlank(Trim(txtNameAP.Text)),
                  IsBlank(drpOption1AP.Selected.ID),
                  IsBlank(Trim(txtRatingAP.Text)))
            Width: =360
            X: =288
            Y: =324

# ===========================================================================
# WIZARD CONTROLS — Back / Next / Save Draft
# ===========================================================================
- btnBackAP:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Gray300
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =ColorPalette.TextBody
      DisplayMode: |-
        =If(locStep <= 1, DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =ColorPalette.White
      FocusedBorderThickness: =1
      Font: =Typography.Family
      Height: =40
      HoverFill: =ColorPalette.Gray50
      OnSelect: |-
        =UpdateContext({ locStep: Max(1, locStep - 1) })
      PressedFill: =ColorPalette.White
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      Text: ="Back"
      Width: =120
      X: =24
      Y: =Parent.Height - 60

# Never blocked — see the navigation-model note at the top of this file.
- btnNextAP:
    Control: Classic/Button@2.2.0
    Properties:
      BorderStyle: =BorderStyle.None
      Color: =ColorPalette.TextOnDark
      DisplayMode: |-
        =If(locStep >= 6, DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =ColorPalette.Blue600
      Font: =Typography.Family
      Height: =40
      HoverFill: =ColorPalette.Blue700
      OnSelect: |-
        =UpdateContext({ locStep: Min(6, locStep + 1) })
      PressedFill: =ColorPalette.Blue700
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      Text: |-
        =If(locStep = 5, "Review and submit", "Next")
      Width: =160
      X: =Parent.Width - 184
      Y: =Parent.Height - 60

# FR-007 — save incomplete work at any step, resume later. No validation here.
- btnSaveDraftAP:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Gray300
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =ColorPalette.TextBody
      DisplayMode: |-
        =If(Or(locCycle.State.Value <> "Open",
               And(Not(IsBlank(locApp)), locApp.Status.Value <> "Draft")),
           DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =ColorPalette.White
      FocusedBorderThickness: =1
      Font: =Typography.Family
      Height: =40
      HoverFill: =ColorPalette.Gray50
      OnSelect: |-
        =UpdateContext({
          locApp: Patch(APPLICATIONS,
            If(IsBlank(locApp), Defaults(APPLICATIONS), locApp),
            {
              CycleID: {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                Id: locCycle.ID,
                Value: locCycle.CycleName
              },
              ApplicantEmail: User().Email,
              ApplicantName: txtNameAP.Text,
              Location: txtLocationAP.Text,
              Grade: txtGradeAP.Text,
              JobSeries: txtSeriesAP.Text,
              JobTitle: txtJobTitleAP.Text,
              LatestPerformanceRating: Value(txtRatingAP.Text),
              ListedOnIDP: drpIdpAP.Selected,
              AttendedInfoSession: drpSessionAP.Selected,
              InfoSessionDate: dtpSessionAP.SelectedDate,
              NCUAStartDate: dtpStartAP.SelectedDate,
              ServiceComputationDate: dtpScdAP.SelectedDate,
