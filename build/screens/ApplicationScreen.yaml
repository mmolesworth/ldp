                  Y: =10
            - lblS4HintAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.Blue50
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeBody
                  Text: ="Confirm your eligibility and information session details."
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =36
      
            # FOUR FIELDS, ONE ROW, on the same grid and in the same order as the DTD
            # review panel's Eligibility tab — so the two read alike. PowerLibs
            # modern-input-label throughout: the control, with a Label astride its top
            # border, filled white so it punches a notch in the line.
            #
            # Choices() reads the SharePoint column, so the Yes/No options cannot
            # drift from the list definition. It returns a single-column table, which
            # is the shape a Classic/DropDown matches Default against — no ForAll
            # projection needed here, unlike the program pickers.
            - drpIdpAP:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AllowEmptySelection: =true
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  ChevronBackground: =ColorPalette.Blue600
                  ChevronFill: =ColorPalette.TextOnDark
                  Default: =locApp.ListedOnIDP.Value
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  Height: =40
                  Items: =Choices(APPLICATIONS.ListedOnIDP)
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  SelectionColor: =ColorPalette.TextOnDark
                  SelectionFill: =ColorPalette.Blue600
                  Size: =Typography.SizeBody
                  Width: =(Parent.Width - 120) / 4
                  X: =24
                  Y: =110
            - txtRatingAP:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  Default: |-
                    =If(IsBlank(locApp), "", Text(locApp.LatestPerformanceRating))
                  DisabledBorderColor: =ColorPalette.Gray300
                  DisabledColor: =ColorPalette.TextBody
                  DisabledFill: =ColorPalette.White
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =ColorPalette.White
                  FocusedBorderColor: =ColorPalette.Blue600
                  FocusedBorderThickness: =2
                  Font: =Typography.Family
                  Height: =40
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  PaddingLeft: =12
                  Size: =Typography.SizeBody
                  Width: =drpIdpAP.Width
                  X: =drpIdpAP.X + (drpIdpAP.Width + 24)
                  Y: =110
            - drpSessionAP:
