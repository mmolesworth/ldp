      # STEP 2 — Program choices (RQ005, FR-004)
      # ===========================================================================
      - conStep2AP:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =428
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =locStep = 2
            Width: =Parent.Width - 48
            X: =24
            Y: =160
          Children:
            # HEADER BAND — same treatment as step 1. Declared first (z-order is
            # declaration order) and a GroupContainer rather than a Rectangle,
            # because only Button, GroupContainer and Image support Radius and the
            # top corners must match the card's 12px.
            - conS2HeaderAP:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.Navy900
                  Height: =64
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - lblS2TitleAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =26
                  Size: =Typography.SizeHeading
                  Text: ="Program choices"
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =10
            - lblS2HintAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.Blue50
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeBody
                  Text: ="Choose one to three options, highest preference first. Some programs require choosing a secondary option."
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =36
            - lblChoice1AP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =22
                  Size: =Typography.SizeBody
                  Text: ="First choice (required)"
                  Width: =240
                  X: =24
                  Y: =88
            - drpProgram1AP:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AllowEmptySelection: =true
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  ChevronBackground: =ColorPalette.Blue600
                  ChevronFill: =ColorPalette.TextOnDark
                  Default: |-
                    =LookUp(APPLICATION_PROGRAM_CHOICES,
                      And(ApplicationID.Id = locApp.ID, Rank = 1)).ProgramID.Value
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  Height: =32
                  # <> "Retired", NOT = "Active": PROGRAMS.State is blank on rows
                  # created before the column existed and nothing backfills it, so an
                  # equality test offers the applicant an empty list. See OI-DATA-2.
                  # SINGLE-COLUMN TEXT. A Classic/DropDown displays and matches
                  # Default against the column named by its Value property, and Value
                  # is an output YAML cannot set (PA2108) — over a table of RECORDS
                  # it picks a column of its own choosing, which is why this rendered
                  # blank. ForAll projects one text column, so display and Default are
                  # the same thing.
                  #
                  # <> "Retired", not = "Active": PROGRAMS.State is blank on rows
                  # created before the column existed (OI-DATA-2).
                  Items: |-
                    =ForAll(
                      Sort(Filter(PROGRAMS, State.Value <> "Retired"), ProgramName),
                      ProgramName)
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  SelectionColor: =ColorPalette.TextOnDark
                  SelectionFill: =ColorPalette.Blue600
                  Size: =Typography.SizeBody
                  Width: =360
                  X: =24
                  Y: =114
            # Options filtered to the chosen program. ProgramID is indexed.
            - drpOption1AP:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AllowEmptySelection: =true
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  ChevronBackground: =ColorPalette.Blue600
                  ChevronFill: =ColorPalette.TextOnDark
                  Default: |-
                    =LookUp(APPLICATION_PROGRAM_CHOICES,
                      And(ApplicationID.Id = locApp.ID, Rank = 1)).ProgramOptionID.Value
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  Height: =32
                  Items: |-
                    =ForAll(
                      Sort(
                        Filter(PROGRAM_OPTIONS,
                          ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram1AP.Selected.Value).ID,
                          Or(State.Value = "Active",
                             OptionName = LookUp(APPLICATION_PROGRAM_CHOICES,
                      And(ApplicationID.Id = locApp.ID, Rank = 1)).ProgramOptionID.Value)),
                        OptionName),
                      OptionName)
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  SelectionColor: =ColorPalette.TextOnDark
                  SelectionFill: =ColorPalette.Blue600
                  Size: =Typography.SizeBody
                  # Hidden when the chosen program has no options — MDP and NEXT
                  # today. IsEmpty(Filter(...)) rather than CountRows(...) = 0:
                  # CountRows does not delegate to SharePoint and would answer from
                  # the first 500 rows only.
                  #
                  # This property is also the single definition of "this program has
                  # options". The submit gate and the review checklist both read
                  # Self.Visible rather than repeating the query, so the rule cannot
                  # drift between the picker and the validation.
                  Visible: |-
                    =Not(IsEmpty(Filter(PROGRAM_OPTIONS,
                       ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram1AP.Selected.Value).ID,
                       State.Value = "Active")))
                  Width: =588
                  X: =400
                  Y: =114
            - lblNoOption1AP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =32
                  Size: =Typography.SizeBody
                  Text: ="This program has no secondary options."
                  VerticalAlign: =VerticalAlign.Middle
                  # The mirror of the dropdown's Visible: shown exactly when the
                  # dropdown is not, and only once a program has been picked. An
                  # empty gap here reads as something failing to load.
                  Visible: |-
                    =And(Not(IsBlank(drpProgram1AP.Selected.Value)),
                       Not(drpOption1AP.Visible))
                  Width: =588
                  X: =400
                  Y: =114
