# ---------- Read-only banner (FR-008) ----------
- lblReadOnlyAP:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.WarningText
      Font: =Typography.Family
      Height: =20
      Size: =Typography.SizeCaption
      Text: |-
        =If(locCycle.State.Value <> "Open",
           "This cycle is " & locCycle.State.Value & ". Your application is read-only and cannot be submitted.",
           "Your application has been submitted and can no longer be edited.")
      Visible: |-
        =Or(locCycle.State.Value <> "Open",
            And(Not(IsBlank(locApp)), locApp.Status.Value <> "Draft"))
      Width: =Parent.Width - 220
      X: =24
      Y: =186

# ===========================================================================
# STEP 1 — Personnel (RQ002, RQ003, RQ004 / RQ105b)
# ===========================================================================
- conStep1AP:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =428
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: =locStep = 1
      Width: =Parent.Width - 48
      X: =24
      Y: =212
    Children:
      - lblS1TitleAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =26
            Size: =Typography.SizeHeading
            Text: ="Personnel information"
            Width: =Parent.Width - 48
            X: =24
            Y: =20
      # RQ002/RQ003 — read-only when the directory has a record, editable when
      # it does not. D-1 seam: the directory stands in for HR Links.
      - lblS1SourceAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="Enter your details below. These will be filled in automatically once the personnel system integration is in place (D-1)."
            Width: =Parent.Width - 48
            X: =24
            Y: =50
      - lblS1NameLabelAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeLabel
            Text: ="Full name (required)"
            Width: =320
            X: =24
            Y: =148
      - txtNameAP:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(IsBlank(locApp), "", locApp.ApplicantName)
            # Disabled, NOT View: DisplayMode.View strips a TextInput's border
            # and fill, so an empty one renders as nothing at all and the step
            # looks broken. Disabled stays visible and greyed.
            DisplayMode: |-
              =If(Or(locCycle.State.Value <> "Open",
                     And(Not(IsBlank(locApp)), locApp.Status.Value <> "Draft")),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
