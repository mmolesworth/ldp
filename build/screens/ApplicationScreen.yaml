                Properties:
                  AllowEmptySelection: =true
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  ChevronBackground: =ColorPalette.Blue600
                  ChevronFill: =ColorPalette.TextOnDark
                  Default: =locApp.AttendedInfoSession.Value
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  FocusedBorderThickness: =1
                  Font: =Typography.Family
                  Height: =40
                  Items: =Choices(APPLICATIONS.AttendedInfoSession)
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  SelectionColor: =ColorPalette.TextOnDark
                  SelectionFill: =ColorPalette.Blue600
                  Size: =Typography.SizeBody
                  Width: =drpIdpAP.Width
                  X: =drpIdpAP.X + (drpIdpAP.Width + 24) * 2
                  Y: =110
            # Only asked once the session question is answered Yes — a date for a
            # session nobody attended is not a thing to collect.
            - dtpSessionAP:
                Control: Classic/DatePicker@2.6.0
                Properties:
                  AccessibleLabel: ="Information session date"
                  BorderColor: =ColorPalette.Gray300
                  BorderThickness: =1
                  Color: =ColorPalette.TextBody
                  # NOT Today() — see OI-REQ-1. Blank stays blank.
                  DefaultDate: =locApp.InfoSessionDate
                  DisplayMode: |-
                    =If(Or(locCycle.State.Value <> "Open",
                           And(Not(IsBlank(locApp)), locApp.ApplicationStatus.Value <> "Draft")),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  Height: =40
                  OnChange: |-
                    =Set(gblFormDirty, true)
                  Size: =Typography.SizeBody
                  Visible: =drpSessionAP.Selected.Value = "Yes"
                  Width: =drpIdpAP.Width
                  X: =drpIdpAP.X + (drpIdpAP.Width + 24) * 3
                  Y: =110
      
            # LABELS LAST: each straddles the top border of its control, and z-order
            # is declaration order.
            - lblS4IdpAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
