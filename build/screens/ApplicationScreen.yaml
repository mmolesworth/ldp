            Width: =Parent.Width - 48
            X: =24
            Y: =160
          Children:
            # HEADER BAND — same treatment as steps 1 and 2.
            - conS3HeaderAP:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.Navy900
                  Height: =64
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - lblS3TitleAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
