                  Height: =64
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - lblS4TitleAP:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =26
                  Size: =Typography.SizeHeading
