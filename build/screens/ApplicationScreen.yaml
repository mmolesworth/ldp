# Application Screen — US1, six-step wizard
# RQ001–014, RQ105a/105b (PROPOSED), FR-004–011, FR-009a/009b (PROPOSED)
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# Composition: PowerLibs `horizontal-stepper` (Pro), generated 2026-07-25 via
# generate_yaml, adapted (see DEVIATIONS).
#
# ---------------------------------------------------------------------------
# HOW TO TRANSCRIBE (Constitution IV)
# ---------------------------------------------------------------------------
#   1. New screen → Blank. Rename it "Application Screen".
#   2. Fill: =ColorPalette.Gray50
#   3. Paste build/screens/_UtilityBar.yaml FIRST, then everything below.
#   4. Data sources (five): APPLICATIONS, APPLICATION_PROGRAM_CHOICES,
#      PROGRAM_OPTIONS, PROGRAMS, CYCLES.  (four, plus APPLICATIONS)
#   5. OnVisible — transcribe by hand (no # prefixes, no leading =):
#
#      UpdateContext({
#          locCycle: If(IsBlank(LookUp(CYCLES, State.Value = "Open")),
#                       First(Sort(CYCLES, OpenDate, SortOrder.Descending)),
#                       LookUp(CYCLES, State.Value = "Open")),
#          locStep: 1
#      });
#      UpdateContext({
#          locApp: LookUp(APPLICATIONS,
#                    And(CycleID.Id = locCycle.ID, ApplicantEmail = User().Email))
#      });
#      ClearCollect(colRanked,
#          ForAll(Filter(APPLICATION_PROGRAM_CHOICES, ApplicationID.Id = locApp.ID) As c,
#              { OptionID: c.ProgramOptionID.Id,
#                OptionName: LookUp(PROGRAM_OPTIONS, ID = c.ProgramOptionID.Id).OptionName,
#                Rank: c.Rank }))
#
#   6. Preview (F5) — OnVisible does not run on the design surface.
#
# ---------------------------------------------------------------------------
# NAVIGATION MODEL — RQ105a (PROPOSED, supersedes RQ105)
# ---------------------------------------------------------------------------
# Forward and backward one step at a time. The step circles are INDICATORS, not
# buttons — there is no control over them, so a step cannot be clicked directly.
# The only jumps are from step 6, where each missing item links to its step.
#
# NEXT NEVER BLOCKS. Advancing is unconditional by design: FR-009 validates the
# whole application at submission, and RQ106 requires incomplete items to be
# indicated without blocking navigation. Gaps surface at step 6 and stop Submit,
# never Next. Do not add per-step gating without amending FR-009 and RQ106 too.
#
# ---------------------------------------------------------------------------
# DEVIATIONS FROM THE GENERATED horizontal-stepper
# ---------------------------------------------------------------------------
# 1. Its demo content panel (conStepContent, with icon/title/description/hint)
#    is REPLACED by the six real step panels. The circles, connector lines,
#    labels and the Back/Next pair are kept as designed.
# 2. varHStep → locStep (project convention).
# 3. Step labels Size 8 → Typography.SizeCaption (9); 8pt is below the 508 floor.
# 4. "All steps completed successfully!" removed — completion is a submission,
#    not a wizard state.
#
# ---------------------------------------------------------------------------
# TWO KNOWN BLOCKERS — unchanged, both still open
# ---------------------------------------------------------------------------
# OI-APP-1  Step 5 cannot deliver three independent document slots. SharePoint
#           item attachments are ONE unnamed collection with no per-slot
#           identity, no MIME filter and no size guard. Step 5 ships as a
#           placeholder stating the three options. Blocks US1 verification.
# D-2       Step 3's ten dropdowns have no values. _CHOICES.md marks OPM
#           competencies, technical competencies and ECQs "TBD — Appendix B",
#           and Constitution I forbids inventing them. Items: =Table() renders
#           an empty list; fill each in when Appendix B lands.

