            # Each row: status + jump link. These are the ONLY direct jumps in the
            # wizard (RQ105a).
            # Size 16 is a LITERAL, not a token. The palette stops at SizeHeading 14
            # and its only larger value is SizeHero 20, reserved for the landing
            # headline. If this size is worth keeping, it wants a token in
            # build/theme/theme.md rather than five literals here.
            #
            # The five rows are centred as a block: 202px tall (5 rows of 34 at
            # 42 apart), positioned against the area below the header — the same
            # arithmetic the Submit button uses, so the two centre on the same line.
            #
            # No jump buttons. They were removed on 2026-08-01 — the stepper at the
            # top of the screen is the only way back, which keeps one navigation
            # model rather than two.
            # TWO PANELS. Left: a status row per step, name at the left and its state
            # right-aligned against the divider — a table someone scans down. Right:
            # what submitting actually does, then the button.
