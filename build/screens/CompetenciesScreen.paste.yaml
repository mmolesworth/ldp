            BorderColor: =ColorPalette.Gray200
            Height: =212
            Items: |-
              =SortByColumns(colTypes, "SortOrder", SortOrder.Ascending)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =44
            Width: =Parent.Width - 48
            X: =24
            Y: =82
          Children:
            - conTypeRow:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =Parent.TemplateHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingLeft: =12
                  PaddingRight: =12
                  Width: =Parent.TemplateWidth
                Children:
                  - lblTypeRowName:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(ThisItem.State.Value = "Retired",
                             ColorPalette.TextHelp, ColorPalette.TextHeading)
                        FillPortions: =1.6
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: =ThisItem.TypeName
                  - lblTypeRowCount:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeCaption
                        Text: |-
                          =CountRows(Filter(colComps,
                             CompetencyTypeID.Id = ThisItem.ID,
                             State.Value = "Active")) & " active"
                  - lblTypeRowState:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(ThisItem.State.Value = "Retired",
                             ColorPalette.WarningText, ColorPalette.SuccessText)
                        FillPortions: =0.8
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        LayoutMinWidth: =0
                        Size: =Typography.SizeCaption
                        Text: =ThisItem.State.Value
                  - btnTypeRowRetire:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: |-
                          =If(ThisItem.State.Value = "Retired",
                             ColorPalette.SuccessText, ColorPalette.WarningText)
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0.8
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =3
                        Font: =Typography.Family
                        Height: =30
                        HoverFill: =ColorPalette.Blue50
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Patch(COMPETENCY_TYPES,
                            LookUp(COMPETENCY_TYPES, ID = ThisItem.ID),
                            {
                              State: {
                                Value: If(ThisItem.State.Value = "Retired", "Active", "Retired")
                              }
                            });
                          ClearCollect(colTypes, COMPETENCY_TYPES);
                          UpdateContext({
                            locTypeID:
                              If(LookUp(colTypes, ID = locTypeID).State.Value = "Active",
                                 locTypeID,
                                 First(SortByColumns(
                                   Filter(colTypes, State.Value = "Active"),
                                   "SortOrder", SortOrder.Ascending)).ID),
                            locComp: Blank()
                          })
                        PressedFill: =ColorPalette.Blue50
                        Size: =Typography.SizeCaption
                        Text: |-
                          =If(ThisItem.State.Value = "Retired", "Restore", "Retire")
            - recTypeRowLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1

      - lblTypeAddLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            PaddingLeft: =8
            Size: =Typography.SizeLabel
            Text: ="New type name"
            Width: =Parent.Width - 48
            X: =24
            Y: =304
      - txtNewType:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =32
            PaddingLeft: =8
            Size: =Typography.SizeBody
            TabIndex: =6
            Width: =340
            X: =24
            Y: =326
      - btnTypeAdd:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(
                Or(IsBlank(Trim(txtNewType.Text)),
                   Not(IsEmpty(Filter(colTypes,
                        TypeName = Trim(txtNewType.Text))))),
                DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =32
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =Patch(COMPETENCY_TYPES, Defaults(COMPETENCY_TYPES),
                {
                  TypeName: Trim(txtNewType.Text),
                  State: { Value: "Active" },
                  SortOrder: Coalesce(Max(colTypes, SortOrder), 0) + 10
                });
              ClearCollect(colTypes, COMPETENCY_TYPES);
              Reset(txtNewType);
              Notify("Competency type added.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =7
            Text: ="Add type"
            Width: =120
            X: =378
            Y: =326
      - lblTypeDupe:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.DangerText
            Font: =Typography.Family
            Height: =18
            PaddingLeft: =8
            Size: =Typography.SizeCaption
            Text: ="That type already exists."
            Visible: |-
              =And(Not(IsBlank(Trim(txtNewType.Text))),
                 Not(IsEmpty(Filter(colTypes,
                      TypeName = Trim(txtNewType.Text)))))
            Width: =Parent.Width - 48
            X: =24
            Y: =360
      - btnTypeModalClose:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =34
            HoverFill: =ColorPalette.Gray50
            OnSelect: |-
              =UpdateContext({ locTypeModal: false })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =8
            Text: ="Done"
            Width: =110
            X: =Parent.Width - 134
            Y: =Parent.Height - 52

- recRetireScrim:
    Control: Rectangle@2.3.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0.3)
      Height: =Parent.Height
      Visible: =locConfirmRetire
      Width: =Parent.Width
      X: =0
      Y: =0

- conRetireConfirm:
