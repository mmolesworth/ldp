              =SortByColumns(
                Filter(colTypes, State.Value = "Active"),
                "SortOrder", SortOrder.Ascending)
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =150
