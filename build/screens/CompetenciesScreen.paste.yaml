- galComps:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =Parent.Height - 214
      Items: |-
        =SortByColumns(
          If(tglHideRetired.Value,
             Filter(colComps, CompetencyTypeID.Id = locTypeID,
                    State.Value = "Active"),
             Filter(colComps, CompetencyTypeID.Id = locTypeID)),
          locCompSort,
          If(locCompAsc, SortOrder.Ascending, SortOrder.Descending))
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =52
      Width: =Parent.Width - 48
      X: =24
      Y: =190
    Children:
      - conCompRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: |-
              =If(And(Not(IsBlank(locComp)), ThisItem.ID = locComp.ID),
                 ColorPalette.Blue50, ColorPalette.White)
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblCompRowName:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.State.Value = "Retired",
                       ColorPalette.TextHelp, ColorPalette.TextHeading)
                  FillPortions: =1.5
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: =ThisItem.CompetencyName
            - lblCompRowDesc:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  FillPortions: =3.2
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: |-
                    =If(Len(ThisItem.Description) > 90,
                       Left(ThisItem.Description, 90) & "…",
                       ThisItem.Description)
            - lblCompRowState:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.State.Value = "Retired",
                       ColorPalette.WarningText, ColorPalette.SuccessText)
                  FillPortions: =0.6
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: =ThisItem.State.Value
            - conCompRowEdit:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.25
                  Height: =34
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - imgCompRowEdit:
                      Control: Image@2.2.3
                      Properties:
                        Height: =18
                        Image: |-
                          ="data:image/svg+xml," &
                            EncodeUrl(Substitute(gblNavIcons.DocumentEdit,
                              "currentColor", "#246FAE"))
                        Width: =18
                        X: =Parent.Width / 2 - 9
                        Y: =Parent.Height / 2 - 9
                  - btnCompRowEdit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =3
                        Height: =Parent.Height
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.06)
                        OnSelect: |-
                          =UpdateContext({ locComp: ThisItem, locCompModal: true });
                          Reset(txtCompName);
                          Reset(txtCompDesc);
                          Reset(drpCompType)
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0.12)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Text: ="Edit competency"
                        Tooltip: ="Edit competency"
                        Width: =Parent.Width
                        X: =0
                        Y: =0
            - conCompRowRetire:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.25
                  Height: =34
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - imgCompRowRetire:
                      Control: Image@2.2.3
                      Properties:
                        Height: =18
                        Image: |-
                          =If(ThisItem.State.Value = "Retired",
                            "data:image/svg+xml," &
                              EncodeUrl(Substitute(gblNavIcons.ArchiveArrowBack,
                                "currentColor", "#047857")),
                            "data:image/svg+xml," &
                              EncodeUrl(Substitute(gblNavIcons.Archive,
                                "currentColor", "#B45309")))
                        Width: =18
                        X: =Parent.Width / 2 - 9
                        Y: =Parent.Height / 2 - 9
                  - btnCompRowRetire:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =3
                        Height: =Parent.Height
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.06)
                        OnSelect: |-
                          =If(ThisItem.State.Value = "Retired",
                            Patch(COMPETENCIES,
                              LookUp(COMPETENCIES, ID = ThisItem.ID),
                              { State: { Value: "Active" } }),
                            UpdateContext({ locRetireComp: ThisItem, locConfirmRetire: true }));
                          UpdateContext({ locComp: Blank() });
                          If(ThisItem.State.Value = "Retired", ClearCollect(colComps, COMPETENCIES))
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0.12)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Text: |-
                          =If(ThisItem.State.Value = "Retired",
                             "Restore competency", "Retire competency")
                        Tooltip: |-
                          =If(ThisItem.State.Value = "Retired",
                             "Restore competency", "Retire competency")
                        Width: =Parent.Width
                        X: =0
                        Y: =0
      - recCompRowLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

