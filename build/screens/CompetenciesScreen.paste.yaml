            X: =24
            Y: =24
      - lblCompModalTypeLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            PaddingLeft: =8
            Size: =Typography.SizeLabel
            Text: ="Type (required)"
            Width: =Parent.Width - 48
            X: =24
            Y: =62
      - drpCompType:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =ColorPalette.Gray300
            Color: =ColorPalette.TextBody
            Default: |-
              =If(IsBlank(locComp),
                 LookUp(colTypes, ID = locTypeID).TypeName,
                 locComp.CompetencyTypeID.Value)
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =32
            Items: |-
              =ForAll(
                SortByColumns(
                  Filter(colTypes, State.Value = "Active"),
                  "SortOrder", SortOrder.Ascending),
                TypeName)
            Size: =Typography.SizeBody
            TabIndex: =1
            Width: =280
            X: =24
            Y: =84
      - lblCompModalNameLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            PaddingLeft: =8
            Size: =Typography.SizeLabel
            Text: ="Competency name (required)"
            Width: =Parent.Width - 48
            X: =24
            Y: =128
      - txtCompName:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(IsBlank(locComp), "", locComp.CompetencyName)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =32
            PaddingLeft: =8
            Size: =Typography.SizeBody
            TabIndex: =2
            Width: =Parent.Width - 48
            X: =24
            Y: =150
      - lblCompModalDescLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            PaddingLeft: =8
            Size: =Typography.SizeLabel
            Text: ="Description (required)"
            Width: =Parent.Width - 48
            X: =24
            Y: =194
      - txtCompDesc:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(IsBlank(locComp), "", locComp.Description)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =120
            Mode: =TextMode.MultiLine
            PaddingLeft: =8
            Size: =Typography.SizeBody
            TabIndex: =3
            Width: =Parent.Width - 48
            X: =24
            Y: =216
      - lblCompModalValidation:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.DangerText
            Font: =Typography.Family
            Height: =20
            PaddingLeft: =8
            Size: =Typography.SizeCaption
            Text: |-
              =If(
                IsBlank(drpCompType.Selected.Value),
                "Choose a type.",
                IsBlank(Trim(txtCompName.Text)),
                "Competency name is required.",
                IsBlank(Trim(txtCompDesc.Text)),
                "Description is required.",
                "")
            Width: =Parent.Width - 48
            X: =24
            Y: =344
      - btnCompModalSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(
                Or(IsBlank(drpCompType.Selected.Value),
                   IsBlank(Trim(txtCompName.Text)),
                   IsBlank(Trim(txtCompDesc.Text))),
                DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({
                locComp: Patch(COMPETENCIES,
                  If(IsBlank(locComp),
                     Defaults(COMPETENCIES),
                     LookUp(COMPETENCIES, ID = locComp.ID)),
                  {
                    CompetencyName: txtCompName.Text,
                    Description: txtCompDesc.Text,
                    CompetencyTypeID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: LookUp(colTypes,
                                 TypeName = drpCompType.Selected.Value).ID,
                      Value: drpCompType.Selected.Value
                    },
                    State: If(IsBlank(locComp), { Value: "Active" }, locComp.State)
                  }),
                locCompModal: false,
                locTypeID: LookUp(colTypes,
                                  TypeName = drpCompType.Selected.Value).ID
              });
              ClearCollect(colComps, COMPETENCIES);
              Notify("Competency saved.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =4
            Text: ="Save"
            Width: =120
            X: =24
            Y: =372
      - btnCompModalCancel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Gray50
            OnSelect: |-
              =UpdateContext({ locCompModal: false })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =5
            Text: ="Cancel"
            Width: =110
            X: =156
            Y: =372

