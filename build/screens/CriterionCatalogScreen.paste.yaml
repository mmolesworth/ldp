                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: ="State"
      - galCatSheets:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =146
            Items: |-
              =SortByColumns(
                Filter(
                  ForAll(
                    Filter(colRatingCrit, CatalogCriterionID.Id = locCrit.ID) As rc,
                    {
