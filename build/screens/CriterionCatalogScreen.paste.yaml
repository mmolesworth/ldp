      - btnCatSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(
                Or(IsBlank(Trim(txtCatName.Text)),
                   IsBlank(Trim(txtCatDesc.Text))),
                DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({
                locSaved: Patch(CRITERION_CATALOG,
                  If(IsBlank(locCrit),
                     Defaults(CRITERION_CATALOG),
                     LookUp(CRITERION_CATALOG, ID = locCrit.ID)),
                  {
                    CriterionName: txtCatName.Text,
                    Description: txtCatDesc.Text,
                    State: If(IsBlank(locCrit), { Value: "Draft" }, locCrit.State)
                  })
              });
              If(IsBlank(locSaved.ID),
                Notify("The criterion could not be saved, so no anchors were written.",
                       NotificationType.Error),
                ForAll(
                  Table(
                    { Sc: 0, Txt: txtAnchor0.Text, Ex: txtExample0.Text },
                    { Sc: 1, Txt: txtAnchor1.Text, Ex: txtExample1.Text },
                    { Sc: 3, Txt: txtAnchor3.Text, Ex: txtExample3.Text },
                    { Sc: 5, Txt: txtAnchor5.Text, Ex: txtExample5.Text }
                  ) As a,
                  If(Not(IsBlank(Trim(a.Txt))),
                    Patch(CRITERION_ANCHORS,
                      If(IsBlank(LookUp(CRITERION_ANCHORS,
                           And(CatalogCriterionID.Id = locSaved.ID, Score = a.Sc))),
                         Defaults(CRITERION_ANCHORS),
                         LookUp(CRITERION_ANCHORS,
                           And(CatalogCriterionID.Id = locSaved.ID, Score = a.Sc))),
                      {
                        CatalogCriterionID: {
                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                          Id: locSaved.ID,
                          Value: locSaved.CriterionName
                        },
                        Score: a.Sc,
                        AnchorText: a.Txt,
                        ExampleText: a.Ex
                      })));
              ClearCollect(colCrit, CRITERION_CATALOG);
              ClearCollect(colAnchors, CRITERION_ANCHORS);
              UpdateContext({ locCatModal: false, locCrit: Blank() });
              Notify("Criterion saved.", NotificationType.Success)
