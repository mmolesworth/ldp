      - recCatTabsRule:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.Width - 40
            X: =20
            Y: =41
      - lblCatDetailFor:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =24
            Size: =Typography.SizeBody
            Text: =locCrit.CriterionName
            Visible: =Not(IsBlank(locCrit))
            Width: =Parent.Width - 400
            X: =380
            Y: =12
      - lblCatDetailDesc:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =52
            PaddingLeft: =0
            Size: =Typography.SizeBody
            Text: =locCrit.Description
            VerticalAlign: =VerticalAlign.Top
            Visible: =Not(IsBlank(locCrit))
            Width: =Parent.Width - 40
            X: =20
            Y: =50
      - lblCatAnchorWarn:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: |-
              =If(CountRows(Filter(colAnchors,
                    CatalogCriterionID.Id = locCrit.ID)) = 4,
                 ColorPalette.SuccessText, ColorPalette.WarningText)
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =24
            Size: =Typography.SizeCaption
            Text: |-
              =If(CountRows(Filter(colAnchors,
                    CatalogCriterionID.Id = locCrit.ID)) = 4,
                 "All four anchors present",
                 "Missing " &
                   (4 - CountRows(Filter(colAnchors,
                      CatalogCriterionID.Id = locCrit.ID))) &
                   " of 4 — cannot be published")
            Visible: =And(Not(IsBlank(locCrit)), locCatTab = 1)
            Width: =300
            X: =Parent.Width - 320
            Y: =106
      - lblCatAnchorEmpty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =40
            Size: =Typography.SizeBody
            Text: ="Select a criterion above to see its anchors and the sheets that use it."
            Visible: =IsBlank(locCrit)
            Width: =Parent.Width - 40
            X: =20
            Y: =Parent.Height / 2 - 20

      - conCatAnchorHead:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray25
            Height: =28
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Visible: =And(Not(IsBlank(locCrit)), locCatTab = 1)
            Width: =Parent.Width - 40
            X: =20
            Y: =132
          Children:
            - lblCatAnchorHeadScore:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =0.35
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: ="Score"
            - lblCatAnchorHeadText:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =3
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: ="Descriptor"
            - lblCatAnchorHeadEx:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =2
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: ="Example"

      - galCatAnchors:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =146
            Items: |-
              =SortByColumns(
                Filter(colAnchors, CatalogCriterionID.Id = locCrit.ID),
                "Score", SortOrder.Ascending)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =42
            Visible: =And(Not(IsBlank(locCrit)), locCatTab = 1)
            Width: =Parent.Width - 40
            X: =20
            Y: =160
          Children:
            - conCatAnchorRow:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =Parent.TemplateHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingLeft: =12
                  PaddingRight: =12
                  Width: =Parent.TemplateWidth
                Children:
                  - lblCatAnchorScore:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.Blue700
                        FillPortions: =0.35
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Score
                  - lblCatAnchorText:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =3
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: |-
                          =If(Len(ThisItem.AnchorText) > 110,
                             Left(ThisItem.AnchorText, 110) & "…",
                             ThisItem.AnchorText)
                  - lblCatAnchorEx:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        FillPortions: =2
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeCaption
                        Text: |-
                          =If(IsBlank(ThisItem.ExampleText), "—",
                             If(Len(ThisItem.ExampleText) > 70,
                                Left(ThisItem.ExampleText, 70) & "…",
                                ThisItem.ExampleText))
            - recCatAnchorLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1

      - conCatSheetHead:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray25
            Height: =28
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Visible: =And(Not(IsBlank(locCrit)), locCatTab = 2)
            Width: =Parent.Width - 40
            X: =20
            Y: =132
          Children:
            - lblCatSheetHeadProgram:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1.6
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
