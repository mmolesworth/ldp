            Size: =Typography.SizeBody
            TabIndex: =13
            Text: |-
              =If(Or(IsBlank(locCrit), locCrit.State.Value = "Draft"),
                 "Cancel", "Close")
            Width: =110
            X: =Parent.Width - 134
            Y: =548

- recCatRetireScrim:
    Control: Rectangle@2.3.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0.3)
      Height: =Parent.Height
      Visible: =locConfirmCat
      Width: =Parent.Width
      X: =0
      Y: =0

- conCatRetireConfirm:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Bold
      Fill: =ColorPalette.White
      Height: =260
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: =locConfirmCat
      Width: =500
      X: =Parent.Width / 2 - Self.Width / 2
      Y: =Parent.Height / 2 - Self.Height / 2
    Children:
      - shpCatRetireHalo:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.WarningLight
            Height: =56
            Width: =56
            X: =Parent.Width / 2 - 28
            Y: =24
      - icoCatRetireWarn:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.WarningText
            Height: =30
            Icon: =Icon.Warning
            Width: =30
            X: =Parent.Width / 2 - 15
            Y: =37
      - lblCatRetireTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =26
            Size: =Typography.SizeHeading
            Text: ="Retire this criterion?"
            Width: =Parent.Width - 48
            X: =24
            Y: =92
      - lblCatRetireBody:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =64
            Size: =Typography.SizeBody
            Text: |-
              =locRetireCrit.CriterionName &
                " will no longer be selectable onto new scoring rubrics. Rubrics that already use it keep working, and you can restore it at any time."
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 64
            X: =32
            Y: =122
      - btnCatRetireConfirm:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =Patch(CRITERION_CATALOG,
                LookUp(CRITERION_CATALOG, ID = locRetireCrit.ID),
                { State: { Value: "Retired" } });
              ClearCollect(colCrit, CRITERION_CATALOG);
              UpdateContext({ locConfirmCat: false, locRetireCrit: Blank() });
              Notify("Criterion retired.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =14
            Text: ="Retire"
            Width: =120
            X: =Parent.Width / 2 - 130
            Y: =Parent.Height - 60
      - btnCatRetireCancel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Gray50
            OnSelect: |-
              =UpdateContext({ locConfirmCat: false, locRetireCrit: Blank() })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =15
            Text: ="Cancel"
            Width: =120
            X: =Parent.Width / 2 + 10
            Y: =Parent.Height - 60
