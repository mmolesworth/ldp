      Y: =62

- conCatHead:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =36
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =Parent.Width - 48
      X: =24
      Y: =98
    Children:
      - btnCatHeadName:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1.6
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverFill: =RGBA(0, 0, 0, 0)
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locCatAsc: If(locCatSort = "CriterionName", Not(locCatAsc), true),
                locCatSort: "CriterionName"
              })
            PressedFill: =RGBA(0, 0, 0, 0)
            Size: =Typography.SizeCaption
            Text: |-
              ="Criterion" & If(locCatSort = "CriterionName", If(locCatAsc, "  ▲", "  ▼"), "")
      - lblCatHeadDesc:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            FillPortions: =3.6
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Description"
      - btnCatHeadState:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =0.7
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverFill: =RGBA(0, 0, 0, 0)
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locCatAsc: If(locCatSort = "State", Not(locCatAsc), true),
                locCatSort: "State"
              })
            PressedFill: =RGBA(0, 0, 0, 0)
            Size: =Typography.SizeCaption
            Text: |-
              ="State" & If(locCatSort = "State", If(locCatAsc, "  ▲", "  ▼"), "")
      - lblCatHeadActions:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =ColorPalette.TextHeading
            FillPortions: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Actions"
            Width: =104

- galCriteria:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =Max(160, Parent.Height - 490)
      Items: |-
        =SortByColumns(
          If(tglCatHideRetired.Value,
             Filter(colCrit, State.Value <> "Retired"),
             colCrit),
          locCatSort,
          If(locCatAsc, SortOrder.Ascending, SortOrder.Descending))
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =92
      Width: =Parent.Width - 48
      X: =24
      Y: =134
    Children:
      - conCatRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: |-
              =If(And(Not(IsBlank(locCrit)), ThisItem.ID = locCrit.ID),
                 ColorPalette.Blue50, ColorPalette.White)
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblCatRowName:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.State.Value = "Retired",
                       ColorPalette.TextHelp, ColorPalette.TextHeading)
                  FillPortions: =1.6
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: =ThisItem.CriterionName
            - lblCatRowDesc:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  FillPortions: =3.6
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: |-
                    =If(Len(ThisItem.Description) > 220,
                       Left(ThisItem.Description, 220) & "…",
                       ThisItem.Description)
            - lblCatRowState:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(ThisItem.State.Value,
                       "Published", ColorPalette.SuccessText,
                       "Draft", ColorPalette.Blue700,
                       ColorPalette.TextHelp)
                  FillPortions: =0.7
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: =ThisItem.State.Value
            - lblCatRowActionSpacer:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  LayoutMinWidth: =0
                  Text: =""
                  Width: =104
      - btnCatRowSelect:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0.04)
            OnSelect: |-
              =UpdateContext({ locCrit: ThisItem })
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.08)
            Text: |-
              ="Select " & ThisItem.CriterionName
            Tooltip: =ThisItem.Description
            Width: =Parent.TemplateWidth
            X: =0
            Y: =0
      - conCatRowEdit:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            Height: =34
            Width: =44
            X: =Parent.TemplateWidth - 120
            Y: =Parent.TemplateHeight / 2 - 17
          Children:
                  - imgCatRowEdit:
                      Control: Image@2.2.3
                      Properties:
                        Height: =18
                        Image: |-
                          =If(ThisItem.State.Value = "Draft",
                            "data:image/svg+xml," &
                              EncodeUrl(Substitute(gblNavIcons.DocumentEdit,
                                "currentColor", "#246FAE")),
                            "data:image/svg+xml," &
                              EncodeUrl(Substitute(gblNavIcons.Eye,
                                "currentColor", "#5D6B7D")))
                        Width: =18
                        X: =Parent.Width / 2 - 9
                        Y: =Parent.Height / 2 - 9
                  - btnCatRowEdit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =3
                        Height: =Parent.Height
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.06)
                        OnSelect: |-
                          =UpdateContext({ locCrit: ThisItem, locCatModal: true });
                          Reset(txtCatName); Reset(txtCatDesc);
                          Reset(txtAnchor0); Reset(txtExample0);
                          Reset(txtAnchor1); Reset(txtExample1);
                          Reset(txtAnchor3); Reset(txtExample3);
                          Reset(txtAnchor5); Reset(txtExample5)
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0.12)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Text: |-
                          =If(ThisItem.State.Value = "Draft",
                             "Edit criterion", "View criterion")
                        Tooltip: |-
                          =If(ThisItem.State.Value = "Draft",
                             "Edit criterion",
                             "View criterion — published criteria cannot be edited")
                        Width: =Parent.Width
                        X: =0
                        Y: =0
      - conCatRowRetire:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            Height: =34
            Width: =44
            X: =Parent.TemplateWidth - 72
            Y: =Parent.TemplateHeight / 2 - 17
          Children:
                  - imgCatRowRetire:
                      Control: Image@2.2.3
                      Properties:
                        Height: =18
                        Image: |-
                          =If(ThisItem.State.Value = "Retired",
                            "data:image/svg+xml," &
                              EncodeUrl(Substitute(gblNavIcons.ArchiveArrowBack,
                                "currentColor", "#047857")),
                            "data:image/svg+xml," &
                              EncodeUrl(Substitute(gblNavIcons.Archive,
                                "currentColor", "#B45309")))
                        Visible: =ThisItem.State.Value <> "Draft"
                        Width: =18
                        X: =Parent.Width / 2 - 9
                        Y: =Parent.Height / 2 - 9
                  - btnCatRowRetire:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =3
                        Height: =Parent.Height
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.06)
                        OnSelect: |-
                          =If(ThisItem.State.Value = "Retired",
                            Patch(CRITERION_CATALOG,
                              LookUp(CRITERION_CATALOG, ID = ThisItem.ID),
                              { State: { Value: "Published" } }),
                            UpdateContext({ locRetireCrit: ThisItem, locConfirmCat: true }));
                          If(ThisItem.State.Value = "Retired",
                             ClearCollect(colCrit, CRITERION_CATALOG))
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0.12)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Text: |-
                          =If(ThisItem.State.Value = "Retired",
                             "Restore criterion", "Retire criterion")
                        Tooltip: |-
                          =If(ThisItem.State.Value = "Retired",
                             "Restore criterion", "Retire criterion")
                        Visible: =ThisItem.State.Value <> "Draft"
                        Width: =Parent.Width
                        X: =0
                        Y: =0
      - recCatRowLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

- lblCatEmpty:
