# Scoring Rubrics Screen — US9 (RQ082–092, RQ117–118, FR-042–045, research R3) — ADMIN
# Rebuilt 2026-07-28 against the per-PROGRAM model. Classic controls only.
# Colours = ColorPalette.*, sizes = Typography.*
#
# Composition (Constitution VIII):
#   · PowerLibs `gallery-filter-header` — version strip and both criterion lists
#   · PowerLibs `warning-modal-v2-1`    — FR-042 / FR-045 refusals
#
# ---------------------------------------------------------------------------
# THE MODEL — a rubric belongs to a PROGRAM, not to a cycle
# ---------------------------------------------------------------------------
# A rubric is defined once for a program and reused across every cycle until DTD
# publishes a replacement. Versions are rows. At most ONE version per program
# is Published — that is the rubric in use, and publishing a new one moves the
# old to Superseded.
#
# COMMITTEE SCORING IS BLOCKED until a program has a Published rubric. The
# status band says so, on the program, rather than letting it be discovered
# later at scoring time.
#
# ---------------------------------------------------------------------------
# DRAFTS ARE EDITABLE; PUBLISHED VERSIONS ARE NOT
# ---------------------------------------------------------------------------
# A refinement of R3, which was written when a rubric was edited directly and
# every save had to insert a row to preserve history. With an explicit Draft
# state there is nothing to preserve until publication: a Draft has never
# scored anyone. So a Draft is edited in place and only publication freezes it.
#
# The alternative — a new row per save — produces a version trail of keystrokes
# rather than of decisions, which is the opposite of what R3 wanted.
#
# At most one Draft per program at a time. btnRSNewVersion is disabled while
# one exists; finish or delete it first.
#
# ---------------------------------------------------------------------------
# THE WORKING SET
# ---------------------------------------------------------------------------
# colSheetCrit holds the criteria being assembled. Selecting a version loads it;
# New version seeds it from the current Published rubric, so the common case is
# "last year's rubric with one change". Add/Remove/reorder touch only the
# collection — nothing reaches SharePoint until Save.
#
# Save REPLACES the version's RATING_CRITERIA rows (RemoveIf then re-insert)
# rather than diffing them. A rubric has a handful of criteria and the rows carry
# no data of their own beyond DisplayOrder, so a diff would be more code and
# more failure modes for no gain.
#
# ---------------------------------------------------------------------------
# READ FROM COLLECTIONS, WRITE TO SHAREPOINT
# ---------------------------------------------------------------------------
# Same pattern as the Competencies and Criterion Catalog screens. Writes target
# the list and re-ClearCollect after; Patch re-fetches the source record with
# LookUp(SOURCE, ID = ...) because a collected row is a copy.
#
# Bounded-list exception (Constitution III): programs, catalogue and rubrics are
# all curated sets. Do NOT copy this to APPLICATIONS.
# ===========================================================================

- lblRSTitle:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHeading
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =30
      Size: =Typography.SizeHeading
      Text: ="Scoring Rubrics"
      Width: =400
      X: =24
      Y: =18

# Single-column text table: a Classic/DropDown renders that shape without its
# Value property, which YAML cannot set (PA2108).
- drpRSProgram:
    Control: Classic/DropDown@2.3.1
    Properties:
      BorderColor: =ColorPalette.Gray300
      Color: =ColorPalette.TextBody
      Fill: =ColorPalette.White
      Font: =Typography.Family
      Height: =32
      # Default must name the SAME program OnVisible seeds into locProgram, or
      # the dropdown shows one program while the page describes another. A
      # Classic/DropDown with no Default silently selects its first item, which
      # is exactly how that mismatch happened.
      Default: |-
        =First(Sort(Filter(colPrograms, State.Value = "Active"), ProgramName)).ProgramName
      Items: |-
        =ForAll(Sort(Filter(colPrograms, State.Value = "Active"), ProgramName),
          ProgramName)
      # Changing program lands on that program's rubric in use, the same as
      # arriving on the screen does. Sequential UpdateContexts because the
      # second reads locProgram set by the first.
      OnChange: |-
        =UpdateContext({
          locProgram: LookUp(colPrograms, ProgramName = drpRSProgram.Selected.Value),
          locNewDraft: false,
          locDirty: false
        });
        UpdateContext({
          locVersion:
            First(SortByColumns(
              Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Published"),
              "SheetVersion", SortOrder.Descending))
        });
        ClearCollect(colSheetCrit,
          ForAll(
            Filter(colRatingCrit, RatingSheetID.Id = locVersion.ID) As rc,
            {
              CritID: rc.CatalogCriterionID.Id,
              CritName: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).CriterionName,
              CritEnd: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).EndDate,
              SortOrder: rc.DisplayOrder
            }))
      Size: =Typography.SizeBody
      TabIndex: =1
      Width: =400
      X: =24
      Y: =62

# The FR-042 precondition, stated on the program rather than discovered later.
- lblRSStatus:
    Control: Label@2.5.1
    Properties:
      Color: |-
        =If(IsBlank(locProgram), ColorPalette.TextHelp,
           If(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Published")),
              ColorPalette.WarningText, ColorPalette.SuccessText))
      Font: =Typography.Family
      FontWeight: =Typography.WeightMedium
      Height: =32
      PaddingLeft: =12
      Size: =Typography.SizeBody
      Text: |-
        =If(IsBlank(locProgram),
           "Choose a program to see its scoring rubrics.",
           If(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Published")),
              "No published rubric — committee scoring is blocked for this program.",
              "Published v" &
                First(Filter(colSheets, ProgramID.Id = locProgram.ID,
                  State.Value = "Published")).SheetVersion &
                " is in use."))
      # 440 = dropdown X (24) + its width (400) + a 16 gutter. The width then
      # runs to 16 short of btnRSNewVersion at Parent.Width - 174, so widening
      # the dropdown again means changing BOTH numbers or the two overlap.
      Width: =Parent.Width - 630
      X: =440
      Y: =62

- btnRSNewVersion:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Blue600
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =0
      Color: =ColorPalette.TextOnDark
      # One Draft at a time. A second would make "the draft" ambiguous and
      # give publish two candidates.
      DisplayMode: |-
        =If(
          Or(IsBlank(locProgram),
             Not(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                  State.Value = "Draft")))),
          DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =ColorPalette.Blue600
      FocusedBorderColor: =ColorPalette.FocusOnDark
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =32
      HoverFill: =ColorPalette.Blue700
      # Seeds from the rubric currently in use, so the common case is "last
      # year's rubric with one change" rather than starting from nothing.
      OnSelect: |-
        =UpdateContext({ locVersion: Blank(), locNewDraft: true, locDirty: true });
        ClearCollect(colSheetCrit,
          ForAll(
            Filter(colRatingCrit,
              RatingSheetID.Id =
                First(Filter(colSheets, ProgramID.Id = locProgram.ID,
                  State.Value = "Published")).ID) As rc,
            {
              CritID: rc.CatalogCriterionID.Id,
              CritName: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).CriterionName,
              CritEnd: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).EndDate,
              SortOrder: rc.DisplayOrder
            }))
      PressedFill: =ColorPalette.Blue700
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =Typography.SizeBody
      TabIndex: =2
      Text: ="New version"
      Tooltip: |-
        =If(IsBlank(locProgram), "Choose a program first",
           If(Not(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Draft"))),
              "Publish or delete the existing draft first",
              "Start a new version, seeded from the rubric in use"))
      Width: =150
      X: =Parent.Width - 174
      Y: =62

# ===========================================================================
# VERSION STRIP
# ===========================================================================
- lblRSVersionsHead:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =20
      Size: =Typography.SizeCaption
      Text: ="VERSIONS"
      Visible: =Not(IsBlank(locProgram))
      Width: =300
      X: =24
      Y: =108

- galRSVersions:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =104
      Items: |-
        =SortByColumns(
          Filter(colSheets, ProgramID.Id = locProgram.ID),
          "SheetVersion", SortOrder.Descending)
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =34
      Visible: =Not(IsBlank(locProgram))
      Width: =Parent.Width - 48
      X: =24
      Y: =130
    Children:
      - conRSVersionRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: |-
              =If(And(Not(IsBlank(locVersion)), ThisItem.ID = locVersion.ID),
                 ColorPalette.Blue50, ColorPalette.White)
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblRSVerNum:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =0.6
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: |-
                    ="v" & ThisItem.SheetVersion
            - lblRSVerState:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(ThisItem.State.Value,
                       "Published", ColorPalette.SuccessText,
                       "Draft", ColorPalette.Blue700,
                       ColorPalette.TextHelp)
                  FillPortions: =1.4
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: |-
                    =If(ThisItem.State.Value = "Published",
                       "Published — in use", ThisItem.State.Value)
            - lblRSVerCount:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  FillPortions: =1
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: |-
                    =CountRows(Filter(colRatingCrit,
                       RatingSheetID.Id = ThisItem.ID)) & " criteria"
            - lblRSVerWho:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  FillPortions: =2
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: |-
                    =ThisItem.CreatedBy & " · " &
                      Text(ThisItem.CreatedDate, "mm/dd/yyyy")
      - btnRSVerSelect:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0.04)
            # Loads this version's criteria into the working set. locDirty
            # resets: what is on screen now matches what is stored.
            OnSelect: |-
              =UpdateContext({
                locVersion: ThisItem, locNewDraft: false, locDirty: false
              });
              ClearCollect(colSheetCrit,
                ForAll(
                  Filter(colRatingCrit, RatingSheetID.Id = ThisItem.ID) As rc,
                  {
                    CritID: rc.CatalogCriterionID.Id,
                    CritName: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).CriterionName,
                    CritEnd: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).EndDate,
                    SortOrder: rc.DisplayOrder
                  }))
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.08)
            Text: |-
              ="Open version " & ThisItem.SheetVersion
            Width: =Parent.TemplateWidth
            X: =0
            Y: =0
      - recRSVerLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

- lblRSNoVersions:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =40
      Size: =Typography.SizeBody
      Text: ="No rubric yet for this program. Use New version to build the first one."
      Visible: |-
        =And(Not(IsBlank(locProgram)),
           IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID)))
      Width: =Parent.Width - 48
      X: =24
      Y: =150

# ===========================================================================
# ASSIGNMENT — two lists. This is the task, and it is the one place the
# table + detail pattern does not fit: moving items between two sets is not
# a record being inspected.
# ===========================================================================
- lblRSEditingWhat:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHeading
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =24
      Size: =Typography.SizeSubtitle
      Text: |-
        =If(locNewDraft,
           "New version — assign criteria",
           If(IsBlank(locVersion), "",
              If(locVersion.State.Value = "Draft",
                 "Editing draft v" & locVersion.SheetVersion,
                 "Viewing v" & locVersion.SheetVersion & " — published versions cannot be changed")))
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =Parent.Width - 48
      X: =24
      Y: =248

- lblRSPickPrompt:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =40
      Size: =Typography.SizeBody
      Text: ="Select a version above, or start a new one, to assign criteria."
      Visible: |-
        =And(Not(IsBlank(locProgram)), Not(locNewDraft), IsBlank(locVersion))
      Width: =Parent.Width - 48
      X: =24
      Y: =300

# ---------- left: published catalogue criteria ----------
- conRSAvailHead:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =32
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =24
      Y: =280
    Children:
      - lblRSAvailHeadName:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            FillPortions: =3
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Published criteria"
      - lblRSAvailHeadAct:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHeading
            FillPortions: =1
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Add"

- galRSAvailable:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =Parent.Height - 380
      # FR-048 — only Published criteria are selectable. Retired ones drop out
      # here automatically because this filters on Published, not on "not
      # retired".
      Items: |-
        =Sort(Filter(colCatalog, State.Value = "Published"), CriterionName)
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =44
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =24
      Y: =312
    Children:
      - conRSAvailRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblRSAvailName:
                Control: Label@2.5.1
                Properties:
                  # Already-added criteria stay listed but muted — hiding them
                  # would make the list jump as items are moved.
                  Color: |-
                    =If(IsBlank(LookUp(colSheetCrit, CritID = ThisItem.ID)),
                       ColorPalette.TextHeading, ColorPalette.TextMuted)
                  FillPortions: =3
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: =ThisItem.CriterionName
            - btnRSAdd:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.Blue600
                  # Nothing to add to a published version, and nothing to add
                  # twice.
                  DisplayMode: |-
                    =If(
                      Or(Not(IsBlank(LookUp(colSheetCrit, CritID = ThisItem.ID))),
                         And(Not(locNewDraft), Not(IsBlank(locVersion)),
                             locVersion.State.Value <> "Draft")),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  # Disabled state styled explicitly. Power Apps otherwise
                  # paints its own grey DisabledFill, which reads as a filled
                  # chip sitting in a borderless row — the awkwardness. The
                  # background stays transparent and only the LABEL changes,
                  # so "Added" is a state, not a control demanding attention.
                  #
                  # TextHelp, not TextMuted: theme.md assigns TextHelp to
                  # help and disabled labels, and TextMuted to decorative
                  # placeholders only. "Added" is meaningful text.
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =ColorPalette.TextHelp
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Collect(colSheetCrit,
                      {
                        CritID: ThisItem.ID,
                        CritName: ThisItem.CriterionName,
                        CritEnd: ThisItem.EndDate,
                        SortOrder: CountRows(colSheetCrit) + 1
                      });
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeCaption
                  Text: |-
                    =If(IsBlank(LookUp(colSheetCrit, CritID = ThisItem.ID)),
                       "Add", "Added")
      - recRSAvailLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

# ---------- right: criteria on this sheet ----------
- conRSOnSheetHead:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =32
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =Parent.Width / 2 + 8
      Y: =280
    Children:
      - lblRSOnSheetHeadName:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            FillPortions: =3
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: |-
              ="On this rubric (" & CountRows(colSheetCrit) & ")"
      - lblRSOnSheetHeadAct:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHeading
            FillPortions: =1.6
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Order / remove"

- galRSOnSheet:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =Parent.Height - 380
      Items: =SortByColumns(colSheetCrit, "SortOrder", SortOrder.Ascending)
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =44
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =Parent.Width / 2 + 8
      Y: =312
    Children:
      - conRSOnSheetRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblRSOnSheetName:
                Control: Label@2.5.1
                Properties:
                  # FR-045 / RQ117 — a criterion whose end date has passed is
                  # flagged here, because it blocks publishing.
                  Color: |-
                    =If(And(Not(IsBlank(ThisItem.CritEnd)),
                            ThisItem.CritEnd < Today()),
                       ColorPalette.DangerText, ColorPalette.TextHeading)
                  FillPortions: =3
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: |-
                    =ThisItem.SortOrder & ".  " & ThisItem.CritName &
                      If(And(Not(IsBlank(ThisItem.CritEnd)),
                             ThisItem.CritEnd < Today()),
                         "  (expired)", "")
            - btnRSUp:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.TextBody
                  DisplayMode: |-
                    =If(
                      Or(ThisItem.SortOrder <= 1,
                         And(Not(locNewDraft), Not(IsBlank(locVersion)),
                             locVersion.State.Value <> "Draft")),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.5
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  # Swap with the row above: give that row this SortOrder, then
                  # take its own. Two Patches, no renumbering pass.
                  OnSelect: |-
                    =Patch(colSheetCrit,
                      LookUp(colSheetCrit, SortOrder = ThisItem.SortOrder - 1),
                      { SortOrder: ThisItem.SortOrder });
                    Patch(colSheetCrit,
                      LookUp(colSheetCrit, CritID = ThisItem.CritID),
                      { SortOrder: ThisItem.SortOrder - 1 });
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeBody
                  Text: ="▲"
                  Tooltip: ="Move up"
            - btnRSDown:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.TextBody
                  DisplayMode: |-
                    =If(
                      Or(ThisItem.SortOrder >= CountRows(colSheetCrit),
                         And(Not(locNewDraft), Not(IsBlank(locVersion)),
                             locVersion.State.Value <> "Draft")),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.5
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Patch(colSheetCrit,
                      LookUp(colSheetCrit, SortOrder = ThisItem.SortOrder + 1),
                      { SortOrder: ThisItem.SortOrder });
                    Patch(colSheetCrit,
                      LookUp(colSheetCrit, CritID = ThisItem.CritID),
                      { SortOrder: ThisItem.SortOrder + 1 });
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeBody
                  Text: ="▼"
                  Tooltip: ="Move down"
            - btnRSRemove:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.WarningText
                  DisplayMode: |-
                    =If(
                      And(Not(locNewDraft), Not(IsBlank(locVersion)),
                          locVersion.State.Value <> "Draft"),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.6
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  # Renumber after removing, or the gap breaks the up/down swap
                  # above, which finds its neighbour by SortOrder.
                  OnSelect: |-
                    =Remove(colSheetCrit,
                      LookUp(colSheetCrit, CritID = ThisItem.CritID));
                    ClearCollect(colSheetCrit,
                      ForAll(
                        Sequence(CountRows(colSheetCrit)) As n,
                        Patch(
                          Last(FirstN(SortByColumns(colSheetCrit, "SortOrder",
                            SortOrder.Ascending), n.Value)),
                          { SortOrder: n.Value })));
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeCaption
                  Text: ="Remove"
      - recRSOnSheetLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

