# Discard (nothing saved yet) or Delete (a stored Draft). One button, because
# from the user's side it is the same intent — abandon this draft — and the
# difference is only whether a row exists to remove.
- btnRSDeleteDraft:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Gray300
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =ColorPalette.WarningText
      Fill: =ColorPalette.White
      FocusedBorderColor: =ColorPalette.FocusOnLight
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =38
      HoverFill: =ColorPalette.Gray50
      # Flat, not If(cond, A; B, C) — semicolon chains inside an If branch
      # parse inconsistently. An unsaved draft is cleared outright; a stored
      # one raises the confirm, because that write cannot be undone.
      OnSelect: |-
        =UpdateContext({ locConfirmDel: Not(locNewDraft) });
        If(locNewDraft, Clear(colSheetCrit));
        If(locNewDraft,
          UpdateContext({ locNewDraft: false, locDirty: false, locVersion: Blank() }))
      PressedFill: =ColorPalette.White
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      TabIndex: =3
      Text: |-
        =If(locNewDraft, "Discard", "Delete draft")
      # ONLY ever a Draft. A Published or Superseded version may be referenced
      # by COMMITTEE_SCORES, and deleting one would strand those scores against
      # a rubric that no longer exists.
      Visible: |-
        =Or(locNewDraft,
           And(Not(IsBlank(locVersion)), locVersion.State.Value = "Draft"))
      Width: =130
      X: =Parent.Width - 448
      Y: =Parent.Height - 54

- btnRSSave:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Blue600
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =0
      Color: =ColorPalette.TextOnDark
      Fill: =ColorPalette.Blue600
      FocusedBorderColor: =ColorPalette.FocusOnDark
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =38
      HoverFill: =ColorPalette.Blue700
      # FR-042 is checked here rather than by disabling the button, so the
      # refusal can explain itself.
      #
      # Three sequential UpdateContexts, not If(cond, A; B, C) — semicolon
      # chains inside an If branch parse inconsistently.
      OnSelect: |-
        =UpdateContext({
          locWarnTitle: If(CountRows(colSheetCrit) = 0,
                           "A rubric needs at least one criterion", ""),
          locWarnMsg: If(CountRows(colSheetCrit) = 0,
                         "Add at least one criterion from the left before saving this version.",
                         "")
        });
        UpdateContext({ locWarn: locWarnMsg <> "" });
        If(Not(locWarn),
          UpdateContext({
            locSavedSheet:
              If(locNewDraft,
                 Patch(RATING_SHEETS, Defaults(RATING_SHEETS),
                   {
                     ProgramID: {
                       '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                       Id: locProgram.ID,
                       Value: locProgram.ProgramName
                     },
                     SheetVersion:
                       Coalesce(Max(Filter(colSheets, ProgramID.Id = locProgram.ID),
                         SheetVersion), 0) + 1,
                     State: { Value: "Draft" },
                     CreatedBy: User().FullName,
                     CreatedDate: Today()
                   }),
                 LookUp(RATING_SHEETS, ID = locVersion.ID))
          }));
        If(Not(locWarn),
          RemoveIf(RATING_CRITERIA, RatingSheetID.Id = locSavedSheet.ID));
        If(Not(locWarn),
          ForAll(SortByColumns(colSheetCrit, "SortOrder", SortOrder.Ascending) As c,
            Patch(RATING_CRITERIA, Defaults(RATING_CRITERIA),
              {
                RatingSheetID: {
                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                  Id: locSavedSheet.ID,
                  Value: locSavedSheet.ID
                },
                CatalogCriterionID: {
                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                  Id: c.CritID,
                  Value: c.CritName
                },
                DisplayOrder: c.SortOrder
              })));
        If(Not(locWarn),
          ClearCollect(colSheets, RATING_SHEETS);
          ClearCollect(colRatingCrit, RATING_CRITERIA));
        If(Not(locWarn),
          UpdateContext({
            locVersion: locSavedSheet, locNewDraft: false, locDirty: false
          }));
        If(Not(locWarn), Notify("Draft saved.", NotificationType.Success))
      PressedFill: =ColorPalette.Blue700
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      TabIndex: =4
      Text: ="Save draft"
      Visible: |-
        =Or(locNewDraft,
           And(Not(IsBlank(locVersion)), locVersion.State.Value = "Draft"))
      Width: =130
      X: =Parent.Width - 306
      Y: =Parent.Height - 54

- btnRSPublish:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.SuccessText
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =ColorPalette.SuccessText
      Fill: =ColorPalette.White
      FocusedBorderColor: =ColorPalette.FocusOnLight
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =38
      HoverFill: =ColorPalette.Gray50
      # Validates, then ASKS. Publishing is the point of no return on this
      # screen — it locks the version against further edits and opens it to
      # committee scoring — so the refusals (FR-042, FR-045) are checked first
      # and the confirm only appears when the version could actually go out.
      #
      # Asking before validating would be worse: a confirm dialog followed by a
      # refusal reads as the app changing its mind.
      OnSelect: |-
        =UpdateContext({
          locWarnTitle: If(
            CountRows(colSheetCrit) = 0,
            "A rubric needs at least one criterion",
            Not(IsEmpty(Filter(colSheetCrit,
              And(Not(IsBlank(CritEnd)), CritEnd < Today())))),
            "This rubric uses an expired criterion",
            locDirty, "Save the draft first",
            ""),
          locWarnMsg: If(
            CountRows(colSheetCrit) = 0,
            "Add at least one criterion before publishing this version.",
            Not(IsEmpty(Filter(colSheetCrit,
              And(Not(IsBlank(CritEnd)), CritEnd < Today())))),
            First(Filter(colSheetCrit,
              And(Not(IsBlank(CritEnd)), CritEnd < Today()))).CritName &
              " passed its end date and cannot be scored against. Remove it, then publish.",
            locDirty,
            "There are unsaved changes. Save the draft, then publish it.",
            "")
        });
        UpdateContext({ locWarn: locWarnMsg <> "" });
        UpdateContext({ locConfirmPub: Not(locWarn) })
      PressedFill: =ColorPalette.White
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      TabIndex: =5
      Text: ="Publish"
      Visible: |-
        =And(Not(locNewDraft), Not(IsBlank(locVersion)),
           locVersion.State.Value = "Draft")
      Width: =130
      X: =Parent.Width - 164
      Y: =Parent.Height - 54

