- conRSDelConfirm:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Bold
      Fill: =ColorPalette.White
      Height: =260
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: =locConfirmDel
      Width: =520
      X: =Parent.Width / 2 - Self.Width / 2
      Y: =Parent.Height / 2 - Self.Height / 2
    Children:
      - shpRSDelHalo:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.DangerLight
            Height: =56
            Width: =56
            X: =Parent.Width / 2 - 28
            Y: =24
      - icoRSDelWarn:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.DangerText
            Height: =30
            Icon: =Icon.Warning
            Width: =30
            X: =Parent.Width / 2 - 15
            Y: =37
      - lblRSDelTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =26
            Size: =Typography.SizeHeading
            Text: ="Delete this draft?"
            Width: =Parent.Width - 48
            X: =24
            Y: =92
      # Says "cannot be undone" because it genuinely cannot. Retiring elsewhere
      # in this app is reversible; this is a Remove.
      - lblRSDelBody:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =64
            Size: =Typography.SizeBody
            Text: |-
              ="Draft v" & locVersion.SheetVersion & " and its " &
                CountRows(colSheetCrit) &
                " assigned criteria will be deleted. This cannot be undone. The published rubric in use is not affected."
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 64
            X: =32
            Y: =122
      - btnRSDelConfirm:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Blue700
            # Children FIRST. Removing the sheet row first would leave the
            # RATING_CRITERIA rows with a lookup pointing at nothing, and the
            # RemoveIf that would have cleaned them up can no longer find them.
            OnSelect: |-
              =RemoveIf(RATING_CRITERIA, RatingSheetID.Id = locVersion.ID);
              Remove(RATING_SHEETS, LookUp(RATING_SHEETS, ID = locVersion.ID));
              ClearCollect(colSheets, RATING_SHEETS);
              ClearCollect(colRatingCrit, RATING_CRITERIA);
              Clear(colSheetCrit);
              UpdateContext({
                locConfirmDel: false, locVersion: Blank(),
                locNewDraft: false, locDirty: false
              });
              Notify("Draft deleted.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =7
            Text: ="Delete"
            Width: =120
            X: =Parent.Width / 2 - 130
            Y: =Parent.Height - 60
