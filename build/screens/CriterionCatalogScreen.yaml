            Font: =Typography.Family
            Height: =16
            Size: =Typography.SizeCaption
            Text: ="Anchor descriptor (required)"
            Width: =txtAnchorText0.Width
            X: =txtAnchorText0.X
            Y: =312
      - lblAnchorExampleHeader:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =16
            Size: =Typography.SizeCaption
            Text: ="Illustrative example (optional, RQ111)"
            Width: =txtAnchorExample0.Width
            X: =txtAnchorExample0.X
            Y: =312

