              =If(locIsNewCriterion, "New Criterion", "Criterion " & locCriterion.CriterionCode)
            Width: =Parent.Width - 48
            X: =24
            Y: =16

      # RQ114 — the banner IS the derivation of locIsPublished used by every
      # DisplayMode below. A published criterion is frozen; a change is a new one.
      - lblPublishedBanner:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="Published — this criterion can no longer be changed. Create a new criterion instead."
            Visible: |-
              =And(Not(locIsNewCriterion), locCriterion.State.Value = "Published")
            Width: =Parent.Width - 48
            X: =24
            Y: =46

      # --- Code / Name ---
      - lblCritCodeLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeLabel
            Text: ="Code (required)"
            Width: =180
            X: =24
            Y: =70
      - txtCriterionCode:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "", locCriterion.CriterionCode)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =32
            HintText: ="e.g., C01"
            Size: =Typography.SizeBody
            Width: =180
            X: =24
            Y: =92
      - lblCritNameLabel:
