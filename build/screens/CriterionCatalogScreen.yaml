# Criterion Catalog Screen — US8 (RQ109–116, FR-046–048)
# Classic controls only (Constitution II). Colours = ColorPalette.*, fonts/sizes = Typography.*
# (both Set in App.OnStart per build/theme/theme.md).
#
# ---------------------------------------------------------------------------
# HOW TO TRANSCRIBE (Constitution IV)
# ---------------------------------------------------------------------------
#   1. New screen → Blank. Rename it "Criterion Catalog Screen".
#   2. Set these screen properties by hand:
#        Fill:      =ColorPalette.Gray50
#        OnVisible: =UpdateContext({
#                     locCriterion: Blank(),
#                     locIsNewCriterion: true
#                   })
#   3. Select the screen and paste everything below.
#   4. Data sources needed: CRITERION_CATALOG, CRITERION_ANCHORS.
#   5. Preview (F5) to judge it — OnVisible does not run on the design surface,
#      so locCriterion stays blank in the editor.
#
# ---------------------------------------------------------------------------
# HOW THE FOUR ANCHORS ARE MODELLED
# ---------------------------------------------------------------------------
# CRITERION_ANCHORS holds FOUR ROWS per criterion (Score 0, 1, 3, 5). They are
# rendered as four FIXED blocks, not a gallery — that is what enforces RQ110
# ("the same four anchors for every criterion, no criterion-specific scale").
# A gallery would imply the set is editable. Each block loads its row by
# (CatalogCriterionID, Score) and btnSaveCriterion writes all four back.
#
# ---------------------------------------------------------------------------
# IMMUTABILITY (RQ114 / FR-047)
# ---------------------------------------------------------------------------
# Published is a one-way door. Every input below sets
#   DisplayMode: =If(locIsPublished, DisplayMode.Disabled, DisplayMode.Edit)
# where locIsPublished is derived, not stored — see lblPublishedBanner. This is
# a UI guard only; SharePoint itself will still accept a write, so the same rule
# has to hold anywhere else that touches CRITERION_CATALOG.

# ---------- Header ----------
- conHeaderCC:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Navy900
      Height: =64
      Width: =Parent.Width
      X: =0
      Y: =0
    Children:
      - lblCatalogTitle:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextOnDark
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =32
            Size: =Typography.SizeTitle
            Text: ="Criterion Catalog"
            Width: =Parent.Width - 48
            X: =24
            Y: =Parent.Height / 2 - Self.Height / 2

# ---------- Left: catalog list ----------
- conListCC:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =Parent.Height - 112
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =340
      X: =24
      Y: =88
    Children:
      - btnNewCriterion:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextOnDark
            Fill: =ColorPalette.Blue600
            Font: =Typography.Family
            Height: =36
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({ locCriterion: Blank(), locIsNewCriterion: true })
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            Text: ="+ New Criterion"
            Width: =Parent.Width - 32
            X: =16
            Y: =16
      - galCriteria:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =Parent.Height - 68
            # State is indexed (Constitution III). Sorted by code, the stable identifier.
            Items: =Sort(CRITERION_CATALOG, CriterionCode)
            TemplatePadding: =0
            TemplateSize: =64
            Width: =Parent.Width - 32
            X: =16
            Y: =60
          Children:
            - lblCritItemName:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeBody
                  Text: |-
                    =ThisItem.CriterionCode & " — " & ThisItem.CriterionName
                  Width: =Parent.TemplateWidth - 24
                  X: =12
                  Y: =9
            - lblCritItemState:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.State.Value = "Published",
                       ColorPalette.SuccessText, ColorPalette.TextHelp)
                  Font: =Typography.Family
                  Height: =18
                  Size: =Typography.SizeCaption
                  Text: =ThisItem.State.Value
                  Width: =120
                  X: =12
                  Y: =33
            # RQ115 — a passed end date retires a criterion from selection (RQ116).
            # Surfaced in the list so DTD can see it without opening each one.
            - lblCritItemRetired:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorPalette.WarningText
                  Font: =Typography.Family
                  Height: =18
                  Size: =Typography.SizeCaption
                  Text: ="end date passed"
                  Visible: |-
                    =And(Not(IsBlank(ThisItem.EndDate)), ThisItem.EndDate < Today())
                  Width: =140
                  X: =Parent.TemplateWidth - 152
                  Y: =33
            - btnCritItemSelect:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =ColorPalette.Blue50
                  OnSelect: |-
                    =UpdateContext({ locCriterion: ThisItem, locIsNewCriterion: false })
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =ColorPalette.Blue50
                  Text: |-
                    ="Open criterion " & ThisItem.CriterionCode
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0

# ---------- Right: criterion + four-anchor editor ----------
- conFormCC:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =Parent.Height - 112
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =Parent.Width - 404
      X: =380
      Y: =88
    Children:
      - lblCritFormTitle:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =28
            Size: =Typography.SizeHeading
