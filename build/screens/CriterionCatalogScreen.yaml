            HintText: ="Full description of what is being assessed"
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =Parent.Width - 48
            X: =24
            Y: =156

      # --- Availability window (RQ115) ---
      # StartDate is set on publish (CRITERION_CATALOG.md). A NULL EndDate means
      # "still available", which a DatePicker cannot express — hence the toggle.
      - lblStartLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeLabel
            Text: ="Start date"
            Width: =180
            X: =24
            Y: =218
      - dtpStartDate:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            DefaultDate: |-
              =If(locIsNewCriterion, Today(), Coalesce(locCriterion.StartDate, Today()))
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Font: =Typography.Family
            Height: =32
            Width: =180
            X: =24
            Y: =240
      - lblEndLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeLabel
            Text: ="End date"
            Width: =180
            X: =220
            Y: =218
      - dtpEndDate:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            DefaultDate: |-
              =If(locIsNewCriterion, Today(), Coalesce(locCriterion.EndDate, Today()))
            DisplayMode: |-
              =If(
                Or(
                  tglStillAvailable.Value,
                  And(Not(locIsNewCriterion), locCriterion.State.Value = "Published")
                ),
                DisplayMode.Disabled, DisplayMode.Edit
              )
            Font: =Typography.Family
            Height: =32
            Width: =180
            X: =220
            Y: =240
      - tglStillAvailable:
          Control: Classic/Toggle@2.1.0
          Properties:
            Default: |-
              =If(locIsNewCriterion, true, IsBlank(locCriterion.EndDate))
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Height: =32
            Width: =60
            X: =416
            Y: =240
      - lblStillAvailableLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeCaption
            Text: ="No end date — still available for selection"
            Width: =300
            X: =484
            Y: =246

      # --- The four fixed anchors (RQ110) ---
      - lblAnchorsHeader:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
