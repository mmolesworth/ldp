            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 0)).AnchorText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =(Parent.Width - 120) / 2
            X: =64
            Y: =332
      - txtAnchorExample0:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 0)).ExampleText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =txtAnchorText0.Width
            X: =txtAnchorText0.X + txtAnchorText0.Width + 16
            Y: =332

      # ----- anchor 1 -----
      - lblAnchorScore1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =44
            Size: =Typography.SizeBody
            Text: ="1"
            Width: =32
            X: =24
            Y: =384
      - txtAnchorText1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 1)).AnchorText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =txtAnchorText0.Width
            X: =64
            Y: =384
      - txtAnchorExample1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 1)).ExampleText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =txtAnchorText0.Width
            X: =txtAnchorExample0.X
            Y: =384

      # ----- anchor 3 (note the scale skips 2 — RQ110) -----
      - lblAnchorScore3:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =44
            Size: =Typography.SizeBody
            Text: ="3"
            Width: =32
            X: =24
            Y: =436
      - txtAnchorText3:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 3)).AnchorText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =txtAnchorText0.Width
            X: =64
            Y: =436
      - txtAnchorExample3:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 3)).ExampleText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =txtAnchorText0.Width
            X: =txtAnchorExample0.X
            Y: =436

      # ----- anchor 5 -----
      - lblAnchorScore5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =44
            Size: =Typography.SizeBody
            Text: ="5"
            Width: =32
            X: =24
            Y: =488
      - txtAnchorText5:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 5)).AnchorText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =txtAnchorText0.Width
            X: =64
            Y: =488
      - txtAnchorExample5:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(locIsNewCriterion, "",
                 LookUp(CRITERION_ANCHORS,
                   And(CatalogCriterionID.Id = locCriterion.ID, Score = 5)).ExampleText)
            DisplayMode: |-
              =If(And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =44
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            Width: =txtAnchorText0.Width
            X: =txtAnchorExample0.X
            Y: =488

      # --- Validation + actions ---
      - lblCritValidation:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.DangerText
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeCaption
            Text: ="Code, name, and description are required before this criterion can be saved."
            Visible: |-
              =Or(
                IsBlank(Trim(txtCriterionCode.Text)),
                IsBlank(Trim(txtCriterionName.Text)),
                IsBlank(Trim(txtCriterionDescription.Text))
              )
            Width: =Parent.Width - 48
            X: =24
            Y: =540

      # Writes the criterion row, then all four anchor rows. Anchors are matched on
      # (CatalogCriterionID, Score) so a re-save updates in place rather than
      # appending a fifth row — FR-046 requires exactly four.
      - btnSaveCriterion:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(
                Or(
                  And(Not(locIsNewCriterion), locCriterion.State.Value = "Published"),
                  IsBlank(Trim(txtCriterionCode.Text)),
                  IsBlank(Trim(txtCriterionName.Text)),
                  IsBlank(Trim(txtCriterionDescription.Text))
                ),
                DisplayMode.Disabled, DisplayMode.Edit
              )
            Fill: =ColorPalette.Blue600
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({
                locSaved: Patch(
                  CRITERION_CATALOG,
                  If(IsBlank(locCriterion), Defaults(CRITERION_CATALOG), locCriterion),
                  {
                    CriterionCode: txtCriterionCode.Text,
                    CriterionName: txtCriterionName.Text,
                    Description: txtCriterionDescription.Text,
                    State: If(IsBlank(locCriterion), { Value: "Draft" }, locCriterion.State),
                    StartDate: dtpStartDate.SelectedDate,
                    EndDate: If(tglStillAvailable.Value, Blank(), dtpEndDate.SelectedDate)
                  }
                )
              });
              If(
                IsBlank(locSaved.ID),
                Notify("The criterion could not be saved, so no anchors were written.", NotificationType.Error),
                ForAll(
                  Table(
                    { Sc: 0, Txt: txtAnchorText0.Text, Ex: txtAnchorExample0.Text },
                    { Sc: 1, Txt: txtAnchorText1.Text, Ex: txtAnchorExample1.Text },
                    { Sc: 3, Txt: txtAnchorText3.Text, Ex: txtAnchorExample3.Text },
                    { Sc: 5, Txt: txtAnchorText5.Text, Ex: txtAnchorExample5.Text }
                  ) As a,
                  Patch(CRITERION_ANCHORS,
                    If(IsBlank(LookUp(CRITERION_ANCHORS, And(CatalogCriterionID.Id = locSaved.ID, Score = a.Sc))),
                       Defaults(CRITERION_ANCHORS),
                       LookUp(CRITERION_ANCHORS, And(CatalogCriterionID.Id = locSaved.ID, Score = a.Sc))),
                    {
                      CatalogCriterionID: {
                        '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                        Id: locSaved.ID,
                        Value: locSaved.CriterionCode
                      },
                      Score: a.Sc,
                      AnchorText: a.Txt,
                      ExampleText: a.Ex
                    }
                  )
                );
                UpdateContext({ locCriterion: locSaved, locIsNewCriterion: false });
                Notify("Criterion saved as Draft.", NotificationType.Success)
              )
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            Text: ="Save Draft"
            Width: =150
            X: =24
            Y: =570

      # FR-046 — no publish unless all four anchors carry text. Checked against the
      # inputs, not the stored rows: the user may have typed a fourth anchor and not
      # yet saved, and CountRows over CRITERION_ANCHORS would not delegate anyway.
      - btnPublishCriterion:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(
                Or(
                  locIsNewCriterion,
                  locCriterion.State.Value = "Published"
                ),
                DisplayMode.Disabled, DisplayMode.Edit
              )
            Fill: =ColorPalette.SuccessText
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.SuccessText
            OnSelect: |-
              =If(
                Or(
                  IsBlank(Trim(txtAnchorText0.Text)),
                  IsBlank(Trim(txtAnchorText1.Text)),
                  IsBlank(Trim(txtAnchorText3.Text)),
                  IsBlank(Trim(txtAnchorText5.Text))
                ),
                Notify(
                  "All four anchors (0, 1, 3 and 5) need a descriptor before this criterion can be published.",
                  NotificationType.Error
                ),
                Patch(CRITERION_CATALOG, locCriterion,
                  {
                    State: { Value: "Published" },
                    StartDate: Coalesce(locCriterion.StartDate, Today())
                  }
                );
                UpdateContext({ locCriterion: LookUp(CRITERION_CATALOG, ID = locCriterion.ID) });
                Notify("Criterion published and is now locked against further change.", NotificationType.Success)
              )
            PressedFill: =ColorPalette.SuccessText
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            Text: ="Publish"
            Width: =150
            X: =190
            Y: =570
      - lblPublishHint:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="Save the draft before publishing. Publishing is permanent."
            Visible: =Not(locIsNewCriterion)
            Width: =Parent.Width - 400
            X: =356
            Y: =580
