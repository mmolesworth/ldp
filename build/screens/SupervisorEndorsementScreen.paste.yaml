- conQueueSE:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: |-
        =If(locQueueOpen,
            64 + Min(4, CountRows(colSupAppsSE)) * 64,
            48)
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: =CountRows(colSupAppsSE) > 0
      Width: =Parent.Width - 48
      X: =24
      Y: =72
    Children:
      - lblQueueHeaderSE:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =48
            PaddingLeft: =20
            Size: =Typography.SizeLabel
            Text: |-
              ="Your review queue" &
                If(Not(IsBlank(locApp)),
                   "  •  " & CountRows(colSupAppsSE) & " assigned", "")
            VerticalAlign: =VerticalAlign.Middle
            Width: =Parent.Width - 60
            X: =0
            Y: =0
      - icoQueueChevronSE:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =ColorPalette.TextHelp
            Height: =20
            Icon: =If(locQueueOpen, Icon.ChevronUp, Icon.ChevronDown)
            Width: =20
            X: =Parent.Width - 40
            Y: =lblQueueHeaderSE.Y + (lblQueueHeaderSE.Height - Self.Height) / 2
      - btnQueueToggleSE:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =48
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0.03)
            OnSelect: |-
              =UpdateContext({ locQueueOpen: Not(locQueueOpen) })
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.06)
            Size: =Typography.SizeLabel
            Text: ="Toggle review queue"
            Width: =Parent.Width
            X: =0
            Y: =0
      - recQueueDividerSE:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Visible: =locQueueOpen
            Width: =Parent.Width - 40
            X: =20
            Y: =lblQueueHeaderSE.Y + lblQueueHeaderSE.Height
      - galQueueSE:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =Min(4, CountRows(colSupAppsSE)) * 64
            Items: =colSupAppsSE
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =64
            Visible: =locQueueOpen
            Width: =Parent.Width - 40
            X: =20
            Y: =lblQueueHeaderSE.Y + lblQueueHeaderSE.Height + 8
          Children:
            - btnQueueRowSE:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =2
                  Font: =Typography.Family
                  Height: =Parent.TemplateHeight
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =ColorPalette.Blue50
                  OnSelect: |-
                    =UpdateContext({
                       locApp: ThisItem.App,
                       locTabSE: 1,
                       locStatementCollapsed: false,
                       locSuggestOpen: false,
                       locQueueOpen: false
                     });
                     ClearCollect(colSuggestSE, Filter(Table({id: 0, program: "", option: ""}), false));
                     UpdateContext({
                       locMineSE: LookUp(SUPERVISOR_ENDORSEMENTS,
                         And(ApplicationID.Id = locApp.ID, SupervisorEmail = User().Email)),
                       locPriorSE: LookUp(SUPERVISOR_ENDORSEMENTS,
                         And(ApplicationID.Id = locApp.ID, SupervisorLevel.Value = "First Line"))
                     });
                     Reset(txtStatementSE);
                     Reset(txtNameSE); Reset(txtEmailSE); Reset(txtLocSE);
                     Reset(txtTitleSE); Reset(txtGradeSE); Reset(txtSeriesSE);
                     Reset(txtStartSE); Reset(txtScdSE);
                     Reset(txtSup1SE); Reset(txtSup2SE);
                     Reset(txtIdpSE); Reset(txtRatingSE);
                     Reset(txtSessSE); Reset(txtSessDSE)
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeCaption
                  Text: =""
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - lblQueueRowNameSE:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.App.ID = locApp.ID,
                        ColorPalette.Blue600, ColorPalette.TextHeading)
                  Font: =Typography.Family
                  FontWeight: |-
                    =If(ThisItem.App.ID = locApp.ID,
                        Typography.WeightBold, Typography.WeightMedium)
                  Height: =24
                  Size: =Typography.SizeBody
                  Text: =ThisItem.Label
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =220
                  X: =16
                  Y: =8
            - lblQueueRowTitleSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextBody
                  Font: =Typography.Family
                  Height: =24
                  Size: =Typography.SizeBody
                  Text: =Coalesce(ThisItem.App.JobTitle, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =300
                  X: =240
                  Y: =8
            - lblQueueRowMetaSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =24
                  Size: =Typography.SizeCaption
                  Text: |-
                    =Coalesce(ThisItem.App.Grade, "—") & "  ·  " &
                     Coalesce(ThisItem.App.JobSeries, "—") & "  ·  " &
                     Coalesce(ThisItem.App.Location, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth - 566
                  X: =550
                  Y: =8
            - lblQueueRow1LineSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =22
                  Size: =Typography.SizeCaption
                  Text: |-
                    ="1st line: " &
                     Coalesce(ThisItem.App.FirstLineSupervisorEmail, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth / 2 - 24
                  X: =16
                  Y: =34
            - lblQueueRow2LineSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =22
                  Size: =Typography.SizeCaption
                  Text: |-
                    ="2nd line: " &
                     Coalesce(ThisItem.App.SecondLineSupervisorEmail, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth / 2 - 16
                  X: =Parent.TemplateWidth / 2
                  Y: =34

