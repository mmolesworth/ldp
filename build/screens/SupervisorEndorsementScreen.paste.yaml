
- conBodySE:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Width: =Parent.Width
      X: =0
      Y: =conUtilityBar.Y + conUtilityBar.Height
      Height: =Parent.Height - Self.Y
    Children:
      - conQueueSE:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =76 + Min(2, CountRows(colSupAppsSE)) * 64
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =CountRows(colSupAppsSE) > 0
            Width: =Parent.Width - 48
            X: =24
            Y: =20
          Children:
            - conQueueHeaderSE:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.Navy900
                  Height: =48
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - lblQueueTitleSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =26
                        Size: =Typography.SizeHeading
                        Text: ="Applications for Review"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =(Parent.Height - Self.Height) / 2
            - galQueueSE:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =Min(2, CountRows(colSupAppsSE)) * 64
                  Items: =colSupAppsSE
                  ShowScrollbar: =true
                  TemplatePadding: =0
                  TemplateSize: =64
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =56
                Children:
                  - btnQueueRowSE:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =Parent.TemplateHeight
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =ColorPalette.Blue50
                        OnSelect: |-
                          =UpdateContext({
                             locApp: ThisItem.App,
                             locTabSE: 1,
                             locOpenCardSE: Blank(),
                             locDecisionSE: Blank()
                           });
                           ClearCollect(colSuggestSE, Filter(Table({id: 0, program: "", option: ""}), false));
                           ClearCollect(colSupDecisionsSE,
                               { level: "First Line",  decision: "", comment: "" },
                               { level: "Second Line", decision: "", comment: "" });
                           UpdateContext({
                             locMineSE: LookUp(SUPERVISOR_ENDORSEMENTS,
                               And(ApplicationID.Id = locApp.ID, SupervisorEmail = User().Email))
                           });
                           Reset(txt1StatementSE); Reset(txt2StatementSE);
                           Reset(txtNameSE); Reset(txtEmailSE); Reset(txtLocSE);
                           Reset(txtTitleSE); Reset(txtGradeSE); Reset(txtSeriesSE);
                           Reset(txtStartSE); Reset(txtScdSE);
                           Reset(txtSup1SE); Reset(txtSup2SE);
                           Reset(txtIdpSE); Reset(txtRatingSE);
                           Reset(txtSessSE); Reset(txtSessDSE)
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =ColorPalette.Blue50
                        Size: =Typography.SizeCaption
                        Text: =""
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
                  - lblQueueRowNameSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(ThisItem.App.ID = locApp.ID,
                              ColorPalette.Blue600, ColorPalette.TextHeading)
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(ThisItem.App.ID = locApp.ID,
                              Typography.WeightBold, Typography.WeightMedium)
                        Height: =24
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Label
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =220
                        X: =16
                        Y: =8
                  - lblQueueRowTitleSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =24
                        Size: =Typography.SizeBody
                        Text: =Coalesce(ThisItem.App.JobTitle, "—")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =300
                        X: =240
                        Y: =8
                  - lblQueueRowMetaSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Font: =Typography.Family
                        Height: =24
                        Size: =Typography.SizeCaption
                        Text: |-
                          =Coalesce(ThisItem.App.Grade, "—") & "  ·  " &
                           Coalesce(ThisItem.App.JobSeries, "—") & "  ·  " &
                           Coalesce(ThisItem.App.Location, "—")
