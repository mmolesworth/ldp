                  FontWeight: =Typography.WeightMedium
                  Height: =32
                  PaddingLeft: =0
                  Size: =Typography.SizeLabel
                  Text: ="Alternative program suggestions (optional)"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 80
                  X: =20
                  Y: =If(locStatementCollapsed, 146, 274)
            - icoSuggestChevronSE:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =ColorPalette.TextHelp
                  Height: =20
                  Icon: =If(locSuggestOpen, Icon.ChevronUp, Icon.ChevronDown)
                  Width: =20
                  X: =Parent.Width - 40
                  Y: =lblSuggestTitleSE.Y + 6
            - btnSuggestToggleSE:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =2
                  Font: =Typography.Family
                  Height: =32
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnSelect: |-
                    =UpdateContext({
                       locSuggestOpen: Not(locSuggestOpen),
                       locStatementCollapsed: If(Not(locSuggestOpen), true, locStatementCollapsed)
                     })
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Size: =Typography.SizeLabel
                  Text: ="Alternative program suggestions (optional)"
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =lblSuggestTitleSE.Y
            - conSuggestBlockSE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: |-
                    =4 + If(CountRows(colSuggestSE) = 0, 36,
                            If(CountRows(colSuggestSE) < 3,
                               CountRows(colSuggestSE) * 44 + 12 + 36,
                               CountRows(colSuggestSE) * 44))
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =If(CountRows(colSuggestSE) > 0, 12, 0)
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =4
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =0
                  Visible: =locSuggestOpen
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =lblSuggestTitleSE.Y + lblSuggestTitleSE.Height
                Children:
                  - galSuggestRowsSE:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        FillPortions: =0
                        Height: =CountRows(colSuggestSE) * 44
                        Items: =colSuggestSE
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =44
                        Visible: =CountRows(colSuggestSE) > 0
                      Children:
                        - drpRowPrgSE:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AllowEmptySelection: =true
                              BorderColor: =ColorPalette.Gray300
                              BorderThickness: =1
                              ChevronBackground: =ColorPalette.Blue600
                              ChevronFill: =ColorPalette.TextOnDark
                              Default: =ThisItem.program
                              FocusedBorderThickness: =1
                              Font: =Typography.Family
                              Height: =36
                              Items: |-
                                =ForAll(
                                  Sort(Filter(PROGRAMS, State.Value <> "Retired"), ProgramName),
                                  ProgramName)
                              OnChange: |-
                                =Patch(colSuggestSE, ThisItem,
                                       { program: drpRowPrgSE.Selected.Value,
                                         option: "" });
                                 Reset(drpRowOptSE)
                              SelectionColor: =ColorPalette.TextOnDark
                              SelectionFill: =ColorPalette.Blue600
                              Size: =Typography.SizeCaption
                              Width: =(Parent.TemplateWidth - 48) * 0.45
                              X: =0
                              Y: =0
                        - drpRowOptSE:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AllowEmptySelection: =true
                              BorderColor: =ColorPalette.Gray300
                              BorderThickness: =1
                              ChevronBackground: =ColorPalette.Blue600
                              ChevronFill: =ColorPalette.TextOnDark
                              Default: =ThisItem.option
                              FocusedBorderThickness: =1
                              Font: =Typography.Family
                              Height: =36
                              Items: |-
                                =ForAll(
                                  Sort(
                                    Filter(PROGRAM_OPTIONS,
                                      ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpRowPrgSE.Selected.Value).ID,
                                      State.Value = "Active"),
                                    OptionName),
                                  OptionName)
                              OnChange: |-
                                =Patch(colSuggestSE, ThisItem,
                                       { option: drpRowOptSE.Selected.Value })
                              SelectionColor: =ColorPalette.TextOnDark
                              SelectionFill: =ColorPalette.Blue600
                              Size: =Typography.SizeCaption
                              Visible: |-
                                =Not(IsEmpty(Filter(PROGRAM_OPTIONS,
                                  ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpRowPrgSE.Selected.Value).ID,
                                  State.Value = "Active")))
                              Width: =(Parent.TemplateWidth - 48) * 0.55
                              X: =drpRowPrgSE.X + drpRowPrgSE.Width + 8
                              Y: =0
                        - icoRowRemoveSE:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =ColorPalette.TextHelp
                              Height: =24
                              HoverColor: =ColorPalette.Danger
                              Icon: =Icon.Trash
                              OnSelect: |-
                                =Remove(colSuggestSE, ThisItem)
                              Tooltip: ="Remove this alternative"
                              Width: =24
                              X: =Parent.TemplateWidth - 32
                              Y: =Parent.TemplateHeight / 2 - 12
                  - btnAddAltSE:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorPalette.Blue400
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =ColorPalette.Blue400
                        Fill: =ColorPalette.White
                        FillPortions: =0
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =1
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =36
                        HoverColor: =Self.Color
                        HoverFill: =ColorPalette.Blue50
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Collect(colSuggestSE,
                                   { id: CountRows(colSuggestSE) + 1,
                                     program: "",
                                     option: "" })
                        PressedColor: =Self.Color
                        PressedFill: =ColorPalette.Blue50
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =Typography.SizeBody
                        Text: ="+ Add another program"
                        Visible: =CountRows(colSuggestSE) < 3
            - btnSubmitSE:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =ColorPalette.TextOnDark
                  DisplayMode: |-
                    =If(Or(IsBlank(locDecisionSE),
                          IsBlank(Trim(txtStatementSE.Text))),
                       DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =ColorPalette.Blue600
                  FocusedBorderColor: =ColorPalette.FocusOnDark
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =44
                  HoverColor: =Self.Color
                  HoverFill: =ColorPalette.Blue700
                  OnSelect: |-
                    =Patch(SUPERVISOR_ENDORSEMENTS, Defaults(SUPERVISOR_ENDORSEMENTS),
                       {
                         ApplicationID: {
                           '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                           Id: locApp.ID,
                           Value: locApp.ApplicantEmail
                         },
                         SupervisorEmail: User().Email,
                         SupervisorLevel: {
                           Value: If(locApp.FirstLineSupervisorEmail = User().Email, "First Line", "Second Line")
                         },
                         Decision: { Value: locDecisionSE },
                         DispositionStatement: txtStatementSE.Text,
                         RecommendedOptions:
                           Concat(
                             Filter(colSuggestSE, Not(IsBlank(program))),
                             program &
                             If(IsBlank(option), "", " — " & option),
                             Char(10)),
                         DecisionDate: Today()
                       });
                     UpdateContext({
                       locApp: Patch(APPLICATIONS, locApp,
                         { ReviewStage: { Value:
                             If(locApp.FirstLineSupervisorEmail = User().Email,
                                If(IsBlank(Trim(locApp.SecondLineSupervisorEmail)),
                                   "Needs Supervisor Assigned",
                                   "Pending Second-Line"),
                                "Pending DTD Validation") } })
                     });
                     UpdateContext({
                       locMineSE: LookUp(SUPERVISOR_ENDORSEMENTS,
                         And(ApplicationID.Id = locApp.ID, SupervisorEmail = User().Email)),
                       locPriorSE: LookUp(SUPERVISOR_ENDORSEMENTS,
                         And(ApplicationID.Id = locApp.ID, SupervisorLevel.Value = "First Line"))
                     });
                     Notify("Your decision has been recorded.", NotificationType.Success)
                  PressedColor: =Self.Color
                  PressedFill: =ColorPalette.Blue700
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeHeading
                  Text: ="Submit decision"
                  Width: =Parent.Width - 40
                  X: =20
                  Y: |-
                    =If(Not(locSuggestOpen),
                        lblSuggestTitleSE.Y + 44,
                        conSuggestBlockSE.Y + conSuggestBlockSE.Height + 12)
      - conDoneSE:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            Height: =410
            Visible: =Not(IsBlank(locMineSE))
            Width: =Parent.Width
            X: =0
            Y: =60
          Children:
            - lblDoneVerdictSE:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(locMineSE.Decision.Value = "Recommend",
                       ColorPalette.SuccessText, ColorPalette.WarningText)
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =28
                  Size: =Typography.SizeHeading
                  Text: =locMineSE.Decision.Value
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =0
            - lblDoneWhenSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="Recorded " & Text(locMineSE.DecisionDate, "mmmm d, yyyy")
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =30
            - lblDoneStatementSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextBody
                  Font: =Typography.Family
                  Height: =150
                  Size: =Typography.SizeBody
                  Text: =locMineSE.DispositionStatement
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =60
            - lblDoneOptionsSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =110
                  Size: =Typography.SizeCaption
                  Text: |-
                    =If(IsBlank(locMineSE.RecommendedOptions), "",
                       "Options you suggested:" & Char(10) & locMineSE.RecommendedOptions)
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =218
            - lblDoneLockSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =56
                  Size: =Typography.SizeCaption
                  Text: |-
                    ="A decision is recorded once. If this is wrong, contact the "
                      & "Division of Talent Development."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =340
      - conWaitSE:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            Height: =200
            Visible: |-
              =And(IsBlank(locMineSE),
                 Not(If(locApp.FirstLineSupervisorEmail = User().Email,
                 locApp.ReviewStage.Value = "Pending First-Line",
                 Or(locApp.ReviewStage.Value = "Pending Second-Line",
                    locApp.ReviewStage.Value = "Needs Supervisor Assigned"))))
            Width: =Parent.Width
            X: =0
            Y: =60
          Children:
            - icoWaitSE:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =ColorPalette.TextSecondary
                  Height: =28
                  Icon: =Icon.Clock
                  Width: =28
                  X: =20
                  Y: =0
            - lblWaitSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextBody
                  Font: =Typography.Family
                  Height: =150
                  Size: =Typography.SizeBody
                  Text: |-
                    ="The first-line supervisor has not recorded a decision yet. "
                      & "You will be able to record yours once they do — their "
                      & "statement is meant to inform it (RQ020)."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =38

- conNoneSE:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =200
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: =IsBlank(locApp)
      Width: =Parent.Width - 48
      X: =24
      Y: =240 + If(locQueueOpen, 16 + Min(4, CountRows(colSupAppsSE)) * 64, 0)
    Children:
      - icoNoneSE:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =ColorPalette.TextSecondary
            Height: =32
            Icon: =Icon.Information
            Width: =32
            X: =28
            Y: =28
      - lblNoneTitleSE:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =30
            Size: =Typography.SizeHeading
            Text: ="No applications are waiting for you"
            Width: =Parent.Width - 120
            X: =76
            Y: =28
      - lblNoneBodySE:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =80
            Size: =Typography.SizeBody
            Text: |-
              ="Applications appear here once the applicant submits and names you "
                & "as their first- or second-line supervisor. Use the logo above to go back."
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 120
            X: =76
            Y: =68
