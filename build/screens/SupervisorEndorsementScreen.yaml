                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Recommend",
                              Typography.WeightBold, Typography.WeightRegular)
                        HoverColor: =Self.Color
                        HoverFill: |-
                          =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Recommend",
                              ColorPalette.SuccessLight, ColorPalette.Gray25)
                        OnSelect: |-
                          =With({e: LookUp(colSupDecisionsSE, level = ThisItem.level)},
                             RemoveIf(colSupDecisionsSE, level = ThisItem.level);
                             Collect(colSupDecisionsSE,
                               { level: ThisItem.level,
                                 decision: "Recommend",
                                 comment: Coalesce(e.comment, "") }))
                        PressedFill: =ColorPalette.SuccessLight
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =Typography.SizeBody
                        Text: ="Recommend"
                        Visible: =varOpenSupItemSE = ThisItem.id
                        Width: =(galSupsSE.TemplateWidth - 52) / 2
                        X: =20
                        Y: =lblSupTitleSE.Height + 20
                  - btnSupNotRecSE:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: |-
                          =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Not Recommend",
                              ColorPalette.WarningText, ColorPalette.Gray300)
                        BorderThickness: =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Not Recommend", 2, 1)
                        Color: |-
                          =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Not Recommend",
                              ColorPalette.WarningText, ColorPalette.TextBody)
                        Fill: |-
                          =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Not Recommend",
                              ColorPalette.WarningLight, ColorPalette.White)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Not Recommend",
                              Typography.WeightBold, Typography.WeightRegular)
                        HoverColor: =Self.Color
                        HoverFill: |-
                          =If(LookUp(colSupDecisionsSE, level = ThisItem.level).decision = "Not Recommend",
                              ColorPalette.WarningLight, ColorPalette.Gray25)
                        OnSelect: |-
                          =With({e: LookUp(colSupDecisionsSE, level = ThisItem.level)},
                             RemoveIf(colSupDecisionsSE, level = ThisItem.level);
                             Collect(colSupDecisionsSE,
                               { level: ThisItem.level,
                                 decision: "Not Recommend",
                                 comment: Coalesce(e.comment, "") }))
                        PressedFill: =ColorPalette.WarningLight
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =Typography.SizeBody
                        Text: ="Not Recommend"
                        Visible: =varOpenSupItemSE = ThisItem.id
                        Width: =(galSupsSE.TemplateWidth - 52) / 2
                        X: =btnSupRecSE.X + btnSupRecSE.Width + 12
                        Y: =btnSupRecSE.Y
                  - lblSupCommentTitleSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =20
                        Size: =Typography.SizeLabel
                        Text: ="Comments explaining your recommendation"
                        Visible: =varOpenSupItemSE = ThisItem.id
                        Width: =galSupsSE.TemplateWidth - 40
                        X: =20
                        Y: =btnSupRecSE.Y + btnSupRecSE.Height + 20
                  - txtSupCommentSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextHeading
                        Default: =Coalesce(LookUp(colSupDecisionsSE, level = ThisItem.level).comment, "")
                        Fill: =ColorPalette.White
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =72
                        HintText: ="Explain why you are recommending or not recommending this application."
                        HoverBorderColor: =ColorPalette.Blue400
                        Mode: =TextMode.MultiLine
                        OnChange: |-
                          =With({e: LookUp(colSupDecisionsSE, level = ThisItem.level)},
                             RemoveIf(colSupDecisionsSE, level = ThisItem.level);
                             Collect(colSupDecisionsSE,
                               { level: ThisItem.level,
                                 decision: Coalesce(e.decision, ""),
                                 comment: Self.Text }))
                        Size: =Typography.SizeBody
                        Visible: =varOpenSupItemSE = ThisItem.id
                        Width: =galSupsSE.TemplateWidth - 40
                        X: =20
                        Y: =lblSupCommentTitleSE.Y + lblSupCommentTitleSE.Height + 4
                  # Submit button — writes to SUPERVISOR_ENDORSEMENTS for the
                  # current supervisor level (ThisItem.level). Uses the
                  # decision and comment stored in colSupDecisionsSE.
                  # Disabled until a decision has been chosen.
                  - btnSupSubmitSE:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =ColorPalette.TextOnDark
                        DisplayMode: |-
                          =If(IsBlank(LookUp(colSupDecisionsSE, level = ThisItem.level).decision),
                             DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =ColorPalette.Blue600
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =40
                        HoverColor: =Self.Color
                        HoverFill: =ColorPalette.Blue700
                        OnSelect: |-
                          =With({d: LookUp(colSupDecisionsSE, level = ThisItem.level)},
                             Patch(SUPERVISOR_ENDORSEMENTS,
                               Coalesce(
                                 LookUp(SUPERVISOR_ENDORSEMENTS,
                                   And(ApplicationID.Id = locApp.ID,
                                       SupervisorLevel.Value = ThisItem.level)),
                                 Defaults(SUPERVISOR_ENDORSEMENTS)),
                               {
                                 ApplicationID: {
                                   '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                   Id: locApp.ID,
                                   Value: locApp.ApplicantEmail
                                 },
                                 SupervisorEmail: User().Email,
                                 SupervisorLevel: { Value: ThisItem.level },
                                 Decision: { Value: d.decision },
                                 DispositionStatement: Coalesce(d.comment, ""),
                                 DecisionDate: Today()
                               }));
                           UpdateContext({
                             locApp: Patch(APPLICATIONS, locApp,
                               { ReviewStage: { Value:
                                   If(ThisItem.level = "First Line",
                                      If(IsBlank(Trim(locApp.SecondLineSupervisorEmail)),
                                         "Needs Supervisor Assigned",
                                         "Pending Second-Line"),
                                      "Pending DTD Validation") } }),
                             varOpenSupItemSE: Blank()
                           });
                           Notify("Your decision has been recorded.", NotificationType.Success)
                        PressedColor: =Self.Color
                        PressedFill: =ColorPalette.Blue700
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =Typography.SizeBody
                        Text: ="Submit decision"
                        Visible: =varOpenSupItemSE = ThisItem.id
                        Width: =galSupsSE.TemplateWidth - 40
                        X: =20
                        Y: =txtSupCommentSE.Y + txtSupCommentSE.Height + 16
      # ===========================================================================
      # NOTHING ASSIGNED — the honest empty state
      # ===========================================================================
      # A supervisor who follows a stale email link, or whose applicant withdrew,
      # lands here. Without this the screen is three empty cards.
      - conNoneSE:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =200
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =IsBlank(locApp)
            Width: =Parent.Width - 48
            X: =24
            Y: =conQueueSE.Y + conQueueSE.Height + 20
          Children:
            - icoNoneSE:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =ColorPalette.TextSecondary
                  Height: =32
                  Icon: =Icon.Information
                  Width: =32
                  X: =28
                  Y: =28
            - lblNoneTitleSE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =30
                  Size: =Typography.SizeHeading
                  Text: ="No applications are waiting for you"
                  Width: =Parent.Width - 120
                  X: =76
                  Y: =28
            - lblNoneBodySE:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextBody
                  Font: =Typography.Family
                  Height: =80
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Applications appear here once the applicant submits and names you "
                      & "as their first- or second-line supervisor. Use the logo above to go back."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 120
                  X: =76
                  Y: =68
      
