# Supervisor Endorsement Screen — screen 6 in LDP_Proposed_Screens.md (UC-2.1)
# Anchors: RQ018-025, FR-013, FR-016.
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# ---------------------------------------------------------------------------
# HOW TO TRANSCRIBE (Constitution IV)
# ---------------------------------------------------------------------------
# Steps marked (screen) are properties of the SCREEN itself — select the screen
# in the tree view and set them in the properties pane. They are NOT properties
# of the utility bar or of any control listed below it.
#
# They cannot be pasted, and there is no way to make them pasteable. Studio's
# Paste YAML inserts CONTROLS into the selected screen, so a paste block has no
# screen node to carry Fill, OnVisible or OnStart. Only the app-source format
# written by `pac canvas unpack` has one, and Studio will not paste that.
#
# The OnVisible below is also kept comment-free and ready to copy in
# build/screens/SupervisorEndorsementScreen.OnVisible.fx.
#
#   1. New screen → Blank. Rename it "Supervisor Endorsement Screen".
#   1a. Paste build/screens/_EnvironmentBanner.paste.yaml FIRST. The utility
#      bar's Y references lblEnvBanner.Height and won't compile without it.
#   1b. Paste build/screens/_UtilityBarSlim.paste.yaml next (app chrome, shared).
#   1c. Paste this file's `conBodySE` block — the wrapper containing every
#      other control on the screen.
#   2. (screen) Fill: =ColorPalette.Gray50
#   3. (screen) OnVisible — transcribe by hand (no # prefixes, no leading =):
#
#        ClearCollect(colSupAppsSE,
#            ForAll(
#                Filter(APPLICATIONS,
#                    ApplicationStatus.Value <> "Draft",
#                    ApplicationStatus.Value <> "Withdrawn",
#                    Or(FirstLineSupervisorEmail = User().Email,
#                       SecondLineSupervisorEmail = User().Email)) As a,
#                { App: a, Label: a.ApplicantName }));
#        UpdateContext({ locTabSE: 1, locDecisionSE: Blank(),
#                        locOpenCardSE: Blank(),
#                        varOpenSupItemSE: Blank(),
#                        locCompTypeSE: First(SortByColumns(
#                            Filter(COMPETENCY_TYPES, State.Value = "Active"),
#                            "SortOrder", SortOrder.Ascending)).ID,
#                        locApp: First(colSupAppsSE).App });
#        ClearCollect(colSuggestSE, Filter(Table({id: 0, program: "", option: ""}), false));
#        ClearCollect(colSupDecisionsSE,
#            { level: "First Line",  decision: "", comment: "" },
#            { level: "Second Line", decision: "", comment: "" });
#        UpdateContext({
#            locMineSE: LookUp(SUPERVISOR_ENDORSEMENTS,
#                And(ApplicationID.Id = locApp.ID, SupervisorEmail = User().Email))
#        })
#
#      THE THIRD BLOCK IS DUPLICATED in btnQueueRowSE.OnSelect (the row
#      picker inside conQueueSE), and must stay identical. Changing the
#      selected application changes who has endorsed it and what the first
#      line said, so both have to be re-resolved. A variable cannot be
#      referenced inside the UpdateContext that defines it, which is why
#      locApp is set in the second block and read in the third.
#
#   4. Data sources (seven): APPLICATIONS, SUPERVISOR_ENDORSEMENTS,
#      APPLICATION_PROGRAM_CHOICES, APPLICATION_COMPETENCIES, COMPETENCIES,
#      COMPETENCY_TYPES, PROGRAM_OPTIONS.
#   5. Preview (F5) — OnVisible does not run on the design surface.
#
# ---------------------------------------------------------------------------
# WHAT THE SUPERVISOR MAY AND MAY NOT DO
# ---------------------------------------------------------------------------
# RQ022 — the application is VIEW-ONLY. Fields on the five tabs are read-only:
# Personnel and Eligibility use the PowerLibs "Modern Input Label" pattern —
# Classic/TextInput with DisplayMode.Disabled, Gray300 border, TextBody colour,
# and a floating caption on the top border. The pattern, colours, spacing and
# 4-column layout mirror txtPersNameDTD / galDetailTabsDTD on the DTD
# Applications screen: same application data, same look. The other tabs use
# plain Labels in galleries. There is no edit toggle and no Patch against
# APPLICATIONS anywhere on this screen. RQ024 makes that explicit for program
# choices: a supervisor must not alter the applicant's selections.
#
# Default doesn't auto-refresh when locApp changes — Reset() must be called
# from btnQueueRowSE.OnSelect for every txtXxxSE. This mirrors DTD, which does
# the same on its Cancel/Edit toggle. Miss a Reset and the stale value
# survives a queue switch.
#
# RQ023/RQ025 — they MAY recommend up to three alternative options, recorded
# separately and attributed. The "Alternative program suggestions" accordion
# in the decision rail is COLLAPSED by default (locSuggestOpen = false). When
# opened it shows an editable gallery (galSuggestRowsSE) of program+option
# dropdown pairs, bound to colSuggestSE ({id, program, option}). Users add
# rows via btnAddAltSE (capped at three) and remove rows via the trash icon.
# Blank rows are filtered on submit; the submit handler concats colSuggestSE
# into SUPERVISOR_ENDORSEMENTS.RecommendedOptions as "Program" or
# "Program — Option", newline-delimited. The applicant's own choices are
# never touched.
#
# RQ019 / FR-013 — a statement is required on BOTH answers, not just the
# negative one. btnSubmitSE is disabled until there is a decision AND a
# non-blank statement.
#
# RQ021 — the packet advances either way. btnSubmitSE sets the same ReviewStage
# whichever button is chosen; there is no branch on the decision value.
#
# ---------------------------------------------------------------------------
# RECOMMEND / NOT RECOMMEND
# ---------------------------------------------------------------------------
# SUPERVISOR_ENDORSEMENTS.Decision was renamed from Approve/Disapprove on
# 2026-08-02 — see _CHOICES.md. A supervisor cannot grant a place in the
# programme, and RQ021 means neither answer blocks anything, so the column was
# always holding an opinion. RQ018 still uses the old words; that is OI-SUP-1.
#
# ---------------------------------------------------------------------------
# WHOSE TURN IT IS
# ---------------------------------------------------------------------------
# Three states, and the rail renders one of them:
#
#   ALREADY DECIDED   locMineSE exists. UC-2.1 preconditions: "the acting
#                     supervisor has not yet recorded a disposition". The form
#                     is replaced by a read-back of what they said.
#   NOT YET MY TURN   a second-line supervisor while ReviewStage is still
#                     Pending First-Line. They may READ the application — that
#                     is not sensitive to them — but not record ahead of the
#                     first line, because RQ020 says their decision is supposed
#                     to be informed by it.
#   MINE TO DECIDE    everything else. The form is live.
#
# `Needs Supervisor Assigned` counts as the second line's turn: the packet is
# waiting on DTD to name someone, and the person reading this screen IS the
# named someone if the application lists them.

# ===========================================================================
# BODY — everything on the screen between the utility bar and the bottom.
#
# One responsive container so the whole body reflows automatically when the
# environment banner shifts the utility bar down (or hides itself), and grows
# to fill the available height. Same pattern as conBodyLD (Landing Screen),
# conBodyAP (Application Screen), and conBodyAS (Application Status Screen).
# ===========================================================================
- conBodySE:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Width: =Parent.Width
      X: =0
      # Anchor to the bottom edge of the utility bar. When the environment
      # banner is present the utility bar shifts down and everything follows.
      Y: =conUtilityBar.Y + conUtilityBar.Height
      # Fill to the screen bottom.
      Height: =Parent.Height - Self.Y
    Children:
      # ---------------------------------------------------------------------
      # REVIEW QUEUE — gallery of applications pending this user's review.
      # Always visible above the application panel. Picking a row sets locApp
      # and reloads the application panel below. Height capped at 2 rows;
      # scroll for more.
      # ---------------------------------------------------------------------
      - conQueueSE:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            Height: =177
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =CountRows(colSupAppsSE) > 0
            Width: =Parent.Width - 48
            X: =24
            Y: =20
          Children:
            - conQueueHeaderSE:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.Navy900
                  Height: =48
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - lblQueueTitleSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =26
                        Size: =Typography.SizeHeading
                        Text: ="Applications for Review"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =(Parent.Height - Self.Height) / 2
            - galQueueSE:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =Min(2, CountRows(colSupAppsSE)) * 64
                  Items: =colSupAppsSE
                  ShowScrollbar: =true
                  TemplatePadding: =0
                  TemplateSize: =64
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =56
                Children:
                  - btnQueueRowSE:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =Parent.TemplateHeight
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =ColorPalette.Blue50
                        OnSelect: |-
                          =UpdateContext({
                             locApp: ThisItem.App,
                             locTabSE: 1,
                             locOpenCardSE: Blank(),
                             locDecisionSE: Blank()
                           });
                           ClearCollect(colSuggestSE, Filter(Table({id: 0, program: "", option: ""}), false));
                           ClearCollect(colSupDecisionsSE,
                               { level: "First Line",  decision: "", comment: "" },
                               { level: "Second Line", decision: "", comment: "" });
                           UpdateContext({
                             locMineSE: LookUp(SUPERVISOR_ENDORSEMENTS,
                               And(ApplicationID.Id = locApp.ID, SupervisorEmail = User().Email))
                           });
                           Reset(txt1StatementSE); Reset(txt2StatementSE);
                           Reset(txtNameSE); Reset(txtEmailSE); Reset(txtLocSE);
                           Reset(txtTitleSE); Reset(txtGradeSE); Reset(txtSeriesSE);
                           Reset(txtStartSE); Reset(txtScdSE);
                           Reset(txtSup1SE); Reset(txtSup2SE);
                           Reset(txtIdpSE); Reset(txtRatingSE);
                           Reset(txtSessSE); Reset(txtSessDSE)
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =ColorPalette.Blue50
                        Size: =Typography.SizeCaption
                        Text: =""
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
                  - lblQueueRowNameSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(ThisItem.App.ID = locApp.ID,
                              ColorPalette.Blue600, ColorPalette.TextHeading)
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(ThisItem.App.ID = locApp.ID,
                              Typography.WeightBold, Typography.WeightMedium)
                        Height: =24
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Label
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =220
                        X: =16
                        Y: =8
                  - lblQueueRowTitleSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =24
                        Size: =Typography.SizeBody
                        Text: =Coalesce(ThisItem.App.JobTitle, "—")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =300
                        X: =240
                        Y: =8
                  - lblQueueRowMetaSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Font: =Typography.Family
                        Height: =24
                        Size: =Typography.SizeCaption
                        Text: |-
                          =Coalesce(ThisItem.App.Grade, "—") & "  ·  " &
                           Coalesce(ThisItem.App.JobSeries, "—") & "  ·  " &
                           Coalesce(ThisItem.App.Location, "—")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.TemplateWidth - 566
                        X: =550
                        Y: =8
      # ===========================================================================
      # THE APPLICATION — five tabs, every one of them read-only (RQ022)
      # ===========================================================================
      - conAppSE:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.White
            # Sized for the standard tabs (Tabs 1-5 are 330px content from
            # Y=114 → 444). Tab 6 (Supervisor Review) is 700px and WILL
            # CLIP at this height — visible portion is 450-114 = 336px, so
            # the card headers show but expanded bodies get cut off.
            # Shrink the tab 6 body separately if you need it fully visible.
            Height: =450
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =Not(IsBlank(locApp))
            Width: =Parent.Width - 48
            X: =24
            Y: =conQueueSE.Y + conQueueSE.Height + 20
          Children:
            - conAppHeaderSE:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.Navy900
                  Height: =48
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - lblAppTitleSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextOnDark
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =26
                        Size: =Typography.SizeHeading
                        Text: ="Supervisor Recommendation"
                        Width: =252
                        X: =20
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblAppTitleNameSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.Blue50
                        Font: =Typography.Family
                        Height: =24
                        Size: =Typography.SizeBody
                        Text: =Coalesce(locApp.ApplicantName, "")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - lblAppTitleSE.Width - 40
                        X: =lblAppTitleSE.X + lblAppTitleSE.Width + 12
                        Y: =(Parent.Height - Self.Height) / 2
            - galTabsSE:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =34
                  Items: |-
                    =Table(
                      { id: 1, label: "Personnel" },
                      { id: 2, label: "Program choices" },
                      { id: 3, label: "Competencies" },
                      { id: 4, label: "Eligibility" },
                      { id: 5, label: "Documents" },
                      { id: 6, label: "Supervisor Review" }
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =160
                  Visible: =Not(IsBlank(locApp))
                  Width: =960
                  X: =24
                  Y: =conAppHeaderSE.Y + conAppHeaderSE.Height + 16
                Children:
                  - btnTabSE:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: |-
                          =If(ThisItem.id = locTabSE,
                             ColorPalette.Blue600, ColorPalette.TextHelp)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =0
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(ThisItem.id = locTabSE,
                             Typography.WeightBold, Typography.WeightRegular)
                        Height: =Parent.TemplateHeight - 3
                        HoverColor: =ColorPalette.TextOnDark
                        HoverFill: =ColorPalette.Blue700
                        OnSelect: |-
                          =UpdateContext({ locTabSE: ThisItem.id })
                        PressedColor: =ColorPalette.TextOnDark
                        PressedFill: =ColorPalette.Blue700
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =Typography.SizeBody
                        Text: =ThisItem.label
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
                  - recTabLineSE:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: |-
                          =If(ThisItem.id = locTabSE,
                             ColorPalette.Blue600, RGBA(0, 0, 0, 0))
                        Height: =3
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =Parent.TemplateHeight - 3
            - recTabsRuleSE:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Visible: =Not(IsBlank(locApp))
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =galTabsSE.Y + galTabsSE.Height
            - conTab1SE:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =330
                  Visible: =locTabSE = 1
                  Width: =1040
                  X: =20
                  Y: =recTabsRuleSE.Y + 16
                Children:
                  - txtNameSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =Coalesce(locApp.ApplicantName, "—")
                        DisabledBorderColor: =ColorPalette.Gray300
                        DisabledColor: =ColorPalette.TextBody
                        DisabledFill: =ColorPalette.White
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorPalette.White
                        FocusedBorderColor: =ColorPalette.Blue600
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =40
                        PaddingLeft: =12
                        Size: =Typography.SizeBody
                        Width: =(Parent.Width - 120) / 4
                        X: =24
                        Y: =10
                  - lblNameSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Fill: =ColorPalette.White
                        Font: =Typography.Family
                        Height: =16
                        PaddingLeft: =4
                        PaddingRight: =4
                        Size: =Typography.SizeCaption
                        Text: ="Full name"
                        Width: =Len(Self.Text) * 6 + 16
                        Wrap: =false
                        X: =txtNameSE.X + 10
                        Y: =txtNameSE.Y - Self.Height / 2
                  - txtEmailSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =Coalesce(locApp.ApplicantEmail, "—")
                        DisabledBorderColor: =ColorPalette.Gray300
                        DisabledColor: =ColorPalette.TextBody
                        DisabledFill: =ColorPalette.White
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorPalette.White
                        FocusedBorderColor: =ColorPalette.Blue600
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =40
                        PaddingLeft: =12
                        Size: =Typography.SizeBody
                        Width: =txtNameSE.Width
                        X: =24
                        Y: =68
                  - lblEmailSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Fill: =ColorPalette.White
                        Font: =Typography.Family
                        Height: =16
                        PaddingLeft: =4
                        PaddingRight: =4
                        Size: =Typography.SizeCaption
                        Text: ="Email"
                        Width: =Len(Self.Text) * 6 + 16
                        Wrap: =false
                        X: =txtEmailSE.X + 10
                        Y: =txtEmailSE.Y - Self.Height / 2
                  - txtLocSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =Coalesce(locApp.Location, "—")
                        DisabledBorderColor: =ColorPalette.Gray300
                        DisabledColor: =ColorPalette.TextBody
                        DisabledFill: =ColorPalette.White
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorPalette.White
                        FocusedBorderColor: =ColorPalette.Blue600
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =40
                        PaddingLeft: =12
                        Size: =Typography.SizeBody
                        Width: =txtNameSE.Width
                        X: =24
                        Y: =126
                  - lblLocSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Fill: =ColorPalette.White
                        Font: =Typography.Family
                        Height: =16
                        PaddingLeft: =4
                        PaddingRight: =4
                        Size: =Typography.SizeCaption
                        Text: ="Location"
                        Width: =Len(Self.Text) * 6 + 16
                        Wrap: =false
                        X: =txtLocSE.X + 10
                        Y: =txtLocSE.Y - Self.Height / 2
                  - txtTitleSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =Coalesce(locApp.JobTitle, "—")
                        DisabledBorderColor: =ColorPalette.Gray300
                        DisabledColor: =ColorPalette.TextBody
                        DisabledFill: =ColorPalette.White
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorPalette.White
                        FocusedBorderColor: =ColorPalette.Blue600
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =40
                        PaddingLeft: =12
                        Size: =Typography.SizeBody
                        Width: =txtNameSE.Width
                        X: =txtNameSE.X + (txtNameSE.Width + 24)
                        Y: =10
                  - lblTitleSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Fill: =ColorPalette.White
                        Font: =Typography.Family
                        Height: =16
                        PaddingLeft: =4
                        PaddingRight: =4
                        Size: =Typography.SizeCaption
                        Text: ="Job title"
                        Width: =Len(Self.Text) * 6 + 16
                        Wrap: =false
                        X: =txtTitleSE.X + 10
                        Y: =txtTitleSE.Y - Self.Height / 2
                  - txtGradeSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =Coalesce(locApp.Grade, "—")
                        DisabledBorderColor: =ColorPalette.Gray300
                        DisabledColor: =ColorPalette.TextBody
                        DisabledFill: =ColorPalette.White
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorPalette.White
                        FocusedBorderColor: =ColorPalette.Blue600
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =40
                        PaddingLeft: =12
                        Size: =Typography.SizeBody
                        Width: =txtNameSE.Width
                        X: =txtNameSE.X + (txtNameSE.Width + 24)
                        Y: =68
                  - lblGradeSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Fill: =ColorPalette.White
                        Font: =Typography.Family
                        Height: =16
                        PaddingLeft: =4
                        PaddingRight: =4
                        Size: =Typography.SizeCaption
                        Text: ="Grade"
                        Width: =Len(Self.Text) * 6 + 16
                        Wrap: =false
                        X: =txtGradeSE.X + 10
                        Y: =txtGradeSE.Y - Self.Height / 2
                  - txtSeriesSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =Coalesce(locApp.JobSeries, "—")
                        DisabledBorderColor: =ColorPalette.Gray300
                        DisabledColor: =ColorPalette.TextBody
                        DisabledFill: =ColorPalette.White
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorPalette.White
                        FocusedBorderColor: =ColorPalette.Blue600
                        FocusedBorderThickness: =2
                        Font: =Typography.Family
                        Height: =40
                        PaddingLeft: =12
                        Size: =Typography.SizeBody
                        Width: =txtNameSE.Width
                        X: =txtNameSE.X + (txtNameSE.Width + 24)
                        Y: =126
                  - lblSeriesSE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Fill: =ColorPalette.White
                        Font: =Typography.Family
                        Height: =16
                        PaddingLeft: =4
                        PaddingRight: =4
                        Size: =Typography.SizeCaption
                        Text: ="Job series"
                        Width: =Len(Self.Text) * 6 + 16
                        Wrap: =false
                        X: =txtSeriesSE.X + 10
                        Y: =txtSeriesSE.Y - Self.Height / 2
                  - txtStartSE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =If(IsBlank(locApp.NCUAStartDate), "—",
                             Text(locApp.NCUAStartDate, "mmmm d, yyyy"))
                        DisabledBorderColor: =ColorPalette.Gray300
                        DisabledColor: =ColorPalette.TextBody
                        DisabledFill: =ColorPalette.White
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorPalette.White
