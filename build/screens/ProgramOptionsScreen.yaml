              =UpdateContext({ locProgModal: true })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            Text: ="Edit details"
            Visible: =Not(IsBlank(locProgram))
            Width: =140
            X: =24
            Y: =Parent.Height - 54

