          Properties:
            BorderStyle: =BorderStyle.None
            Color: |-
              =If(locTab = 2, ColorPalette.Blue600, ColorPalette.TextHelp)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Typography.Family
            FontWeight: |-
              =If(locTab = 2, Typography.WeightMedium, Typography.WeightRegular)
            Height: =40
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ locTab: 2, locOptForm: false })
            PressedFill: =RGBA(0, 0, 0, 0)
            Size: =Typography.SizeBody
            Text: |-
              ="Program options" &
              If(IsBlank(locProgram), "",
                 "  (" & CountRows(Filter(PROGRAM_OPTIONS, ProgramID.Id = locProgram.ID)) & ")")
            Width: =200
            X: =178
            Y: =0
      - recTab2Underline:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Blue600
            Height: =3
            Visible: =locTab = 2
            Width: =200
            X: =178
            Y: =40
      - recTabBaseline:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.Width
            X: =0
            Y: =42

# ===========================================================================
# TAB 1 — program details
# ===========================================================================
- conTab1:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =Parent.Height - 356
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =locTab = 1
      Width: =Parent.Width - 48
      X: =24
      Y: =332
    Children:
      # Empty state: nothing selected AND not creating. Both cases give the
      # user a next action rather than a blank panel.
      - lblTab1Empty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =60
            Size: =Typography.SizeBody
            Text: |-
              =If(CountRows(galPrograms.AllItems) = 0,
                 "No programs exist yet. Use Add program above to create one.",
                 "Select a program above to see and edit its details, or use Add program to create one.")
            Visible: =IsBlank(locProgram)
            Width: =Parent.Width - 48
            X: =24
            Y: =Parent.Height / 2 - 30
      - lblTab1NameLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="PROGRAM NAME"
            Visible: =Not(IsBlank(locProgram))
            Width: =360
            X: =24
            Y: =24
      - lblTab1NameValue:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =26
            Size: =Typography.SizeSubtitle
            Text: =locProgram.ProgramName
            Visible: =Not(IsBlank(locProgram))
            Width: =360
            X: =24
            Y: =44
      - lblTab1StateLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="STATE"
            Visible: =Not(IsBlank(locProgram))
            Width: =200
            X: =408
            Y: =24
      - lblTab1StateValue:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(locProgram.State.Value = "Retired",
                 ColorPalette.WarningText, ColorPalette.SuccessText)
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =26
            Size: =Typography.SizeSubtitle
            Text: =locProgram.State.Value
            Visible: =Not(IsBlank(locProgram))
            Width: =200
            X: =408
            Y: =44
      - lblTab1DescLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="DESCRIPTION"
            Visible: =Not(IsBlank(locProgram))
            Width: =Parent.Width - 48
            X: =24
            Y: =86
      # Full text here — the table truncates at 45 characters, this is where the
      # rest lives.
      - lblTab1DescValue:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =Parent.Height - 160
            PaddingTop: =0
            Size: =Typography.SizeBody
            # A Label centres its text vertically by default, so in a tall box
            # the description floated far below its label.
            VerticalAlign: =VerticalAlign.Top
            Text: |-
              =If(IsBlank(locProgram.Description),
                 "No description recorded.", locProgram.Description)
            Visible: =Not(IsBlank(locProgram))
            Width: =Parent.Width - 48
            X: =24
            Y: =104
      - btnTab1Edit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =34
            HoverFill: =ColorPalette.Gray50
