# Program Options Screen — US7 (RQ072–074, FR-038; FR-038a PROPOSED) — ADMIN
# Rebuilt 2026-07-26. Classic controls only (Constitution II).
# Colours = ColorPalette.*, sizes = Typography.*
#
# Composition (Constitution VIII):
#   · PowerLibs `gallery-filter-header` — sortable headers, used TWICE
#     (programs above, program options in tab 2)
#   · PowerLibs `tab-bar-v2-1` — underline tab bar
#
# ---------------------------------------------------------------------------
# HOW TO TRANSCRIBE (Constitution IV)
# ---------------------------------------------------------------------------
#   1. Open "Program Options Screen". Delete any existing content.
#   2. Paste build/screens/_AdminShell.yaml FIRST.
#   3. Select conMainArea, then paste EVERYTHING BELOW INSIDE IT.
#      Every Parent.* below means conMainArea, not the screen.
#   4. Data sources: PROGRAMS, PROGRAM_OPTIONS.
#   5. OnVisible — transcribe by hand (no # prefixes, no leading =):
#
#      UpdateContext({
#          locProgram: Blank(),
#          locOption: Blank(),
#          locTab: 1,
#          locOptForm: false,
#          locProgSort: "ProgramName",
#          locProgAsc: true,
#          locOptSort: "OptionName",
#          locOptAsc: true,
#          locProgMenu: false,
#          locOptMenu: false,
#          locProgModal: false
#      })
#
#   6. Preview (F5) — OnVisible does not run on the design surface.
#
# ---------------------------------------------------------------------------
# KEYS AND THE PARENT / CHILD RELATIONSHIP
# ---------------------------------------------------------------------------
# PROGRAMS.ID is SharePoint's auto-number (Counter) and IS the primary key.
# PROGRAM_OPTIONS.ProgramID is a Lookup storing that value — `.Id` is the key,
# `.Value` is only display text. Nothing else joins these lists.
# ProgramCode was removed 2026-07-26: it was never part of the relationship.
#
# ---------------------------------------------------------------------------
# RETIRE, DO NOT DELETE — both lists
# ---------------------------------------------------------------------------
# PROGRAMS.State and PROGRAM_OPTIONS.State are both Active/Retired. Retiring
# keeps every historical reference resolvable — options under the program,
# rating sheets, committee scores, an applicant's ranked choice — while removing
# it from applicant-facing pickers. Reversible; deletion is not.
#
# BOTH COLUMNS ARE NEW. Re-run build/scripts/New-LdpSharePointLists.ps1 before
# using this screen or every State cell is blank and Retire writes nowhere.
#
# STILL OWED ELSEWHERE: the Application Screen's step 2 dropdowns must filter
# State = "Active" on both lists, or applicants get retired programs/options.
#
# ---------------------------------------------------------------------------
# PROGRAM CRUD IS STILL [PROPOSED — FR-038a]
# ---------------------------------------------------------------------------
# Add/Edit/Retire of PROGRAMS has no ratified requirement; every source treats
# NEXT/MDP/HPP as a closed set. Built here as instructed, but the three program
# toolbar buttons are the fence — delete btnProgAdd, btnProgEdit, btnProgRetire
# and the screen degrades to option management only (Constitution I).
#
# ---------------------------------------------------------------------------
# SORTING
# ---------------------------------------------------------------------------
# Header buttons set locProgSort/locOptSort to a COLUMN NAME STRING and toggle
# the direction. SortByColumns takes the column name as text, which is the only
# reason a clickable-header gallery is possible at all in Power Fx.

- lblPTitle:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHeading
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =30
      Size: =Typography.SizeHeading
      Text: ="Programs"
      Width: =400
      X: =24
      Y: =18

# ===========================================================================
# PROGRAM TOOLBAR — [PROPOSED FR-038a] fence: these three controls
# ===========================================================================
- btnProgActions:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Gray300
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =ColorPalette.TextBody
      Fill: =ColorPalette.White
      FocusedBorderThickness: =1
      Font: =Typography.Family
      Height: =32
      HoverFill: =ColorPalette.Gray50
      OnSelect: |-
        =UpdateContext({ locProgMenu: Not(locProgMenu), locOptMenu: false })
      PressedFill: =ColorPalette.White
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =Typography.SizeBody
      Text: ="Actions  ▾"
      Width: =150
      X: =Parent.Width - 174
      Y: =18

# ---- programs: sortable header row ----
- conProgHead:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =36
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =Parent.Width - 48
      X: =24
      Y: =62
    Children:
      - btnProgHeadName:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1.6
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverFill: =RGBA(0, 0, 0, 0)
            LayoutMinWidth: =0
            # Same column clicked twice flips direction; a new column resets to
            # ascending. locProgSort holds the column NAME as text.
            OnSelect: |-
              =UpdateContext({
                locProgAsc: If(locProgSort = "ProgramName", Not(locProgAsc), true),
                locProgSort: "ProgramName"
              })
            PressedFill: =RGBA(0, 0, 0, 0)
            Size: =Typography.SizeCaption
            Text: |-
              ="Program" & If(locProgSort = "ProgramName", If(locProgAsc, "  ▲", "  ▼"), "")
      - btnProgHeadDesc:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =2.6
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverFill: =RGBA(0, 0, 0, 0)
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locProgAsc: If(locProgSort = "Description", Not(locProgAsc), true),
                locProgSort: "Description"
              })
            PressedFill: =RGBA(0, 0, 0, 0)
            Size: =Typography.SizeCaption
            Text: |-
              ="Description" & If(locProgSort = "Description", If(locProgAsc, "  ▲", "  ▼"), "")
      - btnProgHeadState:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =0.6
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverFill: =RGBA(0, 0, 0, 0)
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locProgAsc: If(locProgSort = "State", Not(locProgAsc), true),
                locProgSort: "State"
              })
            PressedFill: =RGBA(0, 0, 0, 0)
            Size: =Typography.SizeCaption
            Text: |-
              ="State" & If(locProgSort = "State", If(locProgAsc, "  ▲", "  ▼"), "")

- galPrograms:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =168
      # SortByColumns takes the column name as TEXT — that is what makes a
      # clickable-header gallery possible. PROGRAMS is a tiny reference list.
      Items: |-
        =SortByColumns(PROGRAMS, locProgSort,
          If(locProgAsc, SortOrder.Ascending, SortOrder.Descending))
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =44
      Width: =Parent.Width - 48
      X: =24
      Y: =98
    Children:
      - conProgRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            # Selected row is tinted so the tabs below have an obvious subject.
            Fill: |-
              =If(And(Not(IsBlank(locProgram)), ThisItem.ID = locProgram.ID),
                 ColorPalette.Blue50, ColorPalette.White)
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblProgRowName:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.State.Value = "Retired",
                       ColorPalette.TextHelp, ColorPalette.TextHeading)
                  FillPortions: =1.6
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: =ThisItem.ProgramName
            - lblProgRowDesc:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  FillPortions: =2.6
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  # Truncated to 45 characters. A full description overwhelms the
                  # row; the whole text is on the Program details tab.
                  Text: |-
                    =If(Len(ThisItem.Description) > 45,
                       Left(ThisItem.Description, 45) & "…",
                       ThisItem.Description)
            - lblProgRowState:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.State.Value = "Retired",
                       ColorPalette.WarningText, ColorPalette.SuccessText)
                  FillPortions: =0.6
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: =ThisItem.State.Value
      - btnProgRowSelect:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =Parent.TemplateHeight
            HoverColor: =RGBA(0, 0, 0, 0)
            # Translucent, not opaque — this sits ON TOP of the row content.
            HoverFill: =RGBA(0, 0, 0, 0.04)
            OnSelect: |-
              =UpdateContext({
                locProgram: ThisItem, locOption: Blank(),
                locOptForm: false, locTab: 1, locProgMenu: false
              })
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.08)
            Text: |-
              ="Select " & ThisItem.ProgramName
            Width: =Parent.TemplateWidth
            X: =0
            Y: =0
      - recProgRowLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

- lblProgEmpty:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =40
      Size: =Typography.SizeBody
      Text: ="No programs yet. Use Add program to create the first one."
      Visible: =CountRows(galPrograms.AllItems) = 0
      Width: =Parent.Width - 48
      X: =24
      Y: =140

# ===========================================================================
# TAB BAR (PowerLibs tab-bar-v2-1) — underline indicator
# ===========================================================================
- conTabBar:
