# ===========================================================================
# ACTION MENUS — LAST ON PURPOSE
# ===========================================================================
# Power Apps paints later controls on top. Declared earlier, these panels
# rendered UNDERNEATH the galleries and were unclickable. Anything that floats
# over other content — menu, popover, toast — must be declared last.
# Within each menu the scrim comes first so the panel paints on top of it.
- btnProgMenuScrim:
    Control: Classic/Button@2.2.0
    Properties:
      BorderStyle: =BorderStyle.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height
      HoverFill: =RGBA(0, 0, 0, 0)
      OnSelect: |-
        =UpdateContext({ locProgMenu: false })
      PressedFill: =RGBA(0, 0, 0, 0)
      Text: =""
      Visible: =locProgMenu
      Width: =Parent.Width
      X: =0
      Y: =0

- conProgMenu:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =ColorPalette.White
      Height: =112
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Visible: =locProgMenu
      Width: =190
      X: =Parent.Width - 214
      Y: =54
    Children:
      - btnProgAdd:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextBody
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Typography.Family
            Height: =34
            HoverFill: =ColorPalette.Blue50
            # Blank program + tab 1 = the details form opens empty, ready to create.
            OnSelect: |-
              =UpdateContext({
                locProgram: Blank(), locOption: Blank(), locOptForm: false,
                locProgMenu: false, locProgModal: true
              })
            PressedFill: =ColorPalette.Blue50
            Size: =Typography.SizeBody
            Text: ="Add program"
            Width: =Parent.Width
            X: =0
            Y: =2
      - btnProgEdit:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.TextBody
            DisplayMode: |-
              =If(IsBlank(locProgram), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Typography.Family
            Height: =34
            HoverFill: =ColorPalette.Blue50
            OnSelect: |-
              =UpdateContext({ locTab: 1, locProgMenu: false, locProgModal: true })
            PressedFill: =ColorPalette.Blue50
            Size: =Typography.SizeBody
            Text: ="Edit program"
            Width: =Parent.Width
            X: =0
            Y: =38
      - btnProgRetire:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            Color: |-
              =If(locProgram.State.Value = "Retired",
                 ColorPalette.SuccessText, ColorPalette.WarningText)
            DisplayMode: |-
              =If(IsBlank(locProgram), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Typography.Family
            Height: =34
            HoverFill: =ColorPalette.Blue50
            OnSelect: |-
              =UpdateContext({
                locProgram: Patch(PROGRAMS, locProgram,
                  {
                    State: {
                      Value: If(locProgram.State.Value = "Retired", "Active", "Retired")
                    }
                  }),
                locProgMenu: false
              });
              Notify("Program state updated.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue50
            Size: =Typography.SizeBody
            Text: |-
              =If(locProgram.State.Value = "Retired", "Reactivate program", "Retire program")
            Width: =Parent.Width
            X: =0
            Y: =74

# ===========================================================================
# PROGRAM MODAL — PowerLibs `modal-1`, adapted. DECLARED LAST so it paints
# above everything, including the action menus above.
# ===========================================================================
# Adaptations from the generated component:
# · conModalItems shipped with NO Width or Height — it would have rendered at
#   the default control size. Both set here.
# · `showModal` → locProgModal (project convention: context vars use loc).
# · hardcoded RGBA / Size → ColorPalette.* / Typography.*.
# · the generated trigger button is dropped: the Actions menu and the Edit
#   details button are the triggers.
- recProgModalScrim:
    Control: Rectangle@2.3.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0.3)
      Height: =Parent.Height
      Visible: =locProgModal
      Width: =Parent.Width
      X: =0
      Y: =0

- conProgModal:
