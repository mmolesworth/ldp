      - txtProgModalDesc:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(IsBlank(locProgram), "", locProgram.Description)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =110
            Mode: =TextMode.MultiLine
            Size: =Typography.SizeBody
            TabIndex: =2
            Width: =Parent.Width - 48
            X: =24
            Y: =176
      - lblProgModalValidation:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.DangerText
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeCaption
            Text: ="Program name is required."
            Visible: =IsBlank(Trim(txtProgModalName.Text))
            Width: =Parent.Width - 48
            X: =24
            Y: =294
      - btnProgModalSave:
          Control: Classic/Button@2.2.0
          Properties:
            # Solid + BorderThickness 0, NOT BorderStyle.None. None suppresses the
            # border in every state including focus, so FocusedBorderColor and
            # FocusedBorderThickness have nothing to draw and the ring never
            # appears. Thickness 0 keeps the resting button borderless.
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(IsBlank(Trim(txtProgModalName.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.Blue600
            # Focus ring (WCAG 2.4.7). Blue50, not a mid blue: Blue700 and
            # Blue400 sit at the same luminance as this fill (1.37:1 / 1.45:1)
            # and vanish. Blue50 is 4.64:1 on it. See theme.md A11y rule 4.
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Blue700
            # Patch returns the saved record, so locProgram is set either way —
            # a new program becomes the selection and the details tab fills in.
            OnSelect: |-
              =UpdateContext({
                locProgram: Patch(PROGRAMS,
                  If(IsBlank(locProgram), Defaults(PROGRAMS), locProgram),
                  {
                    ProgramName: txtProgModalName.Text,
                    Description: txtProgModalDesc.Text,
                    State: If(IsBlank(locProgram), { Value: "Active" }, locProgram.State)
                  }),
                locProgModal: false,
                locTab: 1
              });
              Notify("Program saved.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =3
            Text: ="Save program"
            Width: =150
            X: =24
            Y: =320
      - btnProgModalCancel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            # Resting border is Gray300; the focus ring is Blue600 at 3px so it
            # is a change, not just a slightly darker line.
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Gray50
            OnSelect: |-
              =UpdateContext({ locProgModal: false })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =4
            Text: ="Cancel"
            Width: =120
            X: =190
            Y: =320
