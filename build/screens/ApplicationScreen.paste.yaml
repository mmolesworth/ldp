- btnSaveDraftAP:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: |-
        =If(Or(gblFormDirty, IsBlank(locApp)), ColorPalette.Blue600, ColorPalette.Blue50)
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: |-
        =If(Or(gblFormDirty, IsBlank(locApp)), ColorPalette.TextOnDark, ColorPalette.Blue50)
      Fill: |-
        =If(Or(gblFormDirty, IsBlank(locApp)), ColorPalette.Blue600, RGBA(0, 0, 0, 0))
      FocusedBorderColor: =ColorPalette.FocusOnDark
      FocusedBorderThickness: =1
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =40
      HoverColor: =Self.Color
      HoverFill: |-
        =If(Or(gblFormDirty, IsBlank(locApp)), ColorPalette.Blue700, ColorPalette.Navy700)
      OnSelect: |-
        =UpdateContext({
          locApp: Patch(APPLICATIONS,
            If(IsBlank(locApp), Defaults(APPLICATIONS), locApp),
            {
              CycleID: {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                Id: locCycle.ID,
                Value: locCycle.CycleName
              },
              ApplicantEmail: Trim(txtEmailAP.Text),
              ApplicantName: txtNameAP.Text,
              Location: txtLocationAP.Text,
              Grade: txtGradeAP.Text,
              JobSeries: txtSeriesAP.Text,
              JobTitle: txtJobTitleAP.Text,
              LatestPerformanceRating: Value(txtRatingAP.Text),
              ListedOnIDP: drpIdpAP.Selected,
              AttendedInfoSession: drpSessionAP.Selected,
              InfoSessionDate: dtpSessionAP.SelectedDate,
              NCUAStartDate: dtpStartAP.SelectedDate,
              ServiceComputationDate: dtpScdAP.SelectedDate,
              FirstLineSupervisorEmail: txtSup1AP.Text,
              SecondLineSupervisorEmail: txtSup2AP.Text,
              ApplicationStatus: { Value: "Draft" },
              PlacementOutcome: { Value: "Decision Pending" }
            })
        });
        Set(gblFormDirty, false);
        // locDropRank2/3 are deliberately NOT cleared here. Clearing a flag
        // un-suppresses that rank's Default, the Default still points at the
        // saved row this handler has not deleted yet, and Power Apps updates a
        // control when its Default changes — so the dropdown repopulates and
        // the ForAll below writes the removed choice straight back.
        //
        // They are cleared in OnVisible instead, where the record is being
        // reloaded anyway and no row is mid-flight. Leaving them set costs
        // nothing: once the row is gone the Default is blank regardless, and a
        // user's own selection is unaffected by a suppressed Default.

        // Save draft persists the program choices too. It used to patch
        // APPLICATIONS alone, so an applicant could pick three programs, save,
        // come back and find nothing — the choices only ever reached SharePoint
        // on Submit.
        //
        // Safe to delete-and-rewrite here ONLY because the six dropdowns now
        // restore from the saved rows on reopen. Without those Defaults this
        // block would wipe the choices it just loaded.
        Remove(APPLICATION_PROGRAM_CHOICES,
          Filter(APPLICATION_PROGRAM_CHOICES, ApplicationID.Id = locApp.ID));
        ForAll(
          Filter(
            Table(
            { PrgId: LookUp(PROGRAMS, ProgramName = drpProgram1AP.Selected.Value).ID,
              PrgName: drpProgram1AP.Selected.Value,
              OptId: LookUp(PROGRAM_OPTIONS,
                And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram1AP.Selected.Value).ID,
                    OptionName = drpOption1AP.Selected.Value)).ID,
              OptName: drpOption1AP.Selected.Value, Rnk: 1 },
            { PrgId: LookUp(PROGRAMS, ProgramName = drpProgram2AP.Selected.Value).ID,
              PrgName: drpProgram2AP.Selected.Value,
              OptId: LookUp(PROGRAM_OPTIONS,
                And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram2AP.Selected.Value).ID,
                    OptionName = drpOption2AP.Selected.Value)).ID,
              OptName: drpOption2AP.Selected.Value, Rnk: 2 },
            { PrgId: LookUp(PROGRAMS, ProgramName = drpProgram3AP.Selected.Value).ID,
              PrgName: drpProgram3AP.Selected.Value,
              OptId: LookUp(PROGRAM_OPTIONS,
                And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpProgram3AP.Selected.Value).ID,
                    OptionName = drpOption3AP.Selected.Value)).ID,
              OptName: drpOption3AP.Selected.Value, Rnk: 3 }
            ),
            Not(IsBlank(PrgId))
          ) As ch,
          Patch(APPLICATION_PROGRAM_CHOICES, Defaults(APPLICATION_PROGRAM_CHOICES),
            {
              ApplicationID: {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                Id: locApp.ID,
                Value: locApp.ApplicantEmail
              },
              ProgramID: {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                Id: ch.PrgId,
                Value: ch.PrgName
              },
              ProgramOptionID:
                If(Not(IsBlank(ch.OptId)),
                  {
                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                    Id: ch.OptId,
                    Value: ch.OptName
                  },
                  Blank()),
              Rank: ch.Rnk
            })
        );

        // Competencies. ADD FIRST, THEN REMOVE — a failed write then costs the
        // additions rather than the whole set, which is what a delete-and-
        // rewrite cost on the DTD panel when a required Title column made every
        // Patch fail. colAppCompsWas is the stored set snapshotted BEFORE any
        // write, so "already there" is judged against the server.
        ClearCollect(colAppCompsWas,
          ForAll(
            Filter(APPLICATION_COMPETENCIES,
              ApplicationID.Id = locApp.ID) As sv,
            { CompId: sv.CompetencyID.Id }));
        ForAll(
          Filter(colAppComps, Not(CompId in colAppCompsWas.CompId)) As cc,
          Patch(APPLICATION_COMPETENCIES, Defaults(APPLICATION_COMPETENCIES),
            {
              ApplicationID: {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                Id: locApp.ID,
                Value: locApp.ApplicantEmail
              },
              CompetencyID: {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                Id: cc.CompId,
                Value: cc.CompName
              }
            }));
        Remove(APPLICATION_COMPETENCIES,
          Filter(APPLICATION_COMPETENCIES,
            ApplicationID.Id = locApp.ID,
            Not(CompetencyID.Id in colAppComps.CompId)));

        // Three document slots exist for every draft. An attachment needs a row
        // to attach to, so the rows must be created before the Attachments
        // controls have anything to bind to — including on a brand-new
        // application, where locApp only exists after the Patch above.
        //
        // Guarded per type rather than delete-and-rewrite: these rows CARRY THE
        // FILES. Removing one to recreate it would destroy the attachment.
        ForAll(
          Filter(
            Table(
              { DocType: "Resume" },
              { DocType: "Statement of Interest" },
              { DocType: "Performance Appraisal" }
            ),
            IsBlank(LookUp(APPLICATION_DOCUMENTS,
              And(ApplicationID.Id = locApp.ID, DocumentType.Value = DocType)))
          ) As dt,
          Patch(APPLICATION_DOCUMENTS, Defaults(APPLICATION_DOCUMENTS),
            {
              ApplicationID: {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                Id: locApp.ID,
                Value: locApp.ApplicantEmail
              },
              DocumentType: { Value: dt.DocType }
            })
        );
        Notify("Draft saved. You can close this and come back to it.", NotificationType.Success)
      PressedColor: =Self.Color
      PressedFill: |-
        =If(Or(gblFormDirty, IsBlank(locApp)), ColorPalette.Blue700, ColorPalette.Navy700)
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      Text: |-
        =If(Or(gblFormDirty, IsBlank(locApp)), "Save draft", "Saved  ✓")
      Tooltip: |-
        =If(Or(gblFormDirty, IsBlank(locApp)), "Save your progress", "Everything is saved")
      Visible: |-
        =And(locCycle.State.Value = "Open",
           Or(IsBlank(locApp), locApp.ApplicationStatus.Value = "Draft"))
      Width: =140
      X: =Parent.Width - 188
      Y: =224

