    Children:
      - lblS2TitleAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =26
            Size: =Typography.SizeHeading
            Text: ="Program choices"
            Width: =Parent.Width - 48
            X: =24
            Y: =20
      - lblS2HintAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="Choose one to three options, highest preference first. Pick a program, then an option within it. At least one choice is required."
            Width: =Parent.Width - 48
            X: =24
            Y: =50
      - lblChoice1AP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =22
            Size: =Typography.SizeBody
            Text: ="First choice (required)"
            Width: =240
            X: =24
            Y: =88
      - drpProgram1AP:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            ChevronBackground: =ColorPalette.Blue600
            ChevronFill: =ColorPalette.TextOnDark
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =32
            Items: |-
              =Sort(Filter(PROGRAMS, State.Value <> "Retired"), ProgramName)
            SelectionColor: =ColorPalette.TextOnDark
            SelectionFill: =ColorPalette.Blue600
            Size: =Typography.SizeBody
            Width: =300
            X: =24
            Y: =114
      - drpOption1AP:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            ChevronBackground: =ColorPalette.Blue600
            ChevronFill: =ColorPalette.TextOnDark
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =32
            Items: |-
              =Sort(
                Filter(PROGRAM_OPTIONS,
                  ProgramID.Id = drpProgram1AP.Selected.ID,
                  State.Value = "Active"),
                OptionName)
            SelectionColor: =ColorPalette.TextOnDark
            SelectionFill: =ColorPalette.Blue600
            Size: =Typography.SizeBody
            Visible: |-
              =Not(IsEmpty(Filter(PROGRAM_OPTIONS,
                 ProgramID.Id = drpProgram1AP.Selected.ID,
                 State.Value = "Active")))
            Width: =Parent.Width - 372
            X: =340
            Y: =114
      - lblNoOption1AP:
