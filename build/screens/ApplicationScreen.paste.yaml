            Text: ="Supporting documents"
            Width: =Parent.Width - 48
            X: =24
            Y: =20
      - lblS5BlockerAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
            Height: =104
            Size: =Typography.SizeCaption
            Text: ="OI-APP-1 — three independent document slots cannot be built on the current data model. SharePoint item attachments are a single unnamed collection, so there is no way to tell a resume from a statement of interest, and the control enforces neither PDF/Word nor a size limit. Canvas apps also expose attachments only inside a Form control's data card, so no attachment control can be pasted here."
            Width: =Parent.Width - 48
            X: =24
            Y: =54
      - lblS5OptionsAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =120
            Size: =Typography.SizeBody
            Text: ="Option A — keep attachments and distinguish the three documents by a filename convention, validated in a Power Automate flow. Cheapest, weakest guarantee. Option B — replace attachments with a document library keyed to the application ID, one row per document with its own type, size and content-type validation. Strongest, changes the data model. Option C — three link columns pointing at files stored elsewhere. Avoids the problem, moves it to another system."
            Width: =Parent.Width - 48
            X: =24
            Y: =166
      - lblS5InterimAP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =60
            Size: =Typography.SizeCaption
            Text: ="Interim, for something usable now — insert a Form control bound to APPLICATIONS in Studio, keep only its Attachments data card, and place it in this panel. That gives attach, download and remove against one shared collection, which is RQ009 minus the three-slot identity and the file-type and size guards."
            Width: =Parent.Width - 48
            X: =24
            Y: =294

