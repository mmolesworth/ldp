            OnSelect: |-
              =UpdateContext({ locStep: 4 })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeCaption
            Text: ="Go to step 4"
            Width: =120
            X: =Parent.Width - 144
            Y: =182
      - lblS6Check5AP:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
