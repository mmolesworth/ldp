
- conBodyLD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Width: =Parent.Width
      X: =0
      Y: =conUtilityBar.Y + conUtilityBar.Height + 20
      Height: =Parent.Height - Self.Y
    Children:
      - conHeroLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =160
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - 48
            X: =24
            Y: =16
          Children:
            - lblHeroHeadlineLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =38
                  Size: =Typography.SizeHero
                  Text: ="Apply to the Leader Development Program"
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =28
            - lblHeroSubheadLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDarkMuted
                  Font: =Typography.Family
                  Height: =48
                  Size: =Typography.SizeSubtitle
                  Text: |-
                    =Switch(locCycle.State.Value,
                      "Open",
                        "Now accepting applications for " & locCycle.CycleName & ". Deadline " &
                        Text(locCycle.CloseDate, "mmmm d, yyyy") & "; decisions by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "Closed",
                        "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                        ". Applicants will be notified by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "In Review",
                        "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                        ". Applicants will be notified by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "Scheduled",
                        "Not yet accepting applications. The " & locCycle.CycleName & " cycle opens " &
                        Text(locCycle.OpenDate, "mmmm d, yyyy") & ".",
                      "No application cycle is currently scheduled.")
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =66
            - lblHeroOutcomeLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =24
                  Size: =Typography.SizeBody
                  Text: |-
                    =Switch(locApp.PlacementOutcome.Value,
                      "Placed", "You have been placed in this cohort.",
                      "Not Selected", "You were not selected for this cohort.",
                      "Placement Declined", "You declined your placement in this cohort.",
                      "")
                  Visible: |-
                    =And(Not(IsBlank(locApp.PlacementOutcome.Value)),
                       locApp.PlacementOutcome.Value <> "Decision Pending")
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =120
            - btnApplyTodayLD:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =ColorPalette.TextOnDark
                  DisplayMode: |-
                    =If(locCycle.State.Value = "Open", DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =ColorPalette.Blue600
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =52
                  HoverColor: =ColorPalette.TextOnDark
                  HoverFill: =ColorPalette.Blue700
                  OnSelect: =Navigate('Application Screen')
                  PressedColor: =ColorPalette.TextOnDark
                  PressedFill: =ColorPalette.Blue700
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeHeading
                  Text: |-
                    =If(IsBlank(locApp), "Apply Today", "Finish your application")
                  Width: =240
                  X: =Parent.Width - 268
                  Y: =40
            - lblCtaWhyLD:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextOnDarkMuted
                  Font: =Typography.Family
                  Height: =28
                  Size: =Typography.SizeCaption
                  Text: ="Applications can only be submitted while a cycle is open."
                  Visible: =locCycle.State.Value <> "Open"
                  Width: =240
                  X: =Parent.Width - 268
                  Y: =128
      
      - lblProgramsHeaderLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =24
            Size: =Typography.SizeSubtitle
            Text: ="Learn about the programs"
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =conHeroLD.Y + conHeroLD.Height + 20
      
      - lblProgramsCountLD:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =22
            Size: =Typography.SizeCaption
            Text: |-
              =CountRows(Filter(PROGRAMS, State.Value = "Active")) & " programs" &
              If(CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3,
                 " — scroll to see all", "")
            Visible: =conHeroLD.Visible
            Width: =320
            X: =Parent.Width - 344
            Y: =lblProgramsHeaderLD.Y
      
      - conProgramsWellLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray25
            Height: =198
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =lblProgramsHeaderLD.Y + 28
          Children:
            - galProgramsLD:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =ColorPalette.Gray200
                  Height: =Parent.Height - 16
                  Items: =Filter(PROGRAMS, State.Value = "Active")
                  ShowScrollbar: =CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3
                  TemplatePadding: =0
                  TemplateSize: =132
                  Width: =Parent.Width - 16
                  WrapCount: =3
                  X: =8
                  Y: =8
                Children:
                  - conProgramCardLD:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =ColorPalette.White
                        Height: =Parent.TemplateHeight - 4
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.TemplateWidth - 16
                        X: =8
                        Y: =4
                      Children:
                        - lblProgramCardNameLD:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextHeading
                              Font: =Typography.Family
                              FontWeight: =Typography.WeightBold
                              Height: =24
                              Size: =Typography.SizeLabel
                              Text: =ThisItem.ProgramName
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =14
                        - lblProgramCardDescLD:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextBody
                              Font: =Typography.Family
                              Height: =74
                              Size: =Typography.SizeCaption
                              Text: |-
                                =Coalesce(ThisItem.Description, "Description to be supplied by the program office.")
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =42
      
      - lblInfoHeaderLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =22
            Size: =Typography.SizeSubtitle
