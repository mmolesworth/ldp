
- conBodyLD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Width: =Parent.Width
      X: =0
      Y: =conUtilityBar.Y + conUtilityBar.Height + 20
      Height: =Parent.Height - Self.Y
    Children:
      - conHeroLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =160
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - 48
            X: =24
            Y: =16
          Children:
            - lblHeroHeadlineLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =36
                  Size: =Typography.SizeHero
                  Text: ="Apply to the Leader Development Program"
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =28
            - lblHeroSubheadLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDarkMuted
                  Font: =Typography.Family
                  Height: =48
                  Size: =Typography.SizeTitle
                  Text: |-
                    =Switch(locCycle.State.Value,
                      "Open",
                        "Now accepting applications for " & locCycle.CycleName & ". Deadline " &
                        Text(locCycle.CloseDate, "mmmm d, yyyy") & "; decisions by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "Closed",
                        "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                        ". Applicants will be notified by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "In Review",
                        "Applications closed " & Text(locCycle.CloseDate, "mmmm d, yyyy") &
                        ". Applicants will be notified by " &
                        Text(locCycle.ExpectedDecisionDate, "mmmm d, yyyy") & ".",
                      "Scheduled",
                        "Not yet accepting applications. The " & locCycle.CycleName & " cycle opens " &
                        Text(locCycle.OpenDate, "mmmm d, yyyy") & ".",
                      "No application cycle is currently scheduled.")
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =66
            - lblHeroOutcomeLD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =24
                  Size: =Typography.SizeBody
                  Text: |-
                    =Switch(locApp.PlacementOutcome.Value,
                      "Placed", "You have been placed in this cohort.",
                      "Not Selected", "You were not selected for this cohort.",
                      "Placement Declined", "You declined your placement in this cohort.",
                      "")
                  Visible: |-
                    =And(Not(IsBlank(locApp.PlacementOutcome.Value)),
                       locApp.PlacementOutcome.Value <> "Decision Pending")
                  Width: =Parent.Width - 320
                  X: =28
                  Y: =120
            - btnApplyTodayLD:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =ColorPalette.Navy900
                  DisplayMode: |-
                    =If(locCycle.State.Value = "Open", DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =ColorPalette.White
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =52
                  HoverFill: =ColorPalette.Gray50
                  OnSelect: =Navigate('Application Screen')
                  PressedFill: =ColorPalette.Gray50
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =Typography.SizeHeading
                  Text: |-
                    =If(IsBlank(locApp), "Apply Today", "Finish your application")
                  Width: =240
                  X: =Parent.Width - 268
                  Y: =40
            - lblCtaWhyLD:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextOnDarkMuted
                  Font: =Typography.Family
                  Height: =28
                  Size: =Typography.SizeCaption
                  Text: ="Applications can only be submitted while a cycle is open."
                  Visible: =locCycle.State.Value <> "Open"
                  Width: =240
                  X: =Parent.Width - 268
                  Y: =128
      
      - lblProgramsHeaderLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =22
            Size: =Typography.SizeSubtitle
            Text: ="Learn about the programs"
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =conHeroLD.Y + conHeroLD.Height + 20
      
      - lblProgramsCountLD:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =22
            Size: =Typography.SizeCaption
            Text: |-
              =CountRows(Filter(PROGRAMS, State.Value = "Active")) & " programs" &
              If(CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3,
                 " — scroll to see all", "")
            Visible: =conHeroLD.Visible
            Width: =320
            X: =Parent.Width - 344
            Y: =lblProgramsHeaderLD.Y
      
      - conProgramsWellLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray25
            Height: =198
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =lblProgramsHeaderLD.Y + 28
          Children:
            - galProgramsLD:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =ColorPalette.Gray200
                  Height: =Parent.Height - 16
                  Items: =Filter(PROGRAMS, State.Value = "Active")
                  ShowScrollbar: =CountRows(Filter(PROGRAMS, State.Value = "Active")) > 3
                  TemplatePadding: =0
                  TemplateSize: =132
                  Width: =Parent.Width - 16
                  WrapCount: =3
                  X: =8
                  Y: =8
                Children:
                  - conProgramCardLD:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =ColorPalette.White
                        Height: =Parent.TemplateHeight - 8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.TemplateWidth - 16
                        X: =8
                        Y: =4
                      Children:
                        - lblProgramCardNameLD:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextHeading
                              Font: =Typography.Family
                              FontWeight: =Typography.WeightBold
                              Height: =24
                              Size: =Typography.SizeSubtitle
                              Text: =ThisItem.ProgramName
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =14
                        - lblProgramCardDescLD:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorPalette.TextBody
                              Font: =Typography.Family
                              Height: =74
                              Size: =Typography.SizeBody
                              Text: |-
                                =Coalesce(ThisItem.Description, "Description to be supplied by the program office.")
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =42
      
      - lblInfoHeaderLD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =22
            Size: =Typography.SizeSubtitle
            Text: ="What you need to know"
            Visible: =conHeroLD.Visible
            Width: =Parent.Width - 48
            X: =24
            Y: =conProgramsWellLD.Y + conProgramsWellLD.Height + 12
      
      - conNeedLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =72
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =conHeroLD.Visible
            Width: =(Parent.Width - 96) / 4
            X: =24
            Y: =lblInfoHeaderLD.Y + 24
          Children:
            - lblNeedTitleLD:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =26
                  Size: =Typography.SizeTitle
                  Text: ="Before you start"
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =23
      
      - conDatesLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =72
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =conHeroLD.Visible
            Width: =conNeedLD.Width
            X: =conNeedLD.X + conNeedLD.Width + 16
            Y: =conNeedLD.Y
          Children:
            - lblDatesTitleLD:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =26
                  Size: =Typography.SizeTitle
                  Text: ="Key dates"
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =23
      
      - conEligibilityLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =72
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =conHeroLD.Visible
            Width: =conNeedLD.Width
            X: =conDatesLD.X + conNeedLD.Width + 16
            Y: =conNeedLD.Y
          Children:
            - lblEligibilityTitleLD:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =26
                  Size: =Typography.SizeTitle
                  Text: ="Eligibility"
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =23
      
      - conContactLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =ColorPalette.Navy900
            Height: =72
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =conHeroLD.Visible
            Width: =conNeedLD.Width
            X: =conEligibilityLD.X + conNeedLD.Width + 16
            Y: =conNeedLD.Y
          Children:
            - lblContactTitleLD:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextOnDark
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =26
                  Size: =Typography.SizeTitle
                  Text: ="FAQs"
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =23
      - conRoleWellLD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray25
            Height: =116
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - 48
            X: =24
            Y: =Parent.Height - 140
          Children:
            - conBandReviewersLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.White
                  Height: =92
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =(Parent.Width - 36) / 2
                  X: =12
                  Y: =12
                Children:
                  - lblBandReviewersTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =22
                        Size: =Typography.SizeBody
                        Text: ="Reviewing applications?"
                        Width: =Parent.Width - 222
                        X: =20
                        Y: =14
                  - lblBandReviewersDescLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Font: =Typography.Family
                        Height: =40
                        Size: =Typography.SizeCaption
                        Text: |-
                          ="Supervisors approve their employees' requests." & Char(10) &
                          "Committee members score and rank applicants."
                        Width: =Parent.Width - 222
                        X: =20
                        Y: =38
                  - btnBandReviewersLD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Fill: =ColorPalette.White
                        FocusedBorderThickness: =1
                        Font: =Typography.Family
                        Height: =34
                        OnSelect: =Navigate('Supervisor Endorsement Screen')
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =Typography.SizeCaption
                        Text: ="Start reviewing"
                        Width: =170
                        X: =Parent.Width - 190
                        Y: =29
      
            - conBandAdminLD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =ColorPalette.White
                  Height: =92
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =conBandReviewersLD.Width
                  X: =conBandReviewersLD.X + conBandReviewersLD.Width + 12
                  Y: =conBandReviewersLD.Y
                Children:
                  - lblBandAdminTitleLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =22
                        Size: =Typography.SizeBody
                        Text: ="For DTD staff"
                        Width: =Parent.Width - 222
                        X: =20
                        Y: =14
                  - lblBandAdminDescLD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Font: =Typography.Family
                        Height: =40
                        Size: =Typography.SizeCaption
                        Text: ="Manage cycles, scoring, and placement."
                        Width: =Parent.Width - 222
                        X: =20
                        Y: =38
                  - btnBandAdminLD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =ColorPalette.TextBody
                        Fill: =ColorPalette.White
                        FocusedBorderThickness: =1
                        Font: =Typography.Family
                        Height: =34
                        OnSelect: =Navigate('Admin Dashboard Screen')
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =Typography.SizeCaption
                        Text: ="Open administration"
                        Width: =170
                        X: =Parent.Width - 190
                        Y: =29
