              =With(
                 { rows: AddColumns(
                            Filter(colProgRowsPL, programId = locTabPL) As r,
                            IsPlaced,
                               LookUp(colAppPlacementPL, appId = r.appId).placedProgramId = locTabPL) },
                 If(IsBlank(locSortColProgPL),
                    rows,
                    SortByColumns(rows, locSortColProgPL,
                       If(locSortAscProgPL, SortOrder.Ascending, SortOrder.Descending))))
