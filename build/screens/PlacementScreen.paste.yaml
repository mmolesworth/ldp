                  X: =Parent.Width - 264
                  Y: =Parent.Height - Self.Height - 20
            - btnNotSelConfirmPL:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =ColorPalette.TextOnDark
                  Fill: =ColorPalette.WarningText
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =36
                  HoverColor: =ColorPalette.TextOnDark
                  HoverFill: =ColorPalette.WarningText
                  OnSelect: |-
                    =Patch(APPLICATIONS, locNotSelAppPL,
                       { PlacementOutcome: { Value: "Not Selected" },
                         ReviewStage:      { Value: "Pending Notification" } });
                     UpdateContext({ locNotSelModalPL: false })
                  PressedColor: =ColorPalette.TextOnDark
                  PressedFill: =ColorPalette.WarningText
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =Typography.SizeBody
                  Text: ="Not select"
                  Width: =120
                  X: =Parent.Width - 136
                  Y: =Parent.Height - Self.Height - 20
