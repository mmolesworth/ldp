- conTabsPL:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderStyle: =BorderStyle.None
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.White
      Height: =40
      Width: =Parent.Width - 48
      X: =24
      Y: =76
    Children:
      - galTabsPL:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Height: =Parent.Height
            Items: =colTabsPL
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =galTabsPL.Width / galTabsPL.AllItemsCount
            Width: =Parent.Width
          Children:
            - conTabItemPL:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.TemplateHeight
                  Width: =Parent.TemplateWidth
                Children:
                  - btnTabPL:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: |-
                          =If(locTabPL = ThisItem.id,
                             ColorPalette.Blue600, ColorPalette.TextHelp)
                        Fill: =Color.Transparent
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(locTabPL = ThisItem.id,
                             Typography.WeightBold, Typography.WeightMedium)
                        Height: =Parent.Height
                        HoverBorderColor: =Color.Transparent
                        HoverColor: =ColorPalette.Blue600
                        HoverFill: =ColorPalette.Gray25
                        OnSelect: |-
                          =UpdateContext({ locTabPL: ThisItem.id })
                        PressedBorderColor: =Color.Transparent
                        PressedFill: =ColorPalette.Gray50
                        Size: =Typography.SizeBody
                        Text: =ThisItem.label
                        Width: =Parent.Width
                  - recTabIndPL:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Fill: |-
                          =If(locTabPL = ThisItem.id,
                             ColorPalette.Blue600, Color.Transparent)
                        Height: =3
                        Width: =btnTabPL.Width
                        X: =btnTabPL.Width / 2 - Self.Width / 2
                        Y: =Parent.Height - Self.Height

- conAllAppsPL:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height - Self.Y - 24
      Visible: =Or(locTabPL = -1, locTabPL = -2)
      Width: =Parent.Width - 48
      X: =24
      Y: =conTabsPL.Y + conTabsPL.Height + 16
    Children:
      - conHeaderRowPL:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray50
            Height: =40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width * 2 / 3 - 8
            X: =0
            Y: =0
          Children:
            - lblHdrNamePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "ApplicantName", Not(locSortAscPL), true),
                       locSortColPL: "ApplicantName"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Name" & If(locSortColPL = "ApplicantName", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrTitlePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "JobTitle", Not(locSortAscPL), true),
                       locSortColPL: "JobTitle"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Title" & If(locSortColPL = "JobTitle", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrGradePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "Grade", Not(locSortAscPL), true),
                       locSortColPL: "Grade"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Grade" & If(locSortColPL = "Grade", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrLocationPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "Location", Not(locSortAscPL), true),
                       locSortColPL: "Location"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Location" & If(locSortColPL = "Location", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrPlacementPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: ="Placement"
                  Width: =Parent.Width

      - galApplicantsPL:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =Parent.Height - conHeaderRowPL.Height - 4
            Items: |-
              =With(
                 { rows: Filter(APPLICATIONS,
                          CycleID.Id = locCyclePL.ID,
                          Switch(locTabPL,
                             -1, true,
                             -2, PlacementOutcome.Value = "Not Selected",
                             false)) },
                 If(IsBlank(locSortColPL),
                    rows,
                    SortByColumns(rows, locSortColPL,
                       If(locSortAscPL, SortOrder.Ascending, SortOrder.Descending))))
            OnSelect: |-
              =UpdateContext({ locSelectedAppPL: ThisItem })
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =48
            Width: =conHeaderRowPL.Width
            X: =0
            Y: =conHeaderRowPL.Y + conHeaderRowPL.Height + 2
          Children:
            - conRowPL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingLeft: =12
                  PaddingRight: =12
                  Width: =Parent.TemplateWidth
                Children:
                  - lblRowNamePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        FillPortions: =1
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.ApplicantName
                        Width: =Parent.Width
                  - lblRowTitlePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.JobTitle
                        Width: =Parent.Width
                  - lblRowGradePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Grade
                        Width: =Parent.Width
                  - lblRowLocationPL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Location
                        Width: =Parent.Width
                  - drpRowPlacementPL:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        ChevronBackground: =ColorPalette.White
                        ChevronFill: =ColorPalette.TextHelp
                        Color: =ColorPalette.TextBody
                        Default: |-
                          =LookUp(colAppPlacementPL, appId = ThisItem.ID).label
                        Fill: =ColorPalette.White
                        FillPortions: =1
                        Font: =Typography.Family
                        Height: =32
                        Items: =Filter(colAppOptsPL, appId = ThisItem.ID)
                        LayoutMinWidth: =0
                        OnChange: |-
                          =With(
                             { pgm: LookUp(PROGRAMS, Abbreviation = Self.Selected.label) },
                             Switch(true,
                                Self.Selected.label = "Not Selected",
                                   Patch(APPLICATIONS, ThisItem,
                                      { PlacementOutcome:    { Value: "Not Selected" },
                                        PlacementProgramID:  Blank(),
                                        PlacementOptionID:   Blank() });
                                   Patch(colAppPlacementPL,
                                      LookUp(colAppPlacementPL, appId = ThisItem.ID),
                                      { label: "Not Selected", placedProgramId: Blank() }),
                                Not(IsBlank(pgm)),
                                   Patch(APPLICATIONS, ThisItem,
                                      { PlacementOutcome:   { Value: "Placed" },
                                        PlacementProgramID: {
                                           '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                           Id: pgm.ID,
                                           Value: pgm.ProgramName },
                                        PlacementOptionID:  Blank() });
                                   Patch(colAppPlacementPL,
                                      LookUp(colAppPlacementPL, appId = ThisItem.ID),
                                      { label: pgm.Abbreviation, placedProgramId: pgm.ID }),
                                false))
                        Size: =Typography.SizeBody
            - recRowDividerPL:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1

      - conDetailPL:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorPalette.Gray200
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =Parent.Height
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width * 1 / 3 - 8
            X: =Parent.Width * 2 / 3 + 8
            Y: =0
          Children:
            - lblDetailEmptyPL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =40
                  Size: =Typography.SizeBody
                  Text: ="Select an applicant to see their program choices and scores."
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =IsBlank(locSelectedAppPL.ID)
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =Parent.Height / 2 - 20
                  Wrap: =true
            - lblDetailNamePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =28
                  Size: =Typography.SizeSubtitle
                  Text: =locSelectedAppPL.ApplicantName
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =16
            - lblDetailSubPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: |-
                    =Coalesce(locSelectedAppPL.JobTitle, "") &
                     If(IsBlank(locSelectedAppPL.Grade), "",
                        "  ·  " & locSelectedAppPL.Grade) &
                     If(IsBlank(locSelectedAppPL.Location), "",
                        "  ·  " & locSelectedAppPL.Location)
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =lblDetailNamePL.Y + lblDetailNamePL.Height + 4
            - recDetailRulePL:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =lblDetailSubPL.Y + lblDetailSubPL.Height + 16
            - lblProgsHeadPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="PROGRAMS APPLIED TO"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =recDetailRulePL.Y + recDetailRulePL.Height + 16
            - lblProgsColProgPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="Program"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =120
                  X: =16
                  Y: =lblProgsHeadPL.Y + lblProgsHeadPL.Height + 8
            - lblProgsColScorePL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="Score"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =60
                  X: =Parent.Width - 16 - 60 - 60 - 8
                  Y: =lblProgsColProgPL.Y
            - lblProgsColPctPL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="%"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =60
                  X: =Parent.Width - 16 - 60
                  Y: =lblProgsColProgPL.Y
            - galDetailProgsPL:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =Parent.Height - Self.Y - 16
                  Items: |-
                    =SortByColumns(
                       Filter(APPLICATION_PROGRAM_CHOICES,
                              ApplicationID.Id = locSelectedAppPL.ID),
                       "Rank", SortOrder.Ascending)
                  ShowScrollbar: =true
                  TemplatePadding: =0
                  TemplateSize: =40
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =lblProgsColProgPL.Y + lblProgsColProgPL.Height + 4
                Children:
                  - lblProgNameDPL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        Height: =32
                        Size: =Typography.SizeBody
                        Text: |-
                          =Coalesce(
                             LookUp(PROGRAMS, ID = ThisItem.ProgramID.Id).Abbreviation,
                             ThisItem.ProgramID.Value)
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =120
                        X: =0
                        Y: =4
                  - lblProgScoreDPL:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =32
                        Size: =Typography.SizeBody
                        Text: |-
                          =If(IsBlank(ThisItem.FinalScore), "—", Text(ThisItem.FinalScore))
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =60
                        X: =Parent.TemplateWidth - 60 - 60 - 8
                        Y: =4
                  - lblProgPctDPL:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =32
                        Size: =Typography.SizeBody
                        Text: |-
                          =If(IsBlank(ThisItem.PercentOfPossible), "—",
                             Text(Round(ThisItem.PercentOfPossible * 100, 0)) & "%")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =60
                        X: =Parent.TemplateWidth - 60
                        Y: =4

