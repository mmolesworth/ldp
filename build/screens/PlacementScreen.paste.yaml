                  PressedColor: =ColorPalette.TextHeading
                  PressedFill: =ColorPalette.Gray50
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =Typography.SizeBody
                  Text: ="Cancel"
