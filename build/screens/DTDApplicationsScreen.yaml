        =["All outcomes", "Decision Pending", "Placed", "Not Selected", "Placement Declined"]
      OnChange: |-
        =UpdateContext({ locApp: Blank(), locEditApp: false, locClearWarn: false, locCompsDirty: false, locChoicesDirty: false })
      Size: =Typography.SizeBody
      TabIndex: =4
      Width: =200
      X: =722
      Y: =78

- lblCountDTD:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Right
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =32
      Size: =Typography.SizeBody
      # Singular at one — "1 applicants" is the kind of thing that reads as
      # sloppy on a screen someone uses all day.
      Text: |-
        =CountRows(galApplicationsDTD.AllItems) &
         If(CountRows(galApplicationsDTD.AllItems) = 1, " applicant", " applicants")
      Width: =180
      X: =Parent.Width - 204
      Y: =78

# ===========================================================================
# TABLE — PowerLibs gallery-filter-header
# ===========================================================================
- conHeadDTD:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =36
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =Parent.Width - 48
      X: =24
      Y: =126
    Children:
      # SORT HEADERS. Classic/Button defaults HoverColor to WHITE, which on a
      # transparent HoverFill is invisible text — so every header vanished when
      # the pointer crossed it. Hover is now a step from Gray25 to Gray50 with
      # the label going Blue600: legible, and quiet enough not to compete with
      # the rows below.
      #
      # FocusedBorderThickness was 3 and is now 0. The container is 36px tall
      # and centres its children, so the ring's top and bottom edges fell
      # outside the visible band and only the left and right verticals drew —
      # the brackets. This LOSES the keyboard focus ring on these four controls
      # (theme.md A11y rule 4); it is the one place in the app without one, and
      # belongs in the T081 sweep. Restoring it means giving the container
      # enough height to show the ring, not putting the 3px back.
      - btnHeadNameDTD:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =2
            FocusedBorderThickness: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorPalette.Blue600
            HoverFill: =ColorPalette.Gray50
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locAppAsc: If(locAppSort = "ApplicantName", Not(locAppAsc), true),
                locAppSort: "ApplicantName"
              })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =ColorPalette.Blue700
            PressedFill: =ColorPalette.Gray200
            Size: =Typography.SizeCaption
            Text: |-
              ="Applicant" & If(locAppSort = "ApplicantName", If(locAppAsc, "  ▲", "  ▼"), "")
      - btnHeadStatusDTD:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1
            FocusedBorderThickness: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorPalette.Blue600
            HoverFill: =ColorPalette.Gray50
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locAppAsc: If(locAppSort = "ApplicationStatus", Not(locAppAsc), true),
                locAppSort: "ApplicationStatus"
              })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =ColorPalette.Blue700
            PressedFill: =ColorPalette.Gray200
            Size: =Typography.SizeCaption
            Text: |-
              ="Application status" & If(locAppSort = "ApplicationStatus", If(locAppAsc, "  ▲", "  ▼"), "")
      - btnHeadStageDTD:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1.4
            FocusedBorderThickness: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorPalette.Blue600
            HoverFill: =ColorPalette.Gray50
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locAppAsc: If(locAppSort = "ReviewStage", Not(locAppAsc), true),
                locAppSort: "ReviewStage"
              })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =ColorPalette.Blue700
            PressedFill: =ColorPalette.Gray200
            Size: =Typography.SizeCaption
            Text: |-
              ="Review stage" & If(locAppSort = "ReviewStage", If(locAppAsc, "  ▲", "  ▼"), "")
      - btnHeadPlacementDTD:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextHeading
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1
            FocusedBorderThickness: =0
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorPalette.Blue600
            HoverFill: =ColorPalette.Gray50
            LayoutMinWidth: =0
            OnSelect: |-
              =UpdateContext({
                locAppAsc: If(locAppSort = "PlacementOutcome", Not(locAppAsc), true),
                locAppSort: "PlacementOutcome"
              })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =ColorPalette.Blue700
            PressedFill: =ColorPalette.Gray200
            Size: =Typography.SizeCaption
            Text: |-
              ="Placement outcome" & If(locAppSort = "PlacementOutcome", If(locAppAsc, "  ▲", "  ▼"), "")
      # NOT sortable, and the only header that is not. "2 / 3" is not a column
      # — it is two CountRows per row against two other lists. Sorting by it
      # would mean running both queries for every application in the cycle
      # before the first row could render, where today a gallery only pays for
      # the rows it draws. A plain label rather than a button that lies.
      - lblHeadScoredDTD:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =ColorPalette.TextHeading
            FillPortions: =1.1
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Programs scored"
- galApplicationsDTD:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =190
      # EIGHT branches — every on/off combination of the three filters,
      # each a whole delegable Filter(). One Or() with a control
      # reference inside would be far shorter and would silently stop
      # delegating at 500 rows.
      #
      # Ordered MOST "All"s FIRST: If() takes the first condition that
      # matches, so the least selective case has to be tested first or
      # a narrower branch would shadow it. The final branch is the
      # default — no filter set to "All", so all three predicates apply.
      #
      # SORTING A CHOICE COLUMN. SortByColumns takes a column NAME and needs a
      # scalar; a SharePoint Choice arrives as a record ({Value, Id}), so
      # naming one is an error rather than a sort — which is why the status and
      # stage headers used to throw.
      #
      # Sort() takes an EXPRESSION instead, evaluated in each row's scope, so
      # the key can be a Switch that picks the right field. locAppSort is a
      # screen variable and constant across rows; every branch returns text, so
      # the types unify. One copy of the filter, no projected columns to name.
      #
      # Sorting by an expression does not delegate. The Filter() inside still
      # does — the query goes to SharePoint narrowed to one cycle and only the
      # sort happens locally. Same bound as the per-row counts below: fine to
      # ~500 applications in a cycle, wrong above it.
      Items: |-
        =Sort(
          If(
            And(drpStatusDTD.Selected.Value = "All statuses", drpStageDTD.Selected.Value = "All stages", drpOutcomeDTD.Selected.Value = "All outcomes"),
               Filter(APPLICATIONS, CycleID.Id = locCycle.ID),

            And(drpStatusDTD.Selected.Value = "All statuses", drpStageDTD.Selected.Value = "All stages"),
               Filter(APPLICATIONS, CycleID.Id = locCycle.ID,
               PlacementOutcome.Value = drpOutcomeDTD.Selected.Value),

            And(drpStatusDTD.Selected.Value = "All statuses", drpOutcomeDTD.Selected.Value = "All outcomes"),
               Filter(APPLICATIONS, CycleID.Id = locCycle.ID,
               ReviewStage.Value = drpStageDTD.Selected.Value),

            And(drpStageDTD.Selected.Value = "All stages", drpOutcomeDTD.Selected.Value = "All outcomes"),
               Filter(APPLICATIONS, CycleID.Id = locCycle.ID,
               ApplicationStatus.Value = drpStatusDTD.Selected.Value),

            drpStatusDTD.Selected.Value = "All statuses",
               Filter(APPLICATIONS, CycleID.Id = locCycle.ID,
               ReviewStage.Value = drpStageDTD.Selected.Value,
               PlacementOutcome.Value = drpOutcomeDTD.Selected.Value),

            drpStageDTD.Selected.Value = "All stages",
               Filter(APPLICATIONS, CycleID.Id = locCycle.ID,
               ApplicationStatus.Value = drpStatusDTD.Selected.Value,
               PlacementOutcome.Value = drpOutcomeDTD.Selected.Value),

            drpOutcomeDTD.Selected.Value = "All outcomes",
               Filter(APPLICATIONS, CycleID.Id = locCycle.ID,
               ApplicationStatus.Value = drpStatusDTD.Selected.Value,
               ReviewStage.Value = drpStageDTD.Selected.Value),

            Filter(APPLICATIONS, CycleID.Id = locCycle.ID,
               ApplicationStatus.Value = drpStatusDTD.Selected.Value,
               ReviewStage.Value = drpStageDTD.Selected.Value,
               PlacementOutcome.Value = drpOutcomeDTD.Selected.Value)),
          Switch(locAppSort,
            "ApplicationStatus", ApplicationStatus.Value,
            "ReviewStage",       ReviewStage.Value,
            "PlacementOutcome",  PlacementOutcome.Value,
            ApplicantName),
          If(locAppAsc, SortOrder.Ascending, SortOrder.Descending))
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =48
      Width: =Parent.Width - 48
      X: =24
      Y: =162
    Children:
      - conRowDTD:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: |-
              =If(And(Not(IsBlank(locApp)), ThisItem.ID = locApp.ID),
                 ColorPalette.Blue50, ColorPalette.White)
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblRowNameDTD:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =2
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: =ThisItem.ApplicantName
            # Where the APPLICATION is.
            # Submitted is AMBER, not green: under the new status column it
            # means "submitted and waiting on DTD to accept it", which is a
            # queue, not a finish line. Validated is the green one. Sorting
            # this column therefore groups DTD's work without a filter.
            #
            # Plain labels, not badges. The badges live in the detail panel,
            # where there are three of them against one record; a table of
            # 20 rows x 3 pills is more chrome than content. The COLOUR still
            # carries the meaning — amber waiting outside DTD, red DTD owes an
            # action, blue in progress, green done.
            - lblRowStatusDTD:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(ThisItem.ApplicationStatus.Value,
                       "Draft", ColorPalette.Blue700,
                       "Submitted", ColorPalette.WarningText,
                       "Validated", ColorPalette.SuccessText,
                       "Withdrawn", ColorPalette.TextHelp,
                       ColorPalette.TextHelp)
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: =ThisItem.ApplicationStatus.Value
            - lblRowStageDTD:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(ThisItem.ReviewStage.Value,
                       "Pending First-Line", ColorPalette.WarningText,
                       "Pending Second-Line", ColorPalette.WarningText,
                       "Needs Supervisor Assigned", ColorPalette.DangerText,
                       "Pending DTD Validation", ColorPalette.Blue700,
                       "Committee Review", ColorPalette.Navy700,
                       "Pending Placement", ColorPalette.Blue600,
                       "Pending Notification", ColorPalette.DangerText,
                       "Complete", ColorPalette.SuccessText,
                       ColorPalette.TextHelp)
                  FillPortions: =1.4
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  # A Draft has no stage yet — an em dash, so the cell reads as
                  # "nothing yet" rather than as something failing to render.
                  Text: |-
                    =If(IsBlank(ThisItem.ReviewStage.Value), "—",
                       ThisItem.ReviewStage.Value)
            - lblRowPlacementDTD:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(ThisItem.PlacementOutcome.Value,
                       "Placed", ColorPalette.SuccessText,
                       "Not Selected", ColorPalette.WarningText,
                       "Placement Declined", ColorPalette.TextHelp,
                       ColorPalette.TextHelp)
                  FillPortions: =1
                  Font: =Typography.Family
                  # Regular weight while undecided, medium once it is real —
                  # "Decision Pending" is true of most rows most of the time.
                  FontWeight: |-
                    =If(Or(IsBlank(ThisItem.PlacementOutcome.Value),
                           ThisItem.PlacementOutcome.Value = "Decision Pending"),
                       Typography.WeightRegular, Typography.WeightMedium)
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: |-
                    =If(Or(IsBlank(ThisItem.PlacementOutcome.Value),
                           ThisItem.PlacementOutcome.Value = "Decision Pending"),
                       "—", ThisItem.PlacementOutcome.Value)
            - lblRowScoredDTD:
                Control: Label@2.5.1
                Properties:
                  # DISTINCT PROGRAMS in the denominator, not choice rows.
                  # COMMITTEE_SCORES is keyed (ApplicationID, ProgramID), so an
                  # applicant who ranks HPP twice with two options has three
                  # choices and only two things to score. Counting rows made
                  # that "2 / 3" forever: parity unreachable, and the green
                  # "ready to rank" state unreachable with it.
                  #
                  # Legal since 2026-07-31, when ranking the same program with
                  # a different option became allowed — so this is a
                  # consequence of that decision, not an older bug.
                  #
                  # Distinct() returns a one-column table of unique values. Not
                  # delegable, like the CountRows around it — accepted for the
                  # reason in the header: a cycle is bounded, and a gallery only
                  # evaluates the rows it draws.
                  Color: |-
                    =If(
                      And(CountRows(Distinct(Filter(APPLICATION_PROGRAM_CHOICES,
                            ApplicationID.Id = ThisItem.ID), ProgramID.Id)) > 0,
                          CountRows(Filter(COMMITTEE_SCORES,
                            ApplicationID.Id = ThisItem.ID)) =
                          CountRows(Distinct(Filter(APPLICATION_PROGRAM_CHOICES,
                            ApplicationID.Id = ThisItem.ID), ProgramID.Id))),
                      ColorPalette.SuccessText, ColorPalette.TextHelp)
                  FillPortions: =1.1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: |-
                    =CountRows(Filter(COMMITTEE_SCORES,
                       ApplicationID.Id = ThisItem.ID)) & " / " &
                     CountRows(Distinct(Filter(APPLICATION_PROGRAM_CHOICES,
                       ApplicationID.Id = ThisItem.ID), ProgramID.Id))
      # Row overlay. Selecting a row is the only interaction — the detail
      # panel below is always present and simply follows locApp.
      - btnRowSelectDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0.04)
            OnSelect: |-
              =UpdateContext({
                locApp: ThisItem, locEditApp: false, locClearWarn: false,
                locCompsDirty: false, locChoicesDirty: false,
                locCompTypeDTD:
                  First(SortByColumns(
                    Filter(COMPETENCY_TYPES, State.Value = "Active"),
                    "SortOrder", SortOrder.Ascending)).ID
              })
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.08)
            Text: |-
              ="Select " & ThisItem.ApplicantName
            Tooltip: ="Select this application"
            Width: =Parent.TemplateWidth
            X: =0
            Y: =0
      - recRowLineDTD:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

- lblEmptyDTD:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =40
      Size: =Typography.SizeBody
      Text: |-
        =If(
          And(drpStatusDTD.Selected.Value = "All statuses",
              drpStageDTD.Selected.Value = "All stages",
              drpOutcomeDTD.Selected.Value = "All outcomes"),
          "No applications in this cycle yet.",
          "No applications match these filters.")
      Visible: =CountRows(galApplicationsDTD.AllItems) = 0
      Width: =Parent.Width - 48
      X: =24
      Y: =216

# ===========================================================================
# DETAIL PANEL — the selected application, tabbed by the wizard's own steps
# ===========================================================================
# Tabs mirror ApplicationScreen: Personnel, Program choices, Competencies,
# Eligibility, Documents. Review is omitted — the panel IS the review.
#
# Fields are grouped into multi-line labels rather than one control per field.
# Forty separate labels would be forty things to keep aligned for no gain: this
# panel is read-only, so nothing here needs its own hit target or tab stop.
- conDetailDTD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =Max(300, Parent.Height - 388)
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =Parent.Width - 48
      X: =24
      Y: =364
    Children:
      # HEADER BANNER. Declared first — z-order is declaration order, so the
      # name, email and badges all draw on top of it.
      #
      # A GroupContainer, not a Rectangle: only Button, GroupContainer and
      # Image support Radius, and the top corners have to match the panel's own
      # 10px or the banner squares off the card it sits in. Bottom corners stay
      # square so it meets the body flush.
      - conDetailHeaderDTD:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            # Navy850, matching the admin sidebar (_AdminShell). The palette
            # splits into Primary Navy for SURFACES and Accent Blue for accents
            # — _NavBar uses Blue600 only for the selected-item indicator — so
            # an accent blue here read as a stray highlight rather than a
            # surface. Navy900 is the utility bar's shade; this panel sits
            # beside the sidebar, so it takes the sidebar's.
            Fill: =ColorPalette.Navy850
            Height: =52
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =Not(IsBlank(locApp))
            Width: =Parent.Width
            X: =0
            Y: =0
      - lblDetailEmptyDTD:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =40
            Size: =Typography.SizeBody
            Text: ="Select an application above to see its full detail."
            Visible: =IsBlank(locApp)
            Width: =Parent.Width - 48
            X: =24
            Y: =Parent.Height / 2 - 20

      - lblDetailNameDTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextOnDark
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =24
            Size: =Typography.SizeHeading
            Text: =locApp.ApplicantName
            Visible: =Not(IsBlank(locApp))
            Width: =Parent.Width - 560
            X: =24
            Y: =5
      - lblDetailEmailDTD:
          Control: Label@2.5.1
          Properties:
            # Blue50, not white: the email is secondary to the name and needs
            # to read that way. 11.9:1 on Navy850, well past AA.
            Color: =ColorPalette.Blue50
            Font: =Typography.Family
            Height: =20
            Size: =Typography.SizeBody
            Text: =locApp.ApplicantEmail
            Visible: =Not(IsBlank(locApp))
            Width: =Parent.Width - 560
            X: =24
            Y: =28
      # Three badges, top right, no segment labels — the values say what they
      # are. Laid out RIGHT to LEFT: the outcome anchors to the panel edge and
      # each earlier badge positions off the one after it, so the row stays
      # flush right whatever the values are. Each fallback skips a hidden
      # neighbour, which is why a Draft (no stage, no outcome) still puts its
      # single badge against the right edge instead of leaving two gaps.
      #
      # The status badge carries validation now: a Validated application says
      # so here, in the same place it says Submitted.
      - btnDetailStatusBadgeDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Self.Color
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: |-
              =Switch(locApp.ApplicationStatus.Value,
                 "Draft", ColorPalette.Blue700,
                 "Submitted", ColorPalette.WarningText,
                 "Validated", ColorPalette.SuccessText,
                 "Withdrawn", ColorPalette.TextHelp,
                 ColorPalette.TextHelp)
            DisplayMode: =DisplayMode.View
            # Fill is the palette's DESIGNED pair for the text
            # colour, not ColorFade(Self.Color, 80%). The component's
            # derived fill lands too light for the warm hues — amber
            # came out at 3.8:1 and red at 3.5:1, both under AA at
            # 9pt. Switching on Self.Color rather than on the value
            # means this can never drift from the Color expression
            # above it.
            Fill: |-
              =Switch(Self.Color,
                 ColorPalette.WarningText, ColorPalette.WarningLight,
                 ColorPalette.DangerText,  ColorPalette.DangerLight,
                 ColorPalette.SuccessText, ColorPalette.SuccessLight,
                 ColorPalette.TextHelp,    ColorPalette.Gray50,
                 ColorPalette.Blue50)
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =24
            RadiusBottomLeft: =3
            RadiusBottomRight: =3
            RadiusTopLeft: =3
            RadiusTopRight: =3
            Size: =Typography.SizeCaption
            Text: =locApp.ApplicationStatus.Value
            Visible: =Not(IsBlank(locApp))
            Width: =Len(Self.Text) * 5.6 + 26
            X: |-
              =If(btnDetailStageBadgeDTD.Visible,
                 btnDetailStageBadgeDTD.X - 8,
                 If(btnDetailOutcomeBadgeDTD.Visible,
                    btnDetailOutcomeBadgeDTD.X - 8,
                    Parent.Width - 24)) - Self.Width
            Y: =14
      - btnDetailStageBadgeDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Self.Color
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: |-
              =Switch(locApp.ReviewStage.Value,
                 "Pending First-Line", ColorPalette.WarningText,
                 "Pending Second-Line", ColorPalette.WarningText,
                 "Needs Supervisor Assigned", ColorPalette.DangerText,
                 "Pending DTD Validation", ColorPalette.Blue700,
                 "Committee Review", ColorPalette.Navy700,
                 "Pending Placement", ColorPalette.Blue600,
                 "Pending Notification", ColorPalette.DangerText,
                 "Complete", ColorPalette.SuccessText,
                 ColorPalette.TextHelp)
            DisplayMode: =DisplayMode.View
            # Fill is the palette's DESIGNED pair for the text
            # colour, not ColorFade(Self.Color, 80%). The component's
            # derived fill lands too light for the warm hues — amber
            # came out at 3.8:1 and red at 3.5:1, both under AA at
            # 9pt. Switching on Self.Color rather than on the value
            # means this can never drift from the Color expression
            # above it.
            Fill: |-
              =Switch(Self.Color,
                 ColorPalette.WarningText, ColorPalette.WarningLight,
                 ColorPalette.DangerText,  ColorPalette.DangerLight,
                 ColorPalette.SuccessText, ColorPalette.SuccessLight,
                 ColorPalette.TextHelp,    ColorPalette.Gray50,
                 ColorPalette.Blue50)
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =24
            RadiusBottomLeft: =3
            RadiusBottomRight: =3
            RadiusTopLeft: =3
            RadiusTopRight: =3
            Size: =Typography.SizeCaption
            Text: =locApp.ReviewStage.Value
            Visible: |-
              =And(Not(IsBlank(locApp)), Not(IsBlank(locApp.ReviewStage.Value)))
            Width: =Len(Self.Text) * 5.6 + 26
            X: |-
              =If(btnDetailOutcomeBadgeDTD.Visible,
                 btnDetailOutcomeBadgeDTD.X - 8,
                 Parent.Width - 24) - Self.Width
            Y: =14
      - btnDetailOutcomeBadgeDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Self.Color
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: |-
              =Switch(locApp.PlacementOutcome.Value,
                 "Placed", ColorPalette.SuccessText,
                 "Not Selected", ColorPalette.WarningText,
                 "Placement Declined", ColorPalette.TextHelp,
                 ColorPalette.TextHelp)
            DisplayMode: =DisplayMode.View
            # Fill is the palette's DESIGNED pair for the text
            # colour, not ColorFade(Self.Color, 80%). The component's
            # derived fill lands too light for the warm hues — amber
            # came out at 3.8:1 and red at 3.5:1, both under AA at
            # 9pt. Switching on Self.Color rather than on the value
            # means this can never drift from the Color expression
            # above it.
            Fill: |-
              =Switch(Self.Color,
                 ColorPalette.WarningText, ColorPalette.WarningLight,
                 ColorPalette.DangerText,  ColorPalette.DangerLight,
                 ColorPalette.SuccessText, ColorPalette.SuccessLight,
                 ColorPalette.TextHelp,    ColorPalette.Gray50,
                 ColorPalette.Blue50)
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =24
            RadiusBottomLeft: =3
            RadiusBottomRight: =3
            RadiusTopLeft: =3
            RadiusTopRight: =3
            Size: =Typography.SizeCaption
            Text: =locApp.PlacementOutcome.Value
            # Hidden until there is a decision. Its neighbours are positioned
            # from the badge BEFORE it, not from this one, so hiding it leaves
            # no gap.
            Visible: |-
              =And(Not(IsBlank(locApp)),
                 Not(IsBlank(locApp.PlacementOutcome.Value)),
                 locApp.PlacementOutcome.Value <> "Decision Pending")
            Width: =Len(Self.Text) * 5.6 + 26
            X: =Parent.Width - 24 - Self.Width
            Y: =14

      # Advances ApplicationStatus, which is the whole of what validation
      # is now: Submitted -> Validated, and back again if DTD changes its mind
      # or the applicant edits. There is no separate flag to keep in step.
      #
      # Sits on the tab row rather than under the badges: the badges end at
      # y=40 and the tabs start at y=70, and a 32px button does not fit in 30px.
      - btnValidateDTD:
          Control: Classic/Button@2.2.0
          Properties:
            # Validated is shown by the status badge above. This button
            # therefore never states the state — it states what clicking DOES.
            # Green "Validated ✓" read as a badge, so nobody expected it to be
            # live, and a single click silently undid the validation.
            BorderColor: |-
              =If(locApp.ApplicationStatus.Value = "Validated",
                 ColorPalette.Gray300, ColorPalette.Blue600)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: |-
              =If(locApp.ApplicationStatus.Value = "Validated", 1, 0)
            Color: |-
              =If(locApp.ApplicationStatus.Value = "Validated",
                 ColorPalette.TextBody, ColorPalette.TextOnDark)
            # A Draft has not been submitted — there is nothing to accept yet.
            # It still reads "Validate application", greyed: the button states
            # what has not happened, which is true of a draft too.
            DisplayMode: |-
              =If(locApp.ApplicationStatus.Value = "Draft",
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: |-
              =If(locApp.ApplicationStatus.Value = "Validated",
                 ColorPalette.White, ColorPalette.Blue600)
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =32
            HoverColor: =Self.Color
            HoverFill: |-
              =If(locApp.ApplicationStatus.Value = "Validated",
                 ColorPalette.Gray50, ColorPalette.Blue700)
            # Patch returns the saved record, so locApp updates in place and the
            # button, the badge and the gallery row all re-render off the same
            # value without a re-query. Undo goes to Submitted — the state the
            # application was in before DTD accepted it.
            # Validating goes straight through — additive, and undone in one
            # click. CLEARING raises the modal, because it puts the packet back
            # in the queue and used to happen on a single unlabelled click.
            #
            # ONE UpdateContext, not two: every right-hand side reads the
            # PRE-update locApp, so the same test drives both fields. The If
            # after it reads the POST-update locClearWarn, which is true
            # exactly when the modal opened and nothing was written.
            OnSelect: |-
              =UpdateContext({
                locClearWarn: locApp.ApplicationStatus.Value = "Validated",
                locApp: If(locApp.ApplicationStatus.Value = "Validated",
                  locApp,
                  Patch(APPLICATIONS,
                    LookUp(APPLICATIONS, ID = locApp.ID),
                    { ApplicationStatus: { Value: "Validated" } }))
              });
              If(Not(locClearWarn),
                 Notify("Application validated.", NotificationType.Success))
            PressedColor: =Self.Color
            PressedFill: |-
              =If(locApp.ApplicationStatus.Value = "Validated",
                 ColorPalette.White, ColorPalette.Blue700)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeBody
            TabIndex: =7
            Text: |-
              =If(locApp.ApplicationStatus.Value = "Validated",
                 "Clear validation", "Validate application")
            Tooltip: |-
              =If(locApp.ApplicationStatus.Value = "Draft",
                 "A draft has not been submitted — there is nothing to validate",
                 If(locApp.ApplicationStatus.Value = "Validated",
                    "Send this back to Submitted so it waits on DTD again",
                    "Mark this application as reviewed and accepted"))
            # Hidden for a withdrawal — validation is a step on a path the
            # application has left, and offering it would imply it can rejoin.
            Visible: |-
              =And(Not(IsBlank(locApp)),
                 locApp.ApplicationStatus.Value <> "Withdrawn",
                 Not(locEditApp))
            Width: =210
            X: =Parent.Width - 234
            Y: =60

      # ---- edit toggle + save ----
      # Locked by default, same as the cycle detail panel. The toggle doubles
      # as Cancel: leaving edit mode Resets every field, so pending changes are
      # discarded rather than silently kept.
      #
      # UpdateContext runs BEFORE the Resets, not after. Reset re-reads a
      # control's Default, and these Defaults switch on locEditApp — resetting
      # first would re-read the mode we are leaving. This is the opposite order
      # from the cycle screen, where no Default depends on the flag.
      - btnEditToggleDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            # A draft belongs to the applicant, who is still writing it; DTD
            # editing underneath them would be overwritten on their next save.
            DisplayMode: |-
              =If(locApp.ApplicationStatus.Value = "Draft",
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =32
            HoverColor: =Self.Color
            HoverFill: =ColorPalette.Gray50
            OnSelect: |-
              =UpdateContext({ locEditApp: Not(locEditApp), locCompsDirty: false, locChoicesDirty: false });
              ClearCollect(colComps,
                ForAll(
                  Filter(APPLICATION_COMPETENCIES,
                    ApplicationID.Id = locApp.ID) As ac,
                  {
                    CompId: ac.CompetencyID.Id,
                    CompName: ac.CompetencyID.Value,
                    TypeId:
                      LookUp(COMPETENCIES, ID = ac.CompetencyID.Id).CompetencyTypeID.Id,
                    TypeName:
                      LookUp(COMPETENCIES, ID = ac.CompetencyID.Id).CompetencyTypeID.Value,
                    TypeOrder:
                      LookUp(COMPETENCY_TYPES,
                        ID = LookUp(COMPETENCIES,
                               ID = ac.CompetencyID.Id).CompetencyTypeID.Id
                      ).SortOrder
                  }));
              UpdateContext({
                locCompTypeDTD:
                  Coalesce(locCompTypeDTD,
                    First(SortByColumns(
                      Filter(COMPETENCY_TYPES, State.Value = "Active"),
                      "SortOrder", SortOrder.Ascending)).ID)
              });
              Reset(drpAddCompDTD);
              Reset(txtPersNameDTD); Reset(txtPersLocationDTD); Reset(txtPersTitleDTD);
              Reset(txtPersGradeDTD); Reset(txtPersSeriesDTD);
              Reset(txtPersSup1DTD); Reset(txtPersSup2DTD);
              Reset(dtpPersStartDTD); Reset(dtpPersScdDTD);
              Reset(drpEditPrg1DTD); Reset(drpEditOpt1DTD);
              Reset(drpEditPrg2DTD); Reset(drpEditOpt2DTD);
              Reset(drpEditPrg3DTD); Reset(drpEditOpt3DTD);
              Reset(txtEligRatingDTD); Reset(drpEligIdpDTD);
              Reset(drpEligSessionDTD); Reset(dtpEligDateDTD)
            PressedColor: =Self.Color
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeBody
            TabIndex: =5
            Text: |-
              =If(locEditApp, "Cancel", "Edit")
            Tooltip: |-
              =If(locApp.ApplicationStatus.Value = "Draft",
                 "A draft is still the applicant's to change",
                 If(locEditApp, "Discard changes",
                    "Edit the personnel details"))
            Visible: |-
              =And(Not(IsBlank(locApp)),
                 locApp.ApplicationStatus.Value <> "Withdrawn")
            Width: =100
            X: |-
              =If(locEditApp, Parent.Width - 232, Parent.Width - 342)
            Y: =60

      # Choices are removed and rewritten rather than diffed. They carry no
      # data of their own beyond (program, option, rank), nothing references
      # them — COMMITTEE_SCORES keys on ProgramID, not on a choice row — and
      # rank ordering makes an in-place diff more fragile than a replace. Same
      # shape as the applicant's own submit.
      #
      # Writes the nine editable columns. ApplicantEmail is NOT among them:
      # both the Landing and Application screens find an applicant's record
      # with ApplicantEmail = User().Email, so changing it here would detach
      # the application from the person who filed it.
      #
      # ApplicationStatus is NOT touched either. The Validated -> Submitted
      # revert exists because someone changed the application behind DTD's
      # back; DTD changing it themselves is not that. Add
      # ApplicationStatus: { Value: "Submitted" } to the Patch if you would
      # rather have no exception to the rule.
      - btnSaveAppDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            # Blocked while the Program choices tab holds something the
            # applicant's own form would have refused: a program with options
            # and none chosen, or the same (program, option) pair twice. The
            # warning label on that tab says which.
            DisplayMode: |-
              =If(
                Or(And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)), drpEditOpt1DTD.Visible,
                       IsBlank(drpEditOpt1DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg2DTD.Selected.Value)), drpEditOpt2DTD.Visible,
                       IsBlank(drpEditOpt2DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg3DTD.Selected.Value)), drpEditOpt3DTD.Visible,
                       IsBlank(drpEditOpt3DTD.Selected.Value)),
                   And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)),
                       drpEditPrg1DTD.Selected.Value = drpEditPrg2DTD.Selected.Value,
                       Coalesce(drpEditOpt1DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt2DTD.Selected.Value, "")),
                   And(Not(IsBlank(drpEditPrg1DTD.Selected.Value)),
                       drpEditPrg1DTD.Selected.Value = drpEditPrg3DTD.Selected.Value,
                       Coalesce(drpEditOpt1DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt3DTD.Selected.Value, "")),
                   And(Not(IsBlank(drpEditPrg2DTD.Selected.Value)),
                       drpEditPrg2DTD.Selected.Value = drpEditPrg3DTD.Selected.Value,
                       Coalesce(drpEditOpt2DTD.Selected.Value, "") =
                         Coalesce(drpEditOpt3DTD.Selected.Value, ""))),
                DisplayMode.Disabled, DisplayMode.Edit)
            Font: =Typography.Family
            Height: =32
            HoverColor: =Self.Color
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({
                locApp: Patch(APPLICATIONS,
                  LookUp(APPLICATIONS, ID = locApp.ID),
                  {
                    ApplicantName: If(txtPersNameDTD.Text = "—", Blank(), txtPersNameDTD.Text),
                    Location: If(txtPersLocationDTD.Text = "—", Blank(), txtPersLocationDTD.Text),
                    JobTitle: If(txtPersTitleDTD.Text = "—", Blank(), txtPersTitleDTD.Text),
                    Grade: If(txtPersGradeDTD.Text = "—", Blank(), txtPersGradeDTD.Text),
                    JobSeries: If(txtPersSeriesDTD.Text = "—", Blank(), txtPersSeriesDTD.Text),
                    NCUAStartDate: dtpPersStartDTD.SelectedDate,
                    ServiceComputationDate: dtpPersScdDTD.SelectedDate,
                    FirstLineSupervisorEmail: If(txtPersSup1DTD.Text = "—", Blank(), txtPersSup1DTD.Text),
                    SecondLineSupervisorEmail: If(txtPersSup2DTD.Text = "—", Blank(), txtPersSup2DTD.Text),
                    // Eligibility. A choice is patched as { Value: "..." } and
                    // the record form comes FIRST in the If — putting Blank()
                    // first makes Power Fx infer the branch type from it.
                    ListedOnIDP:
                      If(Not(IsBlank(drpEligIdpDTD.Selected.Value)),
                        { Value: drpEligIdpDTD.Selected.Value }, Blank()),
                    AttendedInfoSession:
                      If(Not(IsBlank(drpEligSessionDTD.Selected.Value)),
                        { Value: drpEligSessionDTD.Selected.Value }, Blank()),
                    LatestPerformanceRating:
                      If(txtEligRatingDTD.Text = "—", Blank(),
                        Value(txtEligRatingDTD.Text)),
                    InfoSessionDate: dtpEligDateDTD.SelectedDate
                  }),
                locEditApp: false
              });
              // GUARDED, not diffed. Rank is positional, so a diff would have
              // to match on the (program, option, rank) triple and rewrite any
              // row whose rank moved — more failure surface than the
              // delete-and-rewrite it replaces.
              //
              // The write failure that cost the competencies cannot happen on
              // this list: New-LdpSharePointLists.ps1 made its Title optional
              // when it created it. The remaining risk was an unrelated save
              // rewriting choices from dropdowns that had failed to default,
              // and locChoicesDirty closes that — the flag is raised only by
              // the six dropdowns' OnChange.
              If(locChoicesDirty,
                Remove(APPLICATION_PROGRAM_CHOICES,
                  Filter(APPLICATION_PROGRAM_CHOICES, ApplicationID.Id = locApp.ID)));
              If(locChoicesDirty,
                ForAll(
                  Filter(
                    Table(
                    { PrgId: LookUp(PROGRAMS, ProgramName = drpEditPrg1DTD.Selected.Value).ID,
                      PrgName: drpEditPrg1DTD.Selected.Value,
                      OptId: LookUp(PROGRAM_OPTIONS,
                        And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg1DTD.Selected.Value).ID,
                            OptionName = drpEditOpt1DTD.Selected.Value)).ID,
                      OptName: drpEditOpt1DTD.Selected.Value, Rnk: 1 },
                    { PrgId: LookUp(PROGRAMS, ProgramName = drpEditPrg2DTD.Selected.Value).ID,
                      PrgName: drpEditPrg2DTD.Selected.Value,
                      OptId: LookUp(PROGRAM_OPTIONS,
                        And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg2DTD.Selected.Value).ID,
                            OptionName = drpEditOpt2DTD.Selected.Value)).ID,
                      OptName: drpEditOpt2DTD.Selected.Value, Rnk: 2 },
                    { PrgId: LookUp(PROGRAMS, ProgramName = drpEditPrg3DTD.Selected.Value).ID,
                      PrgName: drpEditPrg3DTD.Selected.Value,
                      OptId: LookUp(PROGRAM_OPTIONS,
                        And(ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg3DTD.Selected.Value).ID,
                            OptionName = drpEditOpt3DTD.Selected.Value)).ID,
                      OptName: drpEditOpt3DTD.Selected.Value, Rnk: 3 }
                  ),
                    Not(IsBlank(PrgId))
                  ) As ch,
                  Patch(APPLICATION_PROGRAM_CHOICES, Defaults(APPLICATION_PROGRAM_CHOICES),
                  {
                    ApplicationID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: locApp.ID,
                      Value: locApp.ApplicantEmail
                    },
                    ProgramID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: ch.PrgId,
                      Value: ch.PrgName
                    },
                    ProgramOptionID:
                      If(Not(IsBlank(ch.OptId)),
                        {
                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                          Id: ch.OptId,
                          Value: ch.OptName
                        },
                        Blank()),
                    Rank: ch.Rnk
                  })
              ));
              // GUARDED. This block deletes every competency row for the
              // application and rewrites it from colComps, so an empty or
              // stale colComps destroys the lot. colComps is built only by the
              // Edit toggle, which means a Personnel-only edit used to rewrite
              // competencies as a side effect — and did, losing them.
              //
              // locCompsDirty is set only by Add and Remove on the Competencies
              // tab. Deliberately removing every competency still saves,
              // because that sets the flag; not touching the tab now leaves the
              // list alone entirely.
              //
              // Two separate If()s rather than If(cond, A; B): semicolons
              // inside an If branch are the shape that parses inconsistently.
              // ADD FIRST, THEN REMOVE — never the other way round. Deleting
              // and rewriting means any failed write loses the whole set, which
              // is exactly what a required Title column did here: every Patch
              // failed validation after the Remove had already run.
              //
              // In this order a failed write costs the additions and nothing
              // else. The removal is correct either way, because it deletes
              // only what is genuinely absent from the working copy.
              //
              // colCompsWas is the stored set snapshotted BEFORE any write, so
              // "already there" is judged against what was on the server when
              // Save started, not against what this handler has since added.
              If(locCompsDirty,
                ClearCollect(colCompsWas,
                  ForAll(
                    Filter(APPLICATION_COMPETENCIES,
                      ApplicationID.Id = locApp.ID) As sv,
                    { CompId: sv.CompetencyID.Id })));
              If(locCompsDirty,
                ForAll(
                  Filter(colComps, Not(CompId in colCompsWas.CompId)) As cc,
                  Patch(APPLICATION_COMPETENCIES, Defaults(APPLICATION_COMPETENCIES),
                  {
                    ApplicationID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: locApp.ID,
                      Value: locApp.ApplicantEmail
                    },
                    CompetencyID: {
                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                      Id: cc.CompId,
                      Value: cc.CompName
                    }
                  })));
              If(locCompsDirty,
                Remove(APPLICATION_COMPETENCIES,
                  Filter(APPLICATION_COMPETENCIES,
                    ApplicationID.Id = locApp.ID,
                    Not(CompetencyID.Id in colComps.CompId))));
              ClearCollect(colComps,
                ForAll(
                  Filter(APPLICATION_COMPETENCIES,
                    ApplicationID.Id = locApp.ID) As ac,
                  {
                    CompId: ac.CompetencyID.Id,
                    CompName: ac.CompetencyID.Value,
                    TypeId:
                      LookUp(COMPETENCIES, ID = ac.CompetencyID.Id).CompetencyTypeID.Id,
                    TypeName:
                      LookUp(COMPETENCIES, ID = ac.CompetencyID.Id).CompetencyTypeID.Value,
                    TypeOrder:
                      LookUp(COMPETENCY_TYPES,
                        ID = LookUp(COMPETENCIES,
                               ID = ac.CompetencyID.Id).CompetencyTypeID.Id
                      ).SortOrder
                  }));
              UpdateContext({
                locCompsDirty: false,
                locChoicesDirty: false,
                locCompTypeDTD:
                  Coalesce(locCompTypeDTD,
                    First(SortByColumns(
                      Filter(COMPETENCY_TYPES, State.Value = "Active"),
                      "SortOrder", SortOrder.Ascending)).ID)
              });
              Reset(drpAddCompDTD);
              Reset(txtPersNameDTD); Reset(txtPersLocationDTD); Reset(txtPersTitleDTD);
              Reset(txtPersGradeDTD); Reset(txtPersSeriesDTD);
              Reset(txtPersSup1DTD); Reset(txtPersSup2DTD);
              Reset(dtpPersStartDTD); Reset(dtpPersScdDTD);
              Reset(drpEditPrg1DTD); Reset(drpEditOpt1DTD);
              Reset(drpEditPrg2DTD); Reset(drpEditOpt2DTD);
              Reset(drpEditPrg3DTD); Reset(drpEditOpt3DTD);
              Reset(txtEligRatingDTD); Reset(drpEligIdpDTD);
              Reset(drpEligSessionDTD); Reset(dtpEligDateDTD);
              Notify("Application updated.", NotificationType.Success)
            PressedColor: =Self.Color
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeBody
