# DTD Applications Screen — US2 (RQ015–021, RQ096–100) — ADMIN
# Built 2026-07-31. Classic controls only (Constitution II).
# Colours = ColorPalette.*, sizes = Typography.*
#
# Composition (Constitution VIII):
#   · PowerLibs `gallery-filter-header` — the applications table
#   · PowerLibs `drawer-right-1`        — the detail panel
#
# ---------------------------------------------------------------------------
# THREE STATUS COLUMNS, SHOWN AS THEY ARE
# ---------------------------------------------------------------------------
# ApplicationStatus (the applicant's progress), ReviewStage (where the packet
# is), PlacementOutcome (the result). Each has a different owner and its own
# clock — see build/lists/_CHOICES.md, 2026-07-31.
#
# The TABLE shows all three. ApplicationStatus carries DTD's acceptance as its
# own value — Draft -> Submitted -> Validated is one linear progression, so
# `Submitted` IS the queue of things waiting on DTD and sorting that column
# groups them. An applicant edit drops a validated application back to
# Submitted; that is a backward transition in the machine, not a second flag
# to keep in step.
#
# Deriving one label from the three would collapse information the admin needs
# and invent a value that exists nowhere in the data.
#
# Colour carries the triage:
#   amber = waiting on someone outside DTD (a supervisor)
#   blue  = in DTD's or the committee's hands
#   green = done
#   grey  = inert, or not started
#
# `Needs Supervisor Assigned` is [PROPOSED — FR-012a]. Rendered so the column is
# complete, but nothing on this screen writes it (Constitution I).
#
# ---------------------------------------------------------------------------
# DELEGATION — THIS IS THE SCREEN WHERE IT MATTERS
# ---------------------------------------------------------------------------
# APPLICATIONS is the only unbounded list in this app. Everything else has been
# safe to collect; this is not, and the patterns used elsewhere would break it.
#
# The gallery therefore picks between EIGHT whole Filter() expressions — every
# on/off combination of the three dropdowns — rather than one with Or() inside. The readable version —
#   Or(drpStatusDTD.Selected.Value = "All", ApplicationStatus.Value = ...)
# — does not delegate, because a control reference is not a column. All four
# branches below filter on CycleID, ApplicationStatus and ReviewStage, all indexed.
#
# THE COUNTS ARE THE EXCEPTION, deliberately. Programs and Scored are per-row
# CountRows against APPLICATION_PROGRAM_CHOICES and COMMITTEE_SCORES; neither
# delegates. Accepted because a cycle is bounded by nature and a gallery only
# evaluates rendered rows. If a cycle ever exceeds ~500 applications this needs
# revisiting — rollup columns maintained by a flow are the usual answer, and a
# new moving part not worth adding before it is needed.
#
# NO COLLECTIONS. The drawer used to map option -> program per row, which is
# why PROGRAM_OPTIONS and PROGRAMS were collected in OnVisible. Since the
# choice row carries ProgramID directly (2026-07-31) nothing on this screen
# reads a collection at all, so OnVisible has no ClearCollect and there is one
# fewer thing that is merely empty before it runs.
#
# ---------------------------------------------------------------------------
# WHAT "SCORED" MEANS
# ---------------------------------------------------------------------------
# "2 / 3" = two COMMITTEE_SCORES rows against three DISTINCT PROGRAMS among the
# ranked choices. Distinct, because the same program may be ranked more than
# once with a different option and there is still only one thing to score.
# The table gives the count; the panel names which ones.
#
# ---------------------------------------------------------------------------
# THE DETAIL PANEL IS ALWAYS PRESENT
# ---------------------------------------------------------------------------
# Not a drawer. A drawer covers the list it was opened from, which is wrong
# when the task is comparing a record against its neighbours. The panel sits
# below the table, follows the selected row, and is divided by the SAME steps
# as the applicant's own wizard — so DTD and the applicant are looking at the
# same shape of information.
#
# "Review" is not a tab: the whole panel is the review.
# ===========================================================================

- lblAppTitleDTD:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHeading
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =30
      Size: =Typography.SizeHeading
      Text: ="Applications"
      Width: =400
      X: =24
      Y: =18

# Defaults to the Open cycle — the one an admin is almost always working in —
# and falls back to the most recent when none is open.
- lblCycleLabelDTD:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =18
      Size: =Typography.SizeCaption
      Text: ="CYCLE"
      Width: =250
      X: =24
      Y: =58

- lblStatusLabelDTD:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =18
      Size: =Typography.SizeCaption
      Text: ="APPLICATION STATUS"
      Width: =190
      X: =290
      Y: =58

- lblStageLabelDTD:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =18
      Size: =Typography.SizeCaption
      Text: ="REVIEW STAGE"
      Width: =210
      X: =496
      Y: =58

- drpCycleDTD:
    Control: Classic/DropDown@2.3.1
    Properties:
      BorderColor: =ColorPalette.Gray300
      Color: =ColorPalette.TextBody
      # Reads CYCLES DIRECTLY, not a collection. This control gates the whole
      # screen: if it depends on a collection, then before OnVisible has run it
      # is not merely empty but ERRORED, and every downstream control is blank
      # with no clue why. CYCLES is a handful of rows and both expressions
      # delegate on the indexed State, so there is nothing to gain by
      # collecting it.
      #
      # It mirrors itself into locCycle, which the gallery reads. Inlining the
      # LookUp into all eight filter branches instead was tried and reverted:
      # it removes the OnVisible dependency but makes eight ~100-character
      # lines out of one short one, and long lines in a formula this size are
      # what gets mangled on paste. If the gallery is ever empty while this
      # dropdown shows a cycle, locCycle is blank and OnVisible has not run.
      Default: |-
        =Coalesce(
          First(Filter(CYCLES, State.Value = "Open")).CycleName,
          First(SortByColumns(CYCLES, "OpenDate", SortOrder.Descending)).CycleName)
      Fill: =ColorPalette.White
      Font: =Typography.Family
      Height: =32
      Items: |-
        =ForAll(SortByColumns(CYCLES, "OpenDate", SortOrder.Descending), CycleName)
      OnChange: |-
        =UpdateContext({
          locCycle: LookUp(CYCLES, CycleName = drpCycleDTD.Selected.Value),
          locApp: Blank(),
          locEditApp: false,
          locCompsDirty: false,
          locChoicesDirty: false
        })
      Size: =Typography.SizeBody
      TabIndex: =1
      Width: =250
      X: =24
      Y: =78

- drpStatusDTD:
    Control: Classic/DropDown@2.3.1
    Properties:
      BorderColor: =ColorPalette.Gray300
      Color: =ColorPalette.TextBody
      Default: ="All statuses"
      Fill: =ColorPalette.White
      Font: =Typography.Family
      Height: =32
      # Literal text table — a Classic/DropDown renders this shape without its
      # Value property, which YAML cannot set (PA2108).
      Items: |-
        =["All statuses", "Draft", "Submitted", "Validated", "Withdrawn"]
      OnChange: |-
        =UpdateContext({ locApp: Blank(), locEditApp: false, locClearWarn: false, locCompsDirty: false, locChoicesDirty: false })
      Size: =Typography.SizeBody
      TabIndex: =2
      Width: =190
      X: =290
      Y: =78

- drpStageDTD:
    Control: Classic/DropDown@2.3.1
    Properties:
      BorderColor: =ColorPalette.Gray300
      Color: =ColorPalette.TextBody
      Default: ="All stages"
      Fill: =ColorPalette.White
      Font: =Typography.Family
      Height: =32
      Items: |-
        =["All stages", "Pending First-Line", "Needs Supervisor Assigned",
          "Pending Second-Line", "Pending DTD Validation", "Committee Review",
          "Pending Placement", "Pending Notification", "Complete"]
      OnChange: |-
        =UpdateContext({ locApp: Blank(), locEditApp: false, locClearWarn: false, locCompsDirty: false, locChoicesDirty: false })
      Size: =Typography.SizeBody
      TabIndex: =3
      Width: =210
      X: =496
      Y: =78

- lblOutcomeLabelDTD:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
