            Y: =276

      # ---- 3. Competencies ----
      # DATA-DRIVEN END TO END. The type strip is COMPETENCY_TYPES, the ceiling
      # is COMPETENCY_TYPES.SelectionCount, and the catalogue is COMPETENCIES.
      # Nothing here knows the words OPM, Technical or ECQ, so a fourth type
      # added on the Competencies admin screen works with no YAML change.
      #
      # Same Tab Bar V2 shape as that admin screen — fixed 150px tabs packed
      # left, underline on the selected one — so the two screens read alike.
      #
      # The selected TYPE replaces what used to be a type dropdown in the add
      # row: the tab already says which type is being worked on, and two
      # controls answering that question could disagree.
      # ---- type strip: PowerLibs shadcn-tabs-1 (Tab Bar) ----
      # The library's Tab Bar, not the V2 underline used for the panel's own
      # tabs — a filled track with the selected tab as a raised pill. The two
      # shapes sitting one above the other is what makes the inner set read as
      # subordinate rather than as a second row of the same strip.
      #
      # DATA-DRIVEN: the component ships a literal Items table; this reads
      # COMPETENCY_TYPES. TemplateSize is the component's own
      # Width/AllItemsCount, which divides the track evenly however many types
      # there are, so a fourth needs no layout change.
      #
      # The component's "nothing selected yet, light up id 1" clause is dropped:
      # it assumes the first tab has id 1, which is true of a literal table and
      # false of SharePoint keys. locCompTypeDTD is set on row select and on
      # entering edit mode, so it is never blank while this is visible.
      - conCompTabsDTD:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            # White, so the track itself disappears against the panel and only
            # the selected Blue50 chip reads — closer to the underline pattern
            # than to a segmented control, which is deliberate.
            Fill: =ColorPalette.White
            Height: =40
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =5
            PaddingLeft: =5
            PaddingRight: =5
            PaddingTop: =5
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 3)
            # Bounded so three types do not stretch the track across the panel.
            Width: |-
              =Min(Parent.Width - 300,
                170 * Max(1, CountRows(Filter(COMPETENCY_TYPES, State.Value = "Active"))))
            X: =24
            Y: =118
          Children:
            - galCompTypeTabsDTD:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =Parent.Height - 10
                  Items: |-
                    =SortByColumns(
                      Filter(COMPETENCY_TYPES, State.Value = "Active"),
                      "SortOrder", SortOrder.Ascending)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: |-
                    =galCompTypeTabsDTD.Width / Max(1, galCompTypeTabsDTD.AllItemsCount)
                  Width: =Parent.Width - 10
                Children:
                  - btnCompTypeTabDTD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.Solid
                        # One text colour throughout; the selected tab is told
                        # apart by the white pill and bold weight, which is how
                        # the component itself works.
                        #
                        # Blue50 on white is 1.15:1 — a pale chip rather than a
                        # raised pill, so the hairline Gray200 border still does
                        # real work defining its edge. It matches the selected-row
                        # tint in the applications table above, so "selected"
                        # looks the same in both places.
                        BorderColor: |-
                          =If(ThisItem.ID = locCompTypeDTD,
                             ColorPalette.Gray200, RGBA(0, 0, 0, 0))
                        BorderThickness: |-
                          =If(ThisItem.ID = locCompTypeDTD, 1, 0)
                        Color: =ColorPalette.TextHeading
                        Fill: |-
                          =If(ThisItem.ID = locCompTypeDTD,
                             ColorPalette.Blue50, RGBA(0, 0, 0, 0))
                        FocusedBorderThickness: |-
                          =If(ThisItem.ID = locCompTypeDTD, 1, 0)
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(ThisItem.ID = locCompTypeDTD,
                             Typography.WeightBold, Typography.WeightRegular)
                        # 1px of room top and bottom. Filling the row exactly
                        # puts the border's bottom edge on the gallery bound
                        # where it is clipped — the same thing that turned the
                        # sort headers' focus ring into brackets.
                        Height: =Parent.TemplateHeight - 2
                        # Track Self.BorderColor rather than inheriting Power
                        # Apps' defaults, which are visible colours — that
                        # default is what drew an outline on hover at all.
                        HoverBorderColor: =Self.BorderColor
                        HoverColor: =Self.Color
                        HoverFill: |-
                          =If(ThisItem.ID = locCompTypeDTD,
                             ColorPalette.Blue50, ColorPalette.Gray200)
                        # Changing tab clears the half-typed add row: the
                        # competency in it belongs to the type being left.
                        OnSelect: |-
                          =UpdateContext({ locCompTypeDTD: ThisItem.ID });
                          Reset(drpAddCompDTD)
                        PressedBorderColor: =Self.BorderColor
                        PressedColor: =Self.Color
                        PressedFill: |-
                          =If(ThisItem.ID = locCompTypeDTD,
                             ColorPalette.Blue50, ColorPalette.Gray200)
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =Typography.SizeBody
                        Text: =ThisItem.TypeName
                        Width: =Parent.TemplateWidth - 4
                        X: =2
                        Y: =1
      # ---- add row, at the TOP ----
      # This is an admin screen: the competencies are usually already complete,
      # so the common act is reading them, and the rare one is adding. The add
      # controls sit above the list where they are found without scrolling, and
      # disappear entirely once the type is at its ceiling — a disabled control
      # invites a click that cannot succeed.
      - drpAddCompDTD:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            ChevronBackground: =ColorPalette.Blue600
            ChevronFill: =ColorPalette.TextOnDark
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =32
            # Already-chosen competencies are excluded rather than offered and
            # rejected — the list IS the rule. Single-column text, like every
            # dropdown on this screen: a Classic/DropDown over records matches
            # against a column YAML cannot name (PA2108).
            Items: |-
              =ForAll(
                Sort(
                  Filter(COMPETENCIES,
                    CompetencyTypeID.Id = locCompTypeDTD,
                    State.Value = "Active",
                    Not(ID in colComps.CompId)),
                  CompetencyName),
                CompetencyName)
            SelectionColor: =ColorPalette.TextOnDark
            SelectionFill: =ColorPalette.Blue600
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 3, locEditApp, CountRows(Filter(colComps, TypeId = locCompTypeDTD)) < Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).SelectionCount, 0))
            Width: =560
            X: =24
            Y: =166
      - btnAddCompDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            DisplayMode: |-
              =If(IsBlank(drpAddCompDTD.Selected.Value),
                 DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =32
            HoverColor: =Self.Color
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({ locCompsDirty: true });
              Collect(colComps,
                {
                  CompId: LookUp(COMPETENCIES,
                    And(CompetencyTypeID.Id = locCompTypeDTD,
                        CompetencyName = drpAddCompDTD.Selected.Value)).ID,
                  CompName: drpAddCompDTD.Selected.Value,
                  TypeId: locCompTypeDTD,
                  TypeName: LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).TypeName,
                  TypeOrder: LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).SortOrder
                });
              Reset(drpAddCompDTD)
            PressedColor: =Self.Color
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =Typography.SizeBody
            Text: ="Add"
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 3, locEditApp, CountRows(Filter(colComps, TypeId = locCompTypeDTD)) < Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).SelectionCount, 0))
            Width: =100
            X: =596
            Y: =166
      # Takes the add row's place at the ceiling, so the band does not collapse
      # and the list does not jump.
      - lblCompFullDTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.WarningText
            Font: =Typography.Family
            Height: =32
            Size: =Typography.SizeBody
            Text: |-
              =LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).TypeName & " is at its maximum of " & Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).SelectionCount, 0) &
               ". Remove one to choose a different competency."
            VerticalAlign: =VerticalAlign.Middle
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 3, locEditApp, Not(IsBlank(locCompTypeDTD)),
                 CountRows(Filter(colComps, TypeId = locCompTypeDTD)) >= Coalesce(LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).SelectionCount, 0))
            Width: =Parent.Width - 48
            X: =24
            Y: =166

      # ---- the selections for the chosen type ----
      # The row shows the competency alone: the tab above already says which
      # type these are, so repeating it on every row would be noise.
      - galCompsDTD:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =Parent.Height - If(locEditApp, 214, 168) - 24
            Items: |-
              =SortByColumns(
                Filter(
                  ForAll(
                    Filter(APPLICATION_COMPETENCIES,
                      ApplicationID.Id = locApp.ID) As ac,
                    {
                      CompName: ac.CompetencyID.Value,
                      TypeId:
                        LookUp(COMPETENCIES,
                          ID = ac.CompetencyID.Id).CompetencyTypeID.Id
                    }),
                  TypeId = locCompTypeDTD),
                "CompName", SortOrder.Ascending)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =44
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 3, Not(locEditApp))
            Width: =Parent.Width - 48
            X: =24
            Y: =168
          Children:
            - conCompRowDTD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =Parent.TemplateHeight
                  Width: =Parent.TemplateWidth
                Children:
                  - lblCompNameDTD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: =ThisItem.CompName
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =560
                        X: =0
                        Y: =0
            - recCompLineDTD:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
      - lblNoCompsDTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =40
            Size: =Typography.SizeBody
            Text: |-
              ="No " & LookUp(COMPETENCY_TYPES, ID = locCompTypeDTD).TypeName & " competencies recorded."
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 3, Not(locEditApp), Not(IsBlank(locCompTypeDTD)),
                 CountRows(galCompsDTD.AllItems) = 0)
            Width: =Parent.Width - 48
            X: =24
            Y: =180
      - galCompEditDTD:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =Parent.Height - 214 - 24
            Items: |-
              =SortByColumns(
                Filter(colComps, TypeId = locCompTypeDTD),
                "CompName", SortOrder.Ascending)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =44
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 3, locEditApp)
            Width: =Parent.Width - 48
            X: =24
            Y: =214
          Children:
            - conCompEditRowDTD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =Parent.TemplateHeight
                  Width: =Parent.TemplateWidth
                Children:
                  - lblCompEditNameDTD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        Height: =Parent.Height
                        Size: =Typography.SizeBody
                        Text: =ThisItem.CompName
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =560
                        X: =0
                        Y: =0
                  # Icon plus a transparent button on top. Classic/Button has
                  # no Icon property — that is the documented pattern, and the
                  # same one the Competencies admin screen uses for its row
                  # actions.
                  #
                  # Icon.Trash is the Power Apps built-in. gblNavIcons carries
                  # DocumentEdit, Archive, ArchiveArrowBack and Eye but nothing
                  # for delete; drop a trash SVG in there and swap the Icon for
                  # an Image if the built-in looks out of place next to them.
                  - icoCompRemoveDTD:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        # STATIC. Power Apps has no cross-control .Hover or
                        # .Pressed read-back — an icon cannot ask the button on
                        # top of it what state it is in. The hover signal is the
                        # button's own DangerLight fill appearing behind this.
                        # Same arrangement as the Competencies admin screen,
                        # where the row icons are a fixed colour too.
                        Color: =ColorPalette.DangerText
                        Height: =18
                        Icon: =Icon.Trash
                        Width: =18
                        X: =583
                        Y: =13
                  - btnCompRemoveDTD:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =ColorPalette.FocusOnLight
                        FocusedBorderThickness: =2
                        Height: =32
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =ColorPalette.DangerLight
                        # Matched on CompId: the row came out of SortByColumns
                        # and is not the identity the collection holds.
                        OnSelect: |-
                          =UpdateContext({ locCompsDirty: true });
                          RemoveIf(colComps, CompId = ThisItem.CompId)
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =ColorPalette.DangerLight
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        # Text is the accessible name — the icon underneath
                        # carries no label, so a screen reader would otherwise
                        # announce an unnamed button.
                        Text: =""
                        Tooltip: |-
                          ="Remove " & ThisItem.CompName
                        Width: =32
                        X: =576
                        Y: =6
            - recCompEditLineDTD:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1

      # ---- 4. Eligibility — PowerLibs modern-input-label ----
      # Same field pattern as Personnel: a disabled Classic/TextInput with a
      # Label astride its top border. Was one label holding four values as a
      # single string with newlines in it, which is what read as jumbled.
      #
      # Four fields on one row, on the SAME grid as Personnel — same column
      # width, same X arithmetic — so moving between the two tabs does not move
      # the eye.
      #
      # LatestPerformanceRating is the NUMERIC rating, distinct from the
      # attached appraisal document (FR-006a / OI-8).
      #
      # DISABLED, NOT VIEW: DisplayMode.View strips a TextInput's border and
      # fill, so an empty one renders as nothing at all.
      - txtEligIdpDTD:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =Coalesce(locApp.ListedOnIDP.Value, "—")
            DisabledBorderColor: =ColorPalette.Gray300
            DisabledColor: =ColorPalette.TextBody
            DisabledFill: =ColorPalette.White
            DisplayMode: =DisplayMode.Disabled
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =40
            PaddingLeft: =12
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 4, Not(locEditApp))
            Width: =(Parent.Width - 120) / 4
            X: =24
            Y: =118
      - txtEligRatingDTD:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(IsBlank(locApp.LatestPerformanceRating), "—",
                 Text(locApp.LatestPerformanceRating))
            DisabledBorderColor: =ColorPalette.Gray300
            DisabledColor: =ColorPalette.TextBody
            DisabledFill: =ColorPalette.White
            DisplayMode: |-
              =If(locEditApp, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.Blue600
            FocusedBorderThickness: =2
            Font: =Typography.Family
            Height: =40
            PaddingLeft: =12
            Size: =Typography.SizeBody
            Visible: =And(Not(IsBlank(locApp)), locDetailTab = 4)
            Width: =txtEligIdpDTD.Width
            X: =txtEligIdpDTD.X + (txtEligIdpDTD.Width + 24)
            Y: =118
      - txtEligSessionDTD:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =Coalesce(locApp.AttendedInfoSession.Value, "—")
            DisabledBorderColor: =ColorPalette.Gray300
            DisabledColor: =ColorPalette.TextBody
            DisabledFill: =ColorPalette.White
            DisplayMode: =DisplayMode.Disabled
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =40
            PaddingLeft: =12
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 4, Not(locEditApp))
            Width: =txtEligIdpDTD.Width
            X: =txtEligIdpDTD.X + (txtEligIdpDTD.Width + 24) * 2
            Y: =118
      - txtEligDateDTD:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Default: |-
              =If(IsBlank(locApp.InfoSessionDate), "—",
                 Text(locApp.InfoSessionDate, "mm/dd/yyyy"))
            DisabledBorderColor: =ColorPalette.Gray300
            DisabledColor: =ColorPalette.TextBody
            DisabledFill: =ColorPalette.White
            DisplayMode: =DisplayMode.Disabled
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =40
            PaddingLeft: =12
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 4, Not(locEditApp))
            Width: =txtEligIdpDTD.Width
            X: =txtEligIdpDTD.X + (txtEligIdpDTD.Width + 24) * 3
            Y: =118
      - drpEligIdpDTD:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            ChevronBackground: =ColorPalette.Blue600
            ChevronFill: =ColorPalette.TextOnDark
            Default: =locApp.ListedOnIDP.Value
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =40
            Items: =Choices(APPLICATIONS.ListedOnIDP)
            SelectionColor: =ColorPalette.TextOnDark
            SelectionFill: =ColorPalette.Blue600
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 4, locEditApp)
            Width: =txtEligIdpDTD.Width
            X: =txtEligIdpDTD.X
            Y: =118
      # Choices() reads the SharePoint column, so the options cannot drift
      # from the list definition — same source the applicant's own form uses.
      # It returns a single-column table, which is the shape a Classic/DropDown
      # matches Default against, so no ForAll projection is needed here.
      - drpEligSessionDTD:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            ChevronBackground: =ColorPalette.Blue600
            ChevronFill: =ColorPalette.TextOnDark
            Default: =locApp.AttendedInfoSession.Value
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =40
            Items: =Choices(APPLICATIONS.AttendedInfoSession)
            SelectionColor: =ColorPalette.TextOnDark
            SelectionFill: =ColorPalette.Blue600
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 4, locEditApp)
            Width: =txtEligSessionDTD.Width
            X: =txtEligSessionDTD.X
            Y: =118
      # NOT Today(). A picker that defaults to today writes a plausible wrong
      # date for anyone who opens the field and does not touch it — the trap
      # recorded as OI-REQ-1 against the Application Screen's own pickers.
      - dtpEligDateDTD:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            DefaultDate: =locApp.InfoSessionDate
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =40
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 4, locEditApp)
            Width: =txtEligDateDTD.Width
            X: =txtEligDateDTD.X
            Y: =118

      # LABELS LAST. Z-order is declaration order, and each floating label
      # straddles the top border of the control beneath it — so every input on
      # this tab must be declared before every label, or the edit-mode pickers
      # draw over the labels of the boxes they replace. Personnel gets this
      # right by accident of build order; here it had to be made explicit.
      - lblEligIdpDTD:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(locEditApp, ColorPalette.Blue600, ColorPalette.TextHelp)
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =16
            PaddingLeft: =4
            PaddingRight: =4
            Size: =Typography.SizeCaption
            Text: ="Listed on IDP"
            Visible: =And(Not(IsBlank(locApp)), locDetailTab = 4)
            Width: =Len(Self.Text) * 6 + 16
            Wrap: =false
            X: =txtEligIdpDTD.X + 10
            Y: =txtEligIdpDTD.Y - Self.Height / 2
      - lblEligRatingDTD:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(locEditApp, ColorPalette.Blue600, ColorPalette.TextHelp)
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =16
            PaddingLeft: =4
            PaddingRight: =4
            Size: =Typography.SizeCaption
            Text: ="Latest performance rating"
            Visible: =And(Not(IsBlank(locApp)), locDetailTab = 4)
            Width: =Len(Self.Text) * 6 + 16
            Wrap: =false
            X: =txtEligRatingDTD.X + 10
            Y: =txtEligRatingDTD.Y - Self.Height / 2
      - lblEligSessionDTD:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(locEditApp, ColorPalette.Blue600, ColorPalette.TextHelp)
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =16
            PaddingLeft: =4
            PaddingRight: =4
            Size: =Typography.SizeCaption
            Text: ="Attended info session"
            Visible: =And(Not(IsBlank(locApp)), locDetailTab = 4)
            Width: =Len(Self.Text) * 6 + 16
            Wrap: =false
            X: =txtEligSessionDTD.X + 10
            Y: =txtEligSessionDTD.Y - Self.Height / 2
      - lblEligDateDTD:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(locEditApp, ColorPalette.Blue600, ColorPalette.TextHelp)
            Fill: =ColorPalette.White
            Font: =Typography.Family
            Height: =16
            PaddingLeft: =4
            PaddingRight: =4
            Size: =Typography.SizeCaption
            Text: ="Info session date"
            Visible: =And(Not(IsBlank(locApp)), locDetailTab = 4)
            Width: =Len(Self.Text) * 6 + 16
            Wrap: =false
            X: =txtEligDateDTD.X + 10
            Y: =txtEligDateDTD.Y - Self.Height / 2
      # Choices() reads the SharePoint column, so the options cannot drift
      # from the list definition — same source the applicant's own form uses.
      # It returns a single-column table, which is the shape a Classic/DropDown
      # matches Default against, so no ForAll projection is needed here.
      # ---- 5. Documents ----
      # OI-APP-1 is still open: the three documents are native SharePoint
      # attachments, and the attachment control only exists inside a Form data
      # card — there is no read-only list control for them. Saying so is more
      # use than an empty panel that looks broken.
      - lblTabDocumentsDTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =Parent.Height - 130
            Size: =Typography.SizeBody
            Text: |-
              ="Résumé, statement of interest and performance appraisal are stored as SharePoint attachments on this application.
              
              They cannot be listed here yet: the attachment control exists only inside a Form data card, and this panel is read-only. Open the item in SharePoint to view them.
              
              Tracked as OI-APP-1."
            VerticalAlign: =VerticalAlign.Top
            Visible: =And(Not(IsBlank(locApp)), locDetailTab = 5)
            Width: =Parent.Width - 48
            X: =24
            Y: =118

# ===========================================================================
# CLEAR-VALIDATION CONFIRMATION — PowerLibs warning-modal-v2-1
# ===========================================================================
# Declared LAST: z-order is declaration order, so the scrim and the card sit
# above everything they cover.
#
# Two buttons, unlike the cycle screen's copy of this component — that modal
# explains a rule and can only be acknowledged; this one asks a question.
#
# AMBER, not the component's red. Clearing a validation is reversible in one
# click and destroys nothing: the packet returns to a queue it was already in
# an hour ago. Red here would spend alarm the action does not earn, and would
# leave nothing louder for the things that do.
#
# The body names the applicant, and says the change is undoable — the two facts
# someone needs to answer the question without leaving the modal.
- recClearScrimDTD:
    Control: Rectangle@2.3.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0.3)
      Height: =Parent.Height
      Visible: =locClearWarn
      Width: =Parent.Width
      X: =0
      Y: =0

- conClearWarnDTD:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Bold
      Fill: =ColorPalette.White
      Height: =248
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: =locClearWarn
      Width: =520
      X: =Parent.Width / 2 - Self.Width / 2
      Y: =Parent.Height / 2 - Self.Height / 2
    Children:
      - shpClearHaloDTD:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.WarningLight
            Height: =56
            Width: =56
            X: =24
            Y: =28
      - icoClearWarnDTD:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =ColorPalette.WarningText
            Height: =30
            Icon: =Icon.Warning
            Width: =30
            X: =37
            Y: =41
      - lblClearTitleDTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =26
            Size: =Typography.SizeHeading
            Text: ="Clear validation?"
            Width: =380
            X: =96
            Y: =42
      # One line, no newline characters in the expression — a literal break
      # inside the string is what broke the cycle modal's body on paste.
      - lblClearBodyDTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =84
            Size: =Typography.SizeBody
            Text: |-
              ="Confirming this will move " &
               Coalesce(locApp.ApplicantName, "this applicant") &
               "'s application back to Submitted status and return it to the DTD queue. Nothing else changes, and you can revalidate at any time."
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            X: =96
            Y: =72
      - btnClearCancelDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =38
            HoverColor: =Self.Color
            HoverFill: =ColorPalette.Gray50
            OnSelect: |-
              =UpdateContext({ locClearWarn: false })
            PressedColor: =Self.Color
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =8
            Text: ="Keep it validated"
            Width: =150
            X: =btnClearConfirmDTD.X - Self.Width - 10
            Y: =Parent.Height - 62
      # Same words as the button that opened it, so the thing being confirmed
      # is the thing that was clicked.
      - btnClearConfirmDTD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverColor: =Self.Color
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =UpdateContext({
                locApp: Patch(APPLICATIONS,
                  LookUp(APPLICATIONS, ID = locApp.ID),
                  { ApplicationStatus: { Value: "Submitted" } }),
                locClearWarn: false
              });
              Notify("Validation cleared — the application is waiting on DTD again.",
                     NotificationType.Success)
            PressedColor: =Self.Color
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =9
            Text: ="Clear validation"
            Width: =150
            X: =Parent.Width - 174
            Y: =Parent.Height - 62

