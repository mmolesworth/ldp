      # ---- 1. Personnel — PowerLibs modern-input-label ----
      # Was two labels holding six and four fields as one string each, with
      # newlines inside the text. That gives no control over row spacing and no
      # alignment between a label and its value, which is what read as jumbled.
      #
      # Each field is now the library's input-with-label pair: a disabled
      # Classic/TextInput plus a Label sitting astride its top border, filled
      # white so it punches a notch in the line.
      #
      # DISABLED, NOT VIEW. DisplayMode.View strips a TextInput's border and
      # fill, so an empty one renders as nothing at all — the same trap noted on
      # the Application Screen. Disabled keeps the box and greys nothing,
      # because DisabledColor and DisabledFill are set to the normal values.
      #
      # The floating label's Width is estimated from its text. PaddingLeft and
      # PaddingRight take 8px out of that width, so the first estimate — 5.2 per
      # character — left the longest labels a few pixels short and they wrapped
      # to a second line inside a 16px-tall control. 6 per character plus 16
      # clears it, and Wrap: =false means a future label that outgrows the
      # estimate clips at the edge rather than breaking in half.
      #
      # Four columns x three rows, grouped by what the fields are about:
      # person, position, service dates, supervisors. Bottom row ends at 274,
      # inside the panel's 300px minimum, so nothing clips when the window is
      # short. Column 1 is the anchor; the rest position off it.
