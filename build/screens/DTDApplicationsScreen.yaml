            Text: ="Second-line supervisor"
            Visible: =And(Not(IsBlank(locApp)), locDetailTab = 1)
            Width: =Len(Self.Text) * 6 + 16
            Wrap: =false
            X: =txtPersSup2DTD.X + 10
            Y: =txtPersSup2DTD.Y - Self.Height / 2

      # ---- 2. Program choices ----
      - galDetailChoicesDTD:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =Parent.Height - 130
            # No score here any more. It keyed on PROGRAM while these rows are
            # per (program, option), so HPP ranked twice showed one score
            # against two rows — accurate and unreadable. The gallery column on
            # the table above already reports scoring progress; this tab is
            # about what was chosen. Dropping it takes the COMMITTEE_SCORES
            # lookup out of a per-row expression as well.
            #
            # OptionName is blank for MDP and NEXT, which have no options. That
            # is the truth rather than a fabricated "N/A", and the row template
            # below shows the program alone when it is blank.
            Items: |-
              =SortByColumns(
                ForAll(
                  Filter(APPLICATION_PROGRAM_CHOICES,
                    ApplicationID.Id = locApp.ID) As ch,
                  {
                    ChRank: ch.Rank,
                    OptionName: ch.ProgramOptionID.Value,
                    ProgramName: ch.ProgramID.Value
                  }),
                "ChRank", SortOrder.Ascending)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =56
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 2, Not(locEditApp))
            Width: =Parent.Width - 48
            X: =24
            Y: =118
          Children:
            - conDetailChoiceDTD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorPalette.White
                  Height: =Parent.TemplateHeight
                  Width: =Parent.TemplateWidth
                Children:
                  - lblChoiceRankDTD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.Blue700
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightBold
                        Height: =20
                        Size: =Typography.SizeBody
                        Text: |-
                          ="#" & ThisItem.ChRank
                        Width: =34
                        X: =0
                        Y: =6
                  # The PROGRAM is the headline, because it is the choice. The
                  # option is the detail underneath it, and there simply is not
                  # one for MDP or NEXT — that line renders empty rather than
                  # carrying an invented "N/A". These were the other way round
                  # while the option was the only thing recorded.
                  - lblChoiceProgramDTD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        Height: =20
                        Size: =Typography.SizeBody
                        Text: =ThisItem.ProgramName
                        Width: =Parent.Width - 60
                        X: =36
                        Y: =6
                  # SizeBody, same as the program above it. The option is a
                  # real part of the choice — "Mini MBA: Management &
                  # Leadership" is what the applicant actually picked — so
                  # caption size was underselling it. Hierarchy is carried by
                  # colour and weight instead: TextHelp grey at regular weight
                  # under TextHeading at medium.
                  - lblChoiceOptionDTD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHelp
                        Font: =Typography.Family
                        Height: =20
                        Size: =Typography.SizeBody
                        Text: =ThisItem.OptionName
                        Width: =Parent.Width - 60
                        X: =36
                        Y: =26
            - recDetailChoiceLineDTD:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
      - lblDetailNoChoicesDTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =40
            Size: =Typography.SizeBody
            Text: ="No program choices recorded yet."
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 2, Not(locEditApp),
                 CountRows(galDetailChoicesDTD.AllItems) = 0)
            Width: =Parent.Width - 48
            X: =24
            Y: =130


      # ---- 2b. Program choices, EDIT ----
      # Three fixed rank rows rather than editable gallery rows. The data is
      # capped at three by FR-004, the applicant's own step 2 has exactly this
      # shape, and reading control values back out of a gallery's AllItems to
      # save them is far more machinery than three pairs of dropdowns.
      #
      # SINGLE-COLUMN TEXT ITEMS, via ForAll(...). A Classic/DropDown matches
      # Default against the column named by its Value property, and Value is an
      # output that YAML cannot set (PA2108) — so with a table of RECORDS the
      # match is against whichever column Power Apps picked, not necessarily
      # ProgramName, and a correct Default silently fails to select anything.
      # A one-column table makes display and Default the same thing. Same
      # reason drpCycleDTD at the top of this screen is built this way.
      #
      # The cost is that Selected.ID is gone, so saving looks the name back up.
      # Program names and option-names-within-a-program are unique, and both
      # lists are small.
      #
      # AllowEmptySelection: without it a dropdown selects its first item when
      # Default matches nothing — so rank 2 and rank 3 would arrive pre-filled
      # with a program the applicant never chose, and saving would invent two
      # choices. Blank has to stay blank.
      #
      # Items unions the ACTIVE set with whatever this application already
      # chose. A retired program or option must still display on an application
      # that chose it (PROGRAM_OPTIONS.md); without the union DTD would see an
      # empty picker and overwrite a real choice on save. Same trap as
      # OI-APP-2, solved here for this screen only.
      - lblEditRank1DTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =18
            Size: =Typography.SizeCaption
            Text: ="FIRST CHOICE"
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 2, locEditApp)
            Width: =360
            X: =24
            Y: =112
      - drpEditPrg1DTD:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            ChevronBackground: =ColorPalette.Blue600
            ChevronFill: =ColorPalette.TextOnDark
            Default: |-
              =LookUp(APPLICATION_PROGRAM_CHOICES,
                     And(ApplicationID.Id = locApp.ID, Rank = 1)).ProgramID.Value
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =32
            # <> "Retired", NOT = "Active". PROGRAMS.State was added after the
            # three programs existed and no script has ever backfilled it, so
            # those rows hold BLANK — which is not "Active", and an equality
            # test returned an empty list. Both PowerShell scripts already test
            # it this way for the same reason. Tighten to = "Active" once the
            # column is backfilled (OI-DATA-2).
            #
            # No union with the current choice here, unlike the option list
            # below: PROGRAMS.md treats NEXT/MDP/HPP as a closed set that
            # nothing retires, so there is no retired program to keep visible.
            OnChange: |-
              =UpdateContext({ locChoicesDirty: true })
            Items: |-
              =ForAll(
                Sort(Filter(PROGRAMS, State.Value <> "Retired"), ProgramName),
                ProgramName)
            SelectionColor: =ColorPalette.TextOnDark
            SelectionFill: =ColorPalette.Blue600
            Size: =Typography.SizeBody
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 2, locEditApp)
            Width: =360
            X: =24
            Y: =130
      - drpEditOpt1DTD:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =ColorPalette.Gray300
            BorderThickness: =1
            ChevronBackground: =ColorPalette.Blue600
            ChevronFill: =ColorPalette.TextOnDark
            Default: |-
              =LookUp(APPLICATION_PROGRAM_CHOICES,
                     And(ApplicationID.Id = locApp.ID, Rank = 1)).ProgramOptionID.Value
            FocusedBorderThickness: =1
            Font: =Typography.Family
            Height: =32
            # Unions the active options with whatever this application already
            # chose, so a retired option still shows on an application that
            # picked it. Matched on OptionName rather than ID: a bare ID inside
            # a Filter that also nests a LookUp on another list resolves
            # ambiguously, and the name is what Default matches on anyway, so
            # the two cannot disagree.
            OnChange: |-
              =UpdateContext({ locChoicesDirty: true })
            Items: |-
              =ForAll(
                Sort(
                  Filter(PROGRAM_OPTIONS,
                    ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg1DTD.Selected.Value).ID,
                    Or(State.Value = "Active",
                       OptionName = LookUp(APPLICATION_PROGRAM_CHOICES,
                     And(ApplicationID.Id = locApp.ID, Rank = 1)).ProgramOptionID.Value)),
                  OptionName),
                OptionName)
            SelectionColor: =ColorPalette.TextOnDark
            SelectionFill: =ColorPalette.Blue600
            Size: =Typography.SizeBody
            # This property IS "the chosen program has options"; the save gate
            # reads Self.Visible rather than repeating the query.
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 2, locEditApp,
                 Not(IsEmpty(Filter(PROGRAM_OPTIONS,
                   ProgramID.Id = LookUp(PROGRAMS, ProgramName = drpEditPrg1DTD.Selected.Value).ID,
                   State.Value = "Active"))))
            Width: =588
            X: =400
            Y: =130
      - lblEditNoOpt1DTD:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHelp
            Font: =Typography.Family
            Height: =32
            Size: =Typography.SizeBody
            Text: ="No options — the program itself is the choice."
            VerticalAlign: =VerticalAlign.Middle
            Visible: |-
              =And(Not(IsBlank(locApp)), locDetailTab = 2, locEditApp,
                 Not(IsBlank(drpEditPrg1DTD.Selected.Value)),
                 Not(drpEditOpt1DTD.Visible))
            Width: =588
            X: =400
            Y: =130

