- lblRSTitle:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHeading
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =30
      Size: =Typography.SizeHeading
      Text: ="Scoring Rubrics"
      Width: =400
      X: =24
      Y: =18

- drpRSProgram:
    Control: Classic/DropDown@2.3.1
    Properties:
      BorderColor: =ColorPalette.Gray300
      Color: =ColorPalette.TextBody
      Fill: =ColorPalette.White
      Font: =Typography.Family
      Height: =32
      Default: |-
        =First(Sort(Filter(colPrograms, State.Value = "Active"), ProgramName)).ProgramName
      Items: |-
        =ForAll(Sort(Filter(colPrograms, State.Value = "Active"), ProgramName),
          ProgramName)
      OnChange: |-
        =UpdateContext({
          locProgram: LookUp(colPrograms, ProgramName = drpRSProgram.Selected.Value),
          locNewDraft: false,
          locDirty: false
        });
        UpdateContext({
          locVersion:
            First(SortByColumns(
              Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Published"),
              "SheetVersion", SortOrder.Descending))
        });
        ClearCollect(colSheetCrit,
          ForAll(
            Filter(colRatingCrit, RatingSheetID.Id = locVersion.ID) As rc,
            {
              CritID: rc.CatalogCriterionID.Id,
              CritName: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).CriterionName,
              CritEnd: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).EndDate,
              SortOrder: rc.DisplayOrder
            }))
      Size: =Typography.SizeBody
      TabIndex: =1
      Width: =400
      X: =24
      Y: =62

- lblRSStatus:
    Control: Label@2.5.1
    Properties:
      Color: |-
        =If(IsBlank(locProgram), ColorPalette.TextHelp,
           If(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Published")),
              ColorPalette.WarningText, ColorPalette.SuccessText))
      Font: =Typography.Family
      FontWeight: =Typography.WeightMedium
      Height: =32
      PaddingLeft: =12
      Size: =Typography.SizeBody
      Text: |-
        =If(IsBlank(locProgram),
           "Choose a program to see its scoring rubrics.",
           If(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Published")),
              "No published rubric — committee scoring is blocked for this program.",
              "Published v" &
                First(Filter(colSheets, ProgramID.Id = locProgram.ID,
                  State.Value = "Published")).SheetVersion &
                " is in use."))
      Width: =Parent.Width - 630
      X: =440
      Y: =62

- btnRSNewVersion:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Blue600
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =0
      Color: =ColorPalette.TextOnDark
      DisplayMode: |-
        =If(
          Or(IsBlank(locProgram),
             Not(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                  State.Value = "Draft")))),
          DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =ColorPalette.Blue600
      FocusedBorderColor: =ColorPalette.FocusOnDark
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =32
      HoverFill: =ColorPalette.Blue700
      OnSelect: |-
        =UpdateContext({ locVersion: Blank(), locNewDraft: true, locDirty: true });
        ClearCollect(colSheetCrit,
          ForAll(
            Filter(colRatingCrit,
              RatingSheetID.Id =
                First(Filter(colSheets, ProgramID.Id = locProgram.ID,
                  State.Value = "Published")).ID) As rc,
            {
              CritID: rc.CatalogCriterionID.Id,
              CritName: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).CriterionName,
              CritEnd: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).EndDate,
              SortOrder: rc.DisplayOrder
            }))
      PressedFill: =ColorPalette.Blue700
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =Typography.SizeBody
      TabIndex: =2
      Text: ="New version"
      Tooltip: |-
        =If(IsBlank(locProgram), "Choose a program first",
           If(Not(IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID,
                State.Value = "Draft"))),
              "Publish or delete the existing draft first",
              "Start a new version, seeded from the rubric in use"))
      Width: =150
      X: =Parent.Width - 174
      Y: =62

- lblRSVersionsHead:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =20
      Size: =Typography.SizeCaption
      Text: ="VERSIONS"
      Visible: =Not(IsBlank(locProgram))
      Width: =300
      X: =24
      Y: =108

- galRSVersions:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =104
      Items: |-
        =SortByColumns(
          Filter(colSheets, ProgramID.Id = locProgram.ID),
          "SheetVersion", SortOrder.Descending)
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =34
      Visible: =Not(IsBlank(locProgram))
      Width: =Parent.Width - 48
      X: =24
      Y: =130
    Children:
      - conRSVersionRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: |-
              =If(And(Not(IsBlank(locVersion)), ThisItem.ID = locVersion.ID),
                 ColorPalette.Blue50, ColorPalette.White)
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblRSVerNum:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =0.6
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: |-
                    ="v" & ThisItem.SheetVersion
            - lblRSVerState:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(ThisItem.State.Value,
                       "Published", ColorPalette.SuccessText,
                       "Draft", ColorPalette.Blue700,
                       ColorPalette.TextHelp)
                  FillPortions: =1.4
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: |-
                    =If(ThisItem.State.Value = "Published",
                       "Published — in use", ThisItem.State.Value)
            - lblRSVerCount:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  FillPortions: =1
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: |-
                    =CountRows(Filter(colRatingCrit,
                       RatingSheetID.Id = ThisItem.ID)) & " criteria"
            - lblRSVerWho:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  FillPortions: =2
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeCaption
                  Text: |-
                    =ThisItem.CreatedBy & " · " &
                      Text(ThisItem.CreatedDate, "mm/dd/yyyy")
      - btnRSVerSelect:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0.04)
            OnSelect: |-
              =UpdateContext({
                locVersion: ThisItem, locNewDraft: false, locDirty: false
              });
              ClearCollect(colSheetCrit,
                ForAll(
                  Filter(colRatingCrit, RatingSheetID.Id = ThisItem.ID) As rc,
                  {
                    CritID: rc.CatalogCriterionID.Id,
                    CritName: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).CriterionName,
                    CritEnd: LookUp(colCatalog, ID = rc.CatalogCriterionID.Id).EndDate,
                    SortOrder: rc.DisplayOrder
                  }))
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.08)
            Text: |-
              ="Open version " & ThisItem.SheetVersion
            Width: =Parent.TemplateWidth
            X: =0
            Y: =0
      - recRSVerLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

- lblRSNoVersions:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =40
      Size: =Typography.SizeBody
      Text: ="No rubric yet for this program. Use New version to build the first one."
      Visible: |-
        =And(Not(IsBlank(locProgram)),
           IsEmpty(Filter(colSheets, ProgramID.Id = locProgram.ID)))
      Width: =Parent.Width - 48
      X: =24
      Y: =150

- lblRSEditingWhat:
    Control: Label@2.5.1
    Properties:
      Color: =ColorPalette.TextHeading
      Font: =Typography.Family
      FontWeight: =Typography.WeightBold
      Height: =24
      Size: =Typography.SizeSubtitle
      Text: |-
        =If(locNewDraft,
           "New version — assign criteria",
           If(IsBlank(locVersion), "",
              If(locVersion.State.Value = "Draft",
                 "Editing draft v" & locVersion.SheetVersion,
                 "Viewing v" & locVersion.SheetVersion & " — published versions cannot be changed")))
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =Parent.Width - 48
      X: =24
      Y: =248

- lblRSPickPrompt:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =40
      Size: =Typography.SizeBody
      Text: ="Select a version above, or start a new one, to assign criteria."
      Visible: |-
        =And(Not(IsBlank(locProgram)), Not(locNewDraft), IsBlank(locVersion))
      Width: =Parent.Width - 48
      X: =24
      Y: =300

- conRSAvailHead:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =32
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =24
      Y: =280
    Children:
      - lblRSAvailHeadName:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            FillPortions: =3
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Published criteria"
      - lblRSAvailHeadAct:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHeading
            FillPortions: =1
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Add"

- galRSAvailable:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =Parent.Height - 380
      Items: |-
        =Sort(Filter(colCatalog, State.Value = "Published"), CriterionName)
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =44
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =24
      Y: =312
    Children:
      - conRSAvailRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblRSAvailName:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(IsBlank(LookUp(colSheetCrit, CritID = ThisItem.ID)),
                       ColorPalette.TextHeading, ColorPalette.TextMuted)
                  FillPortions: =3
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: =ThisItem.CriterionName
            - btnRSAdd:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.Blue600
                  DisplayMode: |-
                    =If(
                      Or(Not(IsBlank(LookUp(colSheetCrit, CritID = ThisItem.ID))),
                         And(Not(locNewDraft), Not(IsBlank(locVersion)),
                             locVersion.State.Value <> "Draft")),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Collect(colSheetCrit,
                      {
                        CritID: ThisItem.ID,
                        CritName: ThisItem.CriterionName,
                        CritEnd: ThisItem.EndDate,
                        SortOrder: CountRows(colSheetCrit) + 1
                      });
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeCaption
                  Text: |-
                    =If(IsBlank(LookUp(colSheetCrit, CritID = ThisItem.ID)),
                       "Add", "Added")
      - recRSAvailLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

- conRSOnSheetHead:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.Gray25
      Height: =32
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Horizontal
      PaddingLeft: =16
      PaddingRight: =16
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =Parent.Width / 2 + 8
      Y: =280
    Children:
      - lblRSOnSheetHeadName:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            FillPortions: =3
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: |-
              ="On this rubric (" & CountRows(colSheetCrit) & ")"
      - lblRSOnSheetHeadAct:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorPalette.TextHeading
            FillPortions: =1.6
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            LayoutMinWidth: =0
            Size: =Typography.SizeCaption
            Text: ="Order / remove"

- galRSOnSheet:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderColor: =ColorPalette.Gray200
      Height: =Parent.Height - 380
      Items: =SortByColumns(colSheetCrit, "SortOrder", SortOrder.Ascending)
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =44
      Visible: =Or(locNewDraft, Not(IsBlank(locVersion)))
      Width: =(Parent.Width - 64) / 2
      X: =Parent.Width / 2 + 8
      Y: =312
    Children:
      - conRSOnSheetRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =Parent.TemplateHeight
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.TemplateWidth
          Children:
            - lblRSOnSheetName:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(And(Not(IsBlank(ThisItem.CritEnd)),
                            ThisItem.CritEnd < Today()),
                       ColorPalette.DangerText, ColorPalette.TextHeading)
                  FillPortions: =3
                  Font: =Typography.Family
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: |-
                    =ThisItem.SortOrder & ".  " & ThisItem.CritName &
                      If(And(Not(IsBlank(ThisItem.CritEnd)),
                             ThisItem.CritEnd < Today()),
                         "  (expired)", "")
            - btnRSUp:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.TextBody
                  DisplayMode: |-
                    =If(
                      Or(ThisItem.SortOrder <= 1,
                         And(Not(locNewDraft), Not(IsBlank(locVersion)),
                             locVersion.State.Value <> "Draft")),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.5
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Patch(colSheetCrit,
                      LookUp(colSheetCrit, SortOrder = ThisItem.SortOrder - 1),
                      { SortOrder: ThisItem.SortOrder });
                    Patch(colSheetCrit,
                      LookUp(colSheetCrit, CritID = ThisItem.CritID),
                      { SortOrder: ThisItem.SortOrder - 1 });
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeBody
                  Text: ="▲"
                  Tooltip: ="Move up"
            - btnRSDown:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.TextBody
                  DisplayMode: |-
                    =If(
                      Or(ThisItem.SortOrder >= CountRows(colSheetCrit),
                         And(Not(locNewDraft), Not(IsBlank(locVersion)),
                             locVersion.State.Value <> "Draft")),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.5
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Patch(colSheetCrit,
                      LookUp(colSheetCrit, SortOrder = ThisItem.SortOrder + 1),
                      { SortOrder: ThisItem.SortOrder });
                    Patch(colSheetCrit,
                      LookUp(colSheetCrit, CritID = ThisItem.CritID),
                      { SortOrder: ThisItem.SortOrder + 1 });
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeBody
                  Text: ="▼"
                  Tooltip: ="Move down"
            - btnRSRemove:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =ColorPalette.WarningText
                  DisplayMode: |-
                    =If(
                      And(Not(locNewDraft), Not(IsBlank(locVersion)),
                          locVersion.State.Value <> "Draft"),
                      DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0.6
                  FocusedBorderColor: =ColorPalette.FocusOnLight
                  FocusedBorderThickness: =3
                  Font: =Typography.Family
                  Height: =30
                  HoverFill: =ColorPalette.Blue50
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Remove(colSheetCrit,
                      LookUp(colSheetCrit, CritID = ThisItem.CritID));
                    ClearCollect(colSheetCrit,
                      ForAll(
                        Sequence(CountRows(colSheetCrit)) As n,
                        Patch(
                          Last(FirstN(SortByColumns(colSheetCrit, "SortOrder",
                            SortOrder.Ascending), n.Value)),
                          { SortOrder: n.Value })));
                    UpdateContext({ locDirty: true })
                  PressedFill: =ColorPalette.Blue50
                  Size: =Typography.SizeCaption
                  Text: ="Remove"
      - recRSOnSheetLine:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =ColorPalette.Gray200
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1

- lblRSOnSheetEmpty:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Center
      Color: =ColorPalette.TextHelp
      Font: =Typography.Family
      Height: =40
      Size: =Typography.SizeBody
      Text: ="Add criteria from the left. At least one is required to save."
      Visible: |-
        =And(Or(locNewDraft, Not(IsBlank(locVersion))),
           CountRows(colSheetCrit) = 0)
      Width: =(Parent.Width - 64) / 2
      X: =Parent.Width / 2 + 8
      Y: =360

- lblRSDirty:
    Control: Label@2.5.1
    Properties:
      Align: =Align.Right
      Color: =ColorPalette.WarningText
      Font: =Typography.Family
      Height: =38
      Size: =Typography.SizeCaption
      Text: ="Unsaved changes"
      Visible: |-
        =And(locDirty, Or(locNewDraft,
           And(Not(IsBlank(locVersion)), locVersion.State.Value = "Draft")))
      Width: =180
      X: =Parent.Width - 640
      Y: =Parent.Height - 54

- btnRSDeleteDraft:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Gray300
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =ColorPalette.WarningText
      Fill: =ColorPalette.White
      FocusedBorderColor: =ColorPalette.FocusOnLight
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =38
      HoverFill: =ColorPalette.Gray50
      OnSelect: |-
        =UpdateContext({ locConfirmDel: Not(locNewDraft) });
        If(locNewDraft, Clear(colSheetCrit));
        If(locNewDraft,
          UpdateContext({ locNewDraft: false, locDirty: false, locVersion: Blank() }))
      PressedFill: =ColorPalette.White
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      TabIndex: =3
      Text: |-
        =If(locNewDraft, "Discard", "Delete draft")
      Visible: |-
        =Or(locNewDraft,
           And(Not(IsBlank(locVersion)), locVersion.State.Value = "Draft"))
      Width: =130
      X: =Parent.Width - 448
      Y: =Parent.Height - 54

- btnRSSave:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.Blue600
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =0
      Color: =ColorPalette.TextOnDark
      Fill: =ColorPalette.Blue600
      FocusedBorderColor: =ColorPalette.FocusOnDark
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =38
      HoverFill: =ColorPalette.Blue700
      OnSelect: |-
        =UpdateContext({
          locWarnTitle: If(CountRows(colSheetCrit) = 0,
                           "A rubric needs at least one criterion", ""),
          locWarnMsg: If(CountRows(colSheetCrit) = 0,
                         "Add at least one criterion from the left before saving this version.",
                         "")
        });
        UpdateContext({ locWarn: locWarnMsg <> "" });
        If(Not(locWarn),
          UpdateContext({
            locSavedSheet:
              If(locNewDraft,
                 Patch(RATING_SHEETS, Defaults(RATING_SHEETS),
                   {
                     ProgramID: {
                       '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                       Id: locProgram.ID,
                       Value: locProgram.ProgramName
                     },
                     SheetVersion:
                       Coalesce(Max(Filter(colSheets, ProgramID.Id = locProgram.ID),
                         SheetVersion), 0) + 1,
                     State: { Value: "Draft" },
                     CreatedBy: User().FullName,
                     CreatedDate: Today()
                   }),
                 LookUp(RATING_SHEETS, ID = locVersion.ID))
          }));
        If(Not(locWarn),
          RemoveIf(RATING_CRITERIA, RatingSheetID.Id = locSavedSheet.ID));
        If(Not(locWarn),
          ForAll(SortByColumns(colSheetCrit, "SortOrder", SortOrder.Ascending) As c,
            Patch(RATING_CRITERIA, Defaults(RATING_CRITERIA),
              {
                RatingSheetID: {
                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                  Id: locSavedSheet.ID,
                  Value: locSavedSheet.ID
                },
                CatalogCriterionID: {
                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                  Id: c.CritID,
                  Value: c.CritName
                },
                DisplayOrder: c.SortOrder
              })));
        If(Not(locWarn),
          ClearCollect(colSheets, RATING_SHEETS);
          ClearCollect(colRatingCrit, RATING_CRITERIA));
        If(Not(locWarn),
          UpdateContext({
            locVersion: locSavedSheet, locNewDraft: false, locDirty: false
          }));
        If(Not(locWarn), Notify("Draft saved.", NotificationType.Success))
      PressedFill: =ColorPalette.Blue700
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      TabIndex: =4
      Text: ="Save draft"
      Visible: |-
        =Or(locNewDraft,
           And(Not(IsBlank(locVersion)), locVersion.State.Value = "Draft"))
      Width: =130
      X: =Parent.Width - 306
      Y: =Parent.Height - 54

- btnRSPublish:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorPalette.SuccessText
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =ColorPalette.SuccessText
      Fill: =ColorPalette.White
      FocusedBorderColor: =ColorPalette.FocusOnLight
      FocusedBorderThickness: =3
      Font: =Typography.Family
      Height: =38
      HoverFill: =ColorPalette.Gray50
      OnSelect: |-
        =UpdateContext({
          locWarnTitle: If(
            CountRows(colSheetCrit) = 0,
            "A rubric needs at least one criterion",
            Not(IsEmpty(Filter(colSheetCrit,
              And(Not(IsBlank(CritEnd)), CritEnd < Today())))),
            "This rubric uses an expired criterion",
            locDirty, "Save the draft first",
            ""),
          locWarnMsg: If(
            CountRows(colSheetCrit) = 0,
            "Add at least one criterion before publishing this version.",
            Not(IsEmpty(Filter(colSheetCrit,
              And(Not(IsBlank(CritEnd)), CritEnd < Today())))),
            First(Filter(colSheetCrit,
              And(Not(IsBlank(CritEnd)), CritEnd < Today()))).CritName &
              " passed its end date and cannot be scored against. Remove it, then publish.",
            locDirty,
            "There are unsaved changes. Save the draft, then publish it.",
            "")
        });
        UpdateContext({ locWarn: locWarnMsg <> "" });
        If(Not(locWarn),
          ForAll(Filter(RATING_SHEETS, ProgramID.Id = locProgram.ID,
                   State.Value = "Published") As old,
            Patch(RATING_SHEETS, LookUp(RATING_SHEETS, ID = old.ID),
              { State: { Value: "Superseded" } })));
        If(Not(locWarn),
          UpdateContext({
            locVersion: Patch(RATING_SHEETS,
              LookUp(RATING_SHEETS, ID = locVersion.ID),
              { State: { Value: "Published" } })
          }));
        If(Not(locWarn), ClearCollect(colSheets, RATING_SHEETS));
        If(Not(locWarn),
          Notify("Version published. This is now the rubric in use for " &
                 locProgram.ProgramName & ".", NotificationType.Success))
      PressedFill: =ColorPalette.White
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =Typography.SizeBody
      TabIndex: =5
      Text: ="Publish"
      Visible: |-
        =And(Not(locNewDraft), Not(IsBlank(locVersion)),
           locVersion.State.Value = "Draft")
      Width: =130
      X: =Parent.Width - 164
      Y: =Parent.Height - 54

