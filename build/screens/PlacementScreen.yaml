# Placement Screen — DTD's placement workspace.
# Classic controls only (Constitution II). Colours = ColorPalette.*, sizes = Typography.*
#
# Rebuild started 2026-08-11. Layout in progress.
#
# STATE (from PlacementScreen.OnVisible.fx):
#   colTabsPL              — All Applicants / Not Selected / one row per Active program.
#   locTabPL               — selected tab id. -1 = All Applicants, -2 = Not Selected, else PROGRAMS.ID.
#   locCyclePL             — the Open cycle.
#   locSortColPL           — column the All Applicants gallery is sorted by, blank = default order.
#   locSortAscPL           — sort direction on the current column.
#   locSortColProgPL       — column the per-program gallery is sorted by, blank = default order.
#   locSortAscProgPL       — sort direction on the current column.
#   colAppPlacementPL      — per-applicant persisted placement { appId, label, placedProgramId }.
#                            Written by both the All Applicants dropdown and the per-program toggle.
#   colProgRowsPL          — per (application, program) rows for the per-program gallery.
#
# COMPONENTS: PowerLibs tab-bar-v2-1 (tabs) + gallery-filter-header (All Applicants
# and per-program tabs), all renamed to project convention.
#
# TAB: All Applicants (locTabPL = -1) / Not Selected (locTabPL = -2)
# ---------------------------------------------------------------------------
# conAllAppsPL — sortable header + gallery of applicants in the Open cycle.
# Each row shows name / title / grade / location and a per-row Placement
# dropdown. Right-hand detail panel keys off locSelectedAppPL.
#
# TAB: <Program abbreviation> (locTabPL > 0, one per Active program)
# ---------------------------------------------------------------------------
# conProgTabPL — full-width sortable gallery of applicants who ranked the tab's
# program. Row shows employee details + FinalScore + PercentOfPossible + a
# Classic/Toggle that places / unplaces the applicant in this program. The
# toggle writes to APPLICATIONS AND colAppPlacementPL, so the All Applicants
# dropdown and other program tabs stay in sync without a re-fetch.

- conTabsPL:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderStyle: =BorderStyle.None
      DropShadow: =DropShadow.None
      Fill: =ColorPalette.White
      Height: =40
      Width: =Parent.Width - 48
      X: =24
      Y: =76
    Children:
      - galTabsPL:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Height: =Parent.Height
            Items: =colTabsPL
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =galTabsPL.Width / galTabsPL.AllItemsCount
            Width: =Parent.Width
          Children:
            - conTabItemPL:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.TemplateHeight
                  Width: =Parent.TemplateWidth
                Children:
                  - btnTabPL:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: |-
                          =If(locTabPL = ThisItem.id,
                             ColorPalette.Blue600, ColorPalette.TextHelp)
                        Fill: =Color.Transparent
                        Font: =Typography.Family
                        FontWeight: |-
                          =If(locTabPL = ThisItem.id,
                             Typography.WeightBold, Typography.WeightMedium)
                        Height: =Parent.Height
                        HoverBorderColor: =Color.Transparent
                        HoverColor: =ColorPalette.Blue600
                        HoverFill: =ColorPalette.Gray25
                        OnSelect: |-
                          =UpdateContext({ locTabPL: ThisItem.id })
                        PressedBorderColor: =Color.Transparent
                        PressedFill: =ColorPalette.Gray50
                        Size: =Typography.SizeBody
                        Text: =ThisItem.label
                        Width: =Parent.Width
                  - recTabIndPL:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Fill: |-
                          =If(locTabPL = ThisItem.id,
                             ColorPalette.Blue600, Color.Transparent)
                        Height: =3
                        Width: =btnTabPL.Width
                        X: =btnTabPL.Width / 2 - Self.Width / 2
                        Y: =Parent.Height - Self.Height

- conAllAppsPL:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height - Self.Y - 24
      # Serves both fixed tabs (-1 All Applicants, -2 Not Selected). The
      # gallery's Items filter uses locTabPL to swap the row set; the detail
      # panel is tab-agnostic (keys off locSelectedAppPL).
      Visible: =Or(locTabPL = -1, locTabPL = -2)
      Width: =Parent.Width - 48
      X: =24
      Y: =conTabsPL.Y + conTabsPL.Height + 16
    Children:
      # ---- Header row — clickable labels toggle sort on their column ----
      - conHeaderRowPL:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray50
            Height: =40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width * 2 / 3 - 8
            X: =0
            Y: =0
          Children:
            - lblHdrNamePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "ApplicantName", Not(locSortAscPL), true),
                       locSortColPL: "ApplicantName"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Name" & If(locSortColPL = "ApplicantName", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrTitlePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "JobTitle", Not(locSortAscPL), true),
                       locSortColPL: "JobTitle"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Title" & If(locSortColPL = "JobTitle", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrGradePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "Grade", Not(locSortAscPL), true),
                       locSortColPL: "Grade"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Grade" & If(locSortColPL = "Grade", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrLocationPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscPL: If(locSortColPL = "Location", Not(locSortAscPL), true),
                       locSortColPL: "Location"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Location" & If(locSortColPL = "Location", If(locSortAscPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblHdrPlacementPL:
                # Placement is a per-row DropDown, not a column value — not sortable.
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: ="Placement"
                  Width: =Parent.Width

      # ---- Gallery — one row per applicant in the Open cycle ----
      - galApplicantsPL:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =Parent.Height - conHeaderRowPL.Height - 4
            # Tab-aware source: -1 = all cycle applicants; -2 = only those
            # marked PlacementOutcome = "Not Selected". With() extracts the
            # filter so it is not duplicated between the sorted / unsorted
            # branches.
            Items: |-
              =With(
                 { rows: Filter(APPLICATIONS,
                          CycleID.Id = locCyclePL.ID,
                          Switch(locTabPL,
                             -1, true,
                             -2, PlacementOutcome.Value = "Not Selected",
                             false)) },
                 If(IsBlank(locSortColPL),
                    rows,
                    SortByColumns(rows, locSortColPL,
                       If(locSortAscPL, SortOrder.Ascending, SortOrder.Descending))))
            # Row click drives the detail panel.
            OnSelect: |-
              =UpdateContext({ locSelectedAppPL: ThisItem })
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =48
            Width: =conHeaderRowPL.Width
            X: =0
            Y: =conHeaderRowPL.Y + conHeaderRowPL.Height + 2
          Children:
            - conRowPL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingLeft: =12
                  PaddingRight: =12
                  Width: =Parent.TemplateWidth
                Children:
                  # Each label carries the row-select OnSelect. AutoLayout
                  # containers do not bubble clicks to the Gallery's OnSelect,
                  # so setting locSelectedAppPL on the labels directly is the
                  # reliable path; the dropdown still handles its own click.
                  - lblRowNamePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        FillPortions: =1
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.ApplicantName
                        Width: =Parent.Width
                  - lblRowTitlePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.JobTitle
                        Width: =Parent.Width
                  - lblRowGradePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Grade
                        Width: =Parent.Width
                  - lblRowLocationPL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({ locSelectedAppPL: ThisItem })
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Location
                        Width: =Parent.Width
                  - drpRowPlacementPL:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =ColorPalette.Gray300
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        ChevronBackground: =ColorPalette.White
                        ChevronFill: =ColorPalette.TextHelp
                        Color: =ColorPalette.TextBody
                        # Echoes the persisted placement state for this
                        # applicant via colAppPlacementPL (built at OnVisible).
                        # "Not Selected" / <program abbreviation> / "" (no
                        # decision yet — Default must match a row in Items so
                        # the blank first row satisfies it).
                        Default: |-
                          =LookUp(colAppPlacementPL, appId = ThisItem.ID).label
                        Fill: =ColorPalette.White
                        FillPortions: =1
                        Font: =Typography.Family
                        Height: =32
                        # Per-row Items: two fixed rows ("" and "Not Selected")
                        # followed by the applicant's applied-to programs, one
                        # row per program (Distinct guards against an applicant
                        # ranking multiple options under the same program).
                        # Sorted alphabetically so the order is stable across
                        # applicants. First row is blank so Default = "" hits it.
                        # Items built at OnVisible into colAppOptsPL (keyed by
                        # applicant). Simple filter per row.
                        Items: =Filter(colAppOptsPL, appId = ThisItem.ID)
                        LayoutMinWidth: =0
                        # Persists final placement to APPLICATIONS.
                        # "Not Selected"          -> PlacementOutcome = Not Selected, clear the lookup.
                        # <program abbreviation>  -> PlacementProgramID = the program, PlacementOutcome = Placed.
                        # "" (blank)              -> no-op (revert case not wired; edit in SharePoint).
                        # colAppPlacementPL is patched to keep the dropdown Default in sync across tab switches.
                        OnChange: |-
                          =With(
                             { pgm: LookUp(PROGRAMS, Abbreviation = Self.Selected.label) },
                             Switch(true,
                                Self.Selected.label = "Not Selected",
                                   Patch(APPLICATIONS, ThisItem,
                                      { PlacementOutcome:    { Value: "Not Selected" },
                                        PlacementProgramID:  Blank(),
                                        PlacementOptionID:   Blank() });
                                   Patch(colAppPlacementPL,
                                      LookUp(colAppPlacementPL, appId = ThisItem.ID),
                                      { label: "Not Selected", placedProgramId: Blank() }),
                                Not(IsBlank(pgm)),
                                   Patch(APPLICATIONS, ThisItem,
                                      { PlacementOutcome:   { Value: "Placed" },
                                        PlacementProgramID: {
                                           '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                           Id: pgm.ID,
                                           Value: pgm.ProgramName },
                                        PlacementOptionID:  Blank() });
                                   Patch(colAppPlacementPL,
                                      LookUp(colAppPlacementPL, appId = ThisItem.ID),
                                      { label: pgm.Abbreviation, placedProgramId: pgm.ID }),
                                false))
                        Size: =Typography.SizeBody
            - recRowDividerPL:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1

      # ---- Right panel — details for the selected applicant ----
      - conDetailPL:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorPalette.Gray200
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.White
            Height: =Parent.Height
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width * 1 / 3 - 8
            X: =Parent.Width * 2 / 3 + 8
            Y: =0
          Children:
            # Empty state — before any row is clicked.
            - lblDetailEmptyPL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =40
                  Size: =Typography.SizeBody
                  Text: ="Select an applicant to see their program choices and scores."
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =IsBlank(locSelectedAppPL.ID)
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =Parent.Height / 2 - 20
                  Wrap: =true
            # Selected applicant — name.
            - lblDetailNamePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =28
                  Size: =Typography.SizeSubtitle
                  Text: =locSelectedAppPL.ApplicantName
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =16
            # Sub-line: title · grade · location. Blanks are dropped by Trim/If.
            - lblDetailSubPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: |-
                    =Coalesce(locSelectedAppPL.JobTitle, "") &
                     If(IsBlank(locSelectedAppPL.Grade), "",
                        "  ·  " & locSelectedAppPL.Grade) &
                     If(IsBlank(locSelectedAppPL.Location), "",
                        "  ·  " & locSelectedAppPL.Location)
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =lblDetailNamePL.Y + lblDetailNamePL.Height + 4
            # Divider.
            - recDetailRulePL:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =lblDetailSubPL.Y + lblDetailSubPL.Height + 16
            # Section header.
            - lblProgsHeadPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="PROGRAMS APPLIED TO"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =recDetailRulePL.Y + recDetailRulePL.Height + 16
            # Sub-header row: Program / Score / Percent columns.
            - lblProgsColProgPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="Program"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =120
                  X: =16
                  Y: =lblProgsHeadPL.Y + lblProgsHeadPL.Height + 8
            - lblProgsColScorePL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="Score"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =60
                  X: =Parent.Width - 16 - 60 - 60 - 8
                  Y: =lblProgsColProgPL.Y
            - lblProgsColPctPL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =20
                  Size: =Typography.SizeCaption
                  Text: ="%"
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =60
                  X: =Parent.Width - 16 - 60
                  Y: =lblProgsColProgPL.Y
            # Program-choices gallery: one row per APPLICATION_PROGRAM_CHOICES
            # for this applicant. Rows sorted by Rank (applicant's preference).
            - galDetailProgsPL:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =Parent.Height - Self.Y - 16
                  Items: |-
                    =SortByColumns(
                       Filter(APPLICATION_PROGRAM_CHOICES,
                              ApplicationID.Id = locSelectedAppPL.ID),
                       "Rank", SortOrder.Ascending)
                  ShowScrollbar: =true
                  TemplatePadding: =0
                  TemplateSize: =40
                  Visible: =Not(IsBlank(locSelectedAppPL.ID))
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =lblProgsColProgPL.Y + lblProgsColProgPL.Height + 4
                Children:
                  - lblProgNameDPL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        Font: =Typography.Family
                        Height: =32
                        Size: =Typography.SizeBody
                        Text: |-
                          =Coalesce(
                             LookUp(PROGRAMS, ID = ThisItem.ProgramID.Id).Abbreviation,
                             ThisItem.ProgramID.Value)
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =120
                        X: =0
                        Y: =4
                  - lblProgScoreDPL:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =32
                        Size: =Typography.SizeBody
                        # FinalScore is blank until a committee scores. Show a dash then.
                        Text: |-
                          =If(IsBlank(ThisItem.FinalScore), "—", Text(ThisItem.FinalScore))
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =60
                        X: =Parent.TemplateWidth - 60 - 60 - 8
                        Y: =4
                  - lblProgPctDPL:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =ColorPalette.TextBody
                        Font: =Typography.Family
                        Height: =32
                        Size: =Typography.SizeBody
                        Text: |-
                          =If(IsBlank(ThisItem.PercentOfPossible), "—",
                             Text(Round(ThisItem.PercentOfPossible * 100, 0)) & "%")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =60
                        X: =Parent.TemplateWidth - 60
                        Y: =4

# ===========================================================================
# TAB: Program tab (locTabPL > 0) — one per Active program.
# Full-width sortable gallery. Rows read from colProgRowsPL (built at
# OnVisible) filtered by programId = locTabPL. The IsPlaced column is a
# derived column that reads live from colAppPlacementPL, so the toggle Default
# re-evaluates whenever the collection is patched (touching the Items table
# forces gallery rows to re-render).
- conProgTabPL:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height - Self.Y - 24
      Visible: =locTabPL > 0
      Width: =Parent.Width - 48
      X: =24
      Y: =conTabsPL.Y + conTabsPL.Height + 16
    Children:
      # ---- Header row — clickable labels toggle sort on their column ----
      - conProgHdrPL:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPalette.Gray50
            Height: =40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - lblProgHdrNamePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =2
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscProgPL: If(locSortColProgPL = "ApplicantName", Not(locSortAscProgPL), true),
                       locSortColProgPL: "ApplicantName"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Name" & If(locSortColProgPL = "ApplicantName", If(locSortAscProgPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblProgHdrTitlePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =2
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscProgPL: If(locSortColProgPL = "JobTitle", Not(locSortAscProgPL), true),
                       locSortColProgPL: "JobTitle"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Title" & If(locSortColProgPL = "JobTitle", If(locSortAscProgPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblProgHdrGradePL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscProgPL: If(locSortColProgPL = "Grade", Not(locSortAscProgPL), true),
                       locSortColProgPL: "Grade"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Grade" & If(locSortColProgPL = "Grade", If(locSortAscProgPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblProgHdrLocationPL:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  FillPortions: =2
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscProgPL: If(locSortColProgPL = "Location", Not(locSortAscProgPL), true),
                       locSortColProgPL: "Location"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Location" & If(locSortColProgPL = "Location", If(locSortAscProgPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblProgHdrScorePL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscProgPL: If(locSortColProgPL = "FinalScore", Not(locSortAscProgPL), true),
                       locSortColProgPL: "FinalScore"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="Score" & If(locSortColProgPL = "FinalScore", If(locSortAscProgPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblProgHdrPctPL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =UpdateContext({
                       locSortAscProgPL: If(locSortColProgPL = "PercentOfPossible", Not(locSortAscProgPL), true),
                       locSortColProgPL: "PercentOfPossible"
                    })
                  Size: =Typography.SizeBody
                  Text: |-
                    ="%" & If(locSortColProgPL = "PercentOfPossible", If(locSortAscProgPL, "  ▲", "  ▼"), "")
                  Width: =Parent.Width
            - lblProgHdrPlacedPL:
                # Placed is a per-row Classic/Toggle — not a column value, not sortable.
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorPalette.TextHeading
                  FillPortions: =1
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  LayoutMinWidth: =0
                  Size: =Typography.SizeBody
                  Text: ="Placed"
                  Width: =Parent.Width

      # ---- Gallery — one row per applicant who ranked this program ----
      - galProgPL:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorPalette.Gray200
            Height: =Parent.Height - conProgHdrPL.Height - 4
            # colProgRowsPL is built at OnVisible with all (application,
            # program) rows for the Open cycle. Filter by locTabPL to get
            # this program's rows; AddColumns projects IsPlaced from
            # colAppPlacementPL so a toggle Patch triggers a gallery re-render.
            Items: |-
              =With(
                 { rows: AddColumns(
                            Filter(colProgRowsPL, programId = locTabPL) As r,
                            IsPlaced,
                               LookUp(colAppPlacementPL, appId = r.appId).placedProgramId = locTabPL) },
                 If(IsBlank(locSortColProgPL),
                    rows,
                    SortByColumns(rows, locSortColProgPL,
                       If(locSortAscProgPL, SortOrder.Ascending, SortOrder.Descending))))
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =48
            Width: =Parent.Width
            X: =0
            Y: =conProgHdrPL.Y + conProgHdrPL.Height + 2
          Children:
            - conProgRowPL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingLeft: =12
                  PaddingRight: =12
                  Width: =Parent.TemplateWidth
                Children:
                  - lblProgRowNamePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextHeading
                        FillPortions: =2
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightMedium
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: =ThisItem.ApplicantName
                        Width: =Parent.Width
                  - lblProgRowTitlePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =2
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: =ThisItem.JobTitle
                        Width: =Parent.Width
                  - lblProgRowGradePL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Grade
                        Width: =Parent.Width
                  - lblProgRowLocationPL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorPalette.TextBody
                        FillPortions: =2
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: =ThisItem.Location
                        Width: =Parent.Width
                  - lblProgRowScorePL:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        # FinalScore is blank until a committee scores. Show a dash then.
                        Text: |-
                          =If(IsBlank(ThisItem.FinalScore), "—", Text(ThisItem.FinalScore))
                        Width: =Parent.Width
                  - lblProgRowPctPL:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =ColorPalette.TextBody
                        FillPortions: =1
                        Font: =Typography.Family
                        LayoutMinWidth: =0
                        Size: =Typography.SizeBody
                        Text: |-
                          =If(IsBlank(ThisItem.PercentOfPossible), "—",
                             Text(Round(ThisItem.PercentOfPossible * 100, 0)) & "%")
                        Width: =Parent.Width
                  - togProgRowPlacePL:
                      Control: Classic/Toggle@2.1.0
                      Properties:
                        # Default echoes IsPlaced (projected from colAppPlacementPL
                        # by the gallery's Items AddColumns). Any Patch to that
                        # collection re-renders the row and the toggle resets to
                        # match — so placing in one tab clears the toggle in others.
                        Default: =ThisItem.IsPlaced
                        FillPortions: =1
                        # OnChange fires on every state flip. Patches both
                        # APPLICATIONS (persisted) and colAppPlacementPL (the local
                        # mirror the All Applicants dropdown and the other program
                        # tabs read). PlacementOptionID stays Blank — HPP option is
                        # a separate decision, not part of this toggle.
                        OnChange: |-
                          =With(
                             { pgm: LookUp(PROGRAMS, ID = locTabPL) },
                             If(Self.Value,
                                Patch(APPLICATIONS, LookUp(APPLICATIONS, ID = ThisItem.appId),
                                   { PlacementOutcome:   { Value: "Placed" },
                                     PlacementProgramID: {
                                        '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                        Id: pgm.ID,
                                        Value: pgm.ProgramName },
                                     PlacementOptionID:  Blank() });
                                Patch(colAppPlacementPL,
                                   LookUp(colAppPlacementPL, appId = ThisItem.appId),
                                   { label: pgm.Abbreviation, placedProgramId: pgm.ID }),
                                Patch(APPLICATIONS, LookUp(APPLICATIONS, ID = ThisItem.appId),
                                   { PlacementOutcome:   { Value: "Decision Pending" },
                                     PlacementProgramID: Blank(),
                                     PlacementOptionID:  Blank() });
                                Patch(colAppPlacementPL,
                                   LookUp(colAppPlacementPL, appId = ThisItem.appId),
                                   { label: "", placedProgramId: Blank() })))
                        Width: =Parent.Width
            - recProgRowDivPL:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.Gray200
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
