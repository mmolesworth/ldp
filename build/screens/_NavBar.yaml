# Global Navigation Bar — cmpNavBar
# Source: PowerLibs `minimal-mega-menu-navbar` (Pro), generated 2026-07-25 via
# generate_yaml with yaml_mode "classic" and primaryColor #246FAE, then adapted
# to project convention. Constitution VIII — library component, not primitives.
#
# ---------------------------------------------------------------------------
# THIS IS A SHARED PASTE BLOCK
# ---------------------------------------------------------------------------
# Paste it at the TOP of every screen, before that screen's own controls. It is
# not a canvas component, so each screen holds its own copy — if you change this
# file, re-paste it everywhere. (Converting it to a real canvas component is a
# later refactor; see T083.)
#
# Because every screen gets a copy, the control names here would collide app-wide.
# Studio auto-suffixes duplicates (conNavBar_1, _2 …) and that is FINE for this
# block specifically — nothing references these controls by name across screens.
# The only cross-screen state is the gblActiveNav / gblAnim* globals, which are
# deliberately shared so the menu behaves identically everywhere.
#
# ---------------------------------------------------------------------------
# ADAPTATIONS FROM THE GENERATED OUTPUT
# ---------------------------------------------------------------------------
#   · every hardcoded RGBA replaced with ColorPalette.* (Constitution VIII)
#   · every hardcoded font/size replaced with Typography.*
#   · nav label size raised 10 -> Typography.SizeBody (11) for 508 legibility
#   · descriptive text uses TextHelp, never TextMuted (theme.md A11y rule 2)
#   · GroupContainer@1.4.0 -> @1.5.0 (this environment's current version)
#   · controls renamed to the 3-char prefix convention; the generated
#     "UnderlineApply" etc. had no prefix and became recUnderline*
#   · dropdown items wired to Navigate() via Switch on ThisItem.label — a
#     gallery cannot Navigate dynamically, so each destination is a literal
#     branch. Screens that do not exist yet fall through to a Notify.
#   · logo width widened 120 -> 260 to fit the real programme name
#
# The SVG arrow glyphs keep their hex colours: they are inside a data URI string,
# where Power Fx tokens cannot reach. They are decorative chevrons, not text.

- conNavBar:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Group: NavBar
    Properties:
      BorderColor: =ColorPalette.Gray200
      BorderThickness: =1
      Fill: =ColorPalette.White
      Height: =64
      Width: =Parent.Width
    Children:
      - conNavLogo:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =64
            Width: =260
            X: =24
          Children:
            - lblNavTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightBold
                  Height: =32
                  Size: =Typography.SizeHeading
                  Text: ="Leader Development Program"
                  Width: =260
                  Y: =Parent.Height/2 - Self.Height/2
      - conNavItems:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =64
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =568
            X: =Parent.Width/2 - Self.Width/2
          Children:
            - conNavApply:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutMinHeight: =0
                  LayoutMinWidth: =100
                  Width: =100
                Children:
                  - btnNavApply:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: |-
                          =If(gblActiveNav = "Apply", ColorPalette.TextHeading, ColorPalette.TextHelp)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Typography.Family
                        FontWeight: =Typography.WeightRegular
                        Height: =64
                        HoverColor: =ColorPalette.TextHeading
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Set(gblActiveNav, If(gblActiveNav = "Apply", "", "Apply"));
                          Set(gblAnimApply, Text(Now(), "yyyymmddhhmmssfff"))
                        PressedColor: =ColorPalette.TextHeading
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Size: =Typography.SizeBody
                        Text: ="Apply"
                        Width: =Parent.Width
                  - imgArrowApply:
                      Control: Image@2.2.3
                      Properties:
                        Height: =10
                        Image: |-
                          ="data:image/svg+xml," & EncodeUrl(
                              "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>
                                <style>
                                  .arrowApply_" & gblAnimApply & " {
                                    stroke: " & If(gblActiveNav = "Apply", "#213455", "#5D6B7D") & ";
                                    stroke-width: 1.5;
                                    stroke-linecap: round;
                                    stroke-linejoin: round;
                                    fill: none;
                                    transform-origin: center;
                                    animation-name: rotateArrowApply_" & gblAnimApply & ";
                                    animation-duration: " & If(IsBlank(gblAnimApply), "0ms", "200ms") & ";
                                    animation-fill-mode: both;
                                    animation-timing-function: ease-out;
                                  }
                                  @keyframes rotateArrowApply_" & gblAnimApply & " {
                                    " & If(gblActiveNav = "Apply", "0%", "100%") & " {
                                      transform: rotate(0deg);
                                    }
                                    " & If(gblActiveNav = "Apply", "100%", "0%") & " {
                                      transform: rotate(180deg);
                                    }
                                  }
                                </style>
                                <path class='arrowApply_" & gblAnimApply & "' d='m6 9 6 6 6-6' />
                              </svg>"
                          )
                        Width: =10
                        X: =Parent.Width - Self.Width - 18
                        Y: =Parent.Height/2 - Self.Height/2
                  - recUnderlineApply:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ColorPalette.Blue600
                        Height: =2
                        Visible: =gblActiveNav = "Apply"
                        Width: =40
