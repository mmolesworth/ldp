# Click-away closer for the open dropdown.
- btnNavScrim:
    Control: Classic/Button@2.2.0
    Group: NavBar
    Properties:
      BorderStyle: =BorderStyle.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height
      HoverBorderColor: =Self.Fill
      HoverFill: =Self.Fill
      OnSelect: =Set(gblActiveNav, "")
      PressedBorderColor: =Self.Fill
      PressedFill: =Self.Fill
      Text: =""
      Visible: =Not(IsBlank(gblActiveNav))
      Width: =Parent.Width

- conNavDropApply:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Group: NavBar
    Properties:
      BorderColor: =ColorPalette.Gray200
      BorderThickness: =1
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =180
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      Visible: =gblActiveNav = "Apply"
      Width: =Parent.Width
      Y: =64
    Children:
      - galNavApply:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =140
            Items: |-
              =[
                {label: "My Application", desc: "Start or continue your application"},
                {label: "Program Information", desc: "Programs, dates and eligibility"}
              ]
            ShowScrollbar: =false
            TemplatePadding: =12
            TemplateSize: =220
            Width: =Parent.Width - 120
            X: =60
            Y: =20
          Children:
            - btnNavApplyCard:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorPalette.Gray200
                  BorderThickness: =1
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =ColorPalette.White
                  Height: =Parent.TemplateHeight
                  HoverBorderColor: =ColorPalette.Gray300
                  HoverFill: =ColorPalette.Gray25
                  PressedFill: =ColorPalette.Gray50
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Text: =""
                  Width: =Parent.TemplateWidth
            - lblNavApplyLabel:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHeading
                  Font: =Typography.Family
                  FontWeight: =Typography.WeightMedium
                  Height: =24
                  PaddingLeft: =16
                  Size: =Typography.SizeBody
                  Text: =ThisItem.label
                  Width: =200
                  Y: =40
            - lblNavApplyDesc:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorPalette.TextHelp
                  Font: =Typography.Family
                  Height: =20
                  PaddingLeft: =16
                  Size: =Typography.SizeCaption
                  Text: =ThisItem.desc
                  Width: =200
                  Y: =64
            # A gallery cannot Navigate dynamically, so each destination is a
            # literal branch. Unbuilt screens fall through to the Notify.
            - btnNavApplyGo:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnSelect: |-
                    =Set(gblActiveNav, "");
                    Switch(ThisItem.label,
                      "Program Information", Navigate('Landing Screen'),
                      Notify("That screen has not been built yet.", NotificationType.Information)
                    )
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Text: |-
                    =ThisItem.label & ". " & ThisItem.desc
                  Width: =Parent.TemplateWidth

