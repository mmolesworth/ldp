                      "Rating Sheets", Navigate('Rating Sheets Screen'),
                      Notify("That screen has not been built yet.", NotificationType.Information)
                    )
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Text: |-
                    =ThisItem.label & ". " & ThisItem.desc
                  Width: =Parent.TemplateWidth

