            X: =Parent.Width / 2 - 15
            Y: =37
      - lblRetireTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =26
            Size: =Typography.SizeHeading
            Text: ="Retire this competency?"
            Width: =Parent.Width - 48
            X: =24
            Y: =92
      - lblRetireBody:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =56
