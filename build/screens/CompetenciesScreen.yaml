                " will stop appearing to applicants. Existing applications that reference it are unaffected, and you can restore it at any time."
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 64
            X: =32
            Y: =122
      - btnRetireConfirm:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Blue600
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =0
            Color: =ColorPalette.TextOnDark
            Fill: =ColorPalette.Blue600
            FocusedBorderColor: =ColorPalette.FocusOnDark
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Blue700
            OnSelect: |-
              =Patch(COMPETENCIES,
                LookUp(COMPETENCIES, ID = locRetireComp.ID),
                { State: { Value: "Retired" } });
              UpdateContext({ locConfirmRetire: false, locRetireComp: Blank() });
              ClearCollect(colComps, COMPETENCIES);
              Notify("Competency retired.", NotificationType.Success)
            PressedFill: =ColorPalette.Blue700
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =9
            Text: ="Retire"
            Width: =120
            X: =Parent.Width / 2 - 130
            Y: =Parent.Height - 60
      - btnRetireCancel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorPalette.Gray300
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =ColorPalette.TextBody
            Fill: =ColorPalette.White
            FocusedBorderColor: =ColorPalette.FocusOnLight
            FocusedBorderThickness: =3
            Font: =Typography.Family
            Height: =38
            HoverFill: =ColorPalette.Gray50
            OnSelect: |-
              =UpdateContext({ locConfirmRetire: false, locRetireComp: Blank() })
            PressedFill: =ColorPalette.White
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =Typography.SizeBody
            TabIndex: =10
            Text: ="Cancel"
            Width: =120
            X: =Parent.Width / 2 + 10
            Y: =Parent.Height - 60
