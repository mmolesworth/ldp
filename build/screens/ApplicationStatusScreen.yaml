# ===========================================================================
# WHAT HAPPENS NEXT — keyed to the stage, not the step
# ===========================================================================
# Keyed to ReviewStage rather than locTimeStep so the second-line detour can
# say who is actually being waited on. Every branch ends by telling the
# applicant whether anything is needed from them; that is the only question
# this panel exists to answer.
- conNextAS:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =144
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: |-
        =And(Not(IsBlank(locApp)),
           locApp.ApplicationStatus.Value <> "Draft",
           locApp.ApplicationStatus.Value <> "Withdrawn")
      Width: =Parent.Width - 692
      X: =668
      Y: =354
    Children:
      - lblNextTitleAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightMedium
            Height: =26
            Size: =Typography.SizeHeading
            Text: ="What happens next"
            Width: =Parent.Width - 40
            X: =20
            Y: =16
      - lblNextBodyAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =88
            Size: =Typography.SizeBody
            Text: |-
              =Switch(locApp.ReviewStage.Value,
                "Pending First-Line",
                  "Your first-line supervisor has been asked to endorse your application. Nothing is needed from you.",
                "Needs Supervisor Assigned",
                  "DTD is identifying a second-line supervisor for your application. Nothing is needed from you.",
                "Pending Second-Line",
                  "Your second-line supervisor has been asked to endorse your application. Nothing is needed from you.",
                "Pending DTD Validation",
                  "DTD is checking that your application is complete. They will contact you if anything is missing.",
                "Committee Review",
                  "The selection committee is scoring applications against the published rating criteria.",
                "Pending Placement",
                  "Scoring is finished and placement decisions are being made.",
                "Pending Notification",
                  "A decision has been recorded. You will be notified.",
                "Complete",
                  "This application is closed. Nothing further is needed from you.",
                "Nothing is needed from you right now.")
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 40
            X: =20
            Y: =48

