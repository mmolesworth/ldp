# ===========================================================================
# WITHDRAWN — replaces the timeline rather than stalling it
# ===========================================================================
# A withdrawn application has no position in a six-step progression. Showing
# the timeline frozen at whatever stage it had reached would read as "still
# being reviewed", which is the opposite of true.
- conWithdrawnAS:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Light
      Fill: =ColorPalette.White
      Height: =200
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Visible: |-
        =And(Not(IsBlank(locApp)),
           locApp.ApplicationStatus.Value = "Withdrawn")
      Width: =Parent.Width - 48
      X: =24
      Y: =180
    Children:
      - icoWithdrawnAS:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =ColorPalette.TextSecondary
            Height: =32
            Icon: =Icon.Cancel
            Width: =32
            X: =28
            Y: =28
      - lblWithdrawnTitleAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextHeading
            Font: =Typography.Family
            FontWeight: =Typography.WeightBold
            Height: =30
            Size: =Typography.SizeHeading
            Text: ="This application was withdrawn"
            Width: =Parent.Width - 120
            X: =76
            Y: =28
      - lblWithdrawnBodyAS:
          Control: Label@2.5.1
          Properties:
            Color: =ColorPalette.TextBody
            Font: =Typography.Family
            Height: =80
            Size: =Typography.SizeBody
            Text: |-
              ="It is no longer under review and will not be scored. "
                & "If this is wrong, contact the Division of Talent Development."
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 120
            X: =76
            Y: =68

